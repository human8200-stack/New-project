    { step_ko: "반죽 섞기", text_ko: "무염버터 100g · 설탕 60g · 계란 2개", text_en: "100g butter · 60g sugar · 2 eggs" },
    { step_ko: "가루 넣기", text_ko: "박력분 100g · 베이킹파우더 5g", text_en: "100g cake flour · 5g baking powder" },
    { step_ko: "카라멜 위에 사과", text_ko: "", text_en: "" },
    { step_ko: "반죽 붓고 뚜껑 덮기", text_ko: "160℃ · 15분", text_en: "160°C · 15 min" },

  ],
  caption_ko: "오븐 없이, 팬 하나로 굽는 카라멜 사과 케이크.\n카라멜 위에 사과를 깔고 반죽을 부은 뒤, 마지막에 뒤집어요.\n\n4인분 · 약 20분\n\n카라멜 사과\n사과 2개 · 설탕 30g · 무염버터 30g\n\n도우\n무염버터 100g · 설탕 60g · 계란 2개 · 박력분 100g · 베이킹파우더 5g\n\n1. 사과는 깨끗이 씻어 껍질째 0.5cm로 썰어요.\n2. 팬에 유산지를 깔고 설탕과 버터를 넣어 중불에서 5분 정도 카라멜을 만들어요.\n3. 버터, 설탕, 계란, 박력분, 베이킹파우더 순으로 섞어 반죽해요.\n4. 카라멜 위에 사과를 가지런히 올려요.\n5. 반죽을 붓고 뚜껑을 덮어 160℃에서 15분 익혀요.\n6. 한 김 식으면 뒤집어 접시에 담아요.\n\n주말에 구워 보려면 저장해 두세요.",

};

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
let current = EXAMPLE, tab = "screen", sample = null, downloads = null;

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
}

async function copy(text, btn) {
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "복사됨"; }
  catch {
    const ta = el("textarea");
    ta.value = text; ta.rows = 6;
    btn.after(ta); ta.select();
    btn.textContent = "아래 글을 길게 눌러 복사";
  }
  setTimeout(() => { btn.textContent = old; }, 1600);
}
const copyBtn = (label, get) => el("button", { class: "ghost", type: "button", onclick: (e) => copy(get(), e.currentTarget) }, label);
function saveBtn(label, filename, get) {
  if (!downloads) return null;
  return el("button", { class: "ghost", type: "button", onclick: async (e) => {
    const b = e.currentTarget;
    try { const r = await downloads.save({ filename, data: get() }); if (r.status === "saved") b.textContent = "저장됨"; }
    catch (err) { if (err && err.code === "unavailable") b.hidden = true; }
  } }, label);
}

const tc = (s) => `00:${pad(Math.floor(s / 60))}:${pad(s % 60)},000`;
function srt(d) {
  const out = [];
  d.overlays.forEach((o, i) => {
    if (!o.text_ko) return;
    out.push(`${out.length + 1}\n${tc(i * 5)} --> ${tc(i * 5 + 5)}\n${o.text_ko}\n${o.text_en}\n`);
  });
  return out.join("\n");
}

function storyboardAsk(d) {
  const shots = d.overlays.map((o, i) => `${i + 1}. (${i * 5}–${i * 5 + 5}초) ${o.step_ko}${o.text_ko ? ` — 화면 글자: ${o.text_ko} / ${o.text_en}` : ""}`).join("\n");
  return `메종 에델 브랜드 바이블 기준으로 La Table d'Edel EP.${pad(d.ep)} 「${d.name}」 영상 콘티와 장면 이미지를 만들어 줘.

- 길이: ${d.len}초, 세로 9:16, 장면당 5초 (${d.overlays.length}장면)
- 계절: ${d.season || ""} / 공개 범위: ${SCOPE[d.scope] || ""}
- 에델 캐릭터 시트 기준. 요리 장면은 손 중심, 얼굴은 필요할 때만
- 오전 9~11시 측면 자연광, 아이보리·베이지·오트밀·토프·올리브·차콜, 은은한 필름 입자
- 말·내레이션 없음. 요리 소리 중심
- 화면 글자는 내가 CapCut에서 넣을 거라 이미지에는 글자를 넣지 말아 줘

장면 순서:
${shots}`;
}

function renderScreen(d) {
  if (d.scope === "book") return el("div", { class: "panel" },
    el("div", { class: "box" }, el("h3", { text: "책 전용 레시피" }),
      el("p", { class: "hint", text: "이 레시피는 영상 대신 완성 사진 한 장과 예고 글로 올려요. 예고 글은 '인스타 · 유튜브' 탭에 있어요." })));
  const text = srt(d);
  return el("div", { class: "panel" },
    el("p", { class: "hint", text: "장면당 5초. 화면 글자는 재료·계량·온도만, 한국어 위·영어 아래. 글자가 없는 장면은 요리 소리만 들려요." }),
    el("div", { class: "reel" }, d.overlays.map((o, i) =>
      el("div", { class: "frame" },
        el("div", { class: "t" }, el("span", { text: pad(i + 1) }), el("span", { text: `${i * 5}–${i * 5 + 5}초` })),
        el("div", { class: "step", text: o.step_ko }),
        o.text_ko ? el("div", { class: "ov" }, el("b", { text: o.text_ko }), el("span", { text: o.text_en }))
                  : el("div", { class: "ov none", text: "글자 없음" }),
        el("div", { class: "wm", text: "Maison Edel" })))),
    el("div", { class: "box" },
      el("h3", { text: "자막 파일 (SRT)" }),
      el("ol", { class: "howto" },
        el("li", { text: "SRT를 저장하거나 복사해요." }),
        el("li", { text: "CapCut에서 장면을 순서대로 놓고 자막 → 자막 가져오기로 불러와요." }),
        el("li", { text: "글꼴은 로고와 어울리는 세리프로 통일하고, 오른쪽 아래에 Maison Edel 워터마크를 작게 넣어요." })),
      el("div", { class: "btns" }, copyBtn("자막 복사", () => text), saveBtn("SRT 파일 저장", `maison-edel-ep${pad(d.ep)}.srt`, () => text)),
      el("pre", { class: "code", text: text || "(화면 글자가 없어요)" })));
}

function renderPosts(d) {
  const tags = d.hashtags.join(" ");
  const ig = d.scope === "book" ? `${d.teaser_ko}\n\n${AI_NOTE}\n\n${SIGN}\n\n${tags}` : `${d.caption_ko}\n\n${d.caption_en}\n\n${AI_NOTE}\n\n${SIGN}\n\n${tags}`;
  const yt = `${d.yt_desc}\n\n${SIGN}\n${tags}`;
  const boxes = [el("div", { class: "box" }, el("h3", { text: d.scope === "book" ? "인스타 예고 글 (완성 사진과 함께)" : "인스타 릴스 캡션" }), el("pre", { text: ig }), el("div", { class: "btns" }, copyBtn("캡션 복사", () => ig)))];
  if (d.scope !== "book") boxes.push(el("div", { class: "box" }, el("h3", { text: "유튜브 쇼츠" }),
    el("pre", { text: d.yt_title }), el("pre", { class: "hint", text: d.yt_desc }),
    el("div", { class: "btns" }, copyBtn("제목 복사", () => d.yt_title), copyBtn("설명 복사", () => yt))));
  return el("div", { class: "panel" }, boxes);
}

function renderBook(d) {
  const b = d.ebook;
  const txt = [d.name, "", b.intro, "", "재료", ...b.ingredients.map((x) => "· " + x), "", "만드는 순서", ...b.steps.map((x, i) => `${i + 1}. ${x}`),
    ...(b.queen ? ["", "퀸 냄비로 만들기", b.queen] : []), "", "에델의 팁", ...b.tips.map((x) => "· " + x), ...(b.variation ? ["", "계절 응용", b.variation] : [])].join("\n");
  return el("div", { class: "panel" },
    el("article", { class: "book" },
      el("span", { class: "series", text: "Maison Edel — Seasonal Recipes" }),
      el("h3", { text: d.name }),
      el("p", { text: b.intro }),
      el("h4", { text: "재료" }), el("ul", {}, b.ingredients.map((x) => el("li", { text: x }))),
      el("h4", { text: "만드는 순서" }), el("ol", {}, b.steps.map((x) => el("li", { text: x }))),
      b.queen ? [el("h4", { text: "퀸 냄비로 만들기" }), el("p", { text: b.queen })] : null,
      el("h4", { text: "에델의 팁" }), el("ul", {}, b.tips.map((x) => el("li", { text: x }))),
      b.variation ? [el("h4", { text: "계절 응용" }), el("p", { text: b.variation })] : null,
      el("p", { class: "hint", text: "영상 QR코드 자리: 영상을 올린 뒤 링크로 QR을 만들어 넣어요." }),
      el("p", { class: "sign", text: SIGN }),
      el("div", { class: "btns" }, copyBtn("원고 복사", () => txt))));
}

function renderAsk(d) {
  const t = storyboardAsk(d);
  return el("div", { class: "panel" },
    el("div", { class: "box" }, el("h3", { text: "ChatGPT에 붙여넣을 콘티 요청문" }),
      el("p", { class: "hint", text: "에델 캐릭터 시트와 무드보드를 첨부하고 이 글을 붙여넣어요. 받은 장면 사진과 영상은 노션 작업실 8번 칸에 올려요." }),
      el("pre", { text: t }),
      el("div", { class: "btns" }, copyBtn("요청문 복사", () => t))));
}

const TABS = [["screen", "화면 글자 · 자막"], ["posts", "인스타 · 유튜브"], ["book", "전자책"], ["ask", "ChatGPT 콘티"]];
function render() {
  const d = current;
  $("sheet").replaceChildren(
    el("div", { class: "sheet-head" },
      el("div", {}, el("h2", { class: "ep", text: `EP.${pad(d.ep)} ${d.title_ko}` }), el("p", { class: "ep-en", text: `La Table d'Edel — ${d.title_en}` })),
      el("div", { class: "pill" },
        d.example ? el("span", { class: "tag example", text: "예시 결과" }) : null,
        el("span", { class: "tag", text: SCOPE[d.scope] }),
        el("span", { class: "tag", text: `${d.len}초 · ${d.overlays.length}장면` }))),
    el("div", { class: "tabs", role: "tablist" }, TABS.map(([k, label]) =>
      el("button", { type: "button", role: "tab", "aria-selected": String(tab === k), onclick: () => { tab = k; render(); } }, label))),
    tab === "screen" ? renderScreen(d) : tab === "posts" ? renderPosts(d) : tab === "book" ? renderBook(d) : renderAsk(d));
}

const STORE = "maison-edel-episodes";
function loadSaved() { try { return JSON.parse(localStorage.getItem(STORE) || "[]"); } catch { return []; } }
function saveEpisode(d) {
  try {
    const list = loadSaved().filter((x) => !(x.ep === d.ep && x.name === d.name));
    list.unshift(d);
    localStorage.setItem(STORE, JSON.stringify(list.slice(0, 30)));
  } catch {}
  renderSaved();
}
function renderSaved() {
  const list = loadSaved(), box = $("saved");
  box.replaceChildren();
  if (!list.length) return;
  box.append(el("span", { class: "label", text: "이 기기에 저장된 에피소드" }),
    list.map((d) => el("button", { class: "ghost", type: "button", onclick: () => { current = d; render(); } }, `EP.${pad(d.ep)} ${d.name}`)));
}

function buildPrompt(r) {
  const n = r.len / 5;
  const scopeRule = {
    full: "화면 글자와 캡션에 재료와 계량을 모두 공개해.",
    taste: "맛보기 레시피야. 화면 글자에는 재료 이름만 쓰고 계량·온도·시간은 쓰지 마. 캡션에도 계량을 쓰지 말고, 마지막에 '정확한 레시피는 Maison Edel — Seasonal Recipes에 담았어요.'를 넣어. 전자책에는 전부 넣어.",
    book: "책 전용 레시피야. 영상은 없어. overlays의 text_ko/text_en은 모두 빈 문자열로 두고, teaser_ko에 완성 사진과 함께 올릴 짧은 예고 글(계량 없이, 2~4줄, 마지막 줄은 전자책 안내)을 써. caption_ko, caption_en, yt_title, yt_desc는 빈 문자열로 둬. 전자책에는 전부 넣어."
  }[r.scope];
  return `너는 프렌치 빈티지 요리 브랜드 Maison Edel(메종 에델)의 편집자야. 요리 영상 시리즈 이름은 La Table d'Edel, 전자책 이름은 Maison Edel — Seasonal Recipes야.
영상은 말·내레이션 없이 요리 소리만 들리고, 화면 글자는 재료·계량·온도만 짧게 한국어·영어로 보여줘. 분위기는 '햇살이 스며드는 주방, 계절을 요리하는 시간'.
아래 레시피로 세로 9:16 영상(${r.len}초, 장면당 5초, 정확히 ${n}장면)의 자료를 만들어.

[레시피]
회차: EP.${pad(r.ep)} / 요리: ${r.name} / 계절: ${r.season}
재료와 계량:
${r.ing}
만드는 순서:
${r.steps}
퀸 냄비·인덕션 조리법: ${r.queen || "(없음)"}
에델의 메모: ${r.note || "(없음)"}

[규칙]
- 레시피의 재료, 계량, 온도, 시간, 순서를 바꾸거나 지어내지 마.
- ${scopeRule}
- overlays: 정확히 ${n}개, 요리 순서대로. step_ko는 그 장면에서 하는 일(12자 이내). text_ko/text_en은 그 장면에 나오는 재료·계량·온도·시간만(한국어 20자, 영어 36자 이내). 첫 장면과 마지막 장면처럼 정보가 없는 장면은 빈 문자열.
- caption_ko: 담백하고 조용한 말투, 이모지 쓰지 마. 첫 줄은 장면을 그리는 한 문장. 마지막 줄은 저장 유도. caption_en: 2~3줄.
- hashtags: 정확히 5개(인스타 제한). ${BASE_TAGS.join(" ")} 1개 + 요리 이름 한글 1개 + 한글 레시피 검색어 1개 + 영문 요리 이름 1개 + 특징(예: 노오븐, 계절) 1개.
- yt_title: 한글 | English 형식, 45자 이내, 끝에 #shorts. yt_desc: 시리즈명·회차와 재료 요약.
- title_en: 요리 이름 영어.
- ebook: intro(에델의 말투로 2~3문장), ingredients, steps(친절한 존댓말), queen(있으면 정리, 없으면 ""), tips(2~4개), variation(계절 응용 한두 문장).

JSON 하나로만 답해. 형태:
{"title_ko":"","title_en":"","overlays":[{"step_ko":"","text_ko":"","text_en":""}],"caption_ko":"","caption_en":"","hashtags":[""],"yt_title":"","yt_desc":"","teaser_ko":"","ebook":{"intro":"","ingredients":[""],"steps":[""],"queen":"","tips":[""],"variation":""}}`;
}

const valid = (d) => d && typeof d === "object" && Array.isArray(d.overlays) && d.overlays.length && d.ebook && Array.isArray(d.ebook.steps) && Array.isArray(d.hashtags);

const ERR = {
  not_granted: "Claude 사용을 허락하지 않아서 AI 작성을 쓸 수 없어요. 페이지를 다시 열면 다시 물어봐요.",
  sampling_disabled: "이 계정에서는 AI 작성을 쓸 수 없어요.",
  rate_limited: "잠깐 사용량이 많아요. 몇 분 뒤 다시 눌러 주세요.",
  session_expired: "로그인이 풀렸어요. 다시 로그인한 뒤 눌러 주세요.",
  invalid_json: "결과 형식이 깨졌어요. 한 번 더 눌러 주세요.",
  refused: "이 내용으로는 작성할 수 없어요. 레시피 내용을 확인해 주세요.",
};

$("recipe").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!sample) return;
  const r = {
    ep: Number($("f-ep").value) || 1, len: Number($("f-len").value) || 45,
    name: $("f-name").value.trim(), season: $("f-season").value,
    scope: (document.querySelector('input[name="scope"]:checked') || {}).value || "full",
    ing: $("f-ing").value.trim(), steps: $("f-steps").value.trim(),
    queen: $("f-queen").value.trim(), note: $("f-note").value.trim(),
  };
  const st = $("status");
  st.classList.remove("err");
  if (!r.name || !r.ing || !r.steps) { st.textContent = "요리 이름, 재료, 만드는 순서를 채워 주세요."; st.classList.add("err"); return; }
  const go = $("go");
  go.disabled = true;
  st.textContent = "에델의 레시피를 정리하는 중… (30초~1분)";
  try {
    const d = await sample.json(buildPrompt(r), { cache: false, onText: ({ text }) => { st.textContent = `작성 중… ${text.length.toLocaleString()}자`; } });
    if (!valid(d)) throw { code: "invalid_json" };
    Object.assign(d, { ep: r.ep, len: r.len, name: r.name, season: r.season, scope: r.scope });
    for (const k of ["caption_ko", "caption_en", "yt_title", "yt_desc", "teaser_ko"]) d[k] = d[k] || "";
    current = d; tab = r.scope === "book" ? "posts" : "screen";
    saveEpisode(d); render();
    st.textContent = "완성됐어요. 이 기기에 저장해 뒀어요.";
  } catch (err) {
    st.textContent = ERR[err && err.code] || "작성이 중간에 끊겼어요. 다시 눌러 주세요.";
    st.classList.add("err");
    if (err && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(err.code)) go.hidden = true;
  } finally { go.disabled = false; }
});

render();
renderSaved();
$("go").disabled = true;
(async () => {
  const c = window.claude;
  sample = c ? await c.use("sample").catch(() => null) : null;
  downloads = c ? await c.use("downloads").catch(() => null) : null;
  if (sample) $("go").disabled = false;
  else {
    $("go").hidden = true;
    $("ai-hint").textContent = "AI 작성은 claude.ai에서 이 페이지를 열 때만 켜져요. 지금은 예시 결과와 저장된 에피소드를 볼 수 있어요.";
  }
  if (downloads) render();
})();
</script>
