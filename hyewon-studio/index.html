<title>혜원의 식탁 스튜디오</title>

<style>
/* Layout: a recipe card on the left feeds a production sheet on the right (stacked on phones). */
:root {
  --paper: #F2F3EC;
  --card: #FBFBF7;
  --ink: #233026;
  --muted: #5E6B60;
  --line: #D6DACD;
  --apple: #A93239;
  --apple-soft: #F3DEDA;
  --leaf: #4C6A47;
  --leaf-soft: #E1E8DA;
  --display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --sub: Gulim, "굴림", "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161B17; --card: #1E2520; --ink: #E8EBE2; --muted: #A4AEA2; --line: #344036;
    --apple: #E3797D; --apple-soft: #3B2326; --leaf: #97B78D; --leaf-soft: #263125; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #161B17; --card: #1E2520; --ink: #E8EBE2; --muted: #A4AEA2; --line: #344036;
  --apple: #E3797D; --apple-soft: #3B2326; --leaf: #97B78D; --leaf-soft: #263125; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
header img { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
header .names { min-width: 0; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.75rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h1 small { font-family: var(--body); font-weight: 400; font-size: .95rem; color: var(--muted); margin-left: 6px; }
.lede { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.grid { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.recipe { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.recipe h2, .sheet h2 { font-family: var(--display); font-size: 1.15rem; margin: 0; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
label { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); letter-spacing: .02em; }
input, textarea, select {
  font: inherit; font-size: .93rem; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
  border-radius: 4px; padding: 8px 10px; width: 100%;
}
textarea { resize: vertical; min-height: 92px; line-height: 1.55; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
.hint { font-size: .8rem; color: var(--muted); margin: 0; }
button { font: inherit; cursor: pointer; border-radius: 4px; }
.primary { background: var(--apple); color: var(--card); border: none; padding: 12px 14px; font-size: 1rem; font-weight: 700; }
.primary:disabled { opacity: .55; cursor: progress; }
.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 6px 10px; font-size: .82rem; }
.ghost:hover { border-color: var(--leaf); color: var(--leaf); }
.status { font-size: .85rem; color: var(--muted); min-height: 1.3em; margin: 0; }
.status.err { color: var(--apple); }

.sheet { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.sheet-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.ep { font-family: var(--display); font-size: 1.45rem; margin: 0; text-wrap: balance; }
.ep-en { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
.tag { display: inline-block; font-size: .72rem; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px; background: var(--leaf-soft); color: var(--leaf); }
.tag.example { background: var(--apple-soft); color: var(--apple); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 12px; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--apple); font-weight: 700; }
.panel { display: flex; flex-direction: column; gap: 12px; }

.hook { background: var(--leaf-soft); border-radius: 6px; padding: 12px 14px; }
.hook b { font-family: var(--display); font-size: 1.1rem; }
.scene { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
@media (max-width: 480px) { .scene { grid-template-columns: minmax(0, 1fr); } }
.frame {
  aspect-ratio: 9 / 16; max-width: 100%; border-radius: 4px; background: var(--ink); color: var(--card);
  display: flex; flex-direction: column; justify-content: space-between; padding: 6px; font-family: var(--sub);
}
.frame .t { font-family: var(--mono); font-size: .68rem; opacity: .75; font-variant-numeric: tabular-nums; }
.frame .s { font-size: .62rem; line-height: 1.3; text-align: center; }
@media (max-width: 480px) { .frame { display: none; } }
.scene-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.scene-body .shot { font-weight: 700; }
.subs { font-family: var(--sub); font-size: .92rem; }
.subs span { display: block; color: var(--muted); font-size: .85rem; }
.sound { font-size: .82rem; color: var(--muted); }
.prompt { font-family: var(--mono); font-size: .76rem; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 8px; white-space: pre-wrap; word-break: break-word; color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }

.box { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.box h3 { margin: 0; font-size: .95rem; }
.box pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--body); font-size: .92rem; }
.srt { font-family: var(--sub) !important; max-height: 360px; overflow: auto; }
.steps-howto { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }

.book { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.book h3 { font-family: var(--display); font-size: 1.35rem; margin: 0; }
.book h4 { font-family: var(--display); margin: 6px 0 0; font-size: 1rem; color: var(--leaf); }
.book ul, .book ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 3px; }
.book p { margin: 0; max-width: 65ch; }

.saved { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.saved .label { font-size: .8rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

      <h1>혜원의 식탁 <small>Hyewon's Table · 영상 제작실</small></h1>
      <p class="lede">레시피를 넣으면 장면별 Runway 프롬프트, 한영 자막, 인스타·유튜브 글, 전자책 페이지가 한 번에 나와요.</p>
    </div>
  </header>

  <div class="grid">
    <form class="recipe" id="recipe" autocomplete="off">
      <h2>레시피 카드</h2>
      <div class="row">
        <label for="f-ep">회차<input id="f-ep" type="number" min="1" value="1"></label>
        <label for="f-len">영상 길이
          <select id="f-len">
            <option value="30">30초 (6장면)</option>
            <option value="45" selected>45초 (9장면)</option>
            <option value="60">60초 (12장면)</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label for="f-name">요리 이름<input id="f-name" value="가을 사과케이크"></label>
        <label for="f-season">계절
          <select id="f-season">
            <option>봄</option><option>여름</option><option selected>가을</option><option>겨울</option>
          </select>
        </label>
      </div>
      <label for="f-ing">재료와 계량
        <textarea id="f-ing" rows="5">사과 2개 (홍옥 또는 부사)
달걀 2개
설탕 80g
녹인 버터 80g
우유 60ml
박력분 150g
베이킹파우더 5g
시나몬 가루 약간</textarea>
      </label>
      <label for="f-steps">만드는 순서
        <textarea id="f-steps" rows="6">1. 오븐을 180℃로 예열하고 22cm 원형 틀에 종이를 깐다.
2. 사과는 씨를 빼고 얇게 썬다.
3. 달걀과 설탕을 뽀얗게 될 때까지 젓는다.
4. 녹인 버터와 우유를 넣고 섞는다.
5. 박력분, 베이킹파우더, 시나몬을 체 쳐 넣고 가볍게 섞는다.
6. 반죽을 틀에 먼저 붓고, 사과를 겹쳐 올린다.
7. 180℃에서 35~40분 굽는다.</textarea>
      </label>
      <label for="f-queen">퀸 냄비·인덕션 조리법 (있을 때만)
        <textarea id="f-queen" rows="3" placeholder="예: 퀸 냄비에 종이를 깔고 반죽을 부은 뒤 뚜껑을 덮고 인덕션 3단에서 25분"></textarea>
      </label>
      <label for="f-tip">혜원의 팁·이야기 (선택)
        <textarea id="f-tip" rows="2">사과는 껍질째 써야 색이 예뻐요. 마당 사과나무에서 처음 딴 사과로 굽는 날.</textarea>
      </label>

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
}

async function copy(text, btn) {

  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "복사됨";
  } catch {
    const ta = el("textarea", { class: "prompt" });
    ta.value = text;
    btn.after(ta);
    ta.select();
    btn.textContent = "아래 글을 길게 눌러 복사";
  }
  setTimeout(() => { btn.textContent = old; }, 1600);
}

function timecode(sec) {
  const h = String(Math.floor(sec / 3600)).padStart(2, "0");
  const m = String(Math.floor(sec % 3600 / 60)).padStart(2, "0");
  const s = String(Math.floor(sec % 60)).padStart(2, "0");
  return `${h}:${m}:${s},000`;
}

  }).join("\n");
}

const ERR = {
  not_granted: "Claude 사용을 허락하지 않아서 AI 작성을 쓸 수 없어요. 페이지를 다시 열면 다시 물어봐요.",
  sampling_disabled: "이 계정에서는 AI 작성을 쓸 수 없어요.",
  rate_limited: "잠깐 사용량이 많아요. 몇 분 뒤 다시 눌러 주세요.",
  session_expired: "로그인이 풀렸어요. 다시 로그인한 뒤 눌러 주세요.",
  invalid_json: "결과 형식이 깨졌어요. 한 번 더 눌러 주세요.",
  refused: "이 내용으로는 작성할 수 없어요. 레시피 내용을 확인해 주세요.",
};

$("recipe").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!sample) return;
  const r = {
    ep: Number($("f-ep").value) || 1, len: Number($("f-len").value) || 45,
    name: $("f-name").value.trim(), season: $("f-season").value,
    ing: $("f-ing").value.trim(), steps: $("f-steps").value.trim(),
    queen: $("f-queen").value.trim(), tip: $("f-tip").value.trim(),
  };
  const st = $("status");
  st.classList.remove("err");
  if (!r.name || !r.ing || !r.steps) { st.textContent = "요리 이름, 재료, 만드는 순서를 채워 주세요."; st.classList.add("err"); return; }
  const go = $("go");
  go.disabled = true;
  st.textContent = "혜원이 대본을 쓰는 중… (30초~1분)";
  try {
    const d = await sample.json(buildPrompt(r), {
      cache: false,
      onText: ({ text }) => { st.textContent = `작성 중… ${text.length.toLocaleString()}자`; },
    });
    if (!valid(d)) throw { code: "invalid_json" };
    Object.assign(d, { ep: r.ep, len: r.len, name: r.name });
    current = d; tab = "scenes";
    saveEpisode(d);
    render();
    st.textContent = "완성됐어요. 이 기기에 저장해 뒀어요.";
  } catch (err) {
    st.textContent = ERR[err && err.code] || "작성이 중간에 끊겼어요. 다시 눌러 주세요.";
    st.classList.add("err");
    if (err && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(err.code)) go.hidden = true;
  } finally {
    go.disabled = false;
  }
});

render();
renderSaved();

const go = $("go");
go.disabled = true;
(async () => {
  const c = window.claude;
  sample = c ? await c.use("sample").catch(() => null) : null;
  downloads = c ? await c.use("downloads").catch(() => null) : null;
  if (sample) { go.disabled = false; }
  else {
    go.hidden = true;
    $("ai-hint").textContent = "AI 작성은 claude.ai에서 이 페이지를 열 때만 켜져요. 지금은 예시 결과와 저장된 회차를 볼 수 있어요.";
  }
  if (downloads && tab === "subs") render();
})();
</script>
