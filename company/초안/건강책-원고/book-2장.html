<title>엄마의 영양 노트 2장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#E6DFD1;
  --paper:#FBF6EA;
  --paper-edge:#EFE6D3;
  --ink:#27241F;
  --ink2:#3D3832;
  --sub:#857D71;
  --line:#D9CFBC;
  --accent:#66763A;
  --accent-soft:rgba(102,118,58,.09);
  --mark:rgba(214,188,100,.50);
  --fig:#8A8F6A;
  --story:#B9AF9B;
  --kv1:#5F7A3E;
  --kv2:#9A7B2F;
  --kv3:#9B5A45;
  --btn:#FFFDF7;
  --shadow:rgba(60,48,28,.20);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512;
    --paper:#2A2721;
    --paper-edge:#221F1A;
    --ink:#EDE6D8;
    --ink2:#D9D1C2;
    --sub:#A49B8C;
    --line:#4A443A;
    --accent:#AFC07A;
    --accent-soft:rgba(175,192,122,.10);
    --mark:rgba(190,165,80,.38);
    --fig:#A6AB86;
    --story:#6E6758;
    --kv1:#A9C27F;
    --kv2:#D6B465;
    --kv3:#D99682;
    --btn:#2F2C26;
    --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161512;
  --paper:#2A2721;
  --paper-edge:#221F1A;
  --ink:#EDE6D8;
  --ink2:#D9D1C2;
  --sub:#A49B8C;
  --line:#4A443A;
  --accent:#AFC07A;
  --accent-soft:rgba(175,192,122,.10);
  --mark:rgba(190,165,80,.38);
  --fig:#A6AB86;
  --story:#6E6758;
  --kv1:#A9C27F;
  --kv2:#D6B465;
  --kv3:#D99682;
  --btn:#2F2C26;
  --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));
  padding-top:max(10px,env(safe-area-inset-top));overflow:hidden}
#stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;
  min-height:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
#bookbox{position:relative}
#book{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;perspective:1800px}
#bar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;
  padding:8px 0 max(10px,env(safe-area-inset-bottom))}
#bar button{font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--btn);
  border:1px solid var(--line);border-radius:999px;padding:9px 18px;min-width:76px;cursor:pointer}
#bar button:disabled{opacity:.4;cursor:default}
#count{font-size:14px;color:var(--sub);min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
#count b{color:var(--ink);font-weight:700}

/* ---------- 쪽: 380 x 562 (152 x 225mm 비율) ---------- */
.page{width:380px;height:562px;background:var(--paper);position:relative;overflow:hidden;flex:0 0 auto;
  box-shadow:0 1px 3px var(--shadow)}
.spread .page.l{box-shadow:-1px 1px 3px var(--shadow);background:linear-gradient(to left,var(--paper-edge),var(--paper) 7%)}
.spread .page.r{box-shadow:1px 1px 3px var(--shadow);background:linear-gradient(to right,var(--paper-edge),var(--paper) 7%)}
.page.blank{background:var(--paper)}
.run{position:absolute;left:30px;right:30px;top:16px;font-size:7px;letter-spacing:.04em;color:var(--sub);
  display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:5px;white-space:nowrap}
.run b{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800;color:var(--accent);margin-right:6px}
.pbody{position:absolute;left:30px;right:30px;top:42px;bottom:40px;overflow:hidden}
.folio{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:7.7px;color:var(--sub);
  letter-spacing:.12em;font-variant-numeric:tabular-nums}
.page.r .folio{text-align:right;padding-right:30px}
.page.l .folio{text-align:left;padding-left:30px}

/* 본문 */
.pbody{font-size:9.4px;line-height:1.78;color:var(--ink2);word-break:keep-all;overflow-wrap:break-word}
.pbody strong{color:var(--ink);font-weight:700}
.art-head{margin-bottom:6px}
.art-no{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800;font-size:9.1px;color:var(--accent);
  letter-spacing:.08em}
.art-title{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800;font-size:14px;line-height:1.4;
  color:var(--ink);margin-top:2px}
.art-title .kw{color:var(--accent)}
.meta{font-size:7.3px;line-height:1.5;color:var(--sub);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.h3{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800;font-size:10.8px;line-height:1.45;
  color:var(--ink);margin:14px 0 6px}
.pbody > .h3:first-child{margin-top:0}
.para{margin:0 0 8px;text-indent:0}
.para.cont{margin-top:0}
.emph{margin:4px 0 10px;font-weight:700;color:var(--ink);border-left:3px solid var(--accent);padding-left:10px;line-height:1.65}
.mk{background:linear-gradient(transparent 56%,var(--mark) 56%);color:inherit;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.lst{margin:4px 0 10px;padding-left:1.4em}
.lst li{margin:2px 0;padding-left:2px}
ol.lst li::marker{color:var(--accent);font-weight:700}
ul.lst li::marker{color:var(--accent)}
.story{margin:6px 0 12px;border:1.5px dashed var(--story);border-radius:8px;padding:12px 12px;text-align:center;
  font-size:8.8px;color:var(--sub);background:transparent}
.fig{margin:8px 0 12px;border:1.5px dashed var(--fig);border-radius:8px;padding:9px 12px 10px;
  font-size:8.4px;line-height:1.6;color:var(--ink2)}
.fig-lab{font-size:7.3px;font-weight:700;letter-spacing:.08em;color:var(--fig);margin-bottom:3px}
.fig.cont .fig-lab::after{content:" (이어서)"}
.figgroup .fg-u{margin:0 0 7px}
.figgroup .fg-u:last-child{margin-bottom:0}
.figgroup .para,.figgroup p{margin:0 0 3px}
.figgroup .lst{margin:2px 0 2px;padding-left:1.2em}
.kv{margin:6px 0 10px;border-radius:8px;padding:8px 11px 8px;background:var(--accent-soft);font-size:8.8px;line-height:1.62}
.kv-lab{font-size:8px;font-weight:700;letter-spacing:.05em;margin-bottom:3px}
.kv1 .kv-lab{color:var(--kv1)} .kv2 .kv-lab{color:var(--kv2)} .kv3 .kv-lab{color:var(--kv3)}
.kv1{border-left:3px solid var(--kv1)} .kv2{border-left:3px solid var(--kv2)} .kv3{border-left:3px solid var(--kv3)}
.kv.cont .kv-lab::after{content:" (이어서)";font-weight:500;color:var(--sub)}
.kv ul{padding-left:1.1em}
.kv li{margin:3px 0}
.key{margin:10px 0 12px;padding:10px 12px;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--line)}
.key-lab{font-size:7.7px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin-bottom:3px}
.key p{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800;font-size:10.5px;line-height:1.6;color:var(--ink)}
.callout{margin:8px 0 12px;padding:9px 12px;border:1.5px solid var(--kv3);border-radius:8px;font-size:8.8px;line-height:1.6}
.callout-lab{font-weight:700;color:var(--kv3);margin-bottom:3px}
.callout .lst{margin:2px 0;padding-left:1.1em}
.see{margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:8px;line-height:1.6;color:var(--sub)}
.see b{color:var(--accent);font-weight:700;margin-right:4px}
.tbl{width:100%;border-collapse:collapse;font-size:8px;margin:6px 0 10px}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
.brk{display:none}
.side-mark{font-size:7px;color:var(--sub);letter-spacing:.06em;margin:0 0 6px}

/* 표지 */
.cover{position:absolute;left:32px;right:30px;top:58px;bottom:40px}
.pill{display:inline-block;padding:2px 10px 3px;border:1px solid var(--sub);border-radius:999px;font-size:7.7px;
  color:var(--sub);letter-spacing:.06em}
.c-title{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800;font-size:21.7px;line-height:1.25;
  margin-top:26px;color:var(--ink);letter-spacing:.01em}
.c-sub{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:700;font-size:9.8px;line-height:1.55;
  color:var(--ink2);margin-top:12px;word-break:keep-all}
.c-rule{width:40px;height:2px;background:var(--ink);margin:30px 0 26px}
.c-ch{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800;font-size:14px;line-height:1.45;color:var(--ink);word-break:keep-all}
.ch-no{color:var(--accent);margin-right:4px}
.c-key{margin-top:14px;font-size:10.5px;font-weight:700;line-height:1.7;color:var(--ink);word-break:keep-all}
.c-foot{position:absolute;left:0;right:0;bottom:6px;font-size:7.7px;line-height:1.6;color:var(--sub);word-break:keep-all}

/* 차례 */
.toc{position:absolute;left:28px;right:28px;top:30px;bottom:30px}
.toc-lab{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800;font-size:14.7px;letter-spacing:.3em;color:var(--ink)}
.toc-ch{font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800;font-size:10.5px;line-height:1.4;margin-top:8px;
  padding-top:8px;border-top:1.5px solid var(--ink);color:var(--ink);word-break:keep-all}
.toc-key{font-size:8.4px;font-weight:700;line-height:1.55;margin:4px 0 6px;color:var(--ink);word-break:keep-all}
.trow{display:flex;align-items:flex-end;width:100%;background:none;border:0;font:inherit;color:var(--ink2);
  text-align:left;padding:2px 0;cursor:pointer;font-size:8px;line-height:1.38}
.trow .tn{flex:0 0 34px;color:var(--sub);font-size:7.7px;font-variant-numeric:tabular-nums;line-height:1.55}
.trow .tt{flex:0 1 auto;word-break:keep-all}
.trow .tt b{color:var(--ink);font-weight:700}
.trow .dots{flex:1 1 auto;min-width:14px;height:5px;margin:0 6px 5px;
  background-image:radial-gradient(circle,var(--sub) .9px,transparent 1.2px);background-size:7px 5px;background-repeat:repeat-x;opacity:.7}
.trow .tp{flex:0 0 auto;min-width:1.8em;text-align:right;font-family:"Nanum Myeongjo","Noto Serif KR",serif;font-weight:800;
  color:var(--accent);font-variant-numeric:tabular-nums}
.toc-note{margin-top:6px;font-size:6.6px;line-height:1.55;color:var(--sub);word-break:keep-all}

/* 넘김 애니메이션 */
.flip{position:absolute;top:0;z-index:5;pointer-events:none;backface-visibility:hidden}
.flip.fwd{transform-origin:0 50%;animation:flipF .34s ease-in forwards}
.flip.back{transform-origin:100% 50%;animation:flipB .34s ease-in forwards}
@keyframes flipF{from{transform:rotateY(0);filter:brightness(1)}to{transform:rotateY(-88deg);filter:brightness(.8)}}
@keyframes flipB{from{transform:rotateY(0);filter:brightness(1)}to{transform:rotateY(88deg);filter:brightness(.8)}}
@media (prefers-reduced-motion: reduce){.flip{display:none!important;animation:none!important}}

#measure{position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none}
</style>

  <div class="c-rule"></div>
  <div class="c-ch"><span class="ch-no">2장</span> 장 — 건강 공부는 장에서 시작해요</div>

  <div class="c-foot">손가락으로 옆으로 밀거나, 화면 왼쪽·오른쪽을 눌러 넘겨 보세요.<br>그림은 아직 자리만 표시했어요.</div>
</div></div>

  <p class="toc-key"><mark class="mk">먹은 것이 내 몸이 되려면, 장을 지나야 해요.</mark></p>
  <div class="toc-list"><button class="trow" type="button" data-goto="2-1"><span class="tn">2-1</span><span class="tt"><b>장</b>: 먹었다고 다 내 것이 될까요?</span><span class="dots"></span><span class="tp" data-pg="2-1">27</span></button><button class="trow" type="button" data-goto="2-2"><span class="tn">2-2</span><span class="tt"><b>위</b>: 위산은 왜 그렇게 셀까요?</span><span class="dots"></span><span class="tp" data-pg="2-2">29</span></button><button class="trow" type="button" data-goto="2-3"><span class="tn">2-3</span><span class="tt"><b>쓸개즙</b>: 기름에 녹는 비타민은 왜 기름과 함께 먹으라고 할까요?</span><span class="dots"></span><span class="tp" data-pg="2-3">31</span></button><button class="trow" type="button" data-goto="2-4"><span class="tn">2-4</span><span class="tt"><b>흡수</b>: 소화와 흡수, 무엇이 다를까요?</span><span class="dots"></span><span class="tp" data-pg="2-4">33</span></button><button class="trow" type="button" data-goto="2-5"><span class="tn">2-5</span><span class="tt"><b>장벽</b>: '장이 샌다'는 말, 어디까지 맞을까요?</span><span class="dots"></span><span class="tp" data-pg="2-5">35</span></button><button class="trow" type="button" data-goto="2-6"><span class="tn">2-6</span><span class="tt"><b>장 속 균</b>: 좋은 균과 나쁜 균, 둘로만 나뉠까요?</span><span class="dots"></span><span class="tp" data-pg="2-6">37</span></button><button class="trow" type="button" data-goto="2-7"><span class="tn">2-7</span><span class="tt"><b>장과 면역</b>: 면역세포는 왜 장에서 배울까요?</span><span class="dots"></span><span class="tp" data-pg="2-7">39</span></button><button class="trow" type="button" data-goto="2-8"><span class="tn">2-8</span><span class="tt"><b>장과 마음</b>: 긴장하면 왜 소화가 멈출까요?</span><span class="dots"></span><span class="tp" data-pg="2-8">41</span></button><button class="trow" type="button" data-goto="2-9"><span class="tn">2-9</span><span class="tt"><b>장의 신호</b>: 변·가스·더부룩함, 언제 지켜보고 언제 병원에 갈까요?</span><span class="dots"></span><span class="tp" data-pg="2-9">43</span></button><button class="trow" type="button" data-goto="2-10"><span class="tn">2-10</span><span class="tt"><b>장을 돕는 밥상</b>: 유산균과 식이섬유, 무엇부터 챙길까요?</span><span class="dots"></span><span class="tp" data-pg="2-10">45</span></button><button class="trow" type="button" data-goto="2-11"><span class="tn">2-11</span><span class="tt"><b>장을 지치게 하는 습관</b>: 잠·단 음료·술은 장벽에 무엇을 할까요?</span><span class="dots"></span><span class="tp" data-pg="2-11">47</span></button><button class="trow" type="button" data-goto="fig"><span class="tn">그림</span><span class="tt"><b>한눈에 보는 그림</b>: 입에서 세포까지, 영양소가 들어오는 길</span><span class="dots"></span><span class="tp" data-pg="fig">49</span></button></div>
  <p class="toc-note">쪽 번호를 누르면 그 꼭지로 가요. (휴대폰에서 읽기 좋게 글자를 실제 책보다 크게 짜서, 쪽 번호는 실제 책과 달라요.)</p>

<article data-id="2-1" data-short="2-1 장"><header class="art-head" data-keep><div class="art-no">2-1</div><h2 class="art-title"><span class="kw">장</span> 먹었다고 다 내 것이 될까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">마트 반찬 칸에서 포장을 뒤집어 봐요. </span><span class="u">시금치나물 한 팩 뒷면에 '철 3mg'이라고 적혀 있다고 해 볼게요. </span><span class="u">옆 칸 소고기 장조림에도 똑같이 '철 3mg'. </span><span class="u">숫자가 같으니, 어느 쪽을 먹어도 내 몸에 들어오는 철은 같을까요? </span></p><p class="para" data-split="soft" data-units><span class="u">답부터 말하면, 아니에요. </span><span class="u">같은 3mg이라도 무엇에 들어 있었는지, 무엇과 같이 먹었는지, 그날 내 몸이 철을 얼마나 원하는지에 따라 들어오는 양이 몇 배씩 달라져요. </span><span class="u">포장 뒷면의 숫자는 접시 위의 숫자예요. </span><span class="u">내 몸의 숫자는 따로 있어요. </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>관 속은 아직 몸 바깥이에요</h3><p class="para" data-split="soft" data-units><span class="u">입에서 항문까지는 한 줄로 이어진 긴 관이에요. </span><span class="u">도넛 구멍에 손가락을 넣어도 도넛 '속'에 들어간 게 아닌 것처럼, 위와 장 안에 있는 밥은 아직 몸 바깥에 있어요. </span><span class="u">장의 벽을 넘어 피와 림프로 들어간 것만 몸 '안'이 돼요. </span></p><p class="para" data-split="soft" data-units><span class="u">그러려면 세 가지 일이 차례로 일어나야 해요. </span><span class="u"><strong>쪼개기</strong> — 입과 위, 작은창자 첫머리에서 아주 작게 부수고 녹여요. </span><span class="u"><strong>넘기</strong> — 작은창자 벽의 세포가 골라서 안으로 들여요. </span><span class="u"><strong>쓰기</strong> — 핏줄로 들어온 것은 간을 먼저 거치고, 기름에서 온 것은 대부분 림프를 돌아 피로 들어가 온몸의 세포에 닿아요. </span></p><p class="para" data-split="soft" data-units><span class="u">여기서는 두 번째 '넘기'를 한 단계 더 들여다봐요. </span><span class="u">문이 늘 같은 너비로 열려 있는 게 아니라는 이야기예요. </span></p><h3 class="h3" data-keep>'흡수율'이라는 숫자</h3><p class="para" data-split="soft" data-units><span class="u">먹은 양 가운데 장벽을 넘어 몸 안으로 들어간 몫을 흡수율이라고 해요. </span><span class="u">영양소마다 이 숫자가 아주 달라요. </span></p><p class="para" data-split="soft" data-units><span class="u">철은 흡수율이 낮은 쪽이에요. </span><span class="u">여러 음식을 섞어 먹는 보통 밥상에서 철은 대개 10~15%쯤 들어와요. </span><span class="u">그런데 폭을 보면 놀라요. </span><span class="u">음식과 몸 상태에 따라 2%가 안 되기도 하고, 50%에 이르기도 해요. </span><span class="u">같은 3mg이 0.06mg이 될 수도, 1.5mg이 될 수도 있다는 뜻이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">이 폭을 정하는 것은 세 가지예요. </span><span class="u"><strong>모양</strong>(어떤 형태의 철인가), <strong>짝</strong>(무엇과 같이 먹었나), 그리고 <strong>내 몸</strong>(지금 철이 얼마나 필요한가). </span></p><h3 class="h3" data-keep>첫째, 모양 — 헴철과 비헴철</h3><p class="para" data-split="soft" data-units><span class="u">고기·생선에 든 철 가운데 상당 부분은 '헴'이라는 고리 모양 구조 안에 들어 있어요. </span><span class="u">이것을 헴철이라고 해요. </span><span class="u">채소·콩·곡물에 든 철은 이런 고리 없이 따로 있어요. </span><span class="u">이것은 비헴철이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">헴철은 흔히 25% 이상 들어온다고 봐요. </span><span class="u">비헴철은 먹은 양의 20%에도 못 미치고, 섞어 먹는 밥상에서는 그보다 훨씬 낮아요. </span></p><p class="para" data-split="soft" data-units><span class="u">왜 이렇게 다를까요? </span><span class="u">비헴철은 장 속에서 잘 녹지 않는 모양(3가 철)으로 있으면 장벽 세포가 들이기 어려워요. </span><span class="u">들어오려면 녹기 쉬운 모양(2가 철)으로 바뀌어야 해요. </span><span class="u">그래서 곁에 무엇이 있느냐에 따라 크게 흔들려요. </span><span class="u">헴철은 고리 안에 싸인 채로 들어오기 때문에, 함께 먹은 음식에 대체로 덜 흔들려요. </span></p><h3 class="h3" data-keep>둘째, 짝 — 같이 먹은 것이 문을 열기도, 닫기도 해요</h3><p class="para" data-split="soft" data-units><span class="u"><strong>문을 여는 짝.</strong> </span><span class="u">비타민C는 비헴철을 녹기 쉬운 모양으로 바꿔 줘요. </span><span class="u">식약처도 비타민C를 "철의 흡수에 필요"한 영양소로 인정해요. </span><span class="u">고기·닭·생선 살코기도 함께 먹은 비헴철이 더 잘 들어오게 해요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>문을 닫는 짝.</strong> </span><span class="u">차에 든 폴리페놀은 철 흡수를 가장 세게 줄이는 쪽으로 꼽혀요. </span><span class="u">곡물·콩의 피트산은 밥상에서 철을 붙잡는 대표 성분이에요. </span><span class="u">커피와 칼슘도 철 흡수를 줄여요. </span></p><p class="para" data-split="soft" data-units><span class="u">숫자로 보면 더 분명해요. </span><span class="u">햄버거 식사에 커피 한 잔을 곁들이자 철 흡수가 39% 줄었고, 차 한 잔은 64%를 줄였어요. </span><span class="u">같은 연구에서 커피를 식사 한 시간 전에 마셨을 땐 영향이 없었어요. </span><span class="u">그런데 식사 한 시간 뒤에 마셨을 땐, 밥과 같이 마신 것만큼 줄었어요. </span><span class="u">"밥 먹고 조금 쉬었다 마시면 괜찮다"는 말보다, 철이 많은 끼니라면 커피를 밥 앞쪽으로 옮기는 편이 근거에 더 가까워요. </span></p><p class="para" data-split="soft" data-units><span class="u">칼슘은 헴철까지 줄여요. </span><span class="u">우유 한 잔쯤의 칼슘(165mg)으로 철 흡수가 절반 가까이 줄었다는 연구가 있어요. </span><span class="u">다만 이 효과는 짧아서, 식사 1시간 30분~2시간 전에 먹은 칼슘은 그 끼니의 철 흡수에 영향을 주지 않았어요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">"같은 3mg, 다른 도착" 선 그림. </span><span class="u">왼쪽에 접시 두 개(시금치나물 · 장조림), 접시마다 철 알갱이 10개(레몬 노랑 점). </span><span class="u">가운데에 장벽(진초록 세로 벽)과 문 하나. </span><span class="u">장조림 쪽 알갱이는 고리(헴)를 두른 모양으로 문을 쉽게 지나고, 시금치 쪽 알갱이는 대부분 문 앞에 머묾. </span><span class="u">문 왼편 위에 '여는 짝' 꼬리표(귤·파프리카·살코기), 아래에 '닫는 짝' 꼬리표(찻잔·커피잔·우유잔·통곡물). </span><span class="u">문 오른편 몸 안쪽에 작은 수도꼭지 모양 '문지기'(간에서 온 신호)가 문 너비를 조절. </span><span class="u">아래 한 줄: "접시 위 숫자 ≠ 몸 안 숫자". </span><span class="u">영양 노트 카드와 같은 결(세이지 모눈·진초록 선·레몬 노랑 강조). </span></p></div><h3 class="h3" data-keep>셋째, 내 몸 — 모자라면 문을 넓히고, 넉넉하면 좁혀요</h3><p class="para" data-split="soft" data-units><span class="u">철에는 특별한 사정이 있어요. </span><span class="u">사람 몸에는 철을 일부러 내보내는 길이 없어요. </span><span class="u">피부와 장 세포가 떨어져 나가며 하루 1mg 남짓 잃고, 생리를 하는 여성은 하루 평균 0.45mg쯤을 더 잃을 뿐이에요. </span><span class="u">그래서 몸은 철의 양을 들어오는 문에서만 맞춰요. </span></p><p class="para" data-split="soft" data-units><span class="u">이 문을 맡는 것은 간에서 만드는 헵시딘이라는 호르몬이에요. </span><span class="u">헵시딘은 장벽 세포에서 철이 피로 나가는 통로(페로포르틴)에 붙어 그 길을 막아요. </span><span class="u">몸에 철이 모자라면 헵시딘이 줄어 문이 넓어지고, 철이 더 들어와요. </span><span class="u">몸에 염증이 있을 때도 헵시딘이 만들어져요. </span></p><p class="para" data-split="soft" data-units><span class="u">그래서 대부분의 사람은 섞어 먹는 밥상에서 철을 5~7%쯤 들이고, 철이 모자라기 시작한 사람에게서는 15% 쪽으로 높아져요. </span><span class="u">흡수율은 음식에 적힌 고정된 숫자가 아니라, 몸이 그때그때 정하는 숫자예요. </span></p><p class="emph"><strong>같은 접시도, 오늘의 내 몸이 문을 얼마나 열어 두었느냐에 따라 다르게 들어와요.</strong></p><div class="callout" data-split="hard"><div class="callout-lab">더 깊이</div><div data-units><p class="emph"><strong>칼슘도 '모양과 짝'을 따져요 — 시금치, 우유, 케일</strong></p><p class="para"><span class="u">건강한 어른 13명에게 같은 양의 칼슘(200mg)을 우유와 시금치로 나눠 먹게 한 실험이 있어요. </span><span class="u">우유에서는 평균 27.6%가 들어왔고, 시금치에서는 5.1%였어요. </span><span class="u">시금치에 든 옥살산(수산)의 양이 칼슘보다 조금 더 많아서, 칼슘을 거의 다 붙잡고 있었어요. </span></p><p class="para"><span class="u">그렇다고 초록 채소가 다 그런 건 아니에요. </span><span class="u">여성 11명이 칼슘 300mg을 케일과 우유로 먹은 실험에서는 케일이 40.9%, 우유가 32.1%로 케일이 더 높았어요. </span><span class="u">'채소 칼슘은 안 들어온다'도, '초록 채소면 다 같다'도 맞지 않아요. </span><span class="u">어떤 채소냐가 답을 바꿔요. </span></p><p class="emph"><strong>한 끼 실험과 매일 밥상은 다를 수 있어요</strong></p><p class="para"><span class="u">비타민C가 철 흡수를 크게 돕는다는 숫자는 주로 빈속에 한 끼를 먹이는 실험에서 나왔어요. </span><span class="u">12명이 5일 동안 평소처럼 여러 끼를 먹으며 하루 비타민C를 51mg에서 247mg까지 바꿔 본 연구에서는, 세 기간의 평균 철 흡수에 뚜렷한 차이가 없었어요. </span><span class="u">짝의 힘은 있지만, 매일 밥상 전체에서는 한 끼 실험보다 훨씬 작게 나타날 수 있다는 뜻이에요. </span></p><p class="emph"><strong>어림 계산 한 번</strong></p><p class="para"><span class="u">섞어 먹는 밥상의 철 가운데 헴철은 10~12%뿐이에요. </span><span class="u">밥상 철을 10mg이라 치고 헴철 1mg은 25%, 비헴철 9mg은 5%가 들어온다고 어림하면, 헴철 0.25mg · 비헴철 0.45mg이에요. </span><span class="u">먹은 철의 10분의 1인 헴철이, 들어온 철의 3분의 1쯤을 맡는 셈이에요. </span><span class="u">(실제 숫자는 사람과 밥상마다 달라요. 원리를 보려는 어림이에요.) </span></p></div></div><h3 class="h3" data-keep>한눈에 비교: 같은 미네랄, 들어오는 몫이 다른 이유</h3><table class="tbl" data-split="hard"><thead><tr><th>무엇</th><th>많이 든 음식</th><th>얼마나 들어오나</th><th>같이 먹으면 늘어요</th><th>같이 먹으면 줄어요</th></tr></thead><tbody data-units><tr><td>헴철</td><td>소고기·닭·생선 살코기</td><td>흔히 25% 이상</td><td>대체로 덜 흔들림</td><td>칼슘(헴철도 줄임)</td></tr><tr><td>비헴철</td><td>채소·콩·곡물</td><td>20% 미만, 섞은 밥상에서는 더 낮음</td><td>비타민C, 살코기·생선</td><td>차, 커피, 피트산(곡물·콩), 칼슘</td></tr><tr><td>칼슘 — 우유</td><td>우유·치즈</td><td>27.6~32.1% (실험 두 개)</td><td>비타민D("칼슘과 인이 흡수되고 이용되는 데 필요")</td><td>이 꼭지에서는 다루지 않음</td></tr><tr><td>칼슘 — 시금치</td><td>시금치</td><td>5.1%</td><td>—</td><td>옥살산(시금치 자체에 많음)</td></tr><tr><td>칼슘 — 케일</td><td>케일</td><td>40.9%</td><td>—</td><td>—</td></tr></tbody></table><h3 class="h3" data-keep>자주 헷갈리는 질문</h3><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 시금치는 철이 많다던데, 헛먹는 건가요?</strong> </span><span class="u">아니에요. </span><span class="u">시금치 철은 비헴철이라 적힌 숫자보다 훨씬 적게 들어오고, 칼슘은 옥살산에 붙잡혀 거의 들어오지 않아요. </span><span class="u">그렇다고 시금치를 뺄 이유는 없어요. </span><span class="u">다른 영양소와 식이섬유는 그대로 몫을 해요. </span><span class="u">철을 생각하는 날이라면 시금치나물 곁에 귤·파프리카를 놓거나, 살코기 반찬을 조금 곁들여 보세요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 커피는 밥 먹고 얼마나 있다가 마셔야 하나요?</strong> </span><span class="u">연구에서는 식사 한 시간 뒤에 마신 커피도 같이 마신 것만큼 철 흡수를 줄였어요. </span><span class="u">한 시간 전에 마셨을 땐 영향이 없었어요. </span><span class="u">차는 커피보다 더 크게 줄였어요. </span><span class="u">철이 많은 끼니라면 커피·차를 밥 앞쪽으로 옮겨 보세요. </span><span class="u">몇 시간이 지나면 괜찮은지는 이 연구로는 알 수 없어요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 칼슘과 철을 같이 먹으면 안 되나요?</strong> </span><span class="u">칼슘은 같은 끼니의 철 흡수를 줄일 수 있어요. </span><span class="u">다만 효과가 짧아서, 1시간 30분~2시간 앞서 먹은 칼슘은 영향이 없었어요. </span><span class="u">음식이라면 우유·치즈가 주인공인 끼니와 철 반찬이 주인공인 끼니를 나눠 보는 정도면 돼요. </span><span class="u">칼슘·철 영양제를 이미 함께 드시는 중이라면, 시간을 어떻게 나눌지 약사와 상의해 보세요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><p class="emph"><strong>확인된 것</strong></p><ul class="lst" data-split="soft" data-units><li>철 흡수율은 음식과 몸 상태에 따라 2% 미만에서 50%까지 달라져요.</li><li>헴철은 비헴철보다 잘 들어오고, 함께 먹은 음식에 덜 흔들려요.</li><li>차·커피·칼슘은 철 흡수를 줄이고, 비타민C와 살코기는 비헴철 흡수를 도와요.</li><li>몸은 철을 내보내는 길이 없어서, 들어오는 문에서 양을 맞춰요.</li></ul><p class="emph"><strong>아직 모르는 것</strong></p><ul class="lst" data-split="soft" data-units><li>한 끼 실험에서 본 짝의 효과가 매일 밥상에서 얼마나 이어지는지. 여러 날 먹는 연구에서는 훨씬 작았어요.</li><li>헴철이 장벽 세포로 들어가는 정확한 길은 비헴철보다 덜 밝혀졌어요.</li><li>장 속 균의 상태가 사람마다 흡수를 얼마나 바꾸는지는 아직 정리되지 않았어요.</li><li>내 몸의 흡수율을 집에서 잴 방법은 없어요. 철이 모자란지 걱정되면 검사는 병원에서 받아 보세요.</li></ul><p class="emph"><strong>흔한 오해</strong></p><ul class="lst" data-split="soft" data-units><li>"포장 뒷면 숫자만큼 들어온다" → 철은 대개 그 숫자의 일부만 들어와요.</li><li>"철이 많은 채소가 철 챙기기엔 최고" → 적힌 양보다 모양과 짝이 더 크게 좌우해요.</li><li>"식후 조금 쉬었다 마시면 커피는 괜찮다" → 한 시간 뒤에 마신 커피도 같이 마신 것만큼 줄였어요.</li><li>"흡수가 잘 될수록 좋다" → 철은 내보내는 길이 없어서, 몸이 일부러 문을 좁히기도 해요.</li></ul><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>채소·콩 반찬이 많은 날엔 귤·파프리카 같은 비타민C 채소·과일을 한 접시에 같이 놓고, 살코기나 생선을 조금 곁들여 보세요.</li><li>철이 많은 끼니라면 커피·차를 밥 먹기 한 시간쯤 전으로 옮겨 보세요.</li><li>우유·치즈가 주인공인 끼니와 철 반찬이 주인공인 끼니를 나눠 보세요. 칼슘은 시금치보다 우유·케일 같은 데서 더 잘 들어와요.</li></ol><p class="para" data-split="soft" data-units><span class="u">철분 보충제를 먹고 있거나 철이 모자라다는 말을 들었다면, 밥상을 바꾸기 전에 전문의와 상담해 보세요. </span></p><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">포장 뒷면은 접시 위의 숫자, 내 몸의 숫자는 모양 · 짝 · 내 몸이 정해요.</mark></p></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-4, 2-2, 11-8, 11-4, 11-7, 7-3</p></article>
<article data-id="2-2" data-short="2-2 위"><header class="art-head" data-keep><div class="art-no">2-2</div><h2 class="art-title"><span class="kw">위</span> 위산은 왜 그렇게 셀까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">위액 속 산의 이름은 염산이에요. </span><span class="u">공장에서 쇠를 녹일 때 쓰는 바로 그 이름의 산을, 우리 위는 밥때마다 스스로 만들어요. </span><span class="u">그것도 고기 한 점, 밥 한 숟가락을 위해서요. </span></p><p class="para" data-split="soft" data-units><span class="u">그래서 두 가지가 궁금해져요. </span><span class="u">왜 그렇게까지 세야 할까요? </span><span class="u">그리고 그 산을 하루 종일 담고 있는 위는, 왜 녹지 않을까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>위의 일은 입에서 이미 시작돼요</h3><p class="para" data-split="soft" data-units><span class="u">위 이야기를 하려면 입부터 봐야 해요. </span><span class="u">이가 밥알을 잘게 부수면 음식의 겉면이 넓어져서, 뒤에 나올 소화액이 닿을 자리가 많아져요. </span><span class="u">침 속에는 녹말을 쪼개는 효소가 들어 있어요. </span><span class="u">밥을 오래 씹으면 은근히 단맛이 올라오는 게, 녹말이 작은 당으로 쪼개지고 있다는 신호예요. </span><span class="u">급하게 삼키면 큰 덩어리가 그대로 내려가고, 위가 할 일이 그만큼 늘어요. </span></p><p class="para" data-split="soft" data-units><span class="u">위는 음식이 들어오기 전부터 준비를 해요. </span><span class="u">밥 냄새를 맡거나 맛있는 음식을 떠올리기만 해도 뇌가 신경을 통해 위에 신호를 보내고, 위액이 나오기 시작해요. </span><span class="u">음식이 들어와 위가 늘어나고, 고기 같은 단백질이 닿으면 신호가 한 번 더 켜져요. </span><span class="u"><strong>위산은 아무 때나 나오는 게 아니라, 밥이 올 것을 알고 맞춰 나와요.</strong> </span></p><h3 class="h3" data-keep>위는 부엌의 '밑손질 자리'예요</h3><p class="para" data-split="soft" data-units><span class="u">요리를 할 때 재료를 바로 냄비에 넣지 않아요. </span><span class="u">씻고, 데치고, 자르고, 양념에 재워 두었다가 조금씩 불 위로 옮기지요. </span><span class="u">위가 하는 일이 꼭 이 밑손질이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">위 윗부분은 들어온 음식을 잠시 담아 두는 그릇이 되고, 아랫부분의 근육은 음식을 위액과 섞으며 잘게 부숴요. </span><span class="u">위 출구는 한꺼번에 열리지 않아요. </span><span class="u">죽처럼 된 것을 조금씩, 작은창자가 감당할 만큼만 내려보내요. </span></p><p class="para" data-split="soft" data-units><span class="u">위는 흡수를 거의 하지 않아요. </span><span class="u">알코올이나 아스피린처럼 몇 안 되는 물질만 조금 흡수될 뿐이에요. </span><span class="u">위의 일은 '들이는 것'이 아니라, 작은창자가 들일 수 있게 '준비하는 것'이에요. </span><span class="u">위가 만든 죽은 그냥 으깬 것이 아니라 소화액이 다 섞인 상태, 밑손질이 끝난 재료예요. </span></p><h3 class="h3" data-keep>산이 센 데는 이유가 네 가지 있어요</h3><p class="para" data-split="soft" data-units><span class="u"><strong>① 함께 들어온 균을 줄여요.</strong> </span><span class="u">밥상의 음식이 늘 깨끗하지는 않아요. </span><span class="u">위의 높은 산성은 대부분의 세균을 죽여 감염을 막는 역할을 해요. </span><span class="u">장으로 내려가는 문 앞의 첫 검문소인 셈이에요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>② 단백질을 자를 준비를 해요.</strong> </span><span class="u">위 안쪽 세포는 염산과 함께 '펩신이 되기 전 단계의 물질'을 내보내요. </span><span class="u">이 물질은 산을 만나야 펩신으로 바뀌어 일을 시작해요. </span><span class="u">펩신은 고기 같은 단백질을 자르는 소화 효소예요. </span><span class="u">산은 실타래처럼 뭉친 단백질을 느슨하게 풀어, 펩신이 자를 자리를 드러내 줘요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>③ 비타민B12를 단백질에서 떼어 내요.</strong> </span><span class="u">음식 속 B12는 단백질에 붙어 있어요. </span><span class="u">위산과 펩신이 이 B12를 떼어 내요. </span><span class="u">떨어져 나온 B12는 위가 만든 단백질(내인 인자)과 결합해야, 먼 길을 내려가 작은창자 끝에서 흡수돼요. </span><span class="u">위산이 줄면 이 떼어 내는 힘이 약해져요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>④ 미네랄이 들어올 길을 거들어요.</strong> </span><span class="u">위산을 중화하는 약(제산제)은 철 흡수를 줄일 수 있어요. </span><span class="u">산성인 곳에서 녹아 있던 철이, 산이 줄면 덜 녹은 채로 내려가기 때문으로 봐요. </span></p><p class="para" data-split="soft" data-units><span class="u">위산의 일을 한 줄로 줄이면 '살균·단백질 분해 준비·비타민B12 떼어 내기·미네랄 흡수 돕기'예요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">위를 부엌 밑손질대로 그린 선 그림. </span><span class="u">위 입구(식도 쪽)에 '닫힌 문' 고리, 위 안쪽 벽을 따라 레몬 노랑 띠(점액 막). </span><span class="u">가운데에 ① 균 그림에 작은 X ② 실타래처럼 엉킨 단백질이 풀리는 모습 ③ B12 알갱이가 단백질에서 떨어져 '내인 인자'와 손잡는 모습 ④ 철 알갱이. </span><span class="u">아래 출구에서 숟가락 하나씩 작은창자로 내려보내는 화살표. </span><span class="u">왼쪽 위 작은 말풍선: 코와 생각 구름 → "밥 냄새만 맡아도 준비 시작". </span><span class="u">2-1 그림과 같은 선·색. </span></p></div><h3 class="h3" data-keep>위가 비는 속도는 음식마다 달라요</h3><p class="para" data-split="soft" data-units><span class="u">물이나 국물은 금방 내려가고, 밥은 조금 더, 기름지고 단백질이 많은 음식은 가장 오래 위에 머물러요. </span><span class="u">기름이 작은창자에 닿으면 "천천히 보내" 하는 신호가 위로 올라가기 때문이에요. </span><span class="u">삼겹살 한 상을 먹은 날 속이 오래 든든한 것도, 죽 한 그릇이 금방 꺼지는 것도 이 때문이에요. </span><span class="u">기름진 큰 한 끼 뒤에 속이 더부룩한 건, 위가 일부러 내려보내는 속도를 늦추고 있어서일 수 있어요. </span></p><h3 class="h3" data-keep>그 산 속에서 위는 왜 녹지 않을까요</h3><p class="para" data-split="soft" data-units><span class="u">위 안쪽 벽은 끈끈한 점액이 덮고 있어요. </span><span class="u">점액 바로 아래에서는 산을 누그러뜨리는 물질도 함께 나와, 세포에 닿는 쪽은 산이 훨씬 약해져요. </span><span class="u">이 점액 막이 산과 효소로부터 위벽 세포를 지켜요. </span><span class="u">위벽 세포는 빠르게 새것으로 바뀌어서, 조금 상한 자리도 금방 메워져요. </span></p><p class="para" data-split="soft" data-units><span class="u">어떤 약이나 균 때문에 이 막이 약해지면 위벽에 상처가 날 수 있어요. </span><span class="u">그래서 위에 상처가 났다는 말을 들으면 "산이 많아서"만이 아니라 "지키는 막이 약해져서"도 함께 봐요. </span></p><h3 class="h3" data-keep>식도는 왜 쓰릴까요</h3><p class="para" data-split="soft" data-units><span class="u">식도에는 위 같은 보호막이 없어요. </span><span class="u">그래서 위에서는 아무렇지 않은 산이, 식도로 올라오면 쓰리게 느껴져요. </span></p><p class="para" data-split="soft" data-units><span class="u">식도 끝에는 근육 고리가 있어서, 평소에는 문처럼 닫혀 위 내용물이 올라오지 못하게 해요. </span><span class="u">위 내용물이 자꾸 식도로 올라오는 병은 대개 산이 많아서가 아니라, 이 고리가 제대로 일하지 않아서 생겨요. </span><span class="u">그 문이 저절로 잠깐씩 풀리는 것이 흔한 길로 꼽혀요. </span><span class="u">배가 너무 부르면 위가 늘어나 이 문이 더 자주 풀리는 것으로 보여요. </span><span class="u">그래서 "속쓰림 = 위산 과다"라는 공식은 절반만 맞아요. </span></p><div class="callout" data-split="hard"><div class="callout-lab">더 깊이</div><div data-units><p class="emph"><strong>위산이 줄면 무슨 일이 생길까요</strong></p><p class="para"><span class="u">위산이 하는 네 가지 일을 거꾸로 보면, 줄었을 때 무엇이 달라지는지도 보여요. </span><span class="u">음식 속 B12를 떼어 내는 힘이 약해지고, 철처럼 산 속에서 잘 녹는 미네랄은 덜 녹은 채로 내려가요. </span></p><p class="para"><span class="u">나이가 들면 위산이 줄어 음식 속 B12를 떼어 내는 힘이 약해질 수 있어요. </span><span class="u">위산을 줄이는 약이나 당뇨약(메트포르민)을 오래 먹는 경우에도 B12 흡수가 떨어질 수 있다고 알려져 있어요. </span><span class="u">이런 약은 꼭 필요해서 쓰는 약이에요. </span><span class="u">약을 탓할 일이 아니라, 오래 드시는 분이라면 의사와 함께 한 번씩 살펴볼 거리라는 뜻이에요. </span></p><p class="emph"><strong>신 음식이 위산을 '채워' 줄까요?</strong></p><p class="para"><span class="u">"밥 먹고 신 음료를 마시면 위산을 보충해 소화가 잘 된다"는 말도 있어요. </span><span class="u">위가 스스로 만드는 산의 양과 세기를 생각하면, 음료 한 잔의 신맛이 그 일을 대신한다고 보기는 어려워요. </span><span class="u">사람에게서 소화를 돕는다고 확인한 근거도 이 책이 확인한 자료에서는 찾지 못했어요. </span></p></div></div><h3 class="h3" data-keep>한눈에 보기: 위산이 하는 일</h3><table class="tbl" data-split="hard"><thead><tr><th>위산이 하는 일</th><th>어떻게</th><th>줄어들면</th><th>이어지는 이야기</th></tr></thead><tbody data-units><tr><td>균 줄이기</td><td>높은 산성으로 대부분의 세균을 죽임</td><td>함께 들어온 균이 더 많이 내려갈 수 있음</td><td>장 속 균·면역</td></tr><tr><td>단백질 분해 준비</td><td>산이 '펩신 전 단계 물질'을 펩신으로 바꿈, 뭉친 단백질을 풂</td><td>위에서의 단백질 손질이 줄어듦</td><td>소화와 흡수</td></tr><tr><td>비타민B12 떼어 내기</td><td>음식 단백질에서 B12를 떼어 내인 인자와 잇게 함</td><td>음식 속 B12를 덜 떼어 냄</td><td>작은창자 끝 흡수</td></tr><tr><td>미네랄 흡수 돕기</td><td>철을 녹은 상태로 내려보냄</td><td>제산제가 철 흡수를 줄일 수 있음</td><td>철 흡수</td></tr></tbody></table><h3 class="h3" data-keep>자주 헷갈리는 질문</h3><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 밥 먹을 때 물을 마시면 위산이 묽어져 소화가 안 되나요?</strong> </span><span class="u">물은 소화를 방해하거나 소화액을 묽게 하지 않는다는 전문가 답변이 있어요. </span><span class="u">위는 음식이 들어오면 그에 맞춰 산을 더 만들어요. </span><span class="u">국이나 물은 목이 마른 만큼 편하게 드세요. </span><span class="u">심장·콩팥·간 질환으로 물을 줄이라는 말을 들었다면 그 말이 먼저예요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 속이 쓰리면 위산이 너무 많은 건가요?</strong> </span><span class="u">꼭 그렇지는 않아요. </span><span class="u">위 내용물이 식도로 올라오는 일은 대개 산의 양보다 식도 끝 문이 풀리는 데서 와요. </span><span class="u">반대로 "속쓰림은 위산이 모자라서"라고 단정하는 말도 있지만, 이것 역시 확인된 근거를 찾지 못했어요. </span><span class="u">속쓰림이 잦다면 이유를 혼자 짐작하기보다 진료를 받아 보세요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 위가 약하면 죽만 먹는 게 좋을까요?</strong> </span><span class="u">속이 불편한 날 부드러운 음식으로 쉬어 가는 건 자연스러워요. </span><span class="u">다만 위는 음식을 섞고 부수고 조금씩 내려보내는 근육 주머니라서, 평소에는 씹어 먹는 보통 밥상으로 돌아오는 게 자연스러운 순서예요. </span><span class="u">불편이 길게 이어진다면 진료를 받아 보세요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><p class="emph"><strong>확인된 것</strong></p><ul class="lst" data-split="soft" data-units><li>위는 흡수를 거의 하지 않고, 산과 효소로 음식을 준비해 작은창자로 조금씩 보내요.</li><li>위산은 균을 줄이고, 펩신을 깨우고, 음식 속 B12를 떼어 내고, 철이 녹은 채 내려가게 거들어요.</li><li>위벽은 점액 막이 지키고, 식도에는 그런 막이 없어요.</li><li>기름진 음식은 위가 비는 속도를 늦춰요.</li></ul><p class="emph"><strong>아직 모르는 것</strong></p><ul class="lst" data-split="soft" data-units><li>식사 뒤 신 음료·식초가 위산을 '보충'해 소화를 돕는다는 말 — 사람에게서 확인한 근거를 찾지 못했어요.</li><li>나이가 들며 위산이 줄어드는 정도가 사람마다 얼마나 다른지.</li><li>위산이 줄었을 때 장 속 균이 얼마나, 어떻게 달라지는지.</li></ul><p class="emph"><strong>흔한 오해</strong></p><ul class="lst" data-split="soft" data-units><li>"속이 쓰린 건 위산이 너무 많아서" → 대개 식도 끝 문이 제대로 닫히지 않는 쪽이에요.</li><li>"밥 먹을 때 물을 마시면 위산이 묽어진다" → 물은 소화액을 묽게 하지 않는다는 전문가 답변이 있어요.</li><li>"위산은 적을수록 좋다" → 위산은 살균·단백질·B12·미네랄을 맡은 일꾼이에요.</li><li>"위에서 영양이 흡수된다" → 위는 준비하는 곳, 흡수는 대부분 작은창자예요.</li></ul><p class="para" data-split="soft" data-units><span class="u">속쓰림이 잦거나, 삼키기 힘들거나, 체중이 이유 없이 줄면 혼자 판단하지 말고 진료를 받아 보세요. </span></p><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>첫 몇 숟가락은 천천히 씹어, 단맛이 올라오는 순간을 느껴 보세요. 위의 밑손질은 입에서 시작해요.</li><li>국이나 물은 목이 마른 만큼 편하게 드세요. 억지로 참기보다, 단 음료 대신 물을 곁에 두는 쪽이 더 쉬워요.</li><li>저녁이 늦은 날은 배가 꽉 차기 전에 숟가락을 내려놓아 보세요. 위가 크게 늘어날수록 식도 끝 문이 더 자주 풀리는 것으로 보여요.</li></ol><p class="para" data-split="soft" data-units><span class="u">위산을 줄이는 약이나 당뇨약(메트포르민)을 오래 드시는 중이라면, 다음 진료 때 "비타민B12도 한번 봐야 할까요?" 하고 물어보세요. 약은 스스로 끊거나 줄이지 않아요. </span></p><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">위산은 줄여야 할 적이 아니라, 음식을 밑손질하는 부엌의 일꾼이에요.</mark></p></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-1, 2-4, 2-8, 2-9, 13-3, 16-1, 16-2</p></article>
<article data-id="2-3" data-short="2-3 쓸개즙"><header class="art-head" data-keep><div class="art-no">2-3</div><h2 class="art-title"><span class="kw">쓸개즙</span> 기름에 녹는 비타민은 왜 기름과 함께 먹으라고 할까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">"당근은 기름에 볶아 먹어야 좋다"는 말, 많이 들어 보셨지요. </span><span class="u">그래서 비타민A·D·E·K는 기름과 함께 먹으라고들 해요. </span><span class="u">그런데 기름은 비타민을 녹여 주기만 하는 걸까요? </span><span class="u">기름 한 숟가락이 장 속에서 하는 일을 따라가 보면, 생각보다 훨씬 여러 가지 일을 하고 있어요. </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>장 속은 물바다예요</h3><p class="para" data-split="soft" data-units><span class="u">장 속은 소화액과 물이 대부분이에요. </span><span class="u">그런데 기름과 기름에 녹는 비타민은 물에 섞이지 않아요. </span><span class="u">국 위에 뜬 기름 동그라미처럼, 장 속에서도 따로 뭉쳐 떠 있으려고 해요. </span></p><p class="para" data-split="soft" data-units><span class="u">기름을 쪼개는 소화 효소는 물 쪽에서 일해요. </span><span class="u">그래서 기름이 큰 덩어리로 뭉쳐 있으면, 효소가 닿을 수 있는 곳은 덩어리 겉면뿐이에요. </span><span class="u">큰 돼지비계 한 덩어리를 통째로 씻기 어렵고, 잘게 썰어야 양념이 배는 것과 같아요. </span></p><h3 class="h3" data-keep>쓸개즙은 몸속 주방 세제예요</h3><p class="para" data-split="soft" data-units><span class="u">기름 묻은 프라이팬을 물로만 헹궈 보세요. </span><span class="u">기름은 동그랗게 떠서 그대로 남아요. </span><span class="u">세제를 한 방울 묻히면 기름이 작은 방울로 풀려 물에 섞여 나가지요. </span></p><p class="para" data-split="soft" data-units><span class="u">이때 세제 노릇을 하는 것이 쓸개즙 속 담즙염이에요. </span><span class="u">담즙염은 한쪽은 물을, 다른 한쪽은 기름을 좋아하는 모양이에요. </span><span class="u">기름 쪽 끝을 기름 방울에 꽂고 물 쪽 끝을 바깥으로 내밀어, 큰 기름 덩어리를 작은 방울로 나눠 감싸요. </span><span class="u">방울이 작아질수록 겉면이 넓어지고, 효소가 일할 자리가 많아져요. </span><span class="u">담즙염은 콜레스테롤, 지방, 기름에 녹는 비타민이 장에서 더 쉽게 흡수되게 도와요. </span></p><h3 class="h3" data-keep>쓸개즙은 간이 만들고, 쓸개가 모아 둬요</h3><p class="para" data-split="soft" data-units><span class="u">쓸개즙은 쓸개가 아니라 간이 만들어요. </span><span class="u">간에서 나온 쓸개즙의 절반쯤은 쓸개(담낭)로 가서 모여요. </span><span class="u">쓸개 안에서 물이 최대 90%까지 빠져 더 진해져요. </span><span class="u">음식이 작은창자로 들어오면 신호가 가고, 쓸개가 수축해 쓸개즙을 내보내요. </span></p><h3 class="h3" data-keep>기름은 쓸개즙을 부르는 초인종이에요</h3><p class="para" data-split="soft" data-units><span class="u">기름과 단백질이 작은창자 첫머리에 닿으면, 장벽 세포가 "기름이 왔어요" 하는 호르몬 신호를 내보내요. </span><span class="u">이 신호를 받은 쓸개는 쪼그라들며 쓸개즙을 짜내고, 췌장은 기름을 쪼개는 효소를 내보내요. </span><span class="u">위에는 "조금 천천히 내려보내" 하는 신호도 함께 가요. </span></p><p class="para" data-split="soft" data-units><span class="u">그러니 기름이 거의 없는 한 끼에는 쓸개즙도 적게 나와요. </span><span class="u"><strong>기름은 작은 배의 재료이면서, 쓸개즙을 부르는 초인종이에요.</strong> </span></p><h3 class="h3" data-keep>세제와 일꾼이 함께 일해요</h3><p class="para" data-split="soft" data-units><span class="u">풀린 기름은 췌장 소화액이 더 잘 쪼개요. </span><span class="u">그런데 기름을 쪼개는 효소는 혼자 일하지 않아요. </span><span class="u">쓸개즙이 기름 방울을 감싸면 효소가 오히려 붙기 어려워지는데, 췌장은 효소가 기름 방울 겉에 자리를 잡도록 붙잡아 주는 짝 단백질을 함께 내보내요. </span><span class="u">세제가 풀고, 짝이 자리를 잡아 주고, 효소가 쪼개요. </span><span class="u">소화는 한 가지 성분이 아니라 여럿이 손발을 맞추는 일이에요. </span></p><h3 class="h3" data-keep>비타민을 싣는 작은 배</h3><p class="para" data-split="soft" data-units><span class="u">쪼개진 기름과 담즙염은 기름에 녹는 비타민을 품고 아주 작은 알갱이(혼합 미셀)로 묶여요. </span><span class="u">기름과 쓸개즙이 함께 비타민을 싣는 작은 배를 만들어요. </span><span class="u">이 배가 물바다를 건너 비타민을 장벽까지 실어 날라요. </span><span class="u">장벽에 닿으면 배에 실린 것들은 세포 안으로 들어가고, 배를 만들던 담즙염은 다시 장 속에 남아 다음 짐을 실어요. </span></p><p class="para" data-split="soft" data-units><span class="u">비타민A가 되는 베타카로틴, 비타민D, 비타민E, 비타민K가 모두 이 배를 타요. </span><span class="u">배를 타지 못한 비타민은 장 속을 그냥 지나가 버려요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">부엌 개수대 선 그림. </span><span class="u">왼쪽 프라이팬: 물만 부은 팬 위에 큰 기름 방울(레몬 노랑) 하나 + 당근·시금치 그림의 비타민 알갱이가 갇혀 있음. </span><span class="u">오른쪽 프라이팬: 세제 병(= 쓸개, 라벨 "간이 만든 쓸개즙")에서 한 방울 → 기름이 작은 방울들로 풀리고, 비타민 알갱이가 작은 배(혼합 미셀)에 실려 '집 안'(장벽) 쪽으로. </span><span class="u">세제 병 위에 작은 초인종 "기름이 오면 딩동". </span><span class="u">배 옆에 작은 일꾼 둘(효소와 짝 단백질)이 손을 맞잡은 모습. </span><span class="u">2-1·2-2와 같은 선·색. </span></p></div><h3 class="h3" data-keep>기름이 있고 없고, 실제로 얼마나 다를까요</h3><p class="para" data-split="soft" data-units><span class="u">한 연구에서 7명이 같은 채소 샐러드를 세 번 먹었어요. </span><span class="u">드레싱 속 기름만 0g·6g·28g으로 바꿨어요. </span><span class="u">기름 없는 드레싱을 먹은 날엔 채소 속 카로티노이드(베타카로틴 같은 색소)가 피에서 거의 나타나지 않았어요. </span><span class="u">기름이 많은 드레싱을 먹은 날 가장 많이 나타났어요. </span></p><p class="para" data-split="soft" data-units><span class="u">50세 이상 50명이 비타민D를 먹은 연구도 있어요. </span><span class="u">지방이 든 아침과 함께 먹은 사람은, 지방이 없는 아침과 먹은 사람보다 피 속 최고치가 평균 32% 높았어요. </span><span class="u">기름의 종류를 바꿔도 차이는 없었어요. </span></p><p class="para" data-split="soft" data-units><span class="u">비타민D는 칼슘과 인이 흡수되고 이용되는 데 필요해요. </span><span class="u">그 비타민D도 먼저 작은 배를 타야 들어와요. </span></p><h3 class="h3" data-keep>기름만큼 중요한 것: 음식을 어떻게 만들었나</h3><p class="para" data-split="soft" data-units><span class="u">채소 속 색소는 단단한 세포벽 안에 갇혀 있어요. </span><span class="u">배가 있어도 짐이 창고 밖으로 나오지 않으면 실을 수 없지요. </span><span class="u">그래서 썰고, 갈고, 익히는 손질이 색소를 꺼내는 첫 단계가 돼요. </span></p><p class="para" data-split="soft" data-units><span class="u">토마토가 좋은 예예요. </span><span class="u">생토마토보다 토마토를 졸여 만든 페이스트를 먹었을 때, 피 속 붉은 색소(라이코펜)가 더 높게 나타났다는 연구가 있어요. </span><span class="u">두 쪽 다 같은 양의 기름과 함께 먹었으니, 차이는 열과 손질로 세포벽이 풀린 덕으로 봐요. </span><span class="u">당근을 기름에 볶으면 좋다는 말에는 '기름'과 '익힘' 두 가지가 다 들어 있었던 거예요. </span></p><div class="callout" data-split="hard"><div class="callout-lab">더 깊이</div><div data-units><p class="emph"><strong>쓸개즙은 한 번 쓰고 버리지 않아요</strong></p><p class="para"><span class="u">작은창자로 나간 담즙염의 90%는 작은창자 아래쪽에서 다시 흡수돼 간으로 돌아가요. </span><span class="u">간은 이것을 다시 쓸개즙으로 내보내요. 하루에 10~12번쯤 돌아요. </span><span class="u">세제를 헹군 물을 모아 다시 쓰는 부엌처럼, 몸은 같은 담즙염을 여러 번 돌려써요. </span></p><p class="emph"><strong>쓸개즙은 몸의 쓰레기 길이기도 해요</strong></p><p class="para"><span class="u">쓸개즙은 몸에 남는 콜레스테롤과 피 색소가 분해된 찌꺼기를 내보내는 길이기도 해요. </span><span class="u">변이 갈색인 것도 이 피 색소 찌꺼기 덕분이에요. </span><span class="u">그래서 쓸개즙은 '들이는 길'과 '내보내는 길'을 함께 맡아요. </span></p><p class="emph"><strong>쓸개가 없으면요?</strong></p><p class="para"><span class="u">쓸개즙은 간이 만들기 때문에, 쓸개를 떼어 낸 뒤에도 간에서 작은창자로 바로 흘러가요. </span><span class="u">다만 모아 두었다가 한꺼번에 짜내는 그릇이 없어지는 셈이에요. </span><span class="u">기름진 한 끼가 예전과 다르게 느껴진다면, 담당 의사와 상의해 보세요. </span></p></div></div><h3 class="h3" data-keep>한눈에 보기: 기름에 녹는 비타민</h3><table class="tbl" data-split="hard"><thead><tr><th>무엇</th><th>많이 든 음식</th><th>식약처가 인정한 일</th><th>함께 먹으면</th></tr></thead><tbody data-units><tr><td>비타민A (베타카로틴)</td><td>당근·단호박·시금치·고구마</td><td>어두운 곳에서 시각 적응을 위해 필요 / 피부와 점막을 형성하고 기능을 유지하는 데 필요</td><td>기름 조금 + 익히거나 잘게 손질</td></tr><tr><td>비타민D</td><td>고등어·연어 같은 생선, 달걀노른자, 햇볕에 말린 버섯</td><td>칼슘과 인이 흡수되고 이용되는 데 필요</td><td>지방이 든 식사</td></tr><tr><td>비타민E</td><td>견과·씨앗, 식물성 기름</td><td>항산화 작용을 하여 유해산소로부터 세포를 보호하는 데 필요</td><td>이미 기름 속에 들어 있는 경우가 많음</td></tr></tbody></table><p class="para" data-split="soft" data-units><span class="u">비타민A는 베타카로틴으로 챙기면, 몸이 필요한 만큼만 바꿔 써요. </span><span class="u">담배를 피우는 분이 고용량 베타카로틴 영양제를 생각한다면 먼저 의사·약사와 상의해 보세요. </span><span class="u">비타민K도 같은 배를 타고 들어와요. 푸른 잎채소에 많아요. </span></p><h3 class="h3" data-keep>자주 헷갈리는 질문</h3><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 다이어트 중이라 샐러드에 드레싱을 안 뿌리는데, 괜찮을까요?</strong> </span><span class="u">기름이 전혀 없으면 채소 속 카로티노이드가 거의 들어오지 않았어요. </span><span class="u">드레싱을 듬뿍이 아니라, 들기름·올리브유 한 숟가락 안쪽, 또는 견과·달걀처럼 기름이 든 재료를 조금 곁들이는 정도로 생각해 보세요. </span><span class="u">한 끼에 몇 g이면 충분한지는 아직 정해진 숫자가 없어요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 어떤 기름이 가장 좋을까요?</strong> </span><span class="u">비타민D 연구에서는 기름 종류를 바꿔도 흡수 차이가 없었어요. </span><span class="u">작은 배를 만드는 데는 '어떤 기름이냐'보다 '기름이 있느냐'가 먼저인 셈이에요. </span><span class="u">어떤 기름을 고를지는 기름 자체의 이야기라 따로 공부해요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 비타민D 영양제는 언제 먹어야 하나요?</strong> </span><span class="u">지방이 든 식사와 함께 먹었을 때 피 속 최고치가 더 높았다는 연구가 있어요. </span><span class="u">비타민D 영양제를 이미 드시는 중이라면, 언제 먹을지 약사와 한번 상의해 보세요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><p class="emph"><strong>확인된 것</strong></p><ul class="lst" data-split="soft" data-units><li>담즙염은 지방과 기름에 녹는 비타민이 장에서 더 쉽게 흡수되게 도와요.</li><li>쓸개즙은 간이 만들고, 쓸개는 모아 두었다가 음식이 오면 짜내요.</li><li>기름 없는 샐러드에서는 카로티노이드가 거의 흡수되지 않았어요.</li><li>담즙염의 대부분은 작은창자 아래쪽에서 다시 흡수돼 돌려써요.</li></ul><p class="emph"><strong>아직 모르는 것</strong></p><ul class="lst" data-split="soft" data-units><li>한 끼에 기름이 몇 g이면 충분한지. 연구가 작고(7명, 50명) 음식·사람마다 달라서, 정해진 숫자는 아직 없어요.</li><li>쓸개를 뗀 뒤 기름에 녹는 비타민이 얼마나 덜 들어오는지는 사람마다 달라요.</li><li>익히는 방법(볶기·찌기·졸이기)마다 채소 색소가 얼마나 다르게 들어오는지, 채소마다의 정답.</li></ul><p class="emph"><strong>흔한 오해</strong></p><ul class="lst" data-split="soft" data-units><li>"건강하려면 기름은 무조건 빼야 한다" → 기름이 없으면 채소 속 카로티노이드가 거의 들어오지 않았어요. 문제는 기름의 양과 종류예요.</li><li>"쓸개를 떼면 쓸개즙이 없다" → 쓸개즙은 간이 만들고, 쓸개가 없어도 간에서 작은창자로 바로 흘러가요.</li><li>"쓸개즙은 쓸개가 만든다" → 만드는 곳은 간, 쓸개는 모아 두는 그릇이에요.</li><li>"생채소가 늘 더 낫다" → 색소에 따라서는 익히고 손질한 쪽이 더 잘 들어오기도 해요.</li></ul><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>당근·단호박·시금치처럼 색이 진한 채소는 들기름·올리브유를 조금 둘러 무치거나 볶아 보세요. 기름 없는 드레싱보다 조금 있는 쪽이 나아요.</li><li>생채소 샐러드만 먹는 날엔 견과 한 줌이나 삶은 달걀 하나를 얹어, 작은 배의 재료를 함께 올려 보세요.</li><li>토마토는 생으로도, 기름에 볶거나 졸여서도 번갈아 드셔 보세요.</li></ol><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">기름과 쓸개즙이 함께 비타민을 싣는 작은 배를 만들어요.</mark></p></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-2, 2-4, 2-9, 4-5, 11-2, 11-5, 11-6, 13-2</p></article>
<article data-id="2-4" data-short="2-4 흡수"><header class="art-head" data-keep><div class="art-no">2-4</div><h2 class="art-title"><span class="kw">흡수</span> 소화와 흡수, 무엇이 다를까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">"오늘은 소화가 잘 됐다"는 말은 자주 해요. </span><span class="u">그런데 "오늘은 흡수가 잘 됐다"고 느껴 본 적이 있나요? </span><span class="u">속이 편한 건 느껴져도, 흡수는 느껴지지 않아요. </span><span class="u">둘은 같은 말이 아니에요. </span><span class="u">속이 아주 편한 날에도 들어오지 못한 영양이 있을 수 있고, 조금 더부룩한 날에도 들어올 것은 들어와요. </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>상자를 뜯는 일과 집 안에 들이는 일</h3><p class="para" data-split="soft" data-units><span class="u">택배가 오면 먼저 상자를 뜯고 물건을 하나씩 꺼내요. </span><span class="u">이게 <strong>소화</strong>예요. </span><span class="u">입과 위가 부수고, 쓸개즙과 췌장 소화액이 잘게 쪼개요. </span></p><p class="para" data-split="soft" data-units><span class="u">꺼낸 물건을 현관 안으로 들여 제자리에 두는 일은 따로 있어요. </span><span class="u">이게 <strong>흡수</strong>예요. </span><span class="u">쪼개진 영양이 장벽 세포를 넘어 피나 림프로 들어가는 일이지요. </span><span class="u">상자를 다 뜯어도 현관 밖에 쌓아 두기만 하면, 우리 집 살림이 되지 않아요. </span></p><h3 class="h3" data-keep>쪼개기는 세 번에 나눠 일어나요</h3><p class="para" data-split="soft" data-units><span class="u"><strong>첫 번째, 부수기.</strong> 이와 위 근육이 덩어리를 잘게 만들어요. 아직 모양만 작아진 단계예요. </span><span class="u"><strong>두 번째, 녹이기.</strong> 침·위액·췌장 소화액 속 효소가 녹말·단백질·기름을 작은 조각으로 잘라요. </span><span class="u"><strong>세 번째, 현관 앞 마지막 손질.</strong> 작은창자 벽 세포의 겉면에도 효소가 붙어 있어요. </span><span class="u">여기서 두 개짜리 당이 하나짜리로, 짧은 단백질 조각이 더 짧게 잘려요. </span><span class="u">현관 앞에서 마지막 포장 비닐을 벗기고 곧바로 들이는 셈이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">우유 속 젖당을 자르는 효소도 이 현관 앞에 있어요. </span><span class="u">어른이 되면서 이 효소가 줄어드는 사람이 많고, 아시아 사람에게서 흔하다고 알려져 있어요. </span><span class="u">우유를 마시면 배가 부글거리는 사람은, 잘리지 못한 젖당이 큰창자까지 내려가 균의 밥이 되면서 가스가 생기는 경우가 많아요. </span><span class="u">소화의 마지막 한 단계가 비면, 흡수도 그 자리에서 멈춰요. </span></p><h3 class="h3" data-keep>이 현관은 생각보다 넓어요</h3><p class="para" data-split="soft" data-units><span class="u">현관은 대부분 작은창자에 있어요. </span><span class="u">안쪽 벽에 주름이 겹겹이 있고, 그 위를 손가락처럼 생긴 융모가, 다시 그 세포 겉을 아주 작은 솔 같은 미세 융모가 덮고 있어요. </span><span class="u">예전에는 이 넓이를 테니스장만 하다고 했지만, 2014년 측정 연구에서는 소화관 안쪽 전체가 약 30~40㎡, 원룸 하나 크기였어요. </span><span class="u">그 대부분이 작은창자예요. </span><span class="u">테니스장은 아니어도, 몸 안에 원룸 한 칸 넓이의 현관을 접어 넣고 다니는 셈이에요. </span></p><h3 class="h3" data-keep>현관문은 영양소마다 달라요</h3><p class="para" data-split="soft" data-units><span class="u">장벽 세포는 아무것이나 들이지 않아요. </span><span class="u">영양소마다 맞는 문(운반체)이 따로 있어요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>포도당</strong> — 나트륨과 손을 잡고 함께 들어가는 문을 써요. </span><span class="u">그래서 설사로 물과 소금기를 잃었을 때 마시는 수분 보충 용액에는 소금과 포도당이 함께 들어 있어요. </span><span class="u">둘이 같이 들어가면서 물도 따라 들어오기 때문이에요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>과당</strong> — 포도당과는 다른 문을 써요. 이 문은 한꺼번에 많이 들이지 못해요. </span><span class="u">과일 몇 쪽은 괜찮아도 과당이 많은 단 음료를 한 번에 많이 마시면, 다 들어오지 못한 과당이 큰창자로 내려가 가스를 늘릴 수 있어요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>아미노산</strong> — 단백질은 낱개 아미노산뿐 아니라 두세 개가 붙은 짧은 조각으로도 들어와요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>기름</strong> — 쓸개즙이 만든 작은 배가 장벽에 닿으면, 실려 온 것이 세포 안으로 들어가요. </span></p><h3 class="h3" data-keep>들어온 뒤의 길은 두 갈래예요</h3><p class="para" data-split="soft" data-units><span class="u"><strong>첫째, 핏줄 길.</strong> </span><span class="u">장벽은 흡수된 영양을 간문맥을 거쳐 간으로 보내는 핏줄로 가득해요. </span><span class="u">그래서 포도당·아미노산, 물에 녹는 비타민, 대부분의 미네랄처럼 핏줄로 들어온 것은 간부터 들러요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>둘째, 림프 길.</strong> </span><span class="u">기름에서 온 것은 대부분 다르게 움직여요. </span><span class="u">장벽 세포 안에서 다시 기름으로 묶여 큰 알갱이(카일로미크론)가 되고, 융모 가운데의 림프관으로 들어가요. </span><span class="u">이 림프는 가슴의 굵은 림프관을 지나 왼쪽 빗장뼈 아래 정맥에서 피와 만나요. </span><span class="u">기름에 녹는 비타민과 베타카로틴도 대부분 이 알갱이에 실려 림프로 나가요. </span><span class="u">"지방산은 림프관으로 간다"는 말이 바로 이 길이에요. </span><span class="u">기름에서 온 것은 대부분 림프를 돌아 피로 들어가요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">융모 한 가닥을 세로로 자른 선 그림. </span><span class="u">겉면은 현관문처럼 촘촘한 세포(미세 융모 = 작은 솔)와 그 위 작은 가위(마지막 손질 효소). </span><span class="u">세포 겉에 모양이 다른 문 네 개(포도당+나트륨 짝 문, 과당 문, 아미노산 문, 작은 배가 닿는 자리). </span><span class="u">융모 가운데에 레몬 노랑 관 하나(림프관), 둘레에 진초록 그물(모세혈관). </span><span class="u">낱개 영양(동그라미)은 초록 그물로 → 아래 화살표 "간문맥 → 간". </span><span class="u">기름 알갱이(카일로미크론, 노란 큰 동그라미 안에 당근 색 점)는 노란 관으로 → "림프 → 가슴 → 빗장뼈 아래 정맥". </span><span class="u">2장 끝 관계도와 같은 그림 요소. </span></p></div><h3 class="h3" data-keep>현관에는 문지기가 있어요</h3><p class="para" data-split="soft" data-units><span class="u">흡수는 문만 열려 있으면 다 들어오는 일이 아니에요. </span><span class="u">장벽 세포는 베타카로틴 일부를 비타민A로 바꿔요. </span><span class="u">그런데 몸에 비타민A가 넉넉하면, 이 바꾸는 일을 줄이는 신호가 켜져요. </span><span class="u">그래서 베타카로틴으로 챙기면 몸이 필요한 만큼만 비타민A로 바꿔 써요. </span><span class="u">비타민A는 어두운 곳에서 시각 적응을 위해 필요해요. </span><span class="u">담배를 피우는 분이 고용량 베타카로틴 영양제를 생각한다면 먼저 의사·약사와 상의해 보세요. </span></p><p class="para" data-split="soft" data-units><span class="u">철도 그래요. 몸에 철이 넉넉하면 문을 좁히고, 모자라면 넓혀요. </span><span class="u"><strong>흡수는 '얼마나 먹었나'보다 '문지기가 얼마나 들였나'의 일이에요.</strong> </span></p><h3 class="h3" data-keep>큰창자도 일해요</h3><p class="para" data-split="soft" data-units><span class="u">작은창자를 지난 뒤에도 흡수는 끝나지 않아요. </span><span class="u">큰창자는 남은 물과 소금기를 거둬들여 변의 모양을 잡아 가요. </span><span class="u">우리가 쪼개지 못한 식이섬유는 큰창자에서 균이 발효해 짧은사슬지방산을 만들어요. </span><span class="u">그중 부티르산은 장 세포가 쓰는 중요한 에너지원이에요. </span><span class="u">큰창자의 균은 비타민K 같은 물질도 만들어요. </span><span class="u">'못 들어온 것'이 큰창자 식구들의 밥이 되고, 식구들이 만든 것이 다시 장 세포의 밥이 되는 거예요. </span></p><h3 class="h3" data-keep>흡수 다음은 '쓰기'예요</h3><p class="para" data-split="soft" data-units><span class="u">음식은 몸에서 세 가지 일을 해요. </span><span class="u">힘을 내는 <strong>연료</strong>가 되고, 피와 살을 만드는 <strong>재료</strong>가 되고, 그 일을 거드는 작은 <strong>일꾼</strong>(비타민·미네랄)을 실어 와요. </span></p><p class="para" data-split="soft" data-units><span class="u">간을 거쳐 온몸으로 간 포도당은 세포 속 작은 발전소(미토콘드리아)에서 산소와 만나 몸이 쓰는 에너지로 바뀌어요. </span><span class="u">이때 일꾼이 필요해요. </span><span class="u">비타민B1은 탄수화물과 에너지 대사에 필요하고, 비타민B2와 나이아신은 체내 에너지 생성에 필요해요. </span><span class="u">아미노산은 다시 이어 붙여져 근육과 효소, 호르몬이 돼요. </span><span class="u">단백질은 효소, 호르몬, 항체의 구성에 필요해요. </span><span class="u"><strong>소화가 상자를 뜯고 흡수가 집 안에 들였다면, 쓰기는 그 물건을 제자리에 놓고 실제로 쓰는 일이에요.</strong> </span></p><div class="callout" data-split="hard"><div class="callout-lab">더 깊이</div><div data-units><p class="emph"><strong>"흡수가 잘 될수록 좋다"가 늘 맞을까요?</strong></p><p class="para"><span class="u">몸은 일부러 문을 좁히기도 해요. </span><span class="u">철처럼 몸 밖으로 내보내는 길이 거의 없는 영양소는, 넉넉할 때 덜 들이는 게 몸을 지키는 방법이에요. </span><span class="u">베타카로틴을 바꾸는 양을 줄이는 것도 같은 이치예요. </span><span class="u">흡수는 '많이'가 아니라 '알맞게'를 맞추는 일이에요. </span></p><p class="emph"><strong>물에 녹는 비타민은 왜 매일 챙기라고 할까요?</strong></p><p class="para"><span class="u">핏줄 길로 들어온 물에 녹는 비타민은 몸에 넉넉하면 소변으로 나가는 몫이 많아요. </span><span class="u">그래서 한꺼번에 많이 먹어 쌓아 두기보다, 끼니마다 조금씩 음식으로 들이는 쪽이 몸의 방식에 가까워요. </span></p></div></div><h3 class="h3" data-keep>한눈에 보기: 쪼개지는 곳 · 넘는 모양 · 가는 길</h3><table class="tbl" data-split="hard"><thead><tr><th>영양</th><th>쪼개지는 곳</th><th>장벽을 넘는 모양</th><th>들어간 뒤의 길</th></tr></thead><tbody data-units><tr><td>녹말(밥·빵)</td><td>입 → 작은창자 → 현관 앞 마지막 손질</td><td>포도당 (나트륨과 함께)</td><td>핏줄 → 간</td></tr><tr><td>과당(과일·단 음료)</td><td>대부분 이미 작은 모양</td><td>과당 (따로 쓰는 문, 많이는 못 들임)</td><td>핏줄 → 간 / 남으면 큰창자로</td></tr><tr><td>단백질(고기·두부)</td><td>위 → 작은창자 → 현관 앞</td><td>아미노산, 짧은 조각</td><td>핏줄 → 간</td></tr><tr><td>기름</td><td>쓸개즙 + 췌장 효소</td><td>작은 배에 실려</td><td>큰 알갱이로 묶여 림프 → 피</td></tr><tr><td>기름에 녹는 비타민·베타카로틴</td><td>작은 배에 실림</td><td>작은 배에 실려</td><td>림프 → 피</td></tr><tr><td>식이섬유</td><td>사람은 못 쪼갬</td><td>넘지 않음</td><td>큰창자 균의 밥 → 짧은사슬지방산</td></tr></tbody></table><h3 class="h3" data-keep>자주 헷갈리는 질문</h3><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 속이 편하면 흡수도 잘 된 건가요?</strong> </span><span class="u">속이 편한 것은 소화 쪽 느낌이에요. </span><span class="u">흡수는 따로 일어나고, 느껴지지 않아요. </span><span class="u">철처럼 문지기가 있는 영양소는 속이 편해도 몸 상태에 따라 덜 들어오기도 해요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 우유만 마시면 배가 부글거려요. 우유 영양이 하나도 안 들어오나요?</strong> </span><span class="u">젖당을 자르는 효소가 줄어든 사람은 잘리지 못한 젖당이 큰창자로 내려가 가스가 생길 수 있어요. </span><span class="u">그렇다고 우유 속 다른 영양이 다 막히는 건 아니에요. </span><span class="u">한 번에 조금씩, 밥과 함께 마시거나, 젖당이 줄어든 발효유·치즈로 바꿔 보는 사람이 많아요. </span><span class="u">배 아픔이나 설사가 자꾸 되풀이되면 진료를 받아 보세요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 기름진 음식은 왜 오래 든든할까요?</strong> </span><span class="u">기름이 작은창자에 닿으면 위에 "천천히 보내" 신호가 가고, 쓸개즙과 작은 배를 만드는 일에도 시간이 걸려요. </span><span class="u">들어간 뒤에도 림프라는 먼 길을 돌아요. </span><span class="u">그래서 같은 양이라도 기름진 한 끼는 오래 배 속에 머무는 느낌이 들어요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><p class="emph"><strong>확인된 것</strong></p><ul class="lst" data-split="soft" data-units><li>영양은 대부분 작은창자에서 흡수되고, 핏줄로 들어온 것은 간문맥을 거쳐 간으로 가요.</li><li>기름에서 온 것은 대부분 큰 알갱이로 묶여 림프로 들어가요.</li><li>영양소마다 장벽을 넘는 문이 달라요. 포도당은 나트륨과 함께 들어가요.</li><li>몸에 비타민A가 넉넉하면 베타카로틴을 바꾸는 일이 줄어요.</li></ul><p class="emph"><strong>아직 모르는 것</strong></p><ul class="lst" data-split="soft" data-units><li>큰창자의 균이 만든 비타민K가 내 몸에서 얼마나 쓰이는지는, 이 책이 확인한 자료로는 답을 찾지 못했어요.</li><li>베타카로틴을 바꾸는 양이 나이·몸 상태에 따라 사람마다 얼마나 다른지.</li><li>내 장의 흡수가 잘 되고 있는지 집에서 알 방법은 없어요. 걱정되면 검사는 병원에서 받아 보세요.</li></ul><p class="emph"><strong>흔한 오해</strong></p><ul class="lst" data-split="soft" data-units><li>"속이 편하면 흡수도 잘 된 것" → 속이 편한 것은 소화 쪽 느낌이에요.</li><li>"장에서 들어온 것은 전부 간부터 들른다" → 기름 길은 림프를 돌아 정맥으로 들어가요.</li><li>"흡수는 작은창자에서 끝난다" → 큰창자는 물을 거두고, 균이 만든 짧은사슬지방산을 장 세포가 써요.</li><li>"흡수가 잘 될수록 무조건 좋다" → 몸은 넉넉할 때 일부러 문을 좁혀요.</li></ul><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>비타민A는 당근·단호박·시금치 같은 베타카로틴 채소로 먼저 챙겨 보세요. 기름을 조금 둘러 무치면 림프 길로 실려 가기 쉬워요.</li><li>한 끼에 나물·콩·잡곡 같은 식이섬유 반찬 하나는 '큰창자 몫'으로 남겨 두세요.</li><li>단맛은 마시는 것보다 씹는 과일로 드셔 보세요. 과당이 한꺼번에 몰리지 않아요.</li></ol><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">소화는 상자를 뜯는 일, 흡수는 집 안에 들이는 일이에요.</mark></p></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-1, 2-2, 2-3, 2-6, 2-9, 2-10, 4-1, 5-1, 11-2, 11-3</p></article>
<article data-id="2-5" data-short="2-5 장벽"><header class="art-head" data-keep><div class="art-no">2-5</div><h2 class="art-title"><span class="kw">장벽</span> '장이 샌다'는 말, 어디까지 맞을까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">장 건강 이야기를 하다 보면 꼭 나오는 말이 있어요. </span><span class="u">"장벽이 약해지면 장이 새요." </span><span class="u">듣는 순간, 혹시 내 장도 새고 있나 덜컥 걱정이 되지요. </span><span class="u">뒤이어 "그래서 온몸에 탈이 난다"는 말까지 붙으면 더 그래요. </span></p><p class="para" data-split="soft" data-units><span class="u">여기서는 이 말을 조각내서, 확인된 데까지와 아직 모르는 데를 갈라 봐요. </span><span class="u">걱정을 키우려는 게 아니라, 무엇을 걱정하고 무엇은 내려놓아도 되는지 알기 위해서예요. </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>세포 한 겹이 지키는 경계</h3><p class="para" data-split="soft" data-units><span class="u">장 속은 아직 몸 바깥이에요. </span><span class="u">그 바깥과 몸 안을 가르는 것이 장벽이에요. </span><span class="u">장벽의 몸통은 장 안쪽을 덮은 세포 딱 한 겹이에요. </span><span class="u">피부가 여러 겹으로 두툼한 것과 달리, 장은 영양을 들여야 해서 얇게 만들어져 있어요. </span><span class="u">얇아야 잘 들이고, 얇은 만큼 잘 지켜야 하는 곳이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">벽돌 담으로 그려 보면 쉬워요. </span><span class="u">세포 하나하나가 벽돌이에요. </span><span class="u">세포와 세포 사이를 단단히 붙잡는 단백질 이음매가 모르타르예요. </span><span class="u">이 이음매를 밀착연접(타이트 정션)이라고 불러요. </span></p><h3 class="h3" data-keep>담은 혼자 서 있지 않아요</h3><p class="para" data-split="soft" data-units><span class="u">벽돌 위는 끈끈한 점액이 덮어, 장 속 균이 세포에 바로 닿지 않게 거리를 둬요. </span><span class="u">큰창자에서는 이 점액이 두 겹이라, 세포에 붙은 안쪽 층은 균이 거의 들어오지 못할 만큼 촘촘해요. </span><span class="u">벽돌 사이사이 세포는 균을 막는 물질을 점액 속으로 내보내요. </span><span class="u">벽돌 바로 아래에는 면역세포가 모여, 벽을 넘어온 것을 살펴요. </span><span class="u"><strong>점액 · 세포 벽 · 면역세포, 세 겹이 한 팀이에요.</strong> </span></p><p class="para" data-split="soft" data-units><span class="u">벽돌도 늘 새것으로 바뀌어요. </span><span class="u">장벽 세포는 아래쪽 우묵한 곳에서 새로 만들어져 위로 올라오고, 낡은 세포는 며칠 만에 장 속으로 떨어져 나가요. </span><span class="u">몸에서 가장 빨리 새로 바뀌는 곳 가운데 하나예요. </span><span class="u">매일 조금씩 새로 쌓는 담이라는 뜻이에요. </span></p><h3 class="h3" data-keep>벽을 지나가는 길은 두 가지예요</h3><p class="para" data-split="soft" data-units><span class="u">장벽은 아무것도 못 지나가는 콘크리트가 아니에요. </span><span class="u">지나가는 길이 두 가지 있어요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>세포를 지나는 길.</strong> 영양소는 대부분 세포 겉의 맞는 문으로 들어가 세포를 통과해요. 세포가 골라서 들이는 길이에요. </span><span class="u"><strong>세포 사이 길.</strong> 물과 소금기, 아주 작은 알갱이는 벽돌 사이 이음매로도 늘 오가요. </span></p><p class="para" data-split="soft" data-units><span class="u">이음매는 늘 같은 너비로 닫혀 있는 게 아니라, 몸 상태에 따라 조금 느슨해지기도 조이기도 해요. </span><span class="u">얼마나 잘 지나가는지를 '투과성'이라고 하고, 연구에서는 이것을 재어 봐요. </span><span class="u">그래서 "장이 샌다"는 말은 <strong>"장벽의 투과성이 평소보다 높아진 상태"</strong>로 바꿔 읽어야 정확해요. </span></p><h3 class="h3" data-keep>투과성은 어떻게 잴까요</h3><p class="para" data-split="soft" data-units><span class="u">흔히 쓰는 방법은 이래요. </span><span class="u">몸이 거의 쓰지 않는 크기가 다른 당 두 가지를 물에 타 마신 뒤, 몇 시간 동안 소변에 얼마나 나오는지를 봐요. </span><span class="u">큰 알갱이 당은 원래 벽을 거의 못 넘기 때문에, 이것이 소변에 많이 나오면 이음매가 느슨해졌다고 읽어 왔어요. 다만 기준값이 정해지지 않아 주로 연구에서 써요. </span><span class="u">장 조직을 조금 떼어 직접 재는 방법도 있어요. </span></p><p class="para" data-split="soft" data-units><span class="u">여기서 알 수 있는 게 있어요. </span><span class="u">투과성은 연구실에서 정해진 방법으로 재는 숫자이고, 집에서 느낌으로 알 수 있는 게 아니에요. </span><span class="u">"배가 더부룩하니 장이 새는 것 같다"는 말은 이 숫자와 같은 말이 아니에요. </span></p><h3 class="h3" data-keep>무엇이 이음매를 흔들까요</h3><p class="para" data-split="soft" data-units><span class="u">투과성은 생활 속에서도 잠깐씩 오르내려요. </span><span class="u">아주 힘든 운동을 오래 하거나, 일부 진통소염제를 먹었을 때 잠깐 높아졌다는 연구가 있어요. </span><span class="u">술을 오래 많이 마셔 온 사람에게서도 높아진 것이 관찰됐어요. </span><span class="u">대부분은 원인이 사라지면 다시 돌아오는 변화로 봐요. </span><span class="u">그러니 진통소염제처럼 필요한 약을 스스로 끊을 일은 아니에요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">벽돌 담 단면 선 그림. </span><span class="u">맨 위 물결 모양 레몬 노랑 띠 두 겹 = "점액"(바깥 층은 느슨, 안쪽 층은 촘촘), 그 위 장 속 쪽에 작은 균 동그라미 몇 개(띠에 막혀 벽에 닿지 않음). </span><span class="u">가운데 진초록 벽돌 한 줄 = "세포 한 겹", 벽돌 사이 가는 노란 줄 = "모르타르(밀착연접)". </span><span class="u">화살표 두 개: 벽돌을 뚫고 지나는 굵은 화살표 "세포를 지나는 길(골라서)", 벽돌 사이로 지나는 작은 물방울 "세포 사이 길(물·작은 알갱이)". </span><span class="u">벽돌 아래 작은 방패 모양 몇 개 = "면역세포". </span><span class="u">맨 아래 작은 칸: 벽돌 밑바닥에서 새 벽돌이 올라오고 맨 위 낡은 벽돌이 떨어지는 모습 "며칠마다 새로". </span><span class="u">2장 끝 관계도와 같은 선·색. </span></p></div><h3 class="h3" data-keep>확인된 데까지, 아직 모르는 데</h3><p class="para" data-split="soft" data-units><span class="u"><strong>확인된 데까지.</strong> 일부 장 질환에서는 투과성이 높아진 것이 실제로 관찰돼요. </span><span class="u"><strong>아직 모르는 데.</strong> 투과성만 되돌린다고 병이 해결된 예는 없고, 장벽을 되돌리면 증상이 좋아진다는 것도 아직 증명되지 않았어요. </span><span class="u">투과성이 높아진 것이 병을 부른 원인인지, 병 때문에 생긴 결과인지도 아직 갈라지지 않았어요. </span></p><p class="para" data-split="soft" data-units><span class="u">연구 하나를 같이 볼게요. </span><span class="u">쥐에게 과당 물을 8주 먹였더니 이음매 단백질이 상하고 투과성이 높아졌어요. </span><span class="u">그런데 사람 10명이 2주 동안 과당을 많이 먹은 작은 연구에서는 투과성이 거의 달라지지 않았어요. </span><span class="u"><strong>동물에서 본 일이 사람에게 그대로 일어난다고는 아직 말할 수 없어요.</strong> </span></p><p class="para" data-split="soft" data-units><span class="u">"장이 새면 온몸에 탈이 난다"는 말이 바로 이 틈에서 생겨요. </span><span class="u">동물 실험과 일부 환자에게서 본 것을, 모든 사람의 일상으로 넓혀 말하는 거예요. </span><span class="u">'장누수'를 한 가지 병으로 진단하는 정해진 기준은 이 책이 확인한 자료에서 찾지 못했어요. </span></p><h3 class="h3" data-keep>벽을 새로 쌓는 재료는 밥상에서 와요</h3><p class="para" data-split="soft" data-units><span class="u">며칠마다 새로 쌓는 담이니, 재료는 매일 필요해요. </span><span class="u">단백질은 근육, 결합조직 등 신체조직의 구성성분이에요. </span><span class="u">비타민A는 피부와 점막을 형성하고 기능을 유지하는 데 필요해요. </span><span class="u">비타민A는 베타카로틴으로 챙기면, 몸이 필요한 만큼만 바꿔 써요. </span><span class="u">담배를 피우는 분이 고용량 베타카로틴 영양제를 생각한다면 먼저 의사·약사와 상의해 보세요. </span><span class="u">아연은 정상적인 세포분열에 필요해요. </span><span class="u">장 속 균이 식이섬유로 만든 부티르산은 장 세포가 쓰는 에너지원이에요. </span><span class="u">특별한 효과를 내는 재료라는 뜻은 아니에요. 매일 새로 쌓는 벽에 늘 쓰이는 재료라는 뜻이에요. </span></p><div class="callout" data-split="hard"><div class="callout-lab">더 깊이</div><div data-units><p class="emph"><strong>장벽은 '막는 벽'이 아니라 '고르는 문'이에요</strong></p><p class="para"><span class="u">장벽이 완전히 막혀 있다면 우리는 물도 소금기도 들일 수 없어요. </span><span class="u">장벽의 일은 막기가 아니라 고르기예요. </span><span class="u">영양은 맞는 문으로 들이고, 물은 사이 길로 오가게 하고, 균은 점액으로 떨어뜨려 놓고, 넘어온 것은 아래의 면역세포가 살펴요. </span></p><p class="emph"><strong>같은 말, 다른 뜻</strong></p><p class="para"><span class="u">연구자가 말하는 '투과성 증가'는 정해진 방법으로 잰 숫자의 변화예요. </span><span class="u">흔히 듣는 '장누수'는 그 숫자에 여러 증상과 병을 한꺼번에 묶어 붙인 말이에요. </span><span class="u">앞의 것은 연구로 따져 볼 수 있지만, 뒤의 것은 아직 한 가지로 정리되지 않았어요. </span></p></div></div><h3 class="h3" data-keep>한눈에 보기: 장벽을 지키는 세 겹</h3><table class="tbl" data-split="hard"><thead><tr><th>겹</th><th>무엇이 하나</th><th>하는 일</th><th>매일 쓰이는 재료</th></tr></thead><tbody data-units><tr><td>점액</td><td>끈끈한 막(큰창자는 두 겹)</td><td>균이 세포에 바로 닿지 않게 거리 두기</td><td>장 속 균의 밥(식이섬유)이 넉넉해야 균이 점액을 덜 먹어요</td></tr><tr><td>세포 벽</td><td>세포 한 겹 + 이음매</td><td>맞는 문으로 골라 들이기, 이음매로 물·작은 알갱이 오가기</td><td>단백질, 비타민A(베타카로틴), 아연, 부티르산</td></tr><tr><td>면역세포</td><td>벽 바로 아래</td><td>넘어온 것을 살피기</td><td>단백질, 아연</td></tr></tbody></table><h3 class="h3" data-keep>자주 헷갈리는 질문</h3><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 장이 새는지 검사할 수 있나요?</strong> </span><span class="u">연구에서는 당 두 가지를 마시고 소변을 재는 방법 등을 써요. </span><span class="u">다만 이 숫자 하나로 병을 정하는 기준은 이 책이 확인한 자료에서 찾지 못했어요. </span><span class="u">속이 계속 불편하다면 '장누수' 검사부터가 아니라, 증상을 말하고 진료를 받아 보세요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 장벽을 닫아 준다는 음식이 있다던데요?</strong> </span><span class="u">그렇게 말할 수 있는 근거는 아직 없어요. </span><span class="u">음식이 할 수 있는 일은 매일 새로 쌓는 벽에 재료를 대 주는 거예요. </span><span class="u">단백질 반찬, 색깔 채소, 장 속 균의 밥인 식이섬유를 고르게 올리는 쪽이 근거에 가까워요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 진통제를 먹으면 장벽이 상하나요?</strong> </span><span class="u">일부 진통소염제가 투과성을 잠깐 높였다는 연구가 있어요. </span><span class="u">그렇다고 필요한 약을 스스로 끊거나 줄이지 않아요. </span><span class="u">오래 드셔야 한다면 속 불편이 있을 때 처방한 의사·약사와 상의해 보세요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><p class="emph"><strong>확인된 것</strong></p><ul class="lst" data-split="soft" data-units><li>장벽은 세포 한 겹과 그 사이 이음매, 위의 점액, 아래의 면역세포가 함께 지켜요.</li><li>물과 아주 작은 알갱이는 이음매로 원래 오가고, 영양은 대부분 세포를 지나 들어와요.</li><li>일부 장 질환에서 투과성이 높아진 것이 관찰돼요.</li><li>장벽 세포는 며칠 만에 새로 바뀌어요.</li></ul><p class="emph"><strong>아직 모르는 것</strong></p><ul class="lst" data-split="soft" data-units><li>투과성이 높아진 것이 병의 원인인지 결과인지.</li><li>장벽을 되돌리면 증상이 나아지는지 — 아직 증명되지 않았어요.</li><li>쥐에서 본 과당의 영향이 사람에게도 그런지 — 2주짜리 작은 연구에서는 달라지지 않았어요.</li></ul><p class="emph"><strong>흔한 오해</strong></p><ul class="lst" data-split="soft" data-units><li>"장벽은 아무것도 통과시키지 않아야 한다" → 물과 아주 작은 알갱이는 원래 오가요.</li><li>"'장누수'는 이미 정해진 병 이름이다" → 한 가지 병으로 진단하는 정해진 기준은 이 책이 확인한 자료에서 찾지 못했어요.</li><li>"장벽을 닫아 준다는 음식·제품이 있다" → 그렇게 말할 수 있는 근거는 아직 없어요.</li><li>"더부룩하면 장이 새는 것" → 투과성은 정해진 방법으로 재는 숫자이고, 느낌과는 같은 말이 아니에요.</li></ul><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>끼니마다 달걀·두부·생선·살코기 같은 단백질 반찬 하나, 그리고 당근·시금치 같은 색깔 채소 하나를 같이 올려 보세요. 벽을 새로 쌓는 재료예요.</li><li>굴·소고기·콩·견과처럼 아연이 든 음식을 일주일에 몇 번 올리고, 나물·잡곡으로 장 속 균의 밥도 챙겨요.</li><li>속이 예민한 날은 발효 음식이나 거친 음식을 억지로 늘리지 말고, 순한 국물과 부드러운 반찬으로 쉬어 가요.</li></ol><p class="para" data-split="soft" data-units><span class="u">배 아픔·설사가 오래가거나 피가 비치면 미루지 말고 진료를 받아 보세요. </span></p><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">장벽은 꽉 막힌 담이 아니라, 들일 것을 고르는 문이에요.</mark></p></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-1, 2-4, 2-6, 2-7, 2-9, 2-10, 2-11, 10-3, 부록 1</p></article>
<article data-id="2-6" data-short="2-6 장 속 균"><header class="art-head" data-keep><div class="art-no">2-6</div><h2 class="art-title"><span class="kw">장 속 균</span> 좋은 균과 나쁜 균, 둘로만 나뉠까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">장 속 균을 줄다리기로 설명하는 말을 자주 들어요. </span><span class="u">유익균과 유해균이 줄을 당기고, 가운데 많은 균은 이기는 편에 붙는다고요. </span><span class="u">쉽고 그럴듯한 그림이에요. </span><span class="u">그럼 장 속 균은 정말 '좋은 편'과 '나쁜 편'으로 딱 갈릴까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>먼저: 큰창자의 작은 식구들은 얼마나 될까요</h3><p class="para" data-split="soft" data-units><span class="u">장 속, 특히 큰창자에는 아주 많은 균이 살아요. </span><span class="u">2016년에 다시 계산한 연구에서는, 몸무게 70kg쯤인 어른 한 사람의 장 속 균 수가 그 사람 몸의 세포 수와 비슷한 정도로 나왔어요. </span><span class="u">예전에 "균이 사람 세포보다 열 배 많다"고 하던 숫자를 바로잡은 계산이에요. </span><span class="u">우리 몸 세포만큼 많은 식구와 함께 산다는 뜻이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">이 식구들이 하는 일은 많이들 알아요. </span><span class="u">우리가 쪼개지 못한 식이섬유를 발효해 짧은사슬지방산을 만들고, 장 세포는 그것을 에너지로 써요. </span><span class="u">여기서는 그다음 세 가지를 봐요. </span><span class="u">'좋다·나쁘다'는 무엇으로 정하는지, 같은 음식이 왜 장마다 다르게 쓰이는지, 그리고 넣는 균은 어디까지 손님인지. </span></p><h3 class="h3" data-keep>하나. '좋다·나쁘다'는 이름표가 아니라 '그때 하는 일'</h3><p class="para" data-split="soft" data-units><span class="u">같은 균도 늘 같은 일을 하지 않아요. </span><span class="u">평소에는 아무 탈 없이 함께 사는 균이, 몸이나 장 환경이 달라지면 말썽을 일으킬 수 있어요. </span><span class="u">그래서 연구자들은 균을 '착한 균·나쁜 균'으로 못 박기보다, 어떤 환경에서 무슨 일을 하는지로 봐요. </span></p><p class="para" data-split="soft" data-units><span class="u">흔히 말하는 '중간균'은 이것을 쉽게 바꿔 말한 그림이에요. </span><span class="u"><strong>가운데 식구들이 어느 쪽으로 기우는지는, 장 속 환경과 매일의 밥상이 정해요.</strong> </span><span class="u">다만 "유익균 20 : 유해균 15 : 중간균 65" 같은 비율은 이 책이 확인한 연구에서 근거를 찾지 못했어요. 숫자 말고 그림으로만 기억해 두세요. </span></p><h3 class="h3" data-keep>누가 사느냐보다, 무슨 일을 하느냐</h3><p class="para" data-split="soft" data-units><span class="u">건강한 사람 수백 명의 장 속 균을 살펴본 큰 연구가 있어요. </span><span class="u">사는 균의 이름은 사람마다 아주 달랐어요. </span><span class="u">그런데 그 균들이 하는 일, 예를 들어 식이섬유를 쪼개거나 어떤 물질을 만드는 일의 목록은 사람끼리 훨씬 비슷했어요. </span><span class="u">같은 일을 여러 균이 나눠 맡을 수 있다는 뜻이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">부엌으로 치면 이래요. </span><span class="u">집마다 일하는 사람은 달라도, 밥 짓고 설거지하는 일은 어느 집에나 있어요. </span><span class="u">누가 하든 그 일이 되고 있으면 부엌은 돌아가요. </span><span class="u">그래서 "이 균이 있어야 건강하다"는 말보다, "필요한 일을 할 식구가 여럿 있는가"가 더 가까운 질문이에요. </span><span class="u">다양성이 자주 이야기되는 것도 이 때문이에요. 한 식구가 빠져도 다른 식구가 그 일을 이어받을 수 있으니까요. </span></p><h3 class="h3" data-keep>둘. 같은 음식도 장마다 다르게 쓰여요</h3><p class="para" data-split="soft" data-units><span class="u">장 속 균 구성은 사람마다 달라요. 쌍둥이도 꼭 같지 않아요. </span><span class="u">그래서 같은 음식을 먹어도 장 속에서 쓰이는 길이 달라져요. </span></p><p class="para" data-split="soft" data-units><span class="u">콩이 좋은 예예요. </span><span class="u">콩에 든 성분(다이드제인)을 장 속 균이 에쿠올이라는 물질로 바꾸는 사람이 있고, 그러지 못하는 사람이 있어요. </span><span class="u">같은 두부를 먹어도 장 속에서 생기는 것이 다른 셈이에요. </span><span class="u">음식의 영양은 접시에서 끝나지 않고, 내 장 속 식구들의 손을 한 번 더 거쳐요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">두 칸 선 그림. </span><span class="u">왼쪽 칸: 줄다리기. </span><span class="u">양 끝에 작은 균 몇 마리(진초록 = 한쪽, 회색 = 다른 쪽), 가운데에 훨씬 많은 균들이 줄 옆에서 고개를 갸웃. </span><span class="u">줄 아래 바닥에 밥상(채소·콩·잡곡 그림)이 깔려 있고 가운데 균들이 밥상 쪽으로 기우는 화살표. </span><span class="u">오른쪽 칸: 같은 콩 한 접시를 먹은 두 사람. </span><span class="u">한 사람 장 속 균이 콩 성분을 다른 모양(별)으로 바꾸고, 다른 사람은 그대로(동그라미) 나감. </span><span class="u">아래 작은 글씨 "같은 콩, 다른 장". </span><span class="u">2장 끝 관계도와 같은 선·색. </span><span class="u">균은 얼굴 없는 단순한 모양. </span></p></div><h3 class="h3" data-keep>장 속 식구는 바뀌어요 — 빨리, 그리고 밥상 따라</h3><p class="para" data-split="soft" data-units><span class="u">장 속 균은 고정된 것도 아니에요. </span><span class="u">먹는 것을 확 바꾸면 며칠 만에 장 속 균 구성이 달라졌다는 사람 연구가 있어요. </span><span class="u">한 주에 식물성 음식을 30가지 넘게 먹은 사람은 10가지 이하인 사람보다 장 속 균이 더 다양했어요(관찰 연구). </span><span class="u">건강한 성인을 두 무리로 나눈 연구에서, 발효 음식을 늘린 18명은 장 속 균의 다양성이 높아졌어요. </span></p><h3 class="h3" data-keep>셋. 넣는 균은 '손님'에 가까워요</h3><p class="para" data-split="soft" data-units><span class="u">프로바이오틱스는 알맞은 양을 먹었을 때 몸에 도움이 되는 살아 있는 미생물을 말해요. </span><span class="u">식약처는 프로바이오틱스를 "유산균 증식과 유해균 억제, 배변활동 원활, 장 건강에 도움을 줄 수 있다"고 인정해요. </span><span class="u">그런데 먹은 균이 장에 얼마나 머무는지는 사람마다 달랐어요. 잘 머무는 사람도, 금방 밀어내는 사람도 있었어요. </span><span class="u">"유산균은 자리 잡는 균이 아니라 나그네"라는 말이 이것과 통해요. </span></p><p class="para" data-split="soft" data-units><span class="u">손님이 머무는 동안 하는 일은 있을 수 있어요. </span><span class="u">다만 오래 사는 식구는 이미 그 집에 살던 균들이고, 그 식구들을 먹여 살리는 건 매일의 밥상이에요. </span><span class="u"><strong>새로 넣는 균보다, 이미 사는 식구들의 밥(식이섬유)이 먼저예요.</strong> </span></p><h3 class="h3" data-keep>항생제를 먹으면 식구들은 어떻게 될까요</h3><p class="para" data-split="soft" data-units><span class="u">항생제는 탈을 일으키는 균을 줄이려고 쓰는 약이라, 장 속 식구들도 함께 줄어들어요. </span><span class="u">건강한 남성 12명이 나흘 동안 항생제 여러 가지를 함께 먹은 연구에서, 장 속 균은 대부분 한 달 반쯤 지나 거의 돌아왔어요. </span><span class="u">다만 몇몇 무리는 반년이 지나도 다시 보이지 않았어요. </span><span class="u">장 속 식구는 회복하는 힘이 크지만, 모든 식구가 똑같이 돌아오지는 않는다는 뜻이에요. </span><span class="u">그렇다고 필요한 항생제를 피할 일은 아니에요. 처방대로 먹고, 그 뒤 밥상으로 식구들의 밥을 챙기는 쪽이 순서예요. </span></p><div class="callout" data-split="hard"><div class="callout-lab">더 깊이</div><div data-units><p class="emph"><strong>같은 장, 다른 동네</strong></p><p class="para"><span class="u">장 속 균은 한곳에 고르게 살지 않아요. </span><span class="u">산이 남아 있고 음식이 빨리 지나가는 작은창자 위쪽에는 적게, 음식이 오래 머무는 큰창자에는 아주 많이 살아요. </span><span class="u">같은 큰창자 안에서도 장 속 한가운데와 점액 가까이에 사는 식구가 달라요. </span><span class="u">그래서 대변으로 본 균 구성은 장 속 전체의 한 장면일 뿐이에요. </span></p><p class="emph"><strong>동물 연구에서 본 것, 사람에게서 본 것</strong></p><p class="para"><span class="u">동물 연구에서는 장 속 균을 다른 쥐에게 옮기자 몸무게 변화가 따라온 결과가 있어요. </span><span class="u">이런 실험은 장 속 균이 몸에 영향을 줄 수 있다는 실마리예요. </span><span class="u">하지만 사람은 먹는 것·사는 곳·약·잠이 모두 달라서, 쥐처럼 균 하나로 설명되지 않아요. </span><span class="u">사람 연구는 대부분 "함께 나타난다"는 관련까지예요. </span></p></div></div><h3 class="h3" data-keep>한눈에 보기: 장 속 식구를 보는 두 가지 눈</h3><table class="tbl" data-split="hard"><thead><tr><th></th><th>줄다리기로 보는 눈</th><th>이 꼭지에서 보는 눈</th></tr></thead><tbody data-units><tr><td>균을 나누는 법</td><td>좋은 균 · 나쁜 균 · 가운데 균</td><td>그때 무슨 일을 하는가</td></tr><tr><td>중요한 것</td><td>좋은 편 균의 숫자</td><td>필요한 일을 할 식구가 여럿 있는가(다양성)</td></tr><tr><td>같은 음식</td><td>누구에게나 같음</td><td>장마다 다르게 쓰임(콩 성분 예)</td></tr><tr><td>바꾸는 방법</td><td>좋은 균을 넣기</td><td>이미 사는 식구의 밥(식이섬유)과 여러 가지 식물성 음식</td></tr><tr><td>넣는 균</td><td>자리 잡는 식구</td><td>머무는 정도가 사람마다 다른 손님</td></tr></tbody></table><h3 class="h3" data-keep>자주 헷갈리는 질문</h3><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 내 장에 좋은 균이 얼마나 있는지 검사로 알 수 있나요?</strong> </span><span class="u">대변 검사로 장 속 균 구성을 볼 수는 있어요. </span><span class="u">다만 대변은 장 속 전체의 한 장면이고, 사람마다 '정상'의 폭이 넓어서, 그 결과로 무엇을 먹어야 하는지까지 정하는 기준은 이 책이 확인한 자료에서 찾지 못했어요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 유산균은 먹을수록 쌓이나요?</strong> </span><span class="u">먹은 균이 머무는 정도는 사람마다 달랐어요. </span><span class="u">잘 머무는 사람도, 금방 밀어내는 사람도 있었어요. </span><span class="u">"쌓인다"보다는 "머무는 동안 지나가는 손님"에 가까워요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 항생제를 먹은 뒤엔 무엇을 챙기면 좋을까요?</strong> </span><span class="u">연구에서는 장 속 식구 대부분이 몇 주에 걸쳐 돌아왔어요. </span><span class="u">식구들의 밥인 채소·콩·잡곡과 발효 음식을 평소처럼 고르게 드셔 보세요. </span><span class="u">항생제는 처방대로 끝까지 먹고, 설사가 심하거나 오래가면 진료를 받아 보세요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><p class="emph"><strong>확인된 것</strong></p><ul class="lst" data-split="soft" data-units><li>장 속 균 구성은 사람마다 다르고, 쌍둥이도 꼭 같지 않아요.</li><li>사는 균의 이름은 달라도, 균들이 하는 일의 목록은 사람끼리 더 비슷해요.</li><li>같은 콩 성분도 장 속 균에 따라 에쿠올로 바뀌기도, 안 바뀌기도 해요.</li><li>먹는 것을 바꾸면 장 속 균 구성이 빨리 달라져요.</li></ul><p class="emph"><strong>아직 모르는 것</strong></p><ul class="lst" data-split="soft" data-units><li>장 속 균이 더 다양해지면 그만큼 더 건강해지는지 — 관련은 보이지만 원인인지는 아직 몰라요.</li><li>동물에서 본 균과 몸무게의 관계가 사람에게서 얼마나 그런지.</li><li>나에게 맞는 균을 집에서 알아보는 믿을 만한 방법.</li></ul><p class="emph"><strong>흔한 오해</strong></p><ul class="lst" data-split="soft" data-units><li>"유익균 20 : 유해균 15 : 중간균 65로 정해져 있다" → 이 비율의 근거는 이 책이 확인한 연구에서 찾지 못했어요.</li><li>"유산균을 먹으면 장에 자리 잡는다" → 머무는 정도는 사람마다 달랐어요.</li><li>"유산균은 균 수가 많을수록 좋다" → 균 수만으로 정해지지 않아요. 연구는 균마다 따로 살펴봐요.</li><li>"균은 사람 세포보다 열 배 많다" → 다시 계산해 보니 비슷한 정도였어요.</li></ul><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>이번 주에 먹은 식물성 음식 가짓수를 세어 보세요. 곡식·콩·채소·과일·버섯·해조류·견과, 참깨·쪽파 같은 양념까지 한 가지씩 셉니다. 지난주보다 두세 가지만 늘려 봐요.</li><li>김치·된장·요구르트 같은 발효 음식을 하루 한 번 작게 곁들여 보세요. 짠 반찬은 양을 줄이고, 속이 예민한 날은 쉬어 가도 돼요.</li><li>같은 채소도 색과 종류를 바꿔 가며 올려 보세요. 일하는 식구가 여럿일수록 부엌이 덜 흔들려요.</li></ol><p class="para" data-split="soft" data-units><span class="u">장 질환으로 치료 중이면 먹는 것을 크게 바꾸기 전에 담당 의사와 먼저 상의해 보세요. </span></p><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">장 속 균은 편이 정해진 군대가 아니라, 밥상 따라 기우는 식구예요.</mark></p></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-4, 2-7, 2-10, 9-2, 11-11, 11-12, 11-13</p></article>
<article data-id="2-7" data-short="2-7 장과 면역"><header class="art-head" data-keep><div class="art-no">2-7</div><h2 class="art-title"><span class="kw">장과 면역</span> 면역세포는 왜 장에서 배울까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">장 건강 이야기를 하다 보면 빠지지 않는 말이 있어요. </span><span class="u">"면역의 70%가 장에 있어요." </span><span class="u">숫자는 귀에 쏙 들어오는데, 정작 궁금한 건 따로 있었어요. </span><span class="u">왜 하필 장일까요? 면역세포는 장에서 무엇을 하고 있을까요? </span><span class="u">그리고 그 일은 '싸우는 일'일까요, 다른 일일까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>하루 세 번, 낯선 것이 들어오는 곳</h3><p class="para" data-split="soft" data-units><span class="u">장 속은 아직 몸 바깥이에요. </span><span class="u">밥 한 끼에도 처음 보는 단백질이 수없이 들어오고, 장 속에는 우리 몸 세포만큼 많은 균 식구들이 살고, 가끔은 탈을 일으키는 균도 섞여 들어와요. </span><span class="u">게다가 그 경계는 세포 한 겹이에요. </span><span class="u">낯선 것이 가장 많이, 가장 가까이 닿는 곳이니, 지키는 사람도 가장 많이 모여 있어야겠지요. </span><span class="u">그래서 장은 몸에서 면역세포가 가장 많이 모인 곳으로 꼽혀요. </span><span class="u">다만 "몇 %"라는 숫자는 자료마다 달라서, 이 책은 숫자 대신 이유를 기억하기로 해요. </span></p><h3 class="h3" data-keep>장 면역의 세 가지 숙제</h3><p class="para" data-split="soft" data-units><span class="u">장에 모인 면역세포에게는 숙제가 세 가지 있어요. </span><span class="u"><strong>하나, 알아보기.</strong> 들어온 것이 밥인지, 함께 사는 식구인지, 침입자인지. </span><span class="u"><strong>둘, 참기.</strong> 밥과 식구에게는 싸움을 걸지 않기. </span><span class="u"><strong>셋, 조용히 막기.</strong> 침입자는 큰 싸움 없이 벽 밖에서 떨어뜨리기. </span><span class="u">이 세 가지를 하루 세 번, 평생 해요. </span></p><h3 class="h3" data-keep>알아보기: 작은 창과 교실</h3><p class="para" data-split="soft" data-units><span class="u">장벽 곳곳에는 장 속 것을 조금씩 떠서 아래로 넘겨 주는 특별한 세포가 있어요. </span><span class="u">이름은 M세포, 장벽에 난 작은 창이라고 생각하면 쉬워요. </span><span class="u">창 바로 아래에는 면역세포가 모여 사는 작은 마을(파이어판)이 있어요. </span><span class="u">면역세포는 이 창으로 들어온 것을 보고 배워요. </span></p><p class="para" data-split="soft" data-units><span class="u">창만 있는 게 아니에요. </span><span class="u">면역세포 가운데 일부는 벽돌 사이로 가는 팔을 뻗어, 장 속을 직접 더듬어 보기도 해요. </span><span class="u">벽을 허물지 않고 이음매 사이로 손만 내미는 식이에요. </span><span class="u">"이건 밥이야." "이건 같이 사는 식구야." "이건 처음 보는 침입자야." </span></p><p class="emph"><strong>면역의 일은 싸우는 것만이 아니라, 싸우지 않을 것을 고르는 일이에요.</strong></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">2-5 벽돌 담 단면을 그대로 쓰고, 벽돌 한 칸만 작은 창문 모양(M세포)으로. </span><span class="u">창 위 장 속 쪽에 밥알·콩·작은 균 동그라미가 줄을 서 있고, 창 아래 작은 지붕 집들이 모인 마을(파이어판) 안에 방패 모양 면역세포들이 칠판 앞에 앉아 있음. </span><span class="u">칠판에 밥알 그림 옆 "괜찮아", 균 동그라미 옆 "식구", 뾰족한 모양 옆 "조심". </span><span class="u">옆 벽돌 사이로 가는 팔을 내민 면역세포 하나. </span><span class="u">점액 띠 속에 Y자 모양 작은 항체들이 균을 둘러싼 모습. </span><span class="u">2장 끝 관계도와 같은 선·색. </span></p></div><h3 class="h3" data-keep>참기: 밥에게는 싸움을 걸지 않아요</h3><p class="para" data-split="soft" data-units><span class="u">먹은 음식 단백질은 몸에게 '남'이에요. </span><span class="u">그런데도 우리 몸이 밥을 먹을 때마다 싸우지 않는 건, 장에서 "이건 반응하지 않아도 돼"를 배우기 때문이에요. </span><span class="u">이것을 '경구 관용'이라고 부르고, 이때 다른 면역세포를 진정시키는 세포(조절 T세포)가 생겨나요. </span><span class="u">입으로 먹은 것에 대해, 몸이 오히려 너그러워지는 셈이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">같은 일은 장 속 식구에게도 일어나요. </span><span class="u">우리 몸 세포만큼 많은 균과 평생 같이 살면서도 날마다 싸우지 않는 건, 면역이 이 식구들을 '함께 사는 사이'로 배워 두었기 때문이에요. </span></p><h3 class="h3" data-keep>조용히 막기: 둘러싸서 밀어내요</h3><p class="para" data-split="soft" data-units><span class="u">장 점막의 면역세포는 분비형 IgA라는 항체를 장 속으로 내보내요. </span><span class="u">몸이 만드는 항체 가운데 가장 많은 양이 이 IgA라고 알려져 있어요. </span><span class="u">이 항체는 균이나 낯선 것을 둘러싸서 장벽에 달라붙지 못하게 하고, 점액과 함께 밀어내요. </span><span class="u">열이 나고 붓는 큰 싸움 없이 조용히 하는 일이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">벽돌도 무기를 들고 있어요. </span><span class="u">작은창자 벽의 우묵한 곳에 있는 세포는 균을 막는 물질을 점액 속으로 내보내요. </span><span class="u">그래서 장벽 바로 위에는 균이 쉽게 다가오지 못하는 좁은 빈터가 생겨요. </span></p><h3 class="h3" data-keep>선생님은 장 속 균</h3><p class="para" data-split="soft" data-units><span class="u">균이 하나도 없게 키운 쥐는 장의 면역 조직이 작고 덜 자라 있었어요. </span><span class="u">장 속 균이 면역이 배우는 데 선생님 노릇을 한다는 뜻이에요. </span><span class="u">쥐 연구에서는 장 속 균이 식이섬유로 만든 짧은사슬지방산이 큰창자의 조절 T세포를 늘렸어요. </span><span class="u">사람에게서도 똑같은지는 아직 정리되지 않았어요. </span></p><p class="para" data-split="soft" data-units><span class="u">여기서 한 가지가 이어져요. </span><span class="u">선생님인 균이 먹고 사는 것은 식이섬유이고, 식이섬유로 만든 물질이 참는 법을 가르치는 세포를 늘렸어요. </span><span class="u">밥상 → 장 속 식구 → 면역의 교실로 이어지는 줄이 쥐에서는 보였어요. </span><span class="u">사람에게서 이 줄이 얼마나 굵은지는 아직 연구 중이에요. </span></p><div class="callout" data-split="hard"><div class="callout-lab">더 깊이</div><div data-units><p class="emph"><strong>'면역의 70%'는 어디서 나왔을까요</strong></p><p class="para"><span class="u">이 숫자는 장 점막에 면역세포가 많다는 여러 연구를 묶어 말할 때 자주 인용돼요. </span><span class="u">그런데 몸 전체의 면역세포를 한꺼번에 세어 나눈 측정 결과는 이 책이 확인한 자료에서 찾지 못했어요. </span><span class="u">면역세포는 피·림프절·지라·골수·피부를 쉬지 않고 오가서, 한곳의 몫을 정확히 나누기 어려워요. </span><span class="u">"장은 면역세포가 가장 많이 모인 곳으로 꼽힌다"까지가 근거에 맞는 말이에요. </span></p><p class="emph"><strong>장에서 배운 것은 장에만 머물까요</strong></p><p class="para"><span class="u">장에서 훈련받은 면역세포 일부는 피를 타고 다른 점막으로도 가요. </span><span class="u">그래서 장을 '온몸 점막 면역의 학교'로 보는 연구자도 있어요. </span><span class="u">다만 장에서 배운 것이 감기·코·피부 같은 곳에서 사람에게 얼마나 그대로 쓰이는지는 아직 정리 중이에요. </span></p></div></div><h3 class="h3" data-keep>밥상과 면역, 말할 수 있는 데까지</h3><p class="para" data-split="soft" data-units><span class="u">아연은 정상적인 면역기능에 필요해요. </span><span class="u">단백질은 효소, 호르몬, 항체의 구성에 필요해요. 장 속으로 내보내는 IgA도 항체예요. </span><span class="u">비타민A는 피부와 점막을 형성하고 기능을 유지하는 데 필요해요. </span><span class="u">비타민A는 베타카로틴으로 챙기면, 몸이 필요한 만큼만 바꿔 써요. </span><span class="u">담배를 피우는 분이 고용량 베타카로틴 영양제를 생각한다면 먼저 의사·약사와 상의해 보세요. </span><span class="u">면역을 세게 올린다는 뜻이 아니에요. 면역이 제 일을 하는 데 늘 쓰이는 재료라는 뜻이에요. </span></p><h3 class="h3" data-keep>한눈에 보기: 장 면역의 세 가지 숙제</h3><table class="tbl" data-split="hard"><thead><tr><th>숙제</th><th>누가</th><th>어떻게</th><th>늘 쓰이는 재료</th></tr></thead><tbody data-units><tr><td>알아보기</td><td>M세포(작은 창), 팔을 뻗는 면역세포, 파이어판</td><td>장 속 것을 조금씩 떠서 보여 주고 배우기</td><td>단백질</td></tr><tr><td>참기</td><td>조절 T세포</td><td>밥·식구에게 반응하지 않기(경구 관용)</td><td>장 속 균의 밥(식이섬유) — 쥐 연구</td
