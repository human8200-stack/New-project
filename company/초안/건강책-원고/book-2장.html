<article data-id="2-1" data-short="2-1 장"><header class="art-head" data-keep><div class="art-no">2-1</div><h2 class="art-title"><span class="kw">장</span> 먹었다고 다 내 것이 될까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">반찬 포장 뒷면에 '철 3mg'이라고 적혀 있어요. </span><span class="u">이 반찬을 다 먹으면, 내 몸에는 철 3mg이 들어왔을까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>입에서 항문까지는 아직 '바깥'이에요</h3><p class="para" data-split="soft" data-units><span class="u">입에서 항문까지는 한 줄로 이어진 긴 관이에요. </span><span class="u">도넛을 떠올려 보세요. </span><span class="u">가운데 구멍에 손가락을 넣어도, 손가락이 도넛 '속'에 들어간 건 아니에요. </span><span class="u">구멍은 도넛을 꿰뚫고 지나가는 바깥이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">소화관도 그래요. </span><span class="u">위와 장 안에 있는 밥은 아직 몸 바깥에 있어요. </span><span class="u">장의 벽을 넘어 피와 림프로 들어간 것만 비로소 몸 '안'이 돼요. </span></p><p class="para" data-split="soft" data-units><span class="u">그래서 "무엇을 먹었나"와 "무엇이 들어왔나"는 서로 다른 질문이에요. </span><span class="u">포장 뒷면의 숫자는 접시 위의 숫자예요. </span></p><h3 class="h3" data-keep>내 것이 되려면 문 세 개를 지나요</h3><p class="para" data-split="soft" data-units><span class="u"><strong>첫째, 쪼개는 문.</strong> </span><span class="u">밥은 포도당으로, 고기는 아미노산으로, 기름은 지방산으로 아주 작아져야 해요. </span><span class="u">입과 위가 먼저 부수고 녹이면, 작은창자 첫머리(샘창자)에서 췌장 소화액과 쓸개즙이 더해져요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>둘째, 넘는 문.</strong> </span><span class="u">잘게 쪼개진 영양은 대부분 작은창자에서 흡수돼요. </span><span class="u">안쪽 벽의 주름과 융모, 미세 융모가 흡수하는 면을 넓혀 줘요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>셋째, 쓰는 문.</strong> </span><span class="u">핏줄로 흡수된 영양은 간문맥을 지나 간으로 먼저 가요. </span><span class="u">기름에서 온 것은 대부분 림프를 돌아 피로 들어가요. </span><span class="u">그렇게 온몸의 세포에 닿아야 비로소 쓰여요. </span></p><p class="para" data-split="soft" data-units><span class="u">앞의 두 문에서 막히면, 접시 위의 영양은 몸 바깥에 머물다 그대로 나가요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">반으로 자른 도넛 단면 위에 소화관을 겹쳐 그린 선 그림. </span><span class="u">도넛 구멍(관 안) = "아직 바깥", 도넛 살(몸) = "안". </span><span class="u">구멍 벽에 문 세 개를 차례로: ① 가위(쪼개기 · 입·위·샘창자) ② 작은 계단(넘기 · 작은창자 벽) ③ 집 모양(쓰기 · 간 → 세포). </span><span class="u">문 밖으로 흘러 나가는 화살표에 "쪼개지지 못한 식이섬유 → 큰창자 균의 밥". </span><span class="u">2장 끝 관계도(49쪽)와 같은 선·색. </span></p></div><div class="brk" data-side="오른쪽 쪽"></div><h3 class="h3" data-keep>같은 영양소도 '모양'과 '짝'에 따라 달라요</h3><p class="para" data-split="soft" data-units><span class="u">철이 좋은 예예요. </span><span class="u">고기·생선에 든 철(헴철)은 채소·콩에 든 철(비헴철)보다 훨씬 잘 흡수돼요. </span><span class="u">비헴철은 먹은 양의 20%도 채 흡수되지 않아요. </span></p><p class="para" data-split="soft" data-units><span class="u">같은 비헴철도 동물 단백질이나 비타민C와 함께 먹으면 더 잘 들어와요. </span><span class="u">반대로 커피·차, 칼슘 보충제는 철 흡수를 줄일 수 있어요. </span><span class="u">식약처도 비타민C를 "철의 흡수에 필요"한 영양소로 인정해요. </span></p><p class="para" data-split="soft" data-units><span class="u">짝은 철에만 있지 않아요. </span><span class="u">비타민D는 칼슘과 인이 흡수되고 이용되는 데 필요해요. </span><span class="u">비타민B12는 위에서 만드는 단백질(내인 인자)과 결합해야 작은창자 끝부분에서 흡수돼요. </span><span class="u">기름에 녹는 비타민은 쓸개즙이 있어야 장에서 쉽게 흡수돼요. </span></p><p class="para" data-split="soft" data-units><span class="u">"먹은 것이 그대로 내 몸이 된다"는 말을 자주 들어요. </span><span class="u">한 단계 더 들어가면 이렇게 고쳐 쓸 수 있어요. </span><span class="u"><strong>먹은 것 가운데, 쪼개지고 넘어가고 쓰인 것만 내 몸이 돼요.</strong> </span></p><p class="para" data-split="soft" data-units><span class="u">그럼 들어오지 못한 것은 다 버려질까요? </span><span class="u">우리가 쪼개지 못하는 식이섬유는 큰창자로 내려가 장 속 균의 밥이 돼요. </span><span class="u">'못 들어온 것'에도 맡은 일이 있는 셈이에요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><div class="kv kv1" data-split="soft"><div class="kv-lab">확인된 것</div><ul data-units><li>영양은 대부분 작은창자에서 흡수되고, 핏줄로 들어온 것은 간을 먼저 거쳐요</li><li>같은 철도 모양(헴철·비헴철)과 함께 먹는 것에 따라 흡수가 달라요</li></ul></div><div class="kv kv2" data-split="soft"><div class="kv-lab">아직 모르는 것</div><ul data-units><li>장 속 균의 상태가 사람마다 영양 흡수를 얼마나 바꾸는지. "영양소보다 장 환경이 먼저일 수 있다"는 말도 있지만, 사람에게서 얼마나 그런지는 아직 정리되지 않았어요</li><li>내 몸의 흡수율을 집에서 잴 방법은 없어요. 걱정되면 검사는 병원에서</li></ul></div><div class="kv kv3" data-split="soft"><div class="kv-lab">흔한 오해</div><ul data-units><li>"장 안쪽을 펴면 테니스장만 하다" → 2014년 측정 연구에서는 소화관 안쪽 전체가 약 30~40㎡, 원룸 하나 크기였어요. 그 대부분이 작은창자예요</li><li>"많이 먹을수록 많이 들어온다" → 먹은 양과 들어온 양은 달라요</li></ul></div><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">먹은 것이 내 것이 되려면, 쪼개지고 · 넘어가고 · 쓰여야 해요.</mark></p></div><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>시금치나물·콩자반처럼 채소·콩 반찬을 올리는 날엔, 파프리카·귤 같은 비타민C가 많은 채소·과일을 한 접시에 같이 놓아 보세요.</li><li>식후 커피·차는 바로 말고, 한 박자 쉬었다가 마셔 보세요. 철이 많은 반찬을 먹은 날이라면 더요.</li></ol><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-5, 2-2, 2-3, 2-4, 4-1, 5-1, 2-6, 2-10</p></article>
<article data-id="2-2" data-short="2-2 위"><header class="art-head" data-keep><div class="art-no">2-2</div><h2 class="art-title"><span class="kw">위</span> 위산은 왜 그렇게 셀까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">우리 위는 염산이라는 아주 센 산을 매일 스스로 만들어요. </span><span class="u">그런데 왜 그렇게까지 세야 할까요? </span><span class="u">그리고 그 산을 담은 위는 왜 녹지 않을까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>위는 부엌의 '밑손질 자리'예요</h3><p class="para" data-split="soft" data-units><span class="u">요리를 할 때 재료를 바로 냄비에 넣지 않아요. </span><span class="u">씻고, 데치고, 자르고, 양념에 재워 두었다가 조금씩 불 위로 옮기지요. </span><span class="u">위가 하는 일이 꼭 이 밑손질이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">위 윗부분은 들어온 음식을 잠시 담아 두는 그릇이 되고, 아랫부분의 근육은 음식을 위액과 섞으며 잘게 부숴요. </span><span class="u">위는 흡수를 거의 하지 않아요. </span><span class="u">알코올이나 아스피린처럼 몇 안 되는 물질만 조금 흡수될 뿐이에요. </span><span class="u">위의 일은 '들이는 것'이 아니라, 작은창자가 들일 수 있게 '준비하는 것'이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">위가 만든 죽은 그냥 으깬 것이 아니라 소화액이 다 섞인 상태예요. </span><span class="u">밑손질이 끝난 재료라는 뜻이에요. </span></p><h3 class="h3" data-keep>산이 센 데는 이유가 네 가지 있어요</h3><p class="para" data-split="soft" data-units><span class="u"><strong>① 함께 들어온 균을 줄여요.</strong> </span><span class="u">위의 높은 산성은 대부분의 세균을 죽여 감염을 막는 역할을 해요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>② 단백질을 자를 준비를 해요.</strong> </span><span class="u">위 안쪽 세포는 염산과 함께 '펩신이 되기 전 단계의 물질'을 내보내요. </span><span class="u">펩신은 고기 같은 단백질을 자르는 소화 효소예요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>③ 비타민B12를 단백질에서 떼어 내요.</strong> </span><span class="u">음식 속 B12는 단백질에 붙어 있어요. </span><span class="u">위산이 줄면 이 B12를 떼어 내는 힘이 약해져요. </span><span class="u">떨어져 나온 B12는 위가 만든 단백질(내인 인자)과 결합해야 작은창자 끝에서 흡수돼요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>④ 미네랄이 들어올 길을 거들어요.</strong> </span><span class="u">위산을 중화하는 약(제산제)은 철 흡수를 줄일 수 있어요. </span><span class="u">위산의 일을 한 줄로 줄이면 '살균·단백질 분해 준비·비타민B12 떼어 내기·미네랄 흡수 돕기'예요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">위를 부엌 밑손질대로 그린 선 그림. </span><span class="u">위 안쪽 벽을 따라 레몬 노랑 띠(점액 막). </span><span class="u">가운데에 ① 균 그림에 작은 X ② 실타래처럼 엉킨 단백질이 풀리는 모습 ③ B12 알갱이가 단백질에서 떨어져 '내인 인자'와 손잡는 모습 ④ 철 알갱이. </span><span class="u">아래 출구에서 숟가락 하나씩 작은창자로 내려보내는 화살표. </span><span class="u">위 입구(식도 쪽)에는 '닫힌 문' 표시(오른쪽 쪽 오해 칸과 이어짐). </span></p></div><div class="brk" data-side="오른쪽 쪽"></div><h3 class="h3" data-keep>그 산 속에서 위는 왜 녹지 않을까요</h3><p class="para" data-split="soft" data-units><span class="u">위 안쪽 벽은 끈끈한 점액이 덮고 있어요. </span><span class="u">이 점액 막이 산과 효소로부터 위벽 세포를 지켜요. </span><span class="u">어떤 약이나 균 때문에 이 막이 약해지면 위벽에 상처가 날 수 있어요. </span></p><p class="para" data-split="soft" data-units><span class="u">식도에는 위 같은 보호막이 없어요. </span><span class="u">그래서 위에서는 아무렇지 않은 산이, 식도로 올라오면 쓰리게 느껴져요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><div class="kv kv1" data-split="soft"><div class="kv-lab">확인된 것</div><ul data-units><li>위는 흡수를 거의 하지 않고, 산과 효소로 음식을 준비해 작은창자로 보내요</li><li>나이가 들면 위산이 줄어 음식 속 B12를 떼어 내는 힘이 약해질 수 있어요</li></ul></div><div class="kv kv2" data-split="soft"><div class="kv-lab">아직 모르는 것</div><ul data-units><li>식사 뒤 신 음료·식초가 위산을 '보충'해 소화를 돕는다는 말도 있지만, 사람에게서 확인한 근거는 찾지 못했어요</li><li>반대로 "속쓰림은 위산이 모자라서"라고 단정하는 말도 있어요. 이것 역시 확인된 근거를 찾지 못했어요</li></ul></div><div class="kv kv3" data-split="soft"><div class="kv-lab">흔한 오해</div><ul data-units><li>"속이 쓰린 건 위산이 너무 많아서" → 위 내용물이 식도로 올라오는 병은 대개 산이 많아서가 아니라, 식도 끝을 닫아 두는 근육 고리가 제대로 일하지 않아서 생겨요. 그 문이 저절로 잠깐씩 풀리는 것이 흔한 길로 꼽혀요</li><li>"밥 먹을 때 물을 마시면 위산이 묽어져 소화가 안 된다" → 물은 소화를 방해하거나 소화액을 묽게 하지 않는다는 전문가 답변이 있어요. 심장·콩팥·간 질환으로 물을 줄이라는 말을 들었다면 그 말이 먼저예요</li></ul></div><p class="para" data-split="soft" data-units><span class="u">속쓰림이 잦거나, 삼키기 힘들거나, 체중이 이유 없이 줄면 혼자 판단하지 말고 진료를 받아 보세요. </span></p><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">위산은 줄여야 할 적이 아니라, 음식을 밑손질하는 부엌의 일꾼이에요.</mark></p></div><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>국이나 물은 목이 마른 만큼 편하게 드세요. 억지로 참기보다, 단 음료 대신 물을 곁에 두는 쪽이 더 쉬워요.</li><li>위산을 줄이는 약이나 당뇨약(메트포르민)을 오래 드시는 중이라면, 다음 진료 때 "비타민B12도 한번 봐야 할까요?" 하고 물어보세요. 약은 스스로 끊거나 줄이지 않아요.</li></ol><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-1, 2-4, 16-1, 2-9, 16-2</p></article>
<article data-id="2-3" data-short="2-3 쓸개즙"><header class="art-head" data-keep><div class="art-no">2-3</div><h2 class="art-title"><span class="kw">쓸개즙</span> 기름에 녹는 비타민은 왜 기름과 함께 먹으라고 할까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">"당근은 기름에 볶아 먹어야 좋다"는 말, 많이 들어 보셨지요. </span><span class="u">그래서 비타민A·D·E·K는 기름과 함께 먹으라고들 해요. </span><span class="u">그런데 기름은 비타민을 녹여 주기만 하는 걸까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>쓸개즙은 몸속 주방 세제예요</h3><p class="para" data-split="soft" data-units><span class="u">기름 묻은 프라이팬을 물로만 헹궈 보세요. </span><span class="u">기름은 동그랗게 떠서 그대로 남아요. </span><span class="u">세제를 한 방울 묻히면 기름이 작은 방울로 풀려 물에 섞여 나가지요. </span></p><p class="para" data-split="soft" data-units><span class="u">장 속도 물이 대부분이에요. </span><span class="u">기름과 기름에 녹는 비타민은 그 물에 섞이지 않아요. </span><span class="u">이때 세제 노릇을 하는 것이 쓸개즙 속 담즙염이에요. </span><span class="u">담즙염은 콜레스테롤, 지방, 기름에 녹는 비타민이 장에서 더 쉽게 흡수되게 도와요. </span></p><p class="para" data-split="soft" data-units><span class="u">풀린 기름은 췌장 소화액이 더 잘 쪼개요. </span><span class="u">쪼개진 기름과 담즙염은 기름에 녹는 비타민을 품고 아주 작은 알갱이(혼합 미셀)로 묶여요. </span><span class="u">기름과 쓸개즙이 함께 비타민을 싣는 작은 배를 만드는 거예요. </span><span class="u">이 배가 비타민을 장벽까지 실어 날라요. </span></p><h3 class="h3" data-keep>쓸개즙은 간이 만들고, 쓸개가 모아 둬요</h3><p class="para" data-split="soft" data-units><span class="u">쓸개즙은 쓸개가 아니라 간이 만들어요. </span><span class="u">간에서 나온 쓸개즙의 절반쯤은 쓸개(담낭)로 가서 모여요. </span><span class="u">쓸개 안에서 물이 최대 90%까지 빠져 더 진해져요. </span><span class="u">음식이 작은창자로 들어오면 신호가 가고, 쓸개가 수축해 쓸개즙을 내보내요. </span></p><p class="para" data-split="soft" data-units><span class="u">여기서 한 단계 더 들어가 볼게요. </span><span class="u">기름이 든 음식은 쓸개즙과 췌장 소화액이 나오게 하는 신호이기도 해요. </span><span class="u"><strong>기름은 작은 배의 재료이면서, 쓸개즙을 부르는 초인종이에요.</strong> </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">부엌 개수대 선 그림. </span><span class="u">왼쪽 프라이팬: 물만 부은 팬 위에 큰 기름 방울(레몬 노랑) 하나 + 당근·시금치 그림의 비타민 알갱이가 갇혀 있음. </span><span class="u">오른쪽 프라이팬: 세제 병(= 쓸개, 라벨 "간이 만든 쓸개즙")에서 한 방울 → 기름이 작은 방울들로 풀리고, 비타민 알갱이가 작은 동그라미(혼합 미셀)에 실려 화살표로 '장벽' 쪽 배수구가 아니라 '집 안'으로 향함. </span><span class="u">세제 병 위에 작은 초인종 그림 "기름이 오면 딩동". </span><span class="u">2-1 도넛, 2-2 밑손질대와 같은 선·색. </span></p></div><div class="brk" data-side="오른쪽 쪽"></div><h3 class="h3" data-keep>기름이 있고 없고, 실제로 얼마나 다를까요</h3><p class="para" data-split="soft" data-units><span class="u">한 연구에서 7명이 같은 채소 샐러드를 세 번 먹었어요. </span><span class="u">드레싱 속 기름만 0g·6g·28g으로 바꿨어요. </span><span class="u">기름 없는 드레싱을 먹은 날엔 채소 속 카로티노이드(베타카로틴 같은 색소)가 피에서 거의 나타나지 않았어요. </span><span class="u">기름이 많은 드레싱을 먹은 날 가장 많이 나타났어요. </span></p><p class="para" data-split="soft" data-units><span class="u">50세 이상 50명이 비타민D를 먹은 연구도 있어요. </span><span class="u">지방이 든 아침과 함께 먹은 사람은, 지방이 없는 아침과 먹은 사람보다 피 속 최고치가 평균 32% 높았어요. </span><span class="u">기름의 종류를 바꿔도 차이는 없었어요. </span></p><p class="para" data-split="soft" data-units><span class="u">비타민D는 칼슘과 인이 흡수되고 이용되는 데 필요해요. </span><span class="u">그 비타민D도 먼저 작은 배를 타야 들어와요. </span></p><h3 class="h3" data-keep>쓸개즙은 한 번 쓰고 버리지 않아요</h3><p class="para" data-split="soft" data-units><span class="u">작은창자로 나간 담즙염의 90%는 작은창자 아래쪽에서 다시 흡수돼 간으로 돌아가요. </span><span class="u">간은 이것을 다시 쓸개즙으로 내보내요. 하루에 10~12번쯤 돌아요. </span><span class="u">쓸개즙은 몸에 남는 콜레스테롤과 피 색소가 분해된 찌꺼기를 내보내는 길이기도 해요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><div class="kv kv1" data-split="soft"><div class="kv-lab">확인된 것</div><ul data-units><li>담즙염은 지방과 기름에 녹는 비타민이 장에서 더 쉽게 흡수되게 도와요</li><li>기름 없는 샐러드에서는 카로티노이드가 거의 흡수되지 않았어요</li></ul></div><div class="kv kv2" data-split="soft"><div class="kv-lab">아직 모르는 것</div><ul data-units><li>한 끼에 기름이 몇 g이면 충분한지. 연구가 작고(7명, 50명) 음식·사람마다 달라서, 정해진 숫자는 아직 없어요</li><li>쓸개를 뗀 뒤 기름에 녹는 비타민이 얼마나 덜 들어오는지는 사람마다 달라요. 궁금하면 담당 의사와 상의해 보세요</li></ul></div><div class="kv kv3" data-split="soft"><div class="kv-lab">흔한 오해</div><ul data-units><li>"건강하려면 기름은 무조건 빼야 한다" → 기름이 없으면 채소 속 카로티노이드가 거의 들어오지 않았어요. 문제는 기름의 양과 종류예요</li><li>"쓸개를 떼면 쓸개즙이 없다" → 쓸개즙은 간이 만들고, 쓸개가 없어도 간에서 작은창자로 바로 흘러가요</li></ul></div><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">기름과 쓸개즙이 함께 비타민을 싣는 작은 배를 만들어요.</mark></p></div><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>당근·단호박·시금치처럼 색이 진한 채소는 들기름·올리브유를 조금 둘러 무치거나 볶아 보세요. 기름 없는 드레싱보다 조금 있는 쪽이 나아요.</li><li>비타민D 영양제를 이미 드시는 중이라면, 언제 먹을지 약사와 한번 상의해 보세요.</li></ol><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-4, 4-5, 13-2</p></article>
<article data-id="2-4" data-short="2-4 흡수"><header class="art-head" data-keep><div class="art-no">2-4</div><h2 class="art-title"><span class="kw">흡수</span> 소화와 흡수, 무엇이 다를까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">"오늘은 소화가 잘 됐다"는 말은 자주 해요. </span><span class="u">그런데 "오늘은 흡수가 잘 됐다"고 느껴 본 적이 있나요? </span><span class="u">속이 편한 건 느껴져도, 흡수는 느껴지지 않아요. </span><span class="u">둘은 같은 말이 아니에요. </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>상자를 뜯는 일과 집 안에 들이는 일</h3><p class="para" data-split="soft" data-units><span class="u">택배가 오면 먼저 상자를 뜯고 물건을 하나씩 꺼내요. </span><span class="u">이게 <strong>소화</strong>예요. </span><span class="u">입과 위가 부수고, 쓸개즙과 췌장 소화액이 잘게 쪼개요. </span></p><p class="para" data-split="soft" data-units><span class="u">꺼낸 물건을 현관 안으로 들여 제자리에 두는 일은 따로 있어요. </span><span class="u">이게 <strong>흡수</strong>예요. </span><span class="u">쪼개진 영양이 장벽 세포를 넘어 피나 림프로 들어가는 일이지요. </span><span class="u">상자를 다 뜯어도 현관 밖에 쌓아 두기만 하면, 우리 집 살림이 되지 않아요. </span></p><p class="para" data-split="soft" data-units><span class="u">이 현관은 대부분 작은창자에 있어요. </span><span class="u">안쪽 벽의 주름과 융모, 미세 융모가 현관을 아주 넓게 만들어 줘요. </span></p><h3 class="h3" data-keep>들어오는 길은 두 갈래예요</h3><p class="para" data-split="soft" data-units><span class="u"><strong>첫째, 핏줄 길.</strong> </span><span class="u">장벽은 흡수된 영양을 간문맥을 거쳐 간으로 보내는 핏줄로 가득해요. </span><span class="u">그래서 핏줄로 들어온 것은 간부터 들러요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>둘째, 림프 길.</strong> </span><span class="u">기름에서 온 것은 대부분 다르게 움직여요. </span><span class="u">장벽 세포 안에서 다시 기름으로 묶여 큰 알갱이(카일로미크론)가 되고, 융모 가운데의 림프관으로 들어가요. </span><span class="u">이 림프는 가슴의 굵은 림프관을 지나 왼쪽 빗장뼈 아래 정맥에서 피와 만나요. </span><span class="u">기름에 녹는 비타민과 베타카로틴도 대부분 이 알갱이에 실려 림프로 나가요. </span><span class="u">"지방산은 림프관으로 간다"는 말이 바로 이 길이에요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">융모 한 가닥을 세로로 자른 선 그림. </span><span class="u">겉면은 현관문처럼 촘촘한 세포(미세 융모 = 작은 솔). </span><span class="u">융모 가운데에 레몬 노랑 관 하나(림프관), 둘레에 진초록 그물(모세혈관). </span><span class="u">위에서 내려온 낱개 영양(포도당·아미노산 동그라미)은 초록 그물로 → 아래 화살표 "간문맥 → 간". </span><span class="u">기름 알갱이(카일로미크론, 노란 큰 동그라미 안에 당근 색 점)는 노란 관으로 → 화살표 "림프 → 가슴 → 빗장뼈 아래 정맥". </span><span class="u">2장 끝 관계도(49쪽)의 '작은창자 → 피·림프' 칸과 같은 그림. </span></p></div><div class="brk" data-side="오른쪽 쪽"></div><h3 class="h3" data-keep>현관에는 문지기가 있어요</h3><p class="para" data-split="soft" data-units><span class="u">흡수는 문만 열려 있으면 다 들어오는 일이 아니에요. </span><span class="u">장벽 세포는 베타카로틴 일부를 비타민A로 바꿔요. </span><span class="u">그런데 몸에 비타민A가 넉넉하면, 이 바꾸는 일을 줄이는 신호가 켜져요. </span><span class="u">그래서 베타카로틴으로 챙기면 몸이 필요한 만큼만 비타민A로 바꿔 써요. </span><span class="u">비타민A는 어두운 곳에서 시각 적응을 위해 필요해요. </span></p><p class="para" data-split="soft" data-units><span class="u">철도 그래요. 같은 철이라도 모양과 짝에 따라 들어오는 양이 달라져요. </span><span class="u"><strong>흡수는 '얼마나 먹었나'보다 '문지기가 얼마나 들였나'의 일이에요.</strong> </span></p><h3 class="h3" data-keep>큰창자도 일해요</h3><p class="para" data-split="soft" data-units><span class="u">작은창자를 지난 뒤에도 흡수는 끝나지 않아요. </span><span class="u">큰창자는 남은 물을 거둬들여요. </span><span class="u">우리가 쪼개지 못한 식이섬유는 큰창자에서 균이 발효해 짧은사슬지방산을 만들어요. </span><span class="u">그중 부티르산은 장 세포가 쓰는 중요한 에너지원이에요. </span><span class="u">큰창자의 균은 비타민K 같은 물질도 만들어요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><div class="kv kv1" data-split="soft"><div class="kv-lab">확인된 것</div><ul data-units><li>영양은 대부분 작은창자에서 흡수되고, 핏줄로 들어온 것은 간문맥을 거쳐 간으로 가요</li><li>기름에서 온 것은 대부분 큰 알갱이로 묶여 림프로 들어가요</li><li>몸에 비타민A가 넉넉하면 베타카로틴을 바꾸는 일이 줄어요</li></ul></div><div class="kv kv2" data-split="soft"><div class="kv-lab">아직 모르는 것</div><ul data-units><li>큰창자의 균이 만든 비타민K가 내 몸에서 얼마나 쓰이는지는, 이 책이 확인한 자료로는 답을 찾지 못했어요</li><li>베타카로틴을 바꾸는 양이 나이·몸 상태에 따라 사람마다 얼마나 다른지</li></ul></div><div class="kv kv3" data-split="soft"><div class="kv-lab">흔한 오해</div><ul data-units><li>"속이 편하면 흡수도 잘 된 것" → 속이 편한 것은 소화 쪽 느낌이에요. 흡수는 따로 일어나고, 느껴지지 않아요</li><li>"장에서 들어온 것은 전부 간부터 들른다" → 기름 길은 림프를 돌아 정맥으로 들어가요</li><li>"흡수는 작은창자에서 끝난다" → 큰창자는 물을 거두고, 균이 만든 짧은사슬지방산을 장 세포가 써요</li></ul></div><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">소화는 상자를 뜯는 일, 흡수는 집 안에 들이는 일이에요.</mark></p></div><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>비타민A는 영양제보다 당근·단호박·시금치 같은 베타카로틴 채소로 먼저 챙겨 보세요. 기름을 조금 둘러 무치면 림프 길로 실려 가기 쉬워요. 담배를 피우는 분이 고용량 베타카로틴 영양제를 생각한다면 먼저 의사·약사와 상의해 보세요.</li><li>한 끼에 나물·콩·잡곡 같은 식이섬유 반찬 하나는 '큰창자 몫'으로 남겨 두세요.</li></ol><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-2, 2-3, 2-1, 5-1, 4-1, 2-6, 2-10</p></article>
<article data-id="2-5" data-short="2-5 장벽"><header class="art-head" data-keep><div class="art-no">2-5</div><h2 class="art-title"><span class="kw">장벽</span> '장이 샌다'는 말, 어디까지 맞을까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">장 건강 이야기를 하다 보면 꼭 나오는 말이 있어요. </span><span class="u">"장벽이 약해지면 장이 새요." </span><span class="u">듣는 순간, 혹시 내 장도 새고 있나 덜컥 걱정이 되지요. </span><span class="u">여기서는 이 말을 나눠서, 확인된 데까지와 아직 모르는 데를 갈라 봐요. </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>세포 한 겹이 지키는 경계</h3><p class="para" data-split="soft" data-units><span class="u">장 속은 아직 몸 바깥이라고 했어요. </span><span class="u">그 바깥과 몸 안을 가르는 것이 장벽이에요. </span><span class="u">장벽의 몸통은 장 안쪽을 덮은 세포 딱 한 겹이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">벽돌 담으로 그려 보면 쉬워요. </span><span class="u">세포 하나하나가 벽돌이에요. </span><span class="u">세포와 세포 사이를 단단히 붙잡는 단백질 이음매가 모르타르예요. </span><span class="u">이 이음매를 밀착연접(타이트 정션)이라고 불러요. </span></p><p class="para" data-split="soft" data-units><span class="u">담은 혼자 서 있지 않아요. </span><span class="u">벽돌 위는 끈끈한 점액이 덮어, 장 속 균이 세포에 바로 닿지 않게 거리를 둬요. </span><span class="u">벽돌 바로 아래에는 면역세포가 모여, 벽을 넘어온 것을 살펴요. </span><span class="u"><strong>점액 · 세포 벽 · 면역세포, 세 겹이 한 팀이에요.</strong> </span></p><p class="para" data-split="soft" data-units><span class="u">벽돌도 늘 새것으로 바뀌어요. </span><span class="u">장벽 세포는 아래쪽에서 새로 만들어져 올라오고, 낡은 세포는 장 속으로 떨어져 나가요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">벽돌 담 단면 선 그림. </span><span class="u">맨 위 물결 모양 레몬 노랑 띠 = "점액", 그 위 장 속 쪽에 작은 균 동그라미 몇 개(띠에 막혀 벽에 닿지 않음). </span><span class="u">가운데 진초록 벽돌 한 줄 = "세포 한 겹", 벽돌 사이 가는 노란 줄 = "모르타르(밀착연접)". </span><span class="u">벽돌 아래 작은 방패 모양 몇 개 = "면역세포". </span><span class="u">벽돌 사이로 작은 물방울 두세 개가 지나가는 화살표 = "물·아주 작은 알갱이는 원래 오가요". </span><span class="u">왼쪽 위 작은 글씨 "장 속(바깥)", 아래 "몸 안". </span><span class="u">2장 끝 관계도(49쪽)와 같은 선·색. </span></p></div><div class="brk" data-side="오른쪽 쪽"></div><h3 class="h3" data-keep>'새는 것'과 '오가는 것'은 달라요</h3><p class="para" data-split="soft" data-units><span class="u">장벽은 아무것도 못 지나가는 콘크리트가 아니에요. </span><span class="u">물과 아주 작은 알갱이는 세포 사이 이음매로도 늘 오가요. </span><span class="u">얼마나 잘 지나가는지를 '투과성'이라고 하고, 연구에서는 이것을 재어 봐요. </span><span class="u">그래서 "장이 샌다"는 말은 "장벽의 투과성이 평소보다 높아진 상태"로 바꿔 읽어야 정확해요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>확인된 데까지.</strong> 일부 장 질환에서는 투과성이 높아진 것이 실제로 관찰돼요. </span><span class="u"><strong>아직 모르는 데.</strong> 투과성만 되돌린다고 병이 해결된 예는 없고, 장벽을 되돌리면 증상이 좋아진다는 것도 아직 증명되지 않았어요. </span></p><p class="para" data-split="soft" data-units><span class="u">연구 하나를 같이 볼게요. </span><span class="u">쥐에게 과당 물을 8주 먹였더니 이음매 단백질이 상하고 투과성이 높아졌어요. </span><span class="u">그런데 사람 10명이 2주 동안 과당을 많이 먹은 작은 연구에서는 투과성이 거의 달라지지 않았어요. </span><span class="u"><strong>동물에서 본 일이 사람에게 그대로 일어난다고는 아직 말할 수 없어요.</strong> </span></p><p class="para" data-split="soft" data-units><span class="u">벽을 새로 쌓는 재료는 결국 밥상에서 와요. </span><span class="u">단백질은 근육, 결합조직 등 신체조직의 구성성분이에요. </span><span class="u">비타민A는 피부와 점막을 형성하고 기능을 유지하는 데 필요해요. </span><span class="u">비타민A는 베타카로틴으로 챙기면, 몸이 필요한 만큼만 바꿔 써요. </span><span class="u">담배를 피우는 분이 고용량 베타카로틴 영양제를 생각한다면 먼저 의사·약사와 상의해 보세요. </span><span class="u">아연은 정상적인 세포분열에 필요해요. </span><span class="u">장 속 균이 식이섬유로 만든 부티르산은 장 세포가 쓰는 에너지원이에요. </span><span class="u">특별한 효과를 내는 재료라는 뜻은 아니에요. 매일 새로 쌓는 벽에 늘 쓰이는 재료라는 뜻이에요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><div class="kv kv1" data-split="soft"><div class="kv-lab">확인된 것</div><ul data-units><li>장벽은 세포 한 겹과 그 사이 이음매, 위의 점액, 아래의 면역세포가 함께 지켜요</li><li>일부 장 질환에서 투과성이 높아진 것이 관찰돼요</li><li>쥐에게 과당을 많이 먹이면 투과성이 높아졌어요</li></ul></div><div class="kv kv2" data-split="soft"><div class="kv-lab">아직 모르는 것</div><ul data-units><li>투과성이 높아진 것이 병의 원인인지 결과인지</li><li>장벽을 되돌리면 증상이 나아지는지 — 아직 증명되지 않았어요</li><li>사람에게서도 그런지 — 2주짜리 작은 연구에서는 달라지지 않았어요</li></ul></div><div class="kv kv3" data-split="soft"><div class="kv-lab">흔한 오해</div><ul data-units><li>"장벽은 아무것도 통과시키지 않아야 한다" → 물과 아주 작은 알갱이는 원래 오가요</li><li>"'장누수'는 이미 정해진 병 이름이다" → 한 가지 병으로 진단하는 정해진 기준은 이 책이 확인한 자료에서 찾지 못했어요</li><li>"장벽을 닫아 준다는 음식·제품이 있다" → 그렇게 말할 수 있는 근거는 아직 없어요</li></ul></div><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">장벽은 꽉 막힌 담이 아니라, 들일 것을 고르는 문이에요.</mark></p></div><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>끼니마다 달걀·두부·생선·살코기 같은 단백질 반찬 하나, 그리고 당근·시금치 같은 색깔 채소 하나를 같이 올려 보세요. 벽을 새로 쌓는 재료예요.</li><li>속이 예민한 날은 발효 음식이나 거친 음식을 억지로 늘리지 말고, 순한 국물과 부드러운 반찬으로 쉬어 가요. 배 아픔·설사가 오래가거나 피가 비치면 미루지 말고 진료를 받아 보세요.</li></ol><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-1, 2-7, 2-11, 2-4, 2-6, 2-9, 부록 1</p></article>
<article data-id="2-6" data-short="2-6 장 속 균"><header class="art-head" data-keep><div class="art-no">2-6</div><h2 class="art-title"><span class="kw">장 속 균</span> 좋은 균과 나쁜 균, 둘로만 나뉠까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">장 속 균을 줄다리기로 설명하는 말을 자주 들어요. </span><span class="u">유익균과 유해균이 줄을 당기고, 가운데 많은 균은 이기는 편에 붙는다고요. </span><span class="u">그럼 장 속 균은 정말 '좋은 편'과 '나쁜 편'으로 딱 갈릴까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>먼저 한 문단: 큰창자의 작은 식구들</h3><p class="para" data-split="soft" data-units><span class="u">장 속, 특히 큰창자에는 아주 많은 균이 살아요. </span><span class="u">우리가 쪼개지 못한 식이섬유를 이 균들이 발효해 짧은사슬지방산을 만들고, 장 세포는 그것을 에너지로 써요. </span><span class="u">여기까지는 많이들 아는 이야기예요. 여기서는 그다음 두 가지를 봐요. </span></p><h3 class="h3" data-keep>하나. '좋다·나쁘다'는 이름표가 아니라 '그때 하는 일'</h3><p class="para" data-split="soft" data-units><span class="u">같은 균도 늘 같은 일을 하지 않아요. </span><span class="u">평소에는 아무 탈 없이 함께 사는 균이, 몸이나 장 환경이 달라지면 말썽을 일으킬 수 있어요. </span><span class="u">그래서 연구자들은 균을 '착한 균·나쁜 균'으로 못 박기보다, 어떤 환경에서 무슨 일을 하는지로 봐요. </span></p><p class="para" data-split="soft" data-units><span class="u">흔히 말하는 '중간균'은 이것을 쉽게 바꿔 말한 그림이에요. </span><span class="u"><strong>가운데 식구들이 어느 쪽으로 기우는지는, 장 속 환경과 매일의 밥상이 정해요.</strong> </span><span class="u">다만 "유익균 20 : 유해균 15 : 중간균 65" 같은 비율은 이 책이 확인한 연구에서 근거를 찾지 못했어요. 숫자 말고 그림으로만 기억해 두세요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">두 칸 선 그림. </span><span class="u">왼쪽 칸: 줄다리기. </span><span class="u">양 끝에 작은 균 몇 마리(진초록 = 한쪽, 회색 = 다른 쪽), 가운데에 훨씬 많은 균들이 줄 옆에서 고개를 갸웃. </span><span class="u">줄 아래 바닥에 밥상(채소·콩·잡곡 그림)이 깔려 있고 가운데 균들이 밥상 쪽으로 기우는 화살표. </span><span class="u">오른쪽 칸: 같은 콩 한 접시를 먹은 두 사람. </span><span class="u">한 사람 장 속 균이 콩 성분을 다른 모양(별)으로 바꾸고, 다른 사람은 그대로(동그라미) 나감. </span><span class="u">아래 작은 글씨 "같은 콩, 다른 장". </span><span class="u">2장 끝 관계도(49쪽)와 같은 선·색. </span></p></div><div class="brk" data-side="오른쪽 쪽"></div><h3 class="h3" data-keep>둘. 같은 음식도 장마다 다르게 쓰여요</h3><p class="para" data-split="soft" data-units><span class="u">장 속 균 구성은 사람마다 달라요. 쌍둥이도 꼭 같지 않아요. </span><span class="u">그래서 같은 음식을 먹어도 장 속에서 쓰이는 길이 달라져요. </span></p><p class="para" data-split="soft" data-units><span class="u">콩이 좋은 예예요. </span><span class="u">콩에 든 성분(다이드제인)을 장 속 균이 에쿠올이라는 물질로 바꾸는 사람이 있고, 그러지 못하는 사람이 있어요. </span><span class="u">같은 두부를 먹어도 장 속에서 생기는 것이 다른 셈이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">장 속 균은 고정된 것도 아니에요. </span><span class="u">먹는 것을 확 바꾸면 며칠 만에 장 속 균 구성이 달라졌다는 사람 연구가 있어요. </span><span class="u">한 주에 식물성 음식을 30가지 넘게 먹은 사람은 10가지 이하인 사람보다 장 속 균이 더 다양했어요(관찰 연구). </span><span class="u">건강한 성인을 두 무리로 나눈 연구에서, 발효 음식을 늘린 18명은 장 속 균의 다양성이 높아졌어요. </span></p><h3 class="h3" data-keep>넣는 균은 '손님'에 가까워요</h3><p class="para" data-split="soft" data-units><span class="u">프로바이오틱스는 알맞은 양을 먹었을 때 몸에 도움이 되는 살아 있는 미생물을 말해요. </span><span class="u">식약처는 프로바이오틱스를 "유산균 증식과 유해균 억제, 배변활동 원활, 장 건강에 도움을 줄 수 있다"고 인정해요. </span><span class="u">그런데 먹은 균이 장에 얼마나 머무는지는 사람마다 달랐어요. 잘 머무는 사람도, 금방 밀어내는 사람도 있었어요. </span><span class="u">"유산균은 자리 잡는 균이 아니라 나그네"라는 말이 이것과 통해요. </span><span class="u"><strong>새로 넣는 균보다, 이미 사는 식구들의 밥(식이섬유)이 먼저예요.</strong> </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><div class="kv kv1" data-split="soft"><div class="kv-lab">확인된 것</div><ul data-units><li>장 속 균 구성은 사람마다 다르고, 쌍둥이도 꼭 같지 않아요</li><li>같은 콩 성분도 장 속 균에 따라 에쿠올로 바뀌기도, 안 바뀌기도 해요</li><li>먹는 것을 바꾸면 장 속 균 구성이 빨리 달라져요</li></ul></div><div class="kv kv2" data-split="soft"><div class="kv-lab">아직 모르는 것</div><ul data-units><li>동물 연구에서는 장 속 균을 옮기면 몸무게 변화가 따라온 결과가 있어요. 사람에게서 얼마나 그런지는 아직 정리되지 않았어요</li><li>장 속 균이 더 다양해지면 그만큼 더 건강해지는지 — 관련은 보이지만 원인인지는 아직 몰라요</li><li>나에게 맞는 균을 집에서 알아보는 믿을 만한 방법</li></ul></div><div class="kv kv3" data-split="soft"><div class="kv-lab">흔한 오해</div><ul data-units><li>"유익균 20 : 유해균 15 : 중간균 65로 정해져 있다" → 이 비율의 근거는 이 책이 확인한 연구에서 찾지 못했어요</li><li>"유산균을 먹으면 장에 자리 잡는다" → 머무는 정도는 사람마다 달랐어요</li><li>"유산균은 균 수가 많을수록 좋다" → 균 수만으로 정해지지 않아요. 연구는 균마다 따로 살펴봐요</li></ul></div><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">장 속 균은 편이 정해진 군대가 아니라, 밥상 따라 기우는 식구예요.</mark></p></div><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>이번 주에 먹은 식물성 음식 가짓수를 세어 보세요. 곡식·콩·채소·과일·버섯·해조류·견과, 참깨·쪽파 같은 양념까지 한 가지씩 셉니다. 지난주보다 두세 가지만 늘려 봐요.</li><li>김치·된장·요구르트 같은 발효 음식을 하루 한 번 작게 곁들여 보세요. 짠 반찬은 양을 줄이고, 속이 예민한 날은 쉬어 가도 돼요. 장 질환으로 치료 중이면 먼저 담당 의사와 상의해 보세요.</li></ol><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-4, 11-13, 2-10, 11-12, 11-11</p></article>
<article data-id="2-7" data-short="2-7 장과 면역"><header class="art-head" data-keep><div class="art-no">2-7</div><h2 class="art-title"><span class="kw">장과 면역</span> 면역세포는 왜 장에서 배울까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">장 건강 이야기를 하다 보면 빠지지 않는 말이 있어요. </span><span class="u">"면역의 70%가 장에 있어요." </span><span class="u">숫자는 귀에 쏙 들어오는데, 정작 궁금한 건 따로 있었어요. </span><span class="u">왜 하필 장일까요? 면역세포는 장에서 무엇을 하고 있을까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>하루 세 번, 낯선 것이 들어오는 곳</h3><p class="para" data-split="soft" data-units><span class="u">장 속은 아직 몸 바깥이라고 했어요. </span><span class="u">밥 한 끼에도 처음 보는 단백질이 수없이 들어오고, 장 속에는 균 식구들이 살고, 가끔은 탈을 일으키는 균도 섞여 들어와요. </span><span class="u">그래서 장은 몸에서 면역세포가 가장 많이 모인 곳으로 꼽혀요. </span><span class="u">다만 "몇 %"라는 숫자는 자료마다 달라서, 이 책은 숫자 대신 이유를 기억하기로 해요. </span></p><h3 class="h3" data-keep>작은 창과 교실</h3><p class="para" data-split="soft" data-units><span class="u">장벽 곳곳에는 장 속 것을 조금씩 떠서 아래로 넘겨 주는 특별한 세포가 있어요. </span><span class="u">이름은 M세포, 장벽에 난 작은 창이라고 생각하면 쉬워요. </span><span class="u">창 바로 아래에는 면역세포가 모여 사는 작은 마을(파이어판)이 있어요. </span><span class="u">면역세포는 이 창으로 들어온 것을 보고 배워요. </span><span class="u">"이건 밥이야." "이건 같이 사는 식구야." "이건 처음 보는 침입자야." </span></p><p class="emph"><strong>면역의 일은 싸우는 것만이 아니라, 싸우지 않을 것을 고르는 일이에요.</strong></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">2-5 벽돌 담 단면을 그대로 쓰고, 벽돌 한 칸만 작은 창문 모양(M세포)으로. </span><span class="u">창 위 장 속 쪽에 밥알·콩·작은 균 동그라미가 줄을 서 있고, 창 아래 작은 지붕 집들이 모인 마을(파이어판) 안에 방패 모양 면역세포들이 칠판 앞에 앉아 있음. </span><span class="u">칠판에 밥알 그림 옆 "괜찮아", 균 동그라미 옆 "식구", 뾰족한 모양 옆 "조심". </span><span class="u">2장 끝 관계도(49쪽)와 같은 선·색. </span></p></div><div class="brk" data-side="오른쪽 쪽"></div><h3 class="h3" data-keep>장에서 배우는 두 가지: 참기와 둘러싸기</h3><p class="para" data-split="soft" data-units><span class="u"><strong>참기.</strong> 먹은 음식 단백질은 몸에게 '남'이에요. </span><span class="u">그런데도 우리 몸이 밥을 먹을 때마다 싸우지 않는 건, 장에서 "이건 반응하지 않아도 돼"를 배우기 때문이에요. </span><span class="u">이것을 '경구 관용'이라고 부르고, 이때 다른 면역세포를 진정시키는 세포(조절 T세포)가 생겨나요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>둘러싸기.</strong> 장 점막의 면역세포는 분비형 IgA라는 항체를 장 속으로 내보내요. </span><span class="u">이 항체는 균이나 낯선 것을 둘러싸서 장벽에 달라붙지 못하게 하고, 점액과 함께 밀어내요. </span><span class="u">열이 나고 붓는 큰 싸움 없이 조용히 하는 일이에요. </span></p><h3 class="h3" data-keep>선생님은 장 속 균</h3><p class="para" data-split="soft" data-units><span class="u">균이 하나도 없게 키운 쥐는 장의 면역 조직이 작고 덜 자라 있었어요. </span><span class="u">장 속 균이 면역이 배우는 데 선생님 노릇을 한다는 뜻이에요. </span><span class="u">쥐 연구에서는 장 속 균이 식이섬유로 만든 짧은사슬지방산이 큰창자의 조절 T세포를 늘렸어요. </span><span class="u">사람에게서도 똑같은지는 아직 정리되지 않았어요. </span></p><h3 class="h3" data-keep>밥상과 면역, 말할 수 있는 데까지</h3><p class="para" data-split="soft" data-units><span class="u">아연은 정상적인 면역기능에 필요해요. </span><span class="u">단백질은 효소, 호르몬, 항체의 구성에 필요해요. </span><span class="u">비타민A는 피부와 점막을 형성하고 기능을 유지하는 데 필요해요. </span><span class="u">비타민A는 베타카로틴으로 챙기면, 몸이 필요한 만큼만 바꿔 써요. </span><span class="u">담배를 피우는 분이 고용량 베타카로틴 영양제를 생각한다면 먼저 의사·약사와 상의해 보세요. </span><span class="u">면역을 세게 올린다는 뜻이 아니에요. 면역이 제 일을 하는 데 늘 쓰이는 재료라는 뜻이에요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><div class="kv kv1" data-split="soft"><div class="kv-lab">확인된 것</div><ul data-units><li>장은 몸에서 면역세포가 가장 많이 모인 곳으로 꼽혀요</li><li>장에서 먹은 음식에 반응하지 않도록 배우는 일(경구 관용)이 일어나요</li><li>균 없이 키운 쥐는 장 면역 조직이 덜 자랐어요</li></ul></div><div class="kv kv2" data-split="soft"><div class="kv-lab">아직 모르는 것</div><ul data-units><li>장 속 균이 면역을 가르치는 일이 사람에게서 쥐와 얼마나 같은지</li><li>어떤 음식을 먹으면 장 면역이 어떻게 달라지는지, 사람마다 얼마나 다른지</li><li>장 속 균 검사로 내 면역 상태를 알 수 있는지</li></ul></div><div class="kv kv3" data-split="soft"><div class="kv-lab">흔한 오해</div><ul data-units><li>"면역의 70%가 장에 있다" → 이 책이 확인한 자료에서 정확히 잰 숫자를 찾지 못했어요. 많이 모인 곳이라는 것까지만</li><li>"면역은 셀수록 좋다" → 장 면역의 큰 일은 오히려 참는 것이에요. 높이기보다 맞추기</li><li>"유산균을 먹으면 면역이 세진다" → 식약처가 공통으로 정해 둔 프로바이오틱스 문장은 장 건강까지예요</li></ul></div><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">장은 면역이 싸우는 전쟁터이기 전에, 싸우지 않을 것을 배우는 교실이에요.</mark></p></div><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>끼니마다 단백질 반찬 하나, 그리고 일주일에 몇 번은 굴·소고기·콩·견과처럼 아연이 든 음식을 올려 보세요. 당근·시금치 같은 색깔 채소도 한 가지 곁들여요.</li><li>장 속 선생님들의 밥인 식이섬유를 챙겨요. 잡곡 한 숟가락, 나물 한 접시, 콩 반찬 하나면 시작이에요. 면역과 관련된 병으로 치료 중이거나 면역을 누르는 약을 드시는 중이면, 먹는 것을 크게 바꾸기 전에 담당 의사와 먼저 상의해 보세요.</li></ol><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-1, 2-5, 2-6, 6-1, 6-2, 11-2, 11-8, 11-10</p></article>
<article data-id="2-8" data-short="2-8 장과 마음"><header class="art-head" data-keep><div class="art-no">2-8</div><h2 class="art-title"><span class="kw">장과 마음</span> 긴장하면 왜 소화가 멈출까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">중요한 자리를 앞두고 밥이 한 숟가락도 안 넘어간 적 있으세요? </span><span class="u">먹은 게 얹힌 것처럼 내려가지 않거나, 반대로 자꾸 화장실이 급해지기도 하지요. </span><span class="u">"편안해야 소화가 된다"는 말을 처음 들었을 때, 그날들이 떠올랐어요. </span><span class="u">마음이 긴장하면 장은 정말 일을 멈출까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>먼저 한 문단: 배 속의 신경, 뇌와 잇는 길</h3><p class="para" data-split="soft" data-units><span class="u">장 벽에는 그물처럼 퍼진 신경이 있어서, 뇌가 일일이 시키지 않아도 장을 꿈틀거리게 하고 소화액을 내보내요. </span><span class="u">그래서 장을 '제2의 뇌'라고 부르기도 해요. </span><span class="u">그렇다고 혼자 일하는 건 아니에요. </span><span class="u">장과 뇌는 신경(그중 큰 길이 미주신경)과 호르몬, 면역 신호로 양쪽에서 소식을 주고받아요. </span><span class="u">이 이어진 길을 '장뇌축'이라고 불러요. </span><span class="u">미주신경 가닥의 대부분(80~90%)은 장과 몸의 소식을 뇌로 올려 보내는 쪽이에요. </span><span class="u">여기서는 이 길 가운데 한 방향, <strong>마음에서 장으로</strong> 내려가는 쪽만 봐요. </span></p><h3 class="h3" data-keep>몸이 "지금은 밥 먹을 때가 아니야"라고 정할 때</h3><p class="para" data-split="soft" data-units><span class="u">긴장은 몸이 위험에 대비하는 상태예요. </span><span class="u">뇌는 싸우거나 피할 준비를 시키는 신경(교감신경)을 켜고, 스트레스 호르몬이 나오는 길도 함께 움직여요. </span><span class="u">심장은 빨리 뛰고, 피가 팔다리 근육 쪽으로 더 가요. </span><span class="u">이때 당장 급하지 않은 소화는 뒤로 밀려요. </span></p><p class="para" data-split="soft" data-units><span class="u">연구에서 본 모습도 같아요. </span><span class="u">스트레스를 받으면 위가 음식을 아래로 내려보내는 일이 느려지고, 큰창자의 움직임은 오히려 빨라졌어요. </span><span class="u">얹힌 느낌과 화장실이 급한 느낌이 한꺼번에 오는 이유예요. </span></p><p class="emph"><strong>긴장하면 소화가 멈추는 건 고장이 아니라, 몸이 일의 순서를 바꾼 거예요.</strong></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">한 사람 상반신 옆모습 선 그림, 머리와 배 사이를 잇는 굵은 선 하나(장뇌축). </span><span class="u">왼쪽 칸 "긴장": 머리 위 작은 번개, 선을 따라 아래로 내려가는 화살표, 위 그림 안에 멈춤 표시(일시정지 두 줄), 큰창자 쪽은 빨리 도는 작은 화살표. </span><span class="u">오른쪽 칸 "편안": 머리 위 작은 해, 위 그림에서 음식이 천천히 아래로 흘러가는 화살표. </span><span class="u">아래 작은 글씨 "같은 밥, 다른 마음". </span><span class="u">2장 끝 관계도(49쪽)와 같은 선·색. </span></p></div><div class="brk" data-side="오른쪽 쪽"></div><h3 class="h3" data-keep>문제는 '긴장'이 아니라 '안 풀리는 긴장'</h3><p class="para" data-split="soft" data-units><span class="u">잠깐 긴장했다가 풀리면, 소화는 다시 제자리로 돌아와요. </span><span class="u">밥을 먹고 쉬는 동안에는 쉬게 하는 신경(부교감신경)이 앞에 서고, 미주신경이 위와 장에 "이제 일하자"는 신호를 내려보내요. </span></p><p class="para" data-split="soft" data-units><span class="u">어려운 건 긴장이 풀리지 않고 길게 이어질 때예요. </span><span class="u">검사에는 이상이 없는데 속이 자주 불편한 사람들을 살핀 연구에서, 스트레스가 위·장의 움직임과 예민함에 함께 얽혀 있었어요. </span><span class="u">다만 스트레스가 원인인지, 속이 불편해서 마음도 지치는지, 그 순서는 아직 정리되지 않았어요. </span></p><p class="para" data-split="soft" data-units><span class="u">신경이 일하는 데 쓰이는 재료도 밥상에서 와요. </span><span class="u">마그네슘은 신경과 근육 기능 유지에 필요해요. </span><span class="u">칼슘도 신경과 근육 기능 유지에 필요해요. </span><span class="u">긴장을 풀어 준다는 뜻이 아니라, 신경이 매일 쓰는 재료라는 뜻이에요. </span></p><h3 class="h3" data-keep>세로토닌 이야기, 어디까지 맞을까요?</h3><p class="para" data-split="soft" data-units><span class="u">"세로토닌은 장에서 많이 만들어진다"는 말, 자주 듣지요. </span><span class="u">뇌 바깥에 있는 세로토닌은 대부분 장 세포가 만든다고 보고된 것은 맞아요. </span><span class="u">그런데 피 속의 세로토닌은 뇌를 지키는 문(혈액뇌장벽)을 넘어가지 못해요. </span><span class="u">장에서 만든 세로토닌은 주로 장의 움직임처럼 장 가까이에서 일해요. </span><span class="u"><strong>"장이 행복 호르몬을 만들어 기분을 정한다"고까지는 아직 말할 수 없어요.</strong> </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><div class="kv kv1" data-split="soft"><div class="kv-lab">확인된 것</div><ul data-units><li>장과 뇌는 신경·호르몬·면역 신호로 양쪽에서 이어져 있어요</li><li>스트레스를 받으면 위의 움직임은 느려지고 큰창자 움직임은 빨라질 수 있어요</li><li>미주신경 가닥의 대부분은 몸의 소식을 뇌로 올려 보내요</li></ul></div><div class="kv kv2" data-split="soft"><div class="kv-lab">아직 모르는 것</div><ul data-units><li>장 속 균이 사람의 기분을 얼마나 바꾸는지 — 대부분 동물 연구이고 사람 연구는 관련성까지예요</li><li>오래 이어진 스트레스가 속 불편의 원인인지 결과인지</li><li>숨 고르기 같은 생활 습관이 소화에 얼마나 도움이 되는지, 사람마다 얼마나 다른지</li></ul></div><div class="kv kv3" data-split="soft"><div class="kv-lab">흔한 오해</div><ul data-units><li>"장에서 만든 세로토닌이 그대로 기분이 된다" → 피 속 세로토닌은 뇌로 넘어가지 못해요</li><li>"장은 제2의 뇌라서 혼자 다 알아서 한다" → 혼자 움직일 수는 있지만 뇌와 늘 소식을 주고받아요</li><li>"긴장해서 체한 건 마음이 약해서다" → 위험에 대비하는 몸의 정상적인 반응이에요</li></ul></div><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">긴장이 풀리면 소화는 제 순서를 되찾아요.</mark></p></div><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>밥 먹기 전, 휴대폰과 업무 메시지를 잠깐 엎어 두고 숨을 길게 세 번 내쉬어 보세요. 첫 몇 숟가락은 천천히, 꼭꼭 씹어요.</li><li>긴장이 큰 날은 기름진 큰 한 끼 대신 따뜻하고 순한 음식을 조금씩 나눠 드세요. 견과·콩·푸른 잎채소·두부·멸치처럼 마그네슘·칼슘이 든 반찬을 하나 곁들여요. 속 불편이 자꾸 되풀이되거나, 몸무게가 이유 없이 줄거나, 삼키기 어려우면 진료를 받아 보세요. 피를 토하거나 검은 변이 나오면 바로 병원에 가세요.</li></ol><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-2, 2-6, 2-9, 13-3, 14-2, 14-3, 11-7</p></article>
<article data-id="2-9" data-short="2-9 장의 신호"><header class="art-head" data-keep><div class="art-no">2-9</div><h2 class="art-title"><span class="kw">장의 신호</span> 변·가스·더부룩함, 언제 지켜보고 언제 병원에 갈까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">이틀째 화장실에 못 갔다고 하면 꼭 따라오는 말이 있어요. </span><span class="u">"그럼 지금 몸속에 여섯 끼가 쌓여서 썩고 있는 거예요." </span><span class="u">듣고 나면 마음이 급해지지요. </span><span class="u">장이 보내는 신호는 정말 그렇게 무서운 말일까요? 무엇을 보고, 언제 병원에 가야 할까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>매일 안 나와도 괜찮을 수 있어요</h3><p class="para" data-split="soft" data-units><span class="u">화장실 가는 횟수는 사람마다 넓게 달라요. </span><span class="u">하루 1~3번부터 일주일에 2~3번까지를 정상 범위로 봐요. </span><span class="u">그러니 "매일 나와야 정상"은 아니에요. </span></p><p class="para" data-split="soft" data-units><span class="u">더 중요한 건 <strong>나의 평소와 비교해 달라졌는가</strong>예요. </span><span class="u">늘 아침마다 가던 사람이 몇 주째 사흘에 한 번이 됐다면, 횟수보다 그 '바뀜'이 신호예요. </span><span class="u">그래서 신호를 읽으려면 먼저 나의 평소를 알아야 해요. </span></p><h3 class="h3" data-keep>색: 갈색은 쓸개즙의 색이에요</h3><p class="para" data-split="soft" data-units><span class="u">변이 갈색인 건 간이 내보낸 쓸개즙 덕분이에요. </span><span class="u">다만 색은 먹은 것과 먹은 약에 따라 그날그날 달라질 수 있어요. </span><span class="u">철분제나 블루베리를 먹은 뒤엔 검게, 비트나 붉은 색소가 든 음식을 먹은 뒤엔 붉게 보이기도 해요. </span></p><p class="para" data-split="soft" data-units><span class="u">"황금색 변이어야 건강하다"는 말도 자주 들어요. </span><span class="u">그런데 기준이 되는 색은 황금색이 아니라 <strong>보통의 갈색</strong>이에요. </span><span class="u">먹은 것으로 설명되지 않는 색이 며칠 이어질 때, 그때가 살펴볼 때예요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">일주일 달력 두 줄 선 그림. </span><span class="u">윗줄 "지난주의 나": 월·수·토에 작은 동그라미(화장실 간 날), 동그라미 옆 작은 갈색 점. </span><span class="u">아랫줄 "이번 주의 나": 동그라미 자리는 같고, 목요일 칸에만 블루베리 그림 + 검은 점, 옆에 "먹은 것 때문" 작은 글씨. </span><span class="u">맨 아래 레몬 노랑 형광펜 한 줄 "횟수보다 '평소와 달라졌나'". </span><span class="u">2장 끝 관계도(49쪽)와 같은 선·색. </span></p></div><div class="brk" data-side="오른쪽 쪽"></div><h3 class="h3" data-keep>가스와 더부룩함: 양보다 '예민함'</h3><p class="para" data-split="soft" data-units><span class="u">방귀는 하루 10~20번쯤 나오는 게 보통이에요. </span><span class="u">대부분은 우리가 다 소화하지 못한 탄수화물을 큰창자의 균이 발효하며 만든 가스예요. </span><span class="u">콩·잡곡처럼 식이섬유가 많은 음식, 과당이나 소르비톨이 든 음식을 먹은 날 더 많아지는 까닭이에요. </span><span class="u">고약한 냄새는 가스 대부분이 아니라, 아주 적은 양의 황 성분 가스가 주로 만들어요. </span></p><p class="para" data-split="soft" data-units><span class="u">더부룩함은 한 단계 더 들어가 볼 만해요. </span><span class="u">배가 빵빵하게 느껴지는 사람 대부분은 장에 가스가 넘치게 차 있다기보다, 보통 양의 가스에도 장이 예민하게 느끼는 쪽으로 봐요. </span><span class="u">그래서 가스를 없애는 데만 매달리기보다, 언제·무엇을·얼마나 급하게 먹은 날 그런지 적어 보는 편이 실마리가 돼요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><div class="kv kv1" data-split="soft"><div class="kv-lab">확인된 것</div><ul data-units><li>하루 1~3번부터 일주일 2~3번까지가 정상 범위예요</li><li>갈색은 쓸개즙 색이고, 음식·약으로 색이 바뀔 수 있어요</li><li>방귀는 하루 10~20번쯤이 보통이고, 대부분 큰창자 균이 만들어요</li></ul></div><div class="kv kv2" data-split="soft"><div class="kv-lab">아직 모르는 것</div><ul data-units><li>내 장의 '평소'가 나이·생활에 따라 얼마나 바뀌는지</li><li>방귀 냄새로 장 속 균의 상태를 알 수 있는지 — 이 책이 확인한 자료에서 근거를 찾지 못했어요</li><li>더부룩함을 느끼는 정도가 사람마다 왜 다른지</li></ul></div><div class="kv kv3" data-split="soft"><div class="kv-lab">흔한 오해</div><ul data-units><li>"이틀 못 가면 몸속에서 음식이 썩는다" → 일주일 2~3번도 정상 범위예요. 횟수보다 평소와의 차이를 봐요</li><li>"황금색이어야 건강하다" → 기준은 보통의 갈색이에요</li><li>"더부룩하면 가스가 많이 찬 것" → 보통 양에도 예민하게 느끼는 경우가 많아요</li></ul></div><div class="callout" data-split="hard"><div class="callout-lab">이럴 땐 병원으로</div><div data-units><ul class="lst"><li><strong>바로:</strong> 변에 피가 보일 때 · 검고 끈적한 변이 나올 때 · 피를 토하거나 어지러울 때 · 심한 배 아픔이 이어지거나 배가 부풀고 토할 때 · 설사에 열이 나거나 소변이 줄고 입이 바짝 마를 때 · 속이 불편하면서 숨이 차고 식은땀이 나고 가슴이 두근거릴 때 → 오늘 바로 병원(응급실)에 가세요.</li><li><strong>며칠~일주일 안에:</strong> 이유 없이 몸무게가 줄 때 · 자다가 깰 만큼 설사가 날 때, 설사가 오래 이어질 때 · 삼키기 어렵거나 삼킬 때 아플 때 · 입맛이 없고 메스꺼움이 이어질 때 · 나이 들어 화장실 가기가 갑자기 많이 힘들어졌을 때 · 변이 며칠째 회색·흙빛처럼 옅을 때 → 미루지 말고 진료를 받아 보세요.</li><li><strong>위 신호가 없어도:</strong> 설사가 사흘 넘게 이어지거나, 속 불편이 자꾸 되풀이되면 진료를 받아 보세요.</li></ul></div></div><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">장의 신호는 정답표가 아니라, 나의 평소와 견주어 읽는 편지예요.</mark></p></div><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>일주일만 '장 일기'를 한 줄씩 써 보세요. 화장실 간 날, 단단했는지·보통이었는지·묽었는지, 더부룩했던 끼니와 그때 먹은 것. 평소를 알아야 달라진 걸 알아요.</li><li>콩·잡곡·채소를 늘릴 때는 한꺼번에 말고 몇 주에 걸쳐 조금씩 늘려요. 식이섬유는 배변활동 원활에 도움을 줄 수 있어요. 늘린 뒤 방귀가 잦아지는 건 큰창자 식구들이 밥을 먹고 있다는 뜻이기도 해요.</li></ol><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-10, 2-6, 2-8, 2-3, 2-5, 11-12, 16장</p></article>
<article data-id="2-10" data-short="2-10 장을 돕는 밥상"><header class="art-head" data-keep><div class="art-no">2-10</div><h2 class="art-title"><span class="kw">장을 돕는 밥상</span> 유산균과 식이섬유, 무엇부터 챙길까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">"아침에 눈뜨면 물 한 잔, 그리고 빈속에 유산균." </span><span class="u">장 건강 이야기에서 가장 자주 듣는 아침 순서예요. </span><span class="u">그런데 장 속 식구들 입장에서 보면, 정말 그게 첫 번째일까요? </span><span class="u">유산균과 식이섬유, 하나만 먼저 챙긴다면 무엇부터일까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>식구에게 밥을 주지 않으면 생기는 일</h3><p class="para" data-split="soft" data-units><span class="u">사람 장에 사는 균 여러 가지를 골라 심은 쥐에게 식이섬유를 뺀 먹이를 주었더니, 장 속 균들이 다른 밥을 찾기 시작했어요. </span><span class="u">바로 장벽 위를 덮은 점액이었어요. </span><span class="u">점액층은 점점 얇아졌고, 탈을 일으키는 균이 장벽에 더 쉽게 닿았어요. </span><span class="u">점액은 늘 새로 만들어지는데, 균이 먹는 속도가 더 빨라진 거예요. </span></p><p class="para" data-split="soft" data-units><span class="u">쥐 연구라 사람에게 그대로 일어난다고 말할 수는 없어요. </span><span class="u">그래도 순서를 생각하게 해 줘요. </span><span class="u">장 속 식구들은 밥이 없으면 굶는 게 아니라, 가까운 데서 밥을 찾아요. </span></p><p class="emph"><strong>새로 넣는 균보다, 이미 사는 식구들의 밥이 먼저예요.</strong></p><h3 class="h3" data-keep>식구들의 밥은 이런 음식이에요</h3><p class="para" data-split="soft" data-units><span class="u">식이섬유는 배변활동 원활에 도움을 줄 수 있어요. </span><span class="u">나물·잡곡·콩·해조류·버섯, 껍질째 먹는 채소와 과일이 밥이 돼요. </span><span class="u">프락토올리고당은 장내 유익균의 증식과 배변활동 원활에 도움을 줄 수 있어요. 양파·마늘·우엉·바나나에 들어 있어요. </span><span class="u">프로바이오틱스는 유산균 증식과 유해균 억제, 배변활동 원활, 장 건강에 도움을 줄 수 있어요. 김치·요구르트 같은 발효 음식에도 유산균이 들어 있어요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">하루를 가로로 그린 선 그림 한 줄. </span><span class="u">왼쪽 해 뜨는 창가: 물컵 + 밥공기 + 시계(여유) + 화장실 문, 그 위 작은 물결 세 줄(장이 깨어나 움직임). </span><span class="u">가운데 점심 밥상: 잡곡밥·나물·김치 한 접시. </span><span class="u">오른쪽 저녁 밥상: 콩·버섯·양파 반찬. </span><span class="u">밥상 아래 큰창자 단면에서 작은 균 식구들이 숟가락을 들고 있고, 옆 '점액' 띠는 도톰. </span><span class="u">아래 작은 칸: 밥상이 빈 날 → 균들이 점액 띠를 갉아먹어 띠가 얇아진 모습. </span><span class="u">작은 글씨 "밥이 없으면 점액을 먹어요(쥐 연구)". </span><span class="u">2장 끝 관계도(49쪽)와 같은 선·색. </span></p></div><div class="brk" data-side="오른쪽 쪽"></div><h3 class="h3" data-keep>아침 순서, 한 단계 더 들어가 보면</h3><p class="para" data-split="soft" data-units><span class="u">큰창자는 하루 종일 같은 힘으로 움직이지 않아요. </span><span class="u">건강한 사람의 큰창자를 하루 내내 잰 연구에서, 잠에서 깰 때 움직임이 약 세 배, 밥을 먹은 뒤 약 두 배로 커졌어요. </span><span class="u">물 한 잔도 좋은 습관이지만, 연구로 확인된 큰 신호는 <strong>일어나는 것과 아침을 먹는 것</strong>이에요. </span><span class="u">아침을 거르고 서둘러 나가면 이 시간을 그냥 보내게 돼요. </span></p><p class="para" data-split="soft" data-units><span class="u">"유산균은 빈속에 먹어야 위산을 피한다"는 말도 들여다볼게요. </span><span class="u">사람 위와 작은창자를 본뜬 실험 장치에서, 코팅하지 않은 유산균은 밥과 함께 또는 밥 먹기 30분 전에 넣었을 때 가장 많이 살아남았어요. </span><span class="u">밥 먹고 30분 뒤에 넣었을 때가 가장 적었고, 기름이 조금 든 식사가 도왔어요. </span><span class="u">실험 장치 연구라 사람 몸에서 꼭 같다고는 말할 수 없고, 제품마다 만든 방식이 달라요. </span><span class="u">그래서 "빈속이 정답"이라기보다, 포장에 적힌 방법을 먼저 따르는 게 맞아요. </span></p><h3 class="h3" data-keep>식이섬유는 조금씩, 꾸준히</h3><p class="para" data-split="soft" data-units><span class="u">식이섬유를 갑자기 많이 늘리면 가스가 차고 배가 부풀 수 있어요. </span><span class="u">몇 주에 걸쳐 한 가지씩 늘리면, 장도 식구들도 새 밥에 익숙해져요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><div class="kv kv1" data-split="soft"><div class="kv-lab">확인된 것</div><ul data-units><li>큰창자는 깰 때와 밥 먹은 뒤 크게 움직여요</li><li>쥐에서 식이섬유를 빼자 장 속 균이 점액을 먹어 점액층이 얇아졌어요</li><li>식약처는 식이섬유·프락토올리고당·프로바이오틱스를 배변활동 쪽 기능으로 인정해요</li></ul></div><div class="kv kv2" data-split="soft"><div class="kv-lab">아직 모르는 것</div><ul data-units><li>식이섬유가 모자랄 때 사람 장에서도 균이 점액을 먹는지, 얼마나 그런지</li><li>유산균을 먹는 가장 좋은 때가 사람 몸에서 언제인지 — 실험 장치 연구까지예요</li><li>나에게 맞는 식이섬유 양이 얼마인지는 사람마다 달라요</li></ul></div><div class="kv kv3" data-split="soft"><div class="kv-lab">흔한 오해</div><ul data-units><li>"아침 물 한 잔이 장을 깨운다" → 물만의 힘은 이 책이 확인한 자료에서 찾지 못했어요. 확인된 큰 신호는 깨어남과 아침밥이에요</li><li>"유산균은 꼭 빈속에" → 실험 장치에서는 밥과 함께·밥 직전이 더 많이 살아남았어요</li><li>"유산균만 잘 고르면 된다" → 들어온 균도 사는 식구도 밥이 있어야 해요</li></ul></div><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">유산균은 손님, 식이섬유는 식구의 밥 — 밥상부터 차려요.</mark></p></div><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>아침을 먹은 뒤 화장실 갈 여유를 조금 두세요. 깰 때와 밥 먹은 뒤 큰창자가 크게 움직여요.</li><li>이번 주에는 끼니마다 식이섬유 반찬을 '한 가지만' 늘려 보세요. 잡곡 한 숟가락, 나물 한 접시, 양파·버섯 볶음처럼요. 가스가 많이 차면 한 주 쉬었다가 다시 조금씩. 유산균 제품을 이미 드신다면 포장에 적힌 방법을 따르세요. 장 질환으로 치료 중이면 담당 의사와 먼저 상의해 보세요.</li></ol><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-6, 2-9, 2-5, 2-4, 11-11, 11-12, 14-4, 15-3</p></article>
<article data-id="2-11" data-short="2-11 장을 지치게 하는 습관"><header class="art-head" data-keep><div class="art-no">2-11</div><h2 class="art-title"><span class="kw">장을 지치게 하는 습관</span> 잠·단 음료·술은 장벽에 무엇을 할까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">장 건강 이야기 끝에는 늘 긴 목록이 따라와요. </span><span class="u">운동 부족, 잠 부족, 술, 담배, 스트레스, 인스턴트, 설탕, 항생제. </span><span class="u">"여기 하나도 안 걸리는 사람은 없을 거예요"라는 말까지 들으면, 오히려 무엇부터 바꿔야 할지 막막해지지요. </span><span class="u">여기서는 목록 대신 세 가지만 골라, 각각이 장에 <strong>무엇을 하는지</strong> 들여다봐요. </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>잠: 이틀 밤 짧게 잤을 때</h3><p class="para" data-split="soft" data-units><span class="u">건강한 젊은 남성 9명이 이틀 밤을 새벽 3시 가까이 되어서야 잠들고 7시에 일어났어요. 하룻밤 4시간 남짓이에요. </span><span class="u">같은 사람이 푹 잔 이틀과 견주어 보니, 장 속 균 구성 가운데 몇 무리의 비율이 달라졌어요. </span><span class="u">그런데 균 구성 전체의 모양은 크게 달라지지 않았고, 짧은사슬지방산 양도 그대로였어요. </span><span class="u">같은 기간 몸이 인슐린에 반응하는 정도는 떨어졌는데, 이것도 균의 변화와는 관련이 없었어요. </span></p><p class="para" data-split="soft" data-units><span class="u">정리하면 이래요. </span><span class="u"><strong>잠이 짧으면 장 속 식구들도 조금 흔들려요. 다만 "며칠 잠이 짧으면 장이 망가진다"까지는 아니에요.</strong> </span><span class="u">아주 작고 짧은 연구여서, 오래 이어지는 잠 부족이 장에 무엇을 하는지는 아직 더 봐야 해요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">펼친 두 쪽에 걸친 저울 세 개 선 그림. </span><span class="u">왼쪽 저울: 달과 시계(새벽 3시) 한쪽, 작은 균 식구들 한쪽 — 저울이 살짝만 기울어 있음. </span><span class="u">오른쪽 쪽 가운데 저울: 단 음료 컵 한쪽, 잡곡·나물 밥공기 한쪽 — 컵이 밥공기 자리를 밀어냄. </span><span class="u">오른쪽 저울: 술잔 여러 개 한쪽, 2-5의 벽돌 담 한쪽 — 잔이 많을수록 벽돌 사이 모르타르가 가늘어짐(잔 하나일 땐 그대로). </span><span class="u">아래 작은 글씨 "한 번보다, 이어질 때". </span><span class="u">2장 끝 관계도(49쪽)와 같은 선·색. </span></p></div><div class="brk" data-side="오른쪽 쪽"></div><h3 class="h3" data-keep>단 음료: 장벽보다 먼저, 밥상 자리를 차지해요</h3><p class="para" data-split="soft" data-units><span class="u">과당을 많이 먹이면 장벽이 느슨해진다는 이야기는 쥐에서 본 결과였고, 사람의 짧은 연구에서는 달라지지 않았어요. </span><span class="u">그래서 단 음료를 보는 눈을 한 칸 옮겨 볼게요. </span></p><p class="para" data-split="soft" data-units><span class="u">과당·소르비톨이 든 음식은 큰창자에서 가스를 늘릴 수 있어요. </span><span class="u">그리고 단 음료 한 잔에는 장 속 식구들의 밥인 식이섬유가 거의 없어요. </span><span class="u">배는 부른데, 식구들 몫은 비어 있는 한 끼가 되는 거예요. </span></p><p class="para" data-split="soft" data-units><span class="u">2025년 한국인 영양소 섭취기준은 첨가당을 하루 열량의 10% 이내로 두고, '가당 음료 섭취는 가능한 줄인다'는 문구를 더했어요. </span><span class="u">과일을 끊자는 뜻이 아니라, 마시는 단맛부터 줄이자는 뜻이에요. </span></p><h3 class="h3" data-keep>술: 장 위쪽에서 바로 들어와요</h3><p class="para" data-split="soft" data-units><span class="u">술은 주로 장 위쪽에서 그대로 스며들어요. 마신 지 한 시간 안에 장 속 알코올 농도가 높게 올라가요. </span><span class="u">쥐에게 술을 먹이면 2주 만에 장벽 투과성이 높아졌고, 술을 오래 많이 마셔 온 사람에게서도 장벽 투과성이 높아진 것이 관찰됐어요. </span><span class="u">장 속 균의 균형이 흐트러지는 일도 함께 보고돼요. </span><span class="u">보통 수준으로 마시는 건강한 사람의 장벽 자료는, 이 책이 확인한 자료에서 찾지 못했어요. </span></p><p class="para" data-split="soft" data-units><span class="u">셋이 만나는 자리도 있어요. </span><span class="u">하루 리듬이 깨진 데 술이 겹치면 장벽 변화가 더 컸다는 연구가 있어요(사람은 관찰까지). </span><span class="u"><strong>잠·단 음료·술은 하나씩보다, 겹치고 이어질 때 장을 더 지치게 해요.</strong> </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><div class="kv kv1" data-split="soft"><div class="kv-lab">확인된 것</div><ul data-units><li>이틀 밤 짧은 잠에 장 속 균 구성 일부가 달라졌어요(9명)</li><li>술을 오래 많이 마신 사람에게서 장벽 투과성이 높아졌어요</li><li>과당·소르비톨이 든 음식은 큰창자 가스를 늘릴 수 있어요</li></ul></div><div class="kv kv2" data-split="soft"><div class="kv-lab">아직 모르는 것</div><ul data-units><li>오래 이어지는 잠 부족이 사람의 장벽에 무엇을 하는지</li><li>보통 수준의 술이 건강한 사람 장벽에 하는 일</li><li>단 음료가 사람의 장벽을 직접 느슨하게 하는지 — 쥐에서는 그랬고, 사람의 작은 연구에서는 아니었어요</li></ul></div><div class="kv kv3" data-split="soft"><div class="kv-lab">흔한 오해</div><ul data-units><li>'며칠 잠이 짧으면 장이 망가진다' → 짧은 연구에서는 균 구성 전체의 모양이 크게 달라지지 않았어요</li><li>"술은 간만 힘들게 한다" → 장 위쪽에서 먼저 흡수되고, 장벽과 장 속 균에도 닿아요</li><li>"과일도 과당이니 끊어야 한다" → 국가 기준이 줄이자는 건 첨가당과 가당 음료예요</li></ul></div><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">장을 지치게 하는 건 한 번의 실수보다, 날마다 겹치는 습관이에요.</mark></p></div><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>오늘 마실 단 음료 한 잔을 물이나 보리차로 바꿔 보세요. 그 자리에 과일 한 쪽이나 나물 한 젓가락을 더해, 장 속 식구들 몫을 채워요.</li><li>술자리가 있는 날은 빈속에 마시지 말고 먼저 밥을 먹고, 잔 사이사이 물을 마셔요. 다음 날은 술 없이 쉬는 날로 두고, 늦게 잔 날일수록 다음 끼니를 거르지 않아요. 술을 줄이기 어렵거나 간·장 질환으로 치료 중이면 담당 의사와 상의해 보세요.</li></ol><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-5, 2-10, 2-6, 3-2, 5-2, 14-2, 14-1, 11-12</p></article>
<article data-id="fig" data-short="한눈에 보는 그림"><header class="art-head" data-keep><div class="art-no">2장 끝</div><h2 class="art-title"><span class="kw">한눈에 보는 그림</span> 입에서 세포까지, 영양소가 들어오는 길</h2></header><p class="para" data-split="soft" data-units><span class="u">밥 한 숟가락이 내 몸이 되기까지, 2장에서 한 칸씩 따라 내려왔어요. </span><span class="u">이 두 쪽은 그 길을 한 장에 펼친 지도예요. </span></p><p class="para" data-split="soft" data-units><span class="u">영양소마다 들어오는 자리가 달라요. </span><span class="u">철은 작은창자 첫머리에서, 비타민B12는 작은창자 끝에서, 기름에 녹는 비타민은 쓸개즙을 만나야 들어와요. </span><span class="u">그래서 어느 한 자리가 힘들면, 그 자리에서 들어오던 영양소부터 모자라기 쉬워요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>영양소를 공부할 때는 "무엇을 먹을까"와 함께 "어디로 들어올까"를 같이 물어봐요.</strong> </span><span class="u">영양소 이름이 헷갈리면, 이 지도로 돌아와 자리를 짚어 보세요. </span></p><div class="fig figgroup" data-split="soft"><div class="fig-lab">그림 자리 — 그림 설명 (펼친 두 쪽 전체)</div><div data-units><div class="fg-u"><p class="para"><span class="u"><strong>전체 모양</strong> — 왼쪽 쪽 위에서 오른쪽 쪽 아래로 흐르는 굵은 진초록 관 하나(입 → 항문). 관을 따라 정거장 6곳(번호 동그라미). 관 옆으로 두 갈래 길이 갈라져 나감: 진초록 '피 길'과 레몬 노랑 '림프 길'. 두 길은 오른쪽 쪽 위에서 다시 만나 '간'과 '세포' 그림으로 이어짐. 관 바깥 테두리에 작은 글씨 "관 속은 아직 바깥", 관 밖 몸 쪽에 "여기부터 몸 안". 정거장마다 말풍선 하나에 <strong>그 자리에서 일어나는 일 한 줄 + 들어오는 영양소 이름</strong>. 선·색은 2-1~2-11 그림과 같게(세이지 모눈, 진초록 선, 레몬 노랑 강조, 얼굴 없는 선 그림). </span></p></div><div class="fg-u"><p class="emph"><strong>① 입 — 부수기</strong></p><ul class="lst"><li>그림: 이와 숟가락.</li><li>말풍선: "꼭꼭 씹어 잘게 부숴요. 쪼개는 일의 첫 문."</li></ul></div><div class="fg-u"><p class="emph"><strong>② 위 — 녹이고 떼어 내기</strong></p><ul class="lst"><li>그림: 주머니 모양 위, 안에 작은 산 방울.</li><li>말풍선: "센 위산이 음식을 녹이고, 고기 속 비타민B12를 떼어 내요. 비타민B12가 나중에 들어갈 때 필요한 짝 단백질도 여기서 만들어요."</li></ul></div><div class="fg-u"><p class="emph"><strong>③ 작은창자 첫머리(샘창자) — 쓸개즙과 만나는 곳</strong></p><ul class="lst"><li>그림: 쓸개(작은 세제 병, 2-3 그림)와 췌장에서 관이 들어오는 모습.</li><li>말풍선: "쓸개즙이 기름을 잘게 풀어요. 기름과 쓸개즙이 함께 비타민을 싣는 작은 배를 만들어요. 철은 이 근처에서 많이 들어와요."</li><li>영양소 이름표: 철 · (배에 실리는) 비타민A·D·E · 베타카로틴</li></ul></div><div class="fg-u"><p class="emph"><strong>④ 작은창자 가운데 — 대부분이 들어오는 넓은 현관</strong></p><ul class="lst"><li>그림: 융모가 빽빽한 벽(2-4 그림을 작게).</li><li>말풍선: "포도당·아미노산·지방산, 대부분의 영양이 여기서 장벽을 넘어요. 엽산과 마그네슘도 이 길에서 들어와요. 칼슘은 작은창자 전체에서 조금씩 들어와요."</li><li>영양소 이름표: 탄수화물(포도당) · 단백질(아미노산) · 기름(지방산) · 엽산 · 마그네슘 · 칼슘(작은창자 전체)</li></ul></div><div class="fg-u"><p class="emph"><strong>⑤ 작은창자 끝(돌창자) — 마지막 문</strong></p><ul class="lst"><li>그림: 관이 좁아지며 큰창자로 꺾이는 곳.</li><li>말풍선: "위에서 짝을 만난 비타민B12가 여기서 들어와요. 비타민K도 기름 길로 이 끝에서 들어와요."</li><li>영양소 이름표: 비타민B12 · 비타민K · 마그네슘</li></ul></div><div class="fg-u"><p class="emph"><strong>⑥ 큰창자 — 식구들의 부엌</strong></p><ul class="lst"><li>그림: 굵은 관 속 작은 균 식구들(2-6 모양)이 식이섬유 실타래를 먹는 모습, 벽 쪽으로 물방울 화살표.</li><li>말풍선: "남은 물과 소금기를 거둬들여요. 우리가 못 쪼갠 식이섬유를 장 속 식구들이 발효해 짧은사슬지방산을 만들고, 장 세포가 그것을 에너지로 써요. 식구들은 비타민K 같은 물질도 만들어요."</li><li>영양소 이름표: 물 · 식이섬유 → 짧은사슬지방산 · 프로바이오틱스·프락토올리고당은 이곳 식구들과 이어짐</li></ul></div><div class="fg-u"><p class="emph"><strong>두 갈래 길 (관 옆)</strong></p><ul class="lst"><li>진초록 <strong>피 길</strong>: ③~⑤에서 "포도당·아미노산·물에 녹는 비타민·미네랄" 화살표 → 간문맥 → <strong>간</strong>(5장 그림과 같은 간). 작은 글씨 "핏줄로 들어온 것은 간부터 들러요."</li><li>레몬 노랑 <strong>림프 길</strong>: ③~⑤에서 "기름 알갱이 + 비타민A·D·E·K·베타카로틴" 화살표 → 가슴의 굵은 림프관 → 빗장뼈 아래 정맥에서 피와 만남. 작은 글씨 "기름 길은 림프를 돌아 피로 들어가요."</li><li>두 길이 만난 뒤 → <strong>세포</strong>(동그라미 집 모양): "쓰이는 문. 여기까지 와야 내 몸이 돼요."</li></ul></div><div class="fg-u"><p class="emph"><strong>관을 감싸는 띠 네 개 (관 바깥 테두리, 아주 작게)</strong></p><ul class="lst"><li>장벽: "세포 한 겹 + 이음매 + 점액 — 들일 것을 고르는 문"</li><li>면역 교실: "싸우지 않을 것을 배우는 곳"</li><li>장 속 식구: "밥상 따라 기우는 식구"</li><li>마음 길: 머리와 배를 잇는 가는 선 "긴장하면 소화가 뒤로 밀려요"</li></ul></div><div class="fg-u"><p class="emph"><strong>오른쪽 쪽 아래 — 이 지도 읽는 법 (작은 상자 3줄)</strong></p><ol class="lst"><li>정거장 번호는 먹은 것이 지나가는 순서예요.</li><li>이름표의 영양소는 "주로 그 자리에서 들어온다"는 뜻이에요. 다른 자리에서도 조금씩 들어올 수 있어요.</li><li>이 지도는 길을 보여 줄 뿐, 내 몸이 얼마나 흡수하는지 알려 주지는 않아요. 걱정되면 검사는 병원에서.</li></ol></div></div></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-1, 2-2, 2-3, 2-4, 2-5, 2-6, 4-1, 5-1, 11-2(비타민A·베타카로틴), 11-3(비타민B12·엽산), 11-5(비타민D), 11-6(비타민E·K), 11-7(칼슘·마그네슘), 11-8(철), 11-9(오메가3), 11-10(단백질), 11-11(프로바이오틱스), 11-12(식이섬유·프락토올리고당)</p></article>
</template>
<script>
(function(){
  "use strict";
  var KEY = "healthbook-ch2-page";
  var START_FOLIO = 27;
  var PW = 380, PH = 562;
  var src = document.getElementById("src");
  var book = document.getElementById("book");
  var bookbox = document.getElementById("bookbox");
  var stage = document.getElementById("stage");
  var countEl = document.getElementById("count");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var measure = document.getElementById("measure");
  var pages = [];      // {el, kind, folio, art}
  var artStart = {};   // 꼭지 id -> 쪽 순번
  var cur = 0;         // 지금 보이는 첫 쪽 순번
  var anchor = 0;      // 읽던 쪽 (펼친 두 쪽에서 맞춰 당기기 전)
  var spread = false;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function mkPage(kind){
    var p = document.createElement("div");
    p.className = "page " + kind;
    return p;
  }
  function fits(body){ return body.scrollHeight <= body.clientHeight + 0.5; }

  function newBodyPage(art){
    var p = mkPage("text");
    var run = document.createElement("div");
    run.className = "run";
    run.innerHTML = "<span><b>2장</b>" + escapeHtml(" \uc7a5") + "</span><span>" + escapeHtml(art.getAttribute("data-short")) + "</span>";
    var body = document.createElement("div");
    body.className = "pbody";
    var fol = document.createElement("div");
    fol.className = "folio";
    p.appendChild(run); p.appendChild(body); p.appendChild(fol);
    measure.appendChild(p);
    return {el:p, body:body, folioEl:fol};
  }
  function escapeHtml(s){ return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function unitBox(el){ return el.hasAttribute("data-units") ? el : el.querySelector("[data-units]"); }

  // 블록 하나를 page에 흘려 넣는다. 다 못 넣으면 남은 조각(복제본)을 돌려준다.
  function place(block, pg){
    pg.body.appendChild(block);
    if (fits(pg.body)) return null;
    var mode = block.getAttribute("data-split");
    var empty = pg.body.children.length === 1;
    if (!mode || (mode === "hard" && !empty)) {
      pg.body.removeChild(block);
      return empty ? "TOO_BIG" : block;
    }
    var box = unitBox(block);
    if (!box || box.children.length < 2) {
      pg.body.removeChild(block);
      return empty ? "TOO_BIG" : block;
    }
    // 조각 단위로 나누기
    var units = Array.prototype.slice.call(box.children);
    var rest = block.cloneNode(true);
    var restBox = unitBox(rest);
    while (box.firstChild) box.removeChild(box.firstChild);
    var placed = 0;
    for (var i = 0; i < units.length; i++) {
      box.appendChild(units[i]);
      if (!fits(pg.body)) { box.removeChild(units[i]); break; }
      placed++;
    }
    if (placed === 0) {
      pg.body.removeChild(block);
      return empty ? "TOO_BIG" : rest;
    }
    // 남은 조각
    var restUnits = Array.prototype.slice.call(restBox.children);
    for (var j = 0; j < placed; j++) restBox.removeChild(restUnits[j]);
    rest.classList.add("cont");
    if (restBox.tagName === "OL") {
      var st = parseInt(restBox.getAttribute("start") || "1", 10);
      restBox.setAttribute("start", st + placed);
    }
    return rest;
  }

  function paginate(){
    var keepArt = pages[anchor] && pages[anchor].art, keepOff = 0;
    if (keepArt) { keepOff = anchor - artStart[keepArt]; }
    pages = []; artStart = {};
    measure.innerHTML = "";
    // 표지·차례
    var cov = mkPage("kcover"); cov.innerHTML = src.content.querySelector("#cover-src").innerHTML;
    pages.push({el:cov, kind:"cover", folio:null, art:null});
    var toc = mkPage("tocp"); toc.innerHTML = src.content.querySelector("#toc-src").innerHTML;
    pages.push({el:toc, kind:"toc", folio:null, art:null});
    var folio = START_FOLIO;
    var arts = src.content.querySelectorAll("article");
    for (var a = 0; a < arts.length; a++) {
      var art = arts[a], id = art.getAttribute("data-id");
      var blocks = Array.prototype.slice.call(art.children).map(function(b){ return b.cloneNode(true); });
      var pg = newBodyPage(art);
      var artPages = [pg];
      artStart[id] = pages.length;
      var queue = blocks.slice();
      var guard = 0;
      while (queue.length && guard++ < 5000) {
        var b = queue.shift();
        if (b.classList.contains("brk")) {
          if (pg.body.children.length) { pg = newBodyPage(art); artPages.push(pg); }
          var sm = document.createElement("div"); sm.className = "side-mark"; sm.textContent = "· " + b.getAttribute("data-side") + " ·";
          pg.body.appendChild(sm);
          continue;
        }
        var r = place(b, pg);
        if (r === null) continue;
        if (r === "TOO_BIG") { // 빈 쪽에도 안 들어가는 블록: 그대로 두고 넘침 검사에서 드러나게
          pg.body.appendChild(b); pg = newBodyPage(art); artPages.push(pg); continue;
        }
        // 쪽 끝에 제목만 남지 않게 (뒤 글과 함께 다음 쪽으로)
        var carry = [];
        while (pg.body.lastElementChild && (pg.body.lastElementChild.hasAttribute("data-keep") || pg.body.lastElementChild.className === "side-mark") && pg.body.children.length > 1) {
          carry.unshift(pg.body.removeChild(pg.body.lastElementChild));
        }
        pg = newBodyPage(art); artPages.push(pg);
        queue = carry.concat([r], queue);
      }
      artPages.forEach(function(p){
        if (!p.body.children.length) return;
        p.folioEl.textContent = folio;
        pages.push({el:p.el, kind:"text", folio:folio, art:id});
        folio++;
      });
    }
    // 차례에 실제 쪽 번호
    pages.forEach(function(p){
      p.el.querySelectorAll && p.el.querySelectorAll("[data-pg]").forEach(function(s){
        var i = artStart[s.getAttribute("data-pg")];
        if (i != null) s.textContent = pages[i].folio;
      });
    });
    measure.innerHTML = "";
    if (keepArt && artStart[keepArt] != null) anchor = Math.min(artStart[keepArt] + keepOff, pages.length - 1);
    anchor = Math.min(anchor, pages.length - 1); cur = anchor;
  }

  function layout(){
    var w = stage.clientWidth, h = stage.clientHeight;
    var sTwo = Math.min(w / (PW * 2), h / PH);
    spread = sTwo >= 0.9 && w >= 700;
    var vw = spread ? PW * 2 : PW;
    var s = spread ? sTwo : Math.min(w / PW, h / PH);
    s = Math.max(0.3, Math.min(s, 1.8));
    book.style.transform = "scale(" + s + ")";
    book.style.width = vw + "px"; book.style.height = PH + "px";
    bookbox.style.width = Math.floor(vw * s) + "px";
    bookbox.style.height = Math.floor(PH * s) + "px";
    book.classList.toggle("spread", spread);
    cur = spread ? viewStart(anchor) : anchor;
    render();
  }
  // 펼친 두 쪽: [표지] 혼자, 그다음 (1,2) (3,4) ...
  function viewStart(i){ if (!spread || i === 0) return i; return i % 2 === 1 ? i : i - 1; }
  function viewPages(i){
    if (!spread) return [i];
    if (i === 0) return [0];
    return i + 1 < pages.length ? [i, i + 1] : [i];
  }
  function render(){
    book.innerHTML = "";
    var v = viewPages(cur);
    v.forEach(function(i, k){
      var el = pages[i].el;
      el.classList.remove("l", "r");
      if (spread && v.length === 2) el.classList.add(k === 0 ? "l" : "r");
      else if (spread) el.classList.add(i === 0 ? "r" : "l");
      book.appendChild(el);
    });
    if (spread && v.length === 1) { // 혼자 있는 쪽은 가운데
      book.style.justifyContent = "center";
    } else book.style.justifyContent = "flex-start";
    var first = pages[v[0]], last = pages[v[v.length - 1]];
    var label;
    if (first.kind === "cover") label = "표지";
    else if (first.kind === "toc") label = last.folio == null ? "차례" : "차례 · " + last.folio + "쪽";
    else label = (first.folio === last.folio ? first.folio : first.folio + "–" + last.folio) + "쪽";
    var n = v.map(function(i){return i + 1;});
    countEl.innerHTML = "<b>" + label + "</b> · " + (n.length > 1 ? n[0] + "–" + n[1] : n[0]) + " / " + pages.length;
    prevBtn.disabled = cur <= 0;
    nextBtn.disabled = v[v.length - 1] >= pages.length - 1;
    try {
      var pc = pages[anchor];
      localStorage.setItem(KEY, JSON.stringify({i:anchor, a:pc.art, o:pc.art ? anchor - artStart[pc.art] : 0}));
    } catch (e) {}
  }
  function go(target, dir){
    target = Math.max(0, Math.min(pages.length - 1, target));
    var shown = spread ? viewStart(target) : target;
    anchor = target;
    if (shown === cur) { render(); return; }
    if (!reduce) flipOut(dir || (shown > cur ? 1 : -1));
    cur = shown;
    render();
  }
  function step(dir){
    var v = viewPages(cur);
    if (dir > 0) go(v[v.length - 1] + 1, 1);
    else go(spread ? (cur <= 1 ? 0 : cur - 2) : cur - 1, -1);
  }
  function flipOut(dir){
    var kids = Array.prototype.slice.call(book.children);
    if (!kids.length) return;
    var src = dir > 0 ? kids[kids.length - 1] : kids[0];
    var c = src.cloneNode(true);
    c.classList.add("flip", dir > 0 ? "fwd" : "back");
    c.style.left = src.offsetLeft + "px";
    book.__flip && book.__flip.remove();
    book.__flip = c;
    setTimeout(function(){ book.appendChild(c); }, 0);
    var kill = function(){ c.remove(); };
    c.addEventListener("animationend", kill);
    setTimeout(kill, 600);
  }

  // 조작
  prevBtn.addEventListener("click", function(e){ e.stopPropagation(); step(-1); });
  nextBtn.addEventListener("click", function(e){ e.stopPropagation(); step(1); });
  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight" || e.key === "PageDown") { step(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { step(-1); e.preventDefault(); }
  });
  var tx = null, ty = 0, swipedAt = 0;
  stage.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) { tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  stage.addEventListener("touchend", function(e){
    if (tx == null) return;
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    tx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) { swipedAt = Date.now(); step(dx < 0 ? 1 : -1); }
  }, {passive:true});
  stage.addEventListener("click", function(e){
    if (Date.now() - swipedAt < 450) return; // 밀기 뒤 따라오는 눌림은 무시
    var g = e.target.closest && e.target.closest("[data-goto]");
    if (g) { var i = artStart[g.getAttribute("data-goto")]; if (i != null) go(i, 1); return; }
    var r = stage.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
    if (x < 0.4) step(-1); else if (x > 0.6) step(1);
  });
  window.addEventListener("resize", layout);

  // 검사용 (Playwright)
  window.__book = {
    count: function(){ return pages.length; },
    cur: function(){ return cur; },
    spread: function(){ return spread; },
    overflow: function(){ // 쪽마다 넘친 px (0이면 잘린 글 없음)
      var res = [];
      measure.innerHTML = "";
      pages.forEach(function(p, i){
        var el = p.el.cloneNode(true); measure.appendChild(el);
        var worst = 0;
        el.querySelectorAll(".pbody,.cover,.toc").forEach(function(b){
          worst = Math.max(worst, b.scrollHeight - b.clientHeight, b.scrollWidth - b.clientWidth);
        });
        res.push(worst);
        measure.removeChild(el);
      });
      return res;
    },
    folios: function(){ return pages.map(function(p){ return p.folio; }); },
    starts: function(){ return artStart; }
  };

  function start(){
    paginate();
    var saved = 0;
    try {
      var sv = JSON.parse(localStorage.getItem(KEY) || "null");
      if (sv && sv.a && artStart[sv.a] != null) {
        var nxt = null;
        for (var k in artStart) if (artStart[k] > artStart[sv.a] && (nxt == null || artStart[k] < nxt)) nxt = artStart[k];
        saved = Math.min(artStart[sv.a] + (sv.o || 0), (nxt == null ? pages.length : nxt) - 1);
      } else if (sv && typeof sv.i === "number") saved = sv.i;
    } catch (e) {}
    anchor = cur = Math.max(0, Math.min(saved, pages.length - 1));
    layout();
  }
  start();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function(){ paginate(); layout(); });
  }
})();
</script>
