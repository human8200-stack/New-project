></tr><tr><td>조용히 막기</td><td>분비형 IgA, 벽 세포의 균 막는 물질, 점액</td><td>둘러싸서 밀어내기, 빈터 만들기</td><td>단백질("항체의 구성"), 아연("정상적인 면역기능"), 비타민A("피부와 점막")</td></tr></tbody></table><h3 class="h3" data-keep>자주 헷갈리는 질문</h3><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 장이 약하면 감기에 잘 걸리나요?</strong> </span><span class="u">장이 면역세포가 많이 모인 곳인 건 맞아요. </span><span class="u">하지만 "장이 약하다"는 말 자체가 여러 가지를 뜻하고, 그것이 감기 횟수와 얼마나 이어지는지는 사람에게서 아직 정리되지 않았어요. </span><span class="u">감기가 잦다면 잠·손 씻기·영양을 고르게 보는 게 먼저예요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 유산균을 먹으면 면역이 세지나요?</strong> </span><span class="u">식약처가 공통으로 정해 둔 프로바이오틱스 문장은 장 건강까지예요. </span><span class="u">그리고 장 면역의 큰 일은 '세지기'보다 '참기'와 '조용히 막기'예요. </span><span class="u">면역은 높이기보다 알맞게 맞추는 쪽으로 보는 게 근거에 가까워요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 아이가 음식에 예민한 건 장에서 배우지 못해서인가요?</strong> </span><span class="u">음식에 반응하지 않는 법을 배우는 일이 장에서 일어나는 건 맞아요. </span><span class="u">다만 아이의 음식 반응은 이유가 여러 가지이고, 집에서 판단할 일이 아니에요. </span><span class="u">걱정되는 반응이 있으면 소아청소년과 진료를 받아 보세요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><p class="emph"><strong>확인된 것</strong></p><ul class="lst" data-split="soft" data-units><li>장은 몸에서 면역세포가 가장 많이 모인 곳으로 꼽혀요.</li><li>장에서 먹은 음식에 반응하지 않도록 배우는 일(경구 관용)이 일어나요.</li><li>장 점막은 분비형 IgA로 균을 둘러싸 장벽에 붙지 못하게 해요.</li><li>균 없이 키운 쥐는 장 면역 조직이 덜 자랐어요.</li></ul><p class="emph"><strong>아직 모르는 것</strong></p><ul class="lst" data-split="soft" data-units><li>장 속 균이 면역을 가르치는 일이 사람에게서 쥐와 얼마나 같은지.</li><li>어떤 음식을 먹으면 장 면역이 어떻게 달라지는지, 사람마다 얼마나 다른지.</li><li>장 속 균 검사로 내 면역 상태를 알 수 있는지.</li></ul><p class="emph"><strong>흔한 오해</strong></p><ul class="lst" data-split="soft" data-units><li>"면역의 70%가 장에 있다" → 이 책이 확인한 자료에서 정확히 잰 숫자를 찾지 못했어요. 많이 모인 곳이라는 것까지만.</li><li>"면역은 셀수록 좋다" → 장 면역의 큰 일은 오히려 참는 것이에요. 높이기보다 맞추기.</li><li>"유산균을 먹으면 면역이 세진다" → 식약처가 공통으로 정해 둔 프로바이오틱스 문장은 장 건강까지예요.</li><li>"장 면역은 균과 싸우는 일" → 대부분은 싸우지 않고 고르고, 둘러싸 밀어내는 일이에요.</li></ul><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>끼니마다 단백질 반찬 하나를 올려 보세요. 달걀·두부·생선·살코기면 돼요.</li><li>일주일에 몇 번은 굴·소고기·콩·견과처럼 아연이 든 음식을, 당근·시금치 같은 색깔 채소와 함께 올려요.</li><li>장 속 선생님들의 밥인 식이섬유를 챙겨요. 잡곡 한 숟가락, 나물 한 접시, 콩 반찬 하나면 시작이에요.</li></ol><p class="para" data-split="soft" data-units><span class="u">면역과 관련된 병으로 치료 중이거나 면역을 누르는 약을 드시는 중이면, 먹는 것을 크게 바꾸기 전에 담당 의사와 먼저 상의해 보세요. </span></p><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">장은 면역이 싸우는 전쟁터이기 전에, 싸우지 않을 것을 배우는 교실이에요.</mark></p></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-1, 2-5, 2-6, 2-10, 6-1, 6-2, 9-2, 11-2, 11-8, 11-10</p></article>
<article data-id="2-8" data-short="2-8 장과 마음"><header class="art-head" data-keep><div class="art-no">2-8</div><h2 class="art-title"><span class="kw">장과 마음</span> 긴장하면 왜 소화가 멈출까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">중요한 자리를 앞두고 밥이 한 숟가락도 안 넘어간 적 있으세요? </span><span class="u">먹은 게 얹힌 것처럼 내려가지 않거나, 반대로 자꾸 화장실이 급해지기도 하지요. </span><span class="u">"편안해야 소화가 된다"는 말을 처음 들었을 때, 그날들이 떠올랐어요. </span><span class="u">마음이 긴장하면 장은 정말 일을 멈출까요? </span><span class="u">그렇다면 그건 고장일까요, 아니면 몸이 일부러 하는 일일까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>200년 전, 위 속을 들여다본 의사</h3><p class="para" data-split="soft" data-units><span class="u">1820년대 미국에서, 총에 맞은 상처가 위까지 뚫린 채 아문 젊은이가 있었어요. </span><span class="u">그를 돌본 군의관은 그 구멍으로 몇 년 동안 위 속을 직접 지켜보며 기록을 남겼어요. </span><span class="u">그 기록 가운데 이런 내용이 있어요. </span><span class="u">젊은이가 화를 내거나 불안해하면 위액이 줄고 음식이 오래 머물렀다고요. </span><span class="u">마음과 소화가 이어져 있다는 것을, 사람의 위 속에서 처음으로 눈으로 본 기록 가운데 하나예요. </span></p><h3 class="h3" data-keep>먼저 한 문단: 배 속의 신경, 뇌와 잇는 길</h3><p class="para" data-split="soft" data-units><span class="u">장 벽에는 그물처럼 퍼진 신경이 있어서, 뇌가 일일이 시키지 않아도 장을 꿈틀거리게 하고 소화액을 내보내요. </span><span class="u">그 신경세포 수가 척수에 있는 것만큼 많다고 알려져 있어서, 장을 '제2의 뇌'라고 부르기도 해요. </span><span class="u">그렇다고 혼자 일하는 건 아니에요. </span><span class="u">장과 뇌는 신경(그중 큰 길이 미주신경)과 호르몬, 면역 신호로 양쪽에서 소식을 주고받아요. </span><span class="u">이 이어진 길을 '장뇌축'이라고 불러요. </span><span class="u">미주신경 가닥의 대부분(80~90%)은 장과 몸의 소식을 뇌로 올려 보내는 쪽이에요. </span><span class="u">여기서는 이 길 가운데 한 방향, <strong>마음에서 장으로</strong> 내려가는 쪽만 봐요. </span></p><h3 class="h3" data-keep>편안할 때: 밥 생각만 해도 소화가 시작돼요</h3><p class="para" data-split="soft" data-units><span class="u">맛있는 냄새를 맡거나 좋아하는 음식을 떠올리면 입에 침이 고여요. </span><span class="u">그때 위에서도 위액이 나오기 시작해요. </span><span class="u">뇌가 미주신경을 통해 "곧 밥이 와" 하고 미리 알리는 거예요. </span><span class="u">밥을 먹고 쉬는 동안에는 쉬게 하는 신경(부교감신경)이 앞에 서고, 미주신경이 위와 장에 "이제 일하자"는 신호를 계속 내려보내요. </span><span class="u"><strong>소화는 편안한 몸이 하는 일이에요.</strong> </span></p><h3 class="h3" data-keep>긴장할 때: 몸이 "지금은 밥 먹을 때가 아니야"라고 정해요</h3><p class="para" data-split="soft" data-units><span class="u">긴장은 몸이 위험에 대비하는 상태예요. </span><span class="u">뇌는 싸우거나 피할 준비를 시키는 신경(교감신경)을 켜고, 스트레스 호르몬이 나오는 길도 함께 움직여요. </span><span class="u">심장은 빨리 뛰고, 피가 팔다리 근육 쪽으로 더 가요. </span><span class="u">침이 마르고, 위액과 소화액은 줄어들어요. </span><span class="u">이때 당장 급하지 않은 소화는 뒤로 밀려요. </span></p><p class="para" data-split="soft" data-units><span class="u">연구에서 본 모습도 같아요. </span><span class="u">스트레스를 받으면 위가 음식을 아래로 내려보내는 일이 느려지고, 큰창자의 움직임은 오히려 빨라졌어요. </span><span class="u">얹힌 느낌과 화장실이 급한 느낌이 한꺼번에 오는 이유예요. </span><span class="u">위는 "잠깐 멈춰", 큰창자는 "가볍게 비워 둬" 하고, 몸이 짐을 정리하는 셈이에요. </span></p><p class="emph"><strong>긴장하면 소화가 멈추는 건 고장이 아니라, 몸이 일의 순서를 바꾼 거예요.</strong></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">한 사람 상반신 옆모습 선 그림, 머리와 배 사이를 잇는 굵은 선 하나(장뇌축). </span><span class="u">왼쪽 칸 "긴장": 머리 위 작은 번개, 선을 따라 아래로 내려가는 화살표, 입 옆 마른 물방울 표시, 위 그림 안에 멈춤 표시(일시정지 두 줄), 큰창자 쪽은 빨리 도는 작은 화살표, 팔다리 쪽으로 가는 피 화살표. </span><span class="u">오른쪽 칸 "편안": 머리 위 작은 해와 밥 냄새 물결, 입에 침 방울, 위 그림에서 음식이 천천히 아래로 흘러가는 화살표. </span><span class="u">아래 작은 글씨 "같은 밥, 다른 마음". </span><span class="u">2장 끝 관계도와 같은 선·색. </span></p></div><h3 class="h3" data-keep>문제는 '긴장'이 아니라 '안 풀리는 긴장'</h3><p class="para" data-split="soft" data-units><span class="u">잠깐 긴장했다가 풀리면, 소화는 다시 제자리로 돌아와요. </span><span class="u">어려운 건 긴장이 풀리지 않고 길게 이어질 때예요. </span><span class="u">검사에는 이상이 없는데 속이 자주 불편한 사람들을 살핀 연구에서, 스트레스가 위·장의 움직임과 예민함에 함께 얽혀 있었어요. </span><span class="u">다만 스트레스가 원인인지, 속이 불편해서 마음도 지치는지, 그 순서는 아직 정리되지 않았어요. </span><span class="u">아마 둘 다일 거라고 보는 연구자가 많아요. 길이 양쪽으로 나 있으니까요. </span></p><h3 class="h3" data-keep>밥 먹는 자리도 마음의 일부예요</h3><p class="para" data-split="soft" data-units><span class="u">긴장은 큰 행사 때만 오는 게 아니에요. </span><span class="u">화면을 보며 서둘러 먹는 한 끼, 업무 메시지를 확인하며 삼키는 점심도 몸에는 작은 긴장이에요. </span><span class="u">다른 일에 정신이 팔린 채 먹으면, 그 끼니에 더 먹고 다음 끼니에도 더 먹게 되는 경향이 있었다는 연구들을 모아 본 결과가 있어요. </span><span class="u">배부름을 알려 주는 신호를 놓치기 쉬워서로 봐요. </span><span class="u">천천히 앉아 먹는 자리는, 몸에 "지금은 밥 먹을 때야"라고 알려 주는 신호가 돼요. </span></p><h3 class="h3" data-keep>세로토닌 이야기, 어디까지 맞을까요?</h3><p class="para" data-split="soft" data-units><span class="u">"세로토닌은 장에서 많이 만들어진다"는 말, 자주 듣지요. </span><span class="u">뇌 바깥에 있는 세로토닌은 대부분 장 세포가 만든다고 보고된 것은 맞아요. </span><span class="u">그런데 피 속의 세로토닌은 뇌를 지키는 문(혈액뇌장벽)을 넘어가지 못해요. </span><span class="u">장에서 만든 세로토닌은 주로 장의 움직임처럼 장 가까이에서 일해요. </span><span class="u"><strong>"장이 행복 호르몬을 만들어 기분을 정한다"고까지는 아직 말할 수 없어요.</strong> </span></p><p class="para" data-split="soft" data-units><span class="u">신경이 일하는 데 쓰이는 재료도 밥상에서 와요. </span><span class="u">마그네슘은 신경과 근육 기능 유지에 필요해요. </span><span class="u">칼슘도 신경과 근육 기능 유지에 필요해요. </span><span class="u">긴장을 풀어 준다는 뜻이 아니라, 신경이 매일 쓰는 재료라는 뜻이에요. </span></p><div class="callout" data-split="hard"><div class="callout-lab">더 깊이</div><div data-units><p class="emph"><strong>장이 뇌에게 하는 말이 더 많아요</strong></p><p class="para"><span class="u">미주신경 가닥의 대부분은 아래에서 위로, 장과 몸의 소식을 뇌로 올려 보내요. </span><span class="u">배부름, 늘어남, 불편함 같은 소식이 쉬지 않고 올라가요. </span><span class="u">그래서 장이 불편한 날 마음까지 가라앉는 것도, 길이 이렇게 나 있으니 자연스러운 일이에요. </span><span class="u">다만 장 속 균이 이 길로 사람의 기분을 얼마나 바꾸는지는, 대부분 동물 연구이고 사람 연구는 관련성까지예요. </span></p><p class="emph"><strong>'체했다'는 몸에서 무슨 일일까요</strong></p><p class="para"><span class="u">우리가 흔히 '체했다'고 하는 느낌은, 위가 음식을 내려보내는 속도가 느려지고 위가 예민해진 상태와 겹치는 경우가 많아요. </span><span class="u">급하게 먹었거나, 기름진 큰 한 끼였거나, 마음이 쫓기던 날이면 이 셋이 한꺼번에 겹치기 쉬워요. </span><span class="u">대부분은 쉬면 풀리지만, 아래 신호가 있으면 이야기가 달라져요. </span></p></div></div><h3 class="h3" data-keep>한눈에 보기: 같은 밥, 다른 마음</h3><table class="tbl" data-split="hard"><thead><tr><th>몸의 자리</th><th>편안할 때</th><th>긴장할 때</th></tr></thead><tbody data-units><tr><td>앞에 서는 신경</td><td>쉬게 하는 신경(부교감)</td><td>대비하는 신경(교감)</td></tr><tr><td>입</td><td>침이 고임</td><td>침이 마름</td></tr><tr><td>위</td><td>위액이 나오고 음식을 조금씩 내려보냄</td><td>내려보내는 일이 느려짐(얹힌 느낌)</td></tr><tr><td>큰창자</td><td>밥 먹은 뒤 크게 움직임</td><td>움직임이 빨라질 수 있음(화장실이 급함)</td></tr><tr><td>피</td><td>배 속 장기 쪽으로 넉넉히</td><td>팔다리 근육 쪽으로 더</td></tr></tbody></table><h3 class="h3" data-keep>자주 헷갈리는 질문</h3><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 스트레스를 받으면 왜 화장실이 급해지나요?</strong> </span><span class="u">스트레스 신호는 위의 움직임을 늦추는 대신 큰창자의 움직임은 빠르게 할 수 있어요. </span><span class="u">몸이 위험에 대비하며 짐을 가볍게 하려는 반응으로 봐요. </span><span class="u">대부분은 긴장이 풀리면 제자리로 돌아와요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 긴장해서 체한 건 마음이 약해서인가요?</strong> </span><span class="u">아니에요. </span><span class="u">위험에 대비하는 몸의 정상적인 반응이에요. </span><span class="u">마음이 강하고 약하고의 문제가 아니라, 몸이 일의 순서를 잠깐 바꾼 거예요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 숨을 고르면 소화에 도움이 되나요?</strong> </span><span class="u">천천히 숨을 내쉬면 쉬게 하는 신경이 앞에 서는 쪽으로 몸이 기운다고 보는 연구자들이 있어요. </span><span class="u">다만 숨 고르기가 소화를 얼마나 바꾸는지, 사람마다 얼마나 다른지는 아직 정리 중이에요. </span><span class="u">밥 앞에서 잠깐 쉬어 가는 습관으로 생각하면 부담이 없어요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><p class="emph"><strong>확인된 것</strong></p><ul class="lst" data-split="soft" data-units><li>장과 뇌는 신경·호르몬·면역 신호로 양쪽에서 이어져 있어요.</li><li>스트레스를 받으면 위의 움직임은 느려지고 큰창자 움직임은 빨라질 수 있어요.</li><li>미주신경 가닥의 대부분은 몸의 소식을 뇌로 올려 보내요.</li><li>피 속 세로토닌은 혈액뇌장벽을 넘지 못해요.</li></ul><p class="emph"><strong>아직 모르는 것</strong></p><ul class="lst" data-split="soft" data-units><li>장 속 균이 사람의 기분을 얼마나 바꾸는지 — 대부분 동물 연구이고 사람 연구는 관련성까지예요.</li><li>오래 이어진 스트레스가 속 불편의 원인인지 결과인지.</li><li>숨 고르기 같은 생활 습관이 소화에 얼마나 도움이 되는지, 사람마다 얼마나 다른지.</li></ul><p class="emph"><strong>흔한 오해</strong></p><ul class="lst" data-split="soft" data-units><li>"장에서 만든 세로토닌이 그대로 기분이 된다" → 피 속 세로토닌은 뇌로 넘어가지 못해요.</li><li>"장은 제2의 뇌라서 혼자 다 알아서 한다" → 혼자 움직일 수는 있지만 뇌와 늘 소식을 주고받아요.</li><li>"긴장해서 체한 건 마음이 약해서다" → 위험에 대비하는 몸의 정상적인 반응이에요.</li><li>"바빠도 먹기만 하면 된다" → 쫓기며 먹는 한 끼는 몸에 작은 긴장이고, 배부름 신호도 놓치기 쉬워요.</li></ul><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>밥 먹기 전, 휴대폰과 업무 메시지를 잠깐 엎어 두고 숨을 길게 세 번 내쉬어 보세요. 첫 몇 숟가락은 천천히, 꼭꼭 씹어요.</li><li>긴장이 큰 날은 기름진 큰 한 끼 대신 따뜻하고 순한 음식을 조금씩 나눠 드세요. 견과·콩·푸른 잎채소·두부·멸치처럼 마그네슘·칼슘이 든 반찬을 하나 곁들여요.</li><li>하루 한 끼는 앉아서, 화면 없이 먹어 보세요. 그 끼니가 몸에게 "지금은 밥 먹을 때"라는 신호가 돼요.</li></ol><p class="para" data-split="soft" data-units><span class="u">속 불편이 자꾸 되풀이되거나, 몸무게가 이유 없이 줄거나, 삼키기 어려우면 진료를 받아 보세요. 피를 토하거나 검은 변이 나오면 바로 병원에 가세요. </span></p><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">긴장이 풀리면 소화는 제 순서를 되찾아요.</mark></p></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-2, 2-6, 2-9, 13-3, 14-2, 14-3, 11-7</p></article>
<article data-id="2-9" data-short="2-9 장의 신호"><header class="art-head" data-keep><div class="art-no">2-9</div><h2 class="art-title"><span class="kw">장의 신호</span> 변·가스·더부룩함, 언제 지켜보고 언제 병원에 갈까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">이틀째 화장실에 못 갔다고 하면 꼭 따라오는 말이 있어요. </span><span class="u">"그럼 지금 몸속에 여섯 끼가 쌓여서 썩고 있는 거예요." </span><span class="u">듣고 나면 마음이 급해지지요. </span><span class="u">장이 보내는 신호는 정말 그렇게 무서운 말일까요? </span><span class="u">무엇을 보고, 언제는 지켜봐도 되고, 언제는 병원에 가야 할까요? </span></p><p class="para" data-split="soft" data-units><span class="u">장은 말을 못 하는 대신 신호를 보내요. </span><span class="u">횟수, 모양, 색, 가스, 더부룩함. </span><span class="u">이 신호를 읽는 기준은 정답표가 아니라 <strong>나의 평소</strong>예요. </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>매일 안 나와도 괜찮을 수 있어요</h3><p class="para" data-split="soft" data-units><span class="u">화장실 가는 횟수는 사람마다 넓게 달라요. </span><span class="u">하루 1~3번부터 일주일에 2~3번까지를 정상 범위로 봐요. </span><span class="u">그러니 "매일 나와야 정상"은 아니에요. </span></p><p class="para" data-split="soft" data-units><span class="u">더 중요한 건 <strong>나의 평소와 비교해 달라졌는가</strong>예요. </span><span class="u">늘 아침마다 가던 사람이 몇 주째 사흘에 한 번이 됐다면, 횟수보다 그 '바뀜'이 신호예요. </span><span class="u">그래서 신호를 읽으려면 먼저 나의 평소를 알아야 해요. </span></p><p class="para" data-split="soft" data-units><span class="u">변비도 횟수만으로 말하지 않아요. </span><span class="u">변이 딱딱해서 힘을 많이 줘야 하거나, 보고 나서도 덜 본 느낌이 남는 것도 함께 봐요. </span><span class="u">반대로 묽은 변이 하루 세 번 이상 나오면 설사로 봐요. </span></p><h3 class="h3" data-keep>모양: 변은 장을 지나온 시간의 기록이에요</h3><p class="para" data-split="soft" data-units><span class="u">변의 모양을 일곱 가지로 나눈 그림표가 병원에서 널리 쓰여요. </span><span class="u">토끼 똥처럼 딱딱하게 따로 떨어진 1번부터, 물처럼 흐르는 7번까지예요. </span><span class="u">가운데 3~4번, 겉이 매끈하거나 살짝 금이 간 소시지 모양이 보통으로 꼽혀요. </span></p><p class="para" data-split="soft" data-units><span class="u">이 모양은 변이 큰창자에 얼마나 오래 머물렀는지와 이어져 있어요. </span><span class="u">큰창자는 지나가는 동안 물을 거둬들이니까, 오래 머물수록 물이 빠져 딱딱해지고, 빨리 지나가면 묽어져요. </span><span class="u">그래서 모양을 보면 횟수만 볼 때보다 장의 속도를 더 잘 짐작할 수 있어요. </span></p><h3 class="h3" data-keep>색: 갈색은 쓸개즙의 색이에요</h3><p class="para" data-split="soft" data-units><span class="u">변이 갈색인 건 간이 내보낸 쓸개즙 덕분이에요. </span><span class="u">쓸개즙 속 피 색소 찌꺼기가 장을 지나며 장 속 균의 손을 거쳐 갈색이 돼요. </span><span class="u">다만 색은 먹은 것과 먹은 약에 따라 그날그날 달라질 수 있어요. </span><span class="u">철분제나 블루베리를 먹은 뒤엔 검게, 비트나 붉은 색소가 든 음식을 먹은 뒤엔 붉게 보이기도 해요. </span></p><p class="para" data-split="soft" data-units><span class="u">"황금색 변이어야 건강하다"는 말도 자주 들어요. </span><span class="u">그런데 기준이 되는 색은 황금색이 아니라 <strong>보통의 갈색</strong>이에요. </span><span class="u">먹은 것으로 설명되지 않는 색이 며칠 이어질 때, 그때가 살펴볼 때예요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">두 칸 선 그림. </span><span class="u">위 칸: 일곱 칸 모양 띠(1번 동글동글 따로 → 4번 매끈한 막대 → 7번 물결), 3~4번 칸만 레몬 노랑 형광펜, 띠 위에 "오래 머묾 ← → 빨리 지나감" 화살표. </span><span class="u">변은 실제 모양이 아니라 단순한 선·점으로(밥상 위 책이라 거부감 없게). </span><span class="u">아래 칸: 일주일 달력 두 줄. </span><span class="u">윗줄 "지난주의 나": 월·수·토에 작은 동그라미, 옆에 작은 갈색 점. </span><span class="u">아랫줄 "이번 주의 나": 동그라미 자리는 같고, 목요일 칸에만 블루베리 그림 + 검은 점, 옆에 "먹은 것 때문" 작은 글씨. </span><span class="u">맨 아래 한 줄 "횟수보다 '평소와 달라졌나'". </span><span class="u">2장 끝 관계도와 같은 선·색. </span></p></div><h3 class="h3" data-keep>가스: 큰창자 식구들이 밥을 먹은 흔적</h3><p class="para" data-split="soft" data-units><span class="u">방귀는 하루 10~20번쯤 나오는 게 보통이에요. </span><span class="u">대부분은 우리가 다 소화하지 못한 탄수화물을 큰창자의 균이 발효하며 만든 가스예요. </span><span class="u">콩·잡곡처럼 식이섬유가 많은 음식, 과당이나 소르비톨이 든 음식을 먹은 날 더 많아지는 까닭이에요. </span><span class="u">고약한 냄새는 가스 대부분이 아니라, 아주 적은 양의 황 성분 가스가 주로 만들어요. </span></p><p class="para" data-split="soft" data-units><span class="u">그러니 방귀가 늘었다는 것만으로 나쁜 신호라고 할 수는 없어요. </span><span class="u">식이섬유를 늘린 뒤라면, 오히려 큰창자 식구들이 밥을 먹고 있다는 뜻이기도 해요. </span></p><h3 class="h3" data-keep>더부룩함: 양보다 '예민함'</h3><p class="para" data-split="soft" data-units><span class="u">더부룩함은 한 단계 더 들어가 볼 만해요. </span><span class="u">배가 빵빵하게 느껴지는 사람 대부분은 장에 가스가 넘치게 차 있다기보다, 보통 양의 가스에도 장이 예민하게 느끼는 쪽으로 봐요. </span><span class="u">그래서 가스를 없애는 데만 매달리기보다, 언제·무엇을·얼마나 급하게 먹은 날 그런지 적어 보는 편이 실마리가 돼요. </span></p><h3 class="h3" data-keep>더부룩할 때 살펴볼 다섯 자리</h3><p class="para" data-split="soft" data-units><span class="u">속이 불편할 때 "장이 나빠서"라고 한 덩어리로 보기보다, 먹은 것이 지나가는 자리를 차례로 짚어 보면 실마리가 보여요. </span></p><ol class="lst" data-split="soft" data-units><li><strong>입과 위</strong> — 급하게 먹었나, 크게 한 끼를 먹었나. 덜 씹고 많이 먹으면 위가 내려보내는 데 시간이 걸려요.</li><li><strong>쓸개즙</strong> — 기름진 음식이었나. 기름은 위가 비는 속도를 늦추고, 작은 배를 만드는 데도 시간이 걸려요.</li><li><strong>현관 앞 마지막 손질</strong> — 우유나 과당이 많은 음식이었나. 다 자르지 못하거나 다 들이지 못한 당은 큰창자로 내려가 가스가 돼요.</li><li><strong>장 속 식구</strong> — 콩·잡곡·채소를 갑자기 많이 늘렸나. 식구들이 새 밥에 익숙해지는 데 몇 주가 걸려요.</li><li><strong>마음</strong> — 쫓기며 먹었나, 긴장한 날이었나. 긴장하면 위는 멈추고 장은 예민해져요.</li></ol><p class="para" data-split="soft" data-units><span class="u">이 다섯 자리를 장 일기에 한 줄씩 적어 보면, 내 더부룩함이 어디서 오는지 조금씩 보여요. </span><span class="u">다만 아래 상자의 신호가 있다면, 일기보다 진료가 먼저예요. </span></p><div class="callout" data-split="hard"><div class="callout-lab">더 깊이</div><div data-units><p class="emph"><strong>"며칠 못 가면 음식이 썩는다"는 말</strong></p><p class="para"><span class="u">먹은 것이 입에서 나오기까지는 보통 하루를 넘겨 며칠까지 걸리고, 그 시간의 대부분을 큰창자에서 보내요. </span><span class="u">큰창자에서는 원래 균이 남은 것을 발효하고, 그 일은 매일 일어나요. </span><span class="u">그러니 이틀 못 갔다고 '갑자기 썩기 시작한다'고 볼 근거는 없어요. </span><span class="u">다만 평소와 다르게 오래 못 가면서 배가 아프거나 부풀고 토한다면, 그건 지켜볼 일이 아니라 바로 병원에 갈 신호예요. </span></p><p class="emph"><strong>화장실에서의 자세</strong></p><p class="para"><span class="u">발밑에 낮은 받침을 두어 무릎을 엉덩이보다 조금 높이면, 힘을 덜 주고 보기 쉬웠다는 작은 연구가 있어요. </span><span class="u">모두에게 같지는 않지만, 돈이 들지 않는 시도라 해 볼 만해요. </span></p></div></div><h3 class="h3" data-keep>한눈에 보기: 신호 읽는 법</h3><table class="tbl" data-split="hard"><thead><tr><th>신호</th><th>보통으로 보는 폭</th><th>먼저 생각해 볼 것</th><th>살펴볼 때</th></tr></thead><tbody data-units><tr><td>횟수</td><td>하루 1~3번 ~ 일주일 2~3번</td><td>나의 평소와 같은가</td><td>평소와 다르게 몇 주째 이어질 때</td></tr><tr><td>모양</td><td>일곱 칸 가운데 3~4번</td><td>물·식이섬유·움직임</td><td>딱딱하거나 묽은 상태가 이어질 때</td></tr><tr><td>색</td><td>보통의 갈색</td><td>먹은 음식·약(철분제·블루베리·비트)</td><td>먹은 것으로 설명되지 않는 색이 며칠</td></tr><tr><td>가스</td><td>하루 10~20번쯤</td><td>콩·잡곡·과당·소르비톨, 식이섬유를 늘렸나</td><td>배 아픔·설사·몸무게 변화와 함께일 때</td></tr><tr><td>더부룩함</td><td>가끔</td><td>다섯 자리(입·위 / 쓸개즙 / 마지막 손질 / 장 속 식구 / 마음)</td><td>자꾸 되풀이될 때</td></tr></tbody></table><div class="callout" data-split="hard"><div class="callout-lab">이럴 땐 병원으로</div><div data-units><ul class="lst"><li><strong>바로:</strong> 변에 피가 보일 때 · 검고 끈적한 변이 나올 때 · 피를 토하거나 어지러울 때 · 심한 배 아픔이 이어지거나 배가 부풀고 토할 때 · 설사에 열이 나거나 소변이 줄고 입이 바짝 마를 때 · 속이 불편하면서 숨이 차고 식은땀이 나고 가슴이 두근거릴 때 → 오늘 바로 병원(응급실)에 가세요.</li><li><strong>며칠~일주일 안에:</strong> 이유 없이 몸무게가 줄 때 · 자다가 깰 만큼 설사가 날 때, 설사가 오래 이어질 때 · 삼키기 어렵거나 삼킬 때 아플 때 · 입맛이 없고 메스꺼움이 이어질 때 · 나이 들어 화장실 가기가 갑자기 많이 힘들어졌을 때 · 변이 며칠째 회색·흙빛처럼 옅을 때 → 미루지 말고 진료를 받아 보세요.</li><li><strong>위 신호가 없어도:</strong> 설사가 사흘 넘게 이어지거나, 속 불편이 자꾸 되풀이되면 진료를 받아 보세요.</li></ul></div></div><h3 class="h3" data-keep>자주 헷갈리는 질문</h3><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 매일 못 가면 변비인가요?</strong> </span><span class="u">꼭 그렇지는 않아요. </span><span class="u">일주일에 2~3번도 정상 범위예요. </span><span class="u">횟수보다 딱딱한지, 힘을 많이 줘야 하는지, 평소와 달라졌는지를 함께 봐요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 콩밥을 먹기 시작했더니 방귀가 늘었어요. 장이 나빠진 건가요?</strong> </span><span class="u">식이섬유가 늘면 큰창자 식구들이 그것을 발효하며 가스를 만들어요. </span><span class="u">갑자기 늘리기보다 몇 주에 걸쳐 조금씩 늘리면, 장도 식구들도 익숙해져요. </span><span class="u">배 아픔이 함께 이어지면 진료를 받아 보세요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 변 색이 검어서 놀랐어요.</strong> </span><span class="u">철분제나 블루베리, 선지처럼 먹은 것으로 검어질 수 있어요. </span><span class="u">하지만 먹은 것으로 설명되지 않는 검고 끈적한 변이라면, 위 상자대로 바로 병원에 가세요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><p class="emph"><strong>확인된 것</strong></p><ul class="lst" data-split="soft" data-units><li>하루 1~3번부터 일주일 2~3번까지가 정상 범위예요.</li><li>변의 모양은 큰창자에 머문 시간과 이어져 있어요.</li><li>갈색은 쓸개즙 색이고, 음식·약으로 색이 바뀔 수 있어요.</li><li>방귀는 하루 10~20번쯤이 보통이고, 대부분 큰창자 균이 만들어요.</li></ul><p class="emph"><strong>아직 모르는 것</strong></p><ul class="lst" data-split="soft" data-units><li>내 장의 '평소'가 나이·생활에 따라 얼마나 바뀌는지.</li><li>방귀 냄새로 장 속 균의 상태를 알 수 있는지 — 이 책이 확인한 자료에서 근거를 찾지 못했어요.</li><li>더부룩함을 느끼는 정도가 사람마다 왜 다른지.</li></ul><p class="emph"><strong>흔한 오해</strong></p><ul class="lst" data-split="soft" data-units><li>"이틀 못 가면 몸속에서 음식이 썩는다" → 일주일 2~3번도 정상 범위예요. 횟수보다 평소와의 차이를 봐요.</li><li>"황금색이어야 건강하다" → 기준은 보통의 갈색이에요.</li><li>"더부룩하면 가스가 많이 찬 것" → 보통 양에도 예민하게 느끼는 경우가 많아요.</li><li>"방귀가 늘면 장이 나빠진 것" → 식이섬유를 늘린 뒤라면 식구들이 밥을 먹은 흔적일 수 있어요.</li></ul><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>일주일만 '장 일기'를 한 줄씩 써 보세요. 화장실 간 날, 모양(딱딱·보통·묽음), 더부룩했던 끼니와 그때 먹은 것, 그리고 다섯 자리 가운데 짚이는 곳. 평소를 알아야 달라진 걸 알아요.</li><li>콩·잡곡·채소를 늘릴 때는 한꺼번에 말고 몇 주에 걸쳐 조금씩 늘려요. 식이섬유는 배변활동 원활에 도움을 줄 수 있어요.</li><li>아침을 먹은 뒤 화장실에 앉아 볼 여유를 조금 두고, 신호가 오면 미루지 않아요.</li></ol><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">장의 신호는 정답표가 아니라, 나의 평소와 견주어 읽는 편지예요.</mark></p></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-2, 2-3, 2-4, 2-6, 2-8, 2-10, 11-12, 16장</p></article>
<article data-id="2-10" data-short="2-10 장을 돕는 밥상"><header class="art-head" data-keep><div class="art-no">2-10</div><h2 class="art-title"><span class="kw">장을 돕는 밥상</span> 유산균과 식이섬유, 무엇부터 챙길까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">"아침에 눈뜨면 물 한 잔, 그리고 빈속에 유산균." </span><span class="u">장 건강 이야기에서 가장 자주 듣는 아침 순서예요. </span><span class="u">그런데 장 속 식구들 입장에서 보면, 정말 그게 첫 번째일까요? </span><span class="u">유산균과 식이섬유, 하나만 먼저 챙긴다면 무엇부터일까요? </span></p><p class="para" data-split="soft" data-units><span class="u">앞에서 본 것을 떠올리면 실마리가 있어요. </span><span class="u">넣는 균은 머무는 정도가 사람마다 다른 손님이었고, 오래 사는 식구는 이미 장에 살던 균들이었어요. </span><span class="u">그럼 그 식구들은 무엇을 먹고 살까요? 밥이 없으면 어떻게 될까요? </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>식구에게 밥을 주지 않으면 생기는 일</h3><p class="para" data-split="soft" data-units><span class="u">사람 장에 사는 균 여러 가지를 골라 심은 쥐에게 식이섬유를 뺀 먹이를 주었더니, 장 속 균들이 다른 밥을 찾기 시작했어요. </span><span class="u">바로 장벽 위를 덮은 점액이었어요. </span><span class="u">점액층은 점점 얇아졌고, 탈을 일으키는 균이 장벽에 더 쉽게 닿았어요. </span><span class="u">점액은 늘 새로 만들어지는데, 균이 먹는 속도가 더 빨라진 거예요. </span></p><p class="para" data-split="soft" data-units><span class="u">쥐 연구라 사람에게 그대로 일어난다고 말할 수는 없어요. </span><span class="u">그래도 순서를 생각하게 해 줘요. </span><span class="u">장 속 식구들은 밥이 없으면 굶는 게 아니라, 가까운 데서 밥을 찾아요. </span></p><p class="emph"><strong>새로 넣는 균보다, 이미 사는 식구들의 밥이 먼저예요.</strong></p><h3 class="h3" data-keep>밥이 없는 시간이 길어지면</h3><p class="para" data-split="soft" data-units><span class="u">또 다른 쥐 연구도 있어요. </span><span class="u">식이섬유가 적은 먹이를 여러 세대에 걸쳐 먹였더니, 세대가 지날수록 장 속 균의 가짓수가 줄었어요. </span><span class="u">나중에 식이섬유를 다시 넉넉히 주어도, 한번 사라진 무리는 저절로 돌아오지 않았어요. </span><span class="u">식구들의 밥은 한두 끼의 일이 아니라, 오래 이어지는 밥상의 일이라는 뜻이에요. </span><span class="u">이것도 쥐에서 본 일이고, 사람에게서 얼마나 그런지는 아직 연구 중이에요. </span></p><h3 class="h3" data-keep>식구들의 밥은 이런 음식이에요</h3><p class="para" data-split="soft" data-units><span class="u">식이섬유는 배변활동 원활에 도움을 줄 수 있어요. </span><span class="u">나물·잡곡·콩·해조류·버섯, 껍질째 먹는 채소와 과일이 밥이 돼요. </span><span class="u">프락토올리고당은 장내 유익균의 증식과 배변활동 원활에 도움을 줄 수 있어요. 양파·마늘·우엉·바나나에 들어 있어요. </span><span class="u">프로바이오틱스는 유산균 증식과 유해균 억제, 배변활동 원활, 장 건강에 도움을 줄 수 있어요. 김치·요구르트 같은 발효 음식에도 유산균이 들어 있어요. </span></p><p class="para" data-split="soft" data-units><span class="u">식이섬유도 한 가지가 아니에요. </span><span class="u">물에 녹아 끈끈해지는 것, 녹지 않고 결을 이루는 것, 녹말인데 작은창자에서 다 쪼개지지 않고 큰창자까지 내려가는 것까지 여러 가지예요. </span><span class="u">식구들도 저마다 좋아하는 밥이 달라요. </span><span class="u">그래서 한 가지 음식을 많이 먹기보다, 여러 가지를 조금씩 올리는 밥상이 더 많은 식구를 먹여요. </span></p><h3 class="h3" data-keep>밥 → 식구 → 식구가 만든 것</h3><p class="para" data-split="soft" data-units><span class="u">장 속에서는 이런 차례로 일이 이어져요. </span><span class="u"><strong>식구의 밥</strong>(식이섬유·올리고당)이 들어오면, <strong>식구</strong>(장 속 균)가 그것을 발효하고, <strong>식구가 만든 것</strong>(짧은사슬지방산 같은 물질)이 장 세포의 에너지가 되고 장벽 가까이에서 일해요. </span><span class="u">이 셋 가운데 우리가 밥상에서 매일 정할 수 있는 건 첫째, 식구의 밥이에요. </span><span class="u">식구를 바꾸는 일은 어렵고 오래 걸리지만, 밥은 오늘 저녁에 바꿀 수 있어요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">하루를 가로로 그린 선 그림 한 줄. </span><span class="u">왼쪽 해 뜨는 창가: 물컵 + 밥공기 + 시계(여유) + 화장실 문, 그 위 작은 물결 세 줄(장이 깨어나 움직임). </span><span class="u">가운데 점심 밥상: 잡곡밥·나물·김치 한 접시. </span><span class="u">오른쪽 저녁 밥상: 콩·버섯·양파 반찬. </span><span class="u">밥상 아래 큰창자 단면에서 작은 균 식구들이 숟가락을 들고 있고, 식구들 옆에 작은 화살표 "밥 → 식구 → 식구가 만든 것 → 장 세포". </span><span class="u">옆 '점액' 띠는 도톰. </span><span class="u">아래 작은 칸: 밥상이 빈 날 → 균들이 점액 띠를 갉아먹어 띠가 얇아진 모습. </span><span class="u">작은 글씨 "밥이 없으면 점액을 먹어요(쥐 연구)". </span><span class="u">2장 끝 관계도와 같은 선·색. </span></p></div><h3 class="h3" data-keep>아침 순서, 한 단계 더 들어가 보면</h3><p class="para" data-split="soft" data-units><span class="u">큰창자는 하루 종일 같은 힘으로 움직이지 않아요. </span><span class="u">건강한 사람의 큰창자를 하루 내내 잰 연구에서, 밤에는 움직임이 낮았고, 잠에서 깰 때 움직임이 약 세 배, 밥을 먹은 뒤 약 두 배로 커졌어요. </span><span class="u">물 한 잔도 좋은 습관이지만, 연구로 확인된 큰 신호는 <strong>일어나는 것과 아침을 먹는 것</strong>이에요. </span><span class="u">아침을 거르고 서둘러 나가면 이 시간을 그냥 보내게 돼요. </span></p><p class="para" data-split="soft" data-units><span class="u">"유산균은 빈속에 먹어야 위산을 피한다"는 말도 들여다볼게요. </span><span class="u">사람 위와 작은창자를 본뜬 실험 장치에서, 코팅하지 않은 유산균은 밥과 함께 또는 밥 먹기 30분 전에 넣었을 때 가장 많이 살아남았어요. </span><span class="u">밥 먹고 30분 뒤에 넣었을 때가 가장 적었고, 기름이 조금 든 식사가 도왔어요. </span><span class="u">밥이 위산을 잠깐 누그러뜨리는 완충 노릇을 했다고 봐요. </span><span class="u">실험 장치 연구라 사람 몸에서 꼭 같다고는 말할 수 없고, 제품마다 만든 방식이 달라요. </span><span class="u">그래서 "빈속이 정답"이라기보다, 포장에 적힌 방법을 먼저 따르는 게 맞아요. </span></p><h3 class="h3" data-keep>식이섬유는 조금씩, 꾸준히</h3><p class="para" data-split="soft" data-units><span class="u">식이섬유를 갑자기 많이 늘리면 가스가 차고 배가 부풀 수 있어요. </span><span class="u">몇 주에 걸쳐 한 가지씩 늘리면, 장도 식구들도 새 밥에 익숙해져요. </span><span class="u">식이섬유를 늘릴 때는 물도 함께 넉넉히 마시는 게 자연스러워요. </span><span class="u">식이섬유는 물을 머금어 변의 부피를 만드는데, 물이 모자라면 그 일이 어려워지기 때문이에요. </span></p><div class="callout" data-split="hard"><div class="callout-lab">더 깊이</div><div data-units><p class="emph"><strong>유산균과 식이섬유, 경쟁이 아니라 짝</strong></p><p class="para"><span class="u">"유산균이냐 식이섬유냐"는 사실 고르는 문제가 아니에요. </span><span class="u">들어온 손님도, 원래 사는 식구도 결국 같은 밥을 먹어요. </span><span class="u">밥이 없으면 손님은 더 빨리 떠나고, 식구는 점액을 먹기 시작해요. </span><span class="u">그래서 순서를 정한다면 밥이 먼저이고, 손님은 밥상 위에 얹는 쪽이에요. </span></p><p class="emph"><strong>우리 밥상은 이미 좋은 재료를 갖고 있어요</strong></p><p class="para"><span class="u">나물, 잡곡밥, 된장국 속 두부와 미역, 김치 한 접시. </span><span class="u">한식 밥상은 식이섬유 반찬과 발효 음식을 한 상에 올리기 쉬운 구조예요. </span><span class="u">다만 김치·장아찌처럼 짠 반찬은 양을 줄이고, 흰쌀밥에 잡곡을 한 숟가락씩 섞는 것부터가 현실적인 시작이에요. </span></p></div></div><h3 class="h3" data-keep>한눈에 보기: 장 속 식구의 밥상</h3><table class="tbl" data-split="hard"><thead><tr><th>무엇</th><th>많이 든 음식</th><th>식약처가 인정한 일</th><th>넣을 때</th></tr></thead><tbody data-units><tr><td>식이섬유</td><td>나물·잡곡·콩·해조류·버섯, 껍질째 먹는 채소·과일</td><td>배변활동 원활에 도움을 줄 수 있어요</td><td>몇 주에 걸쳐 한 가지씩, 물과 함께</td></tr><tr><td>프락토올리고당</td><td>양파·마늘·우엉·바나나</td><td>장내 유익균의 증식과 배변활동 원활에 도움을 줄 수 있어요</td><td>볶음·국에 양파·마늘을 넉넉히</td></tr><tr><td>프로바이오틱스</td><td>(김치·요구르트 같은 발효 음식에도 유산균이 들어 있어요)</td><td>유산균 증식과 유해균 억제, 배변활동 원활, 장 건강에 도움을 줄 수 있어요</td><td>제품은 포장에 적힌 방법대로</td></tr></tbody></table><h3 class="h3" data-keep>자주 헷갈리는 질문</h3><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 아침 물 한 잔이 장을 깨우나요?</strong> </span><span class="u">물 한 잔은 좋은 습관이에요. </span><span class="u">다만 물만의 힘은 이 책이 확인한 자료에서 찾지 못했어요. </span><span class="u">연구로 확인된 큰 신호는 잠에서 깨는 것과 아침을 먹는 것이에요. </span><span class="u">물을 마시고, 아침을 먹고, 화장실 갈 여유를 두는 세 가지를 한 묶음으로 생각해 보세요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 식이섬유를 늘렸더니 오히려 배가 더부룩해요.</strong> </span><span class="u">갑자기 많이 늘리면 가스가 차고 배가 부풀 수 있어요. </span><span class="u">한 주 쉬었다가 더 조금씩, 한 가지씩 다시 늘려 보세요. </span><span class="u">배 아픔이나 설사가 함께 이어지면 진료를 받아 보세요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 유산균 제품은 꼭 먹어야 하나요?</strong> </span><span class="u">이 책이 권하는 순서는 밥상이 먼저예요. </span><span class="u">식구들의 밥인 식이섬유를 고르게 올리고, 발효 음식을 곁들이는 데서 시작해요. </span><span class="u">제품을 고르고 먹는 일은 사람마다 사정이 달라서, 이 책은 밥상까지만 이야기해요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><p class="emph"><strong>확인된 것</strong></p><ul class="lst" data-split="soft" data-units><li>큰창자는 깰 때와 밥 먹은 뒤 크게 움직여요.</li><li>쥐에서 식이섬유를 빼자 장 속 균이 점액을 먹어 점액층이 얇아졌어요.</li><li>식약처는 식이섬유·프락토올리고당·프로바이오틱스를 배변활동 쪽 기능으로 인정해요.</li><li>식이섬유를 갑자기 늘리면 가스·부풂이 생길 수 있어 몇 주에 걸쳐 늘려요.</li></ul><p class="emph"><strong>아직 모르는 것</strong></p><ul class="lst" data-split="soft" data-units><li>식이섬유가 모자랄 때 사람 장에서도 균이 점액을 먹는지, 얼마나 그런지.</li><li>유산균을 먹는 가장 좋은 때가 사람 몸에서 언제인지 — 실험 장치 연구까지예요.</li><li>나에게 맞는 식이섬유 양이 얼마인지는 사람마다 달라요.</li><li>여러 세대에 걸친 쥐 연구처럼, 사람에게서도 한번 줄어든 식구가 돌아오기 어려운지.</li></ul><p class="emph"><strong>흔한 오해</strong></p><ul class="lst" data-split="soft" data-units><li>"아침 물 한 잔이 장을 깨운다" → 물만의 힘은 이 책이 확인한 자료에서 찾지 못했어요. 확인된 큰 신호는 깨어남과 아침밥이에요.</li><li>"유산균은 꼭 빈속에" → 실험 장치에서는 밥과 함께·밥 직전이 더 많이 살아남았어요.</li><li>"유산균만 잘 고르면 된다" → 들어온 균도 사는 식구도 밥이 있어야 해요.</li><li>"식이섬유는 한 가지만 많이 먹으면 된다" → 식구마다 좋아하는 밥이 달라서, 여러 가지를 조금씩이 더 많은 식구를 먹여요.</li></ul><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>아침을 먹은 뒤 화장실 갈 여유를 조금 두세요. 깰 때와 밥 먹은 뒤 큰창자가 크게 움직여요.</li><li>이번 주에는 끼니마다 식이섬유 반찬을 '한 가지만' 늘려 보세요. 잡곡 한 숟가락, 나물 한 접시, 양파·버섯 볶음처럼요. 가스가 많이 차면 한 주 쉬었다가 다시 조금씩.</li><li>일주일 밥상에 나물·콩·해조류·버섯·과일이 한 번씩은 오르게 해 보세요. 같은 식이섬유도 종류가 달라야 더 많은 식구가 먹어요.</li></ol><p class="para" data-split="soft" data-units><span class="u">유산균 제품을 이미 드신다면 포장에 적힌 방법을 따르세요. 장 질환으로 치료 중이면 담당 의사와 먼저 상의해 보세요. </span></p><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">유산균은 손님, 식이섬유는 식구의 밥 — 밥상부터 차려요.</mark></p></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-4, 2-5, 2-6, 2-9, 11-11, 11-12, 13-1, 14-4, 15-3</p></article>
<article data-id="2-11" data-short="2-11 장을 지치게 하는 습관"><header class="art-head" data-keep><div class="art-no">2-11</div><h2 class="art-title"><span class="kw">장을 지치게 하는 습관</span> 잠·단 음료·술은 장벽에 무엇을 할까요?</h2></header><p class="para" data-split="soft" data-units><span class="u">장 건강 이야기 끝에는 늘 긴 목록이 따라와요. </span><span class="u">운동 부족, 잠 부족, 술, 담배, 스트레스, 인스턴트, 설탕, 항생제. </span><span class="u">"여기 하나도 안 걸리는 사람은 없을 거예요"라는 말까지 들으면, 오히려 무엇부터 바꿔야 할지 막막해지지요. </span><span class="u">목록이 길수록 하나도 못 바꾸게 되는 게 사람 마음이에요. </span></p><p class="para" data-split="soft" data-units><span class="u">여기서는 목록 대신 세 가지만 골라, 각각이 장에 <strong>무엇을 하는지</strong>, 그리고 <strong>어디까지 확인됐는지</strong> 들여다봐요. </span><span class="u">겁을 주려는 게 아니라, 바꿀 하나를 고르기 위해서예요. </span></p><div class="story">회장님 이야기가 들어갈 자리</div><h3 class="h3" data-keep>잠: 이틀 밤 짧게 잤을 때</h3><p class="para" data-split="soft" data-units><span class="u">건강한 젊은 남성 9명이 이틀 밤을 새벽 3시 가까이 되어서야 잠들고 7시에 일어났어요. 하룻밤 4시간 남짓이에요. </span><span class="u">같은 사람이 푹 잔 이틀과 견주어 보니, 장 속 균 구성 가운데 몇 무리의 비율이 달라졌어요. </span><span class="u">그런데 균 구성 전체의 모양은 크게 달라지지 않았고, 짧은사슬지방산 양도 그대로였어요. </span><span class="u">같은 기간 몸이 인슐린에 반응하는 정도는 떨어졌는데, 이것도 균의 변화와는 관련이 없었어요. </span></p><p class="para" data-split="soft" data-units><span class="u">정리하면 이래요. </span><span class="u"><strong>잠이 짧으면 장 속 식구들도 조금 흔들려요. 다만 "며칠 잠이 짧으면 장이 망가진다"까지는 아니에요.</strong> </span><span class="u">아주 작고 짧은 연구여서, 오래 이어지는 잠 부족이 장에 무엇을 하는지는 아직 더 봐야 해요. </span></p><h3 class="h3" data-keep>장에도 하루 시계가 있어요</h3><p class="para" data-split="soft" data-units><span class="u">큰창자는 밤에 조용하고, 깰 때와 밥 먹은 뒤 크게 움직여요. </span><span class="u">쥐 연구에서는 장 속 균의 구성과 하는 일도 하루 동안 오르내렸고, 먹는 시간이 그 리듬을 맞추는 신호가 됐어요. </span><span class="u">먹는 시간이 뒤죽박죽이 되자 균의 리듬도 흐트러졌어요. </span><span class="u">사람에게서는 아주 적은 수를 살펴본 관찰까지라, 같은 일이 얼마나 일어나는지는 아직 몰라요. </span><span class="u">그래도 잠과 끼니가 장에게는 '하루 시계의 눈금'이라는 그림은 기억해 둘 만해요. </span></p><h3 class="h3" data-keep>단 음료: 장벽보다 먼저, 밥상 자리를 차지해요</h3><p class="para" data-split="soft" data-units><span class="u">과당을 많이 먹이면 장벽이 느슨해진다는 이야기는 쥐에서 본 결과였고, 사람의 짧은 연구에서는 달라지지 않았어요. </span><span class="u">그래서 단 음료를 보는 눈을 한 칸 옮겨 볼게요. </span></p><p class="para" data-split="soft" data-units><span class="u">과당·소르비톨이 든 음식은 큰창자에서 가스를 늘릴 수 있어요. </span><span class="u">과당은 작은창자에서 한꺼번에 많이 들이지 못해서, 단 음료를 한 번에 많이 마시면 남은 몫이 큰창자로 내려가기 쉬워요. </span><span class="u">그리고 단 음료 한 잔에는 장 속 식구들의 밥인 식이섬유가 거의 없어요. </span><span class="u">배는 부른데, 식구들 몫은 비어 있는 한 끼가 되는 거예요. </span></p><p class="para" data-split="soft" data-units><span class="u">같은 과당이라도 과일 한 쪽은 달라요. </span><span class="u">씹어 먹는 과일에는 식이섬유가 함께 있고, 과당이 한꺼번에 몰려 들어오지 않아요. </span></p><p class="para" data-split="soft" data-units><span class="u">2025년 한국인 영양소 섭취기준은 첨가당을 10% 이내로 제한하고, '가당음료의 섭취는 가능한 줄인다'는 문구를 더했어요. </span><span class="u">과일을 끊자는 뜻이 아니라, 마시는 단맛부터 줄이자는 뜻이에요. </span></p><h3 class="h3" data-keep>단맛을 뺀 음료라면 괜찮을까요</h3><p class="para" data-split="soft" data-units><span class="u">설탕 대신 단맛을 내는 감미료를 쓴 음료도 많아요. </span><span class="u">건강한 성인 120명에게 몇 가지 감미료를 2주 동안 먹게 한 연구에서, 장 속 균 구성이 달라지고, 일부 사람에게서는 식후 혈당 반응까지 달라졌어요. </span><span class="u">그런데 그 정도는 사람마다 달랐고, 장 속 균이 어떤가에 따라 갈렸어요. </span><span class="u">"제로라서 장에 아무 일도 없다"고도, "제로가 더 나쁘다"고도 아직 말할 수 없다는 뜻이에요. </span><span class="u">가장 단순한 답은 여전히 물과 보리차예요. </span></p><div class="fig" data-split="hard"><div class="fig-lab">그림 자리</div><p data-units><b>그림:</b> <span class="u">펼친 두 쪽에 걸친 저울 세 개 선 그림. </span><span class="u">왼쪽 저울: 달과 시계(새벽 3시) 한쪽, 작은 균 식구들 한쪽 — 저울이 살짝만 기울어 있음. </span><span class="u">가운데 저울: 단 음료 컵 한쪽, 잡곡·나물 밥공기 한쪽 — 컵이 밥공기 자리를 밀어냄, 컵 옆 작은 과일 한 쪽은 밥공기 쪽에 올라가 있음. </span><span class="u">오른쪽 저울: 술잔 여러 개 한쪽, 벽돌 담 한쪽 — 잔이 많을수록 벽돌 사이 모르타르가 가늘어짐(잔 하나일 땐 그대로). </span><span class="u">아래 작은 글씨 "한 번보다, 이어질 때". </span><span class="u">2장 끝 관계도와 같은 선·색. </span></p></div><h3 class="h3" data-keep>술: 장 위쪽에서 바로 들어와요</h3><p class="para" data-split="soft" data-units><span class="u">술은 주로 장 위쪽에서 그대로 스며들어요. 마신 지 한 시간 안에 장 속 알코올 농도가 높게 올라가요. </span><span class="u">장벽 세포는 간보다 먼저, 가장 높은 농도의 알코올을 만나는 자리예요. </span><span class="u">쥐에게 술을 먹이면 2주 만에 장벽 투과성이 높아졌고, 술을 오래 많이 마셔 온 사람에게서도 장벽 투과성이 높아진 것이 관찰됐어요. </span><span class="u">장 속 균의 균형이 흐트러지는 일도 함께 보고돼요. </span><span class="u">보통 수준으로 마시는 건강한 사람의 장벽 자료는, 이 책이 확인한 자료에서 찾지 못했어요. </span></p><p class="para" data-split="soft" data-units><span class="u">빈속에 마시면 알코올이 위를 빨리 지나 작은창자로 넘어가서, 더 빨리 흡수돼요. </span><span class="u">밥을 먼저 먹으면 위가 내려보내는 속도가 늦어져, 장에 닿는 알코올도 천천히 와요. </span><span class="u">"술자리 전에 밥부터"는 장 쪽에서 봐도 맞는 순서예요. </span></p><h3 class="h3" data-keep>셋이 만나는 자리</h3><p class="para" data-split="soft" data-units><span class="u">하루 리듬이 깨진 데 술이 겹치면 장벽 변화가 더 컸다는 연구가 있어요(사람은 관찰까지). </span><span class="u">늦게까지 마시면 잠이 짧아지고, 다음 날 아침을 거르고, 대신 단 음료로 버티게 되기 쉬워요. </span><span class="u">하나하나는 작아도, 한 밤에 셋이 겹치는 거예요. </span><span class="u"><strong>잠·단 음료·술은 하나씩보다, 겹치고 이어질 때 장을 더 지치게 해요.</strong> </span></p><div class="callout" data-split="hard"><div class="callout-lab">더 깊이</div><div data-units><p class="emph"><strong>"한 번쯤은 괜찮다"와 "매일"은 다른 이야기예요</strong></p><p class="para"><span class="u">이 꼭지에 나온 사람 연구를 다시 보면 공통점이 있어요. </span><span class="u">이틀 짧게 잔 것, 2주 동안 과당을 많이 먹은 것으로는 장벽이나 균 전체가 크게 달라지지 않았어요. </span><span class="u">변화가 분명하게 보인 쪽은 오래 많이 마셔 온 사람, 리듬이 오래 깨진 사람이었어요. </span><span class="u">장은 한 번의 실수보다, 날마다 겹치는 습관에 더 반응한다고 읽을 수 있어요. </span></p><p class="emph"><strong>늦은 밤 큰 한 끼는요?</strong></p><p class="para"><span class="u">늦은 시간에 많이 먹으면 속이 불편하고 잠도 얕아지기 쉬워요. </span><span class="u">다만 늦은 식사가 사람의 장벽이나 장 속 균에 무엇을 하는지는 이 책이 확인한 자료로는 아직 답을 찾지 못했어요. </span><span class="u">확인된 데까지는 "잠과 끼니가 장의 하루 시계 눈금"이라는 것까지예요. </span></p></div></div><h3 class="h3" data-keep>한눈에 보기: 세 가지 습관, 확인된 데까지</h3><table class="tbl" data-split="hard"><thead><tr><th>습관</th><th>사람에게서 본 것</th><th>동물에게서 본 것</th><th>바꿀 하나</th></tr></thead><tbody data-units><tr><td>짧은 잠</td><td>이틀 밤(9명): 균 일부 비율만 달라짐, 전체 모양은 그대로</td><td>하루 리듬이 깨지면 균 리듬도 흐트러짐</td><td>늦게 잔 날에도 다음 끼니 거르지 않기</td></tr><tr><td>단 음료</td><td>과당 2주(10명): 투과성 거의 그대로 / 감미료 2주(120명): 사람마다 다른 변화</td><td>과당 8주: 투과성 높아짐</td><td>하루 한 잔을 물·보리차로</td></tr><tr><td>술</td><td>오래 많이 마신 사람: 투과성 높아짐</td><td>2주 만에 투과성 높아짐</td><td>빈속에 마시지 않기, 다음 날 쉬기</td></tr></tbody></table><h3 class="h3" data-keep>자주 헷갈리는 질문</h3><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 주말에 몰아서 자면 장도 회복되나요?</strong> </span><span class="u">이틀 짧은 잠으로 본 변화가 작았던 것처럼, 잠과 장의 관계는 아직 짧은 연구가 대부분이에요. </span><span class="u">몰아 자기가 장에 무엇을 하는지는 이 책이 확인한 자료로는 알 수 없어요. </span><span class="u">잠의 길이보다 매일 비슷한 시간에 자고 일어나는 리듬을 먼저 챙겨 보세요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 과일도 과당인데 줄여야 하나요?</strong> </span><span class="u">국가 기준이 줄이자는 건 첨가당과 가당 음료예요. </span><span class="u">씹어 먹는 과일에는 식이섬유가 함께 있어서 단 음료와 같지 않아요. </span><span class="u">과일은 갈아 마시기보다 씹어 드셔 보세요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>Q. 술은 간만 힘들게 하는 것 아닌가요?</strong> </span><span class="u">술은 장 위쪽에서 먼저 흡수되고, 장벽과 장 속 균에도 닿아요. </span><span class="u">장벽 세포는 간보다 먼저 술을 만나는 자리예요. </span><span class="u">술과 간 이야기는 따로 공부해요. </span></p><h3 class="h3" data-keep>확인된 것 · 아직 모르는 것 · 흔한 오해</h3><p class="emph"><strong>확인된 것</strong></p><ul class="lst" data-split="soft" data-units><li>이틀 밤 짧은 잠에 장 속 균 구성 일부가 달라졌어요(9명).</li><li>술을 오래 많이 마신 사람에게서 장벽 투과성이 높아졌어요.</li><li>과당·소르비톨이 든 음식은 큰창자 가스를 늘릴 수 있어요.</li><li>빈속의 술은 더 빨리 흡수돼요.</li></ul><p class="emph"><strong>아직 모르는 것</strong></p><ul class="lst" data-split="soft" data-units><li>오래 이어지는 잠 부족이 사람의 장벽에 무엇을 하는지.</li><li>보통 수준의 술이 건강한 사람 장벽에 하는 일.</li><li>단 음료가 사람의 장벽을 직접 느슨하게 하는지 — 쥐에서는 그랬고, 사람의 작은 연구에서는 아니었어요.</li><li>감미료가 누구에게 어떤 변화를 일으키는지 미리 알 수 있는지.</li></ul><p class="emph"><strong>흔한 오해</strong></p><ul class="lst" data-split="soft" data-units><li>'며칠 잠이 짧으면 장이 망가진다' → 짧은 연구에서는 균 구성 전체의 모양이 크게 달라지지 않았어요.</li><li>"술은 간만 힘들게 한다" → 장 위쪽에서 먼저 흡수되고, 장벽과 장 속 균에도 닿아요.</li><li>"과일도 과당이니 끊어야 한다" → 국가 기준이 줄이자는 건 첨가당과 가당 음료예요.</li><li>"제로 음료는 장에 아무 일도 없다" → 사람마다 다른 변화가 보였어요. 아직 단정할 수 없어요.</li></ul><h3 class="h3" data-keep>밥상에서 해 볼 것</h3><ol class="lst" data-split="soft" data-units><li>오늘 마실 단 음료 한 잔을 물이나 보리차로 바꿔 보세요. 그 자리에 과일 한 쪽이나 나물 한 젓가락을 더해, 장 속 식구들 몫을 채워요.</li><li>술자리가 있는 날은 빈속에 마시지 말고 먼저 밥을 먹고, 잔 사이사이 물을 마셔요. 다음 날은 술 없이 쉬는 날로 두고, 늦게 잔 날일수록 다음 끼니를 거르지 않아요.</li><li>이번 주에는 세 가지 가운데 '하나만' 골라 보세요. 잠이든, 단 음료든, 술이든. 겹친 것을 하나만 풀어도 장의 하루가 덜 엉켜요.</li></ol><p class="para" data-split="soft" data-units><span class="u">술을 줄이기 어렵거나 간·장 질환으로 치료 중이면 담당 의사와 상의해 보세요. </span></p><div class="key" data-split="hard"><div class="key-lab">핵심 한 줄</div><p data-units><mark class="mk">장을 지치게 하는 건 한 번의 실수보다, 날마다 겹치는 습관이에요.</mark></p></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-4, 2-5, 2-6, 2-10, 3-2, 5-2, 14-1, 14-2, 11-12</p></article>
<article data-id="fig" data-short="한눈에 보는 그림"><header class="art-head" data-keep><div class="art-no">2장 끝</div><h2 class="art-title"><span class="kw">한눈에 보는 그림</span> 입에서 세포까지, 영양소가 들어오는 길</h2></header><p class="para" data-split="soft" data-units><span class="u">밥 한 숟가락이 내 몸이 되기까지, 2장에서 한 칸씩 따라 내려왔어요. </span><span class="u">이 두 쪽은 그 길을 한 장에 펼친 지도예요. </span></p><p class="para" data-split="soft" data-units><span class="u">영양소마다 들어오는 자리가 달라요. </span><span class="u">철은 작은창자 첫머리에서, 비타민B12는 작은창자 끝에서, 기름에 녹는 비타민은 쓸개즙을 만나야 들어와요. </span><span class="u">그래서 어느 한 자리가 힘들면, 그 자리에서 들어오던 영양소부터 모자라기 쉬워요. </span></p><p class="para" data-split="soft" data-units><span class="u"><strong>영양소를 공부할 때는 "무엇을 먹을까"와 함께 "어디로 들어올까"를 같이 물어봐요.</strong> </span><span class="u">영양소 이름이 헷갈리면, 이 지도로 돌아와 자리를 짚어 보세요. </span></p><div class="fig figgroup" data-split="soft"><div class="fig-lab">그림 자리 — 그림 설명 (펼친 두 쪽 전체)</div><div data-units><div class="fg-u"><p class="para"><span class="u"><strong>전체 모양</strong> — 왼쪽 쪽 위에서 오른쪽 쪽 아래로 흐르는 굵은 진초록 관 하나(입 → 항문). 관을 따라 정거장 6곳(번호 동그라미). 관 옆으로 두 갈래 길이 갈라져 나감: 진초록 '피 길'과 레몬 노랑 '림프 길'. 두 길은 오른쪽 쪽 위에서 다시 만나 '간'과 '세포' 그림으로 이어짐. 관 바깥 테두리에 작은 글씨 "관 속은 아직 바깥", 관 밖 몸 쪽에 "여기부터 몸 안". 정거장마다 말풍선 하나에 <strong>그 자리에서 일어나는 일 한 줄 + 들어오는 영양소 이름</strong>. 선·색은 2-1~2-11 그림과 같게(세이지 모눈, 진초록 선, 레몬 노랑 강조, 얼굴 없는 선 그림). </span></p></div><div class="fg-u"><p class="emph"><strong>① 입 — 부수기</strong></p><ul class="lst"><li>그림: 이와 숟가락.</li><li>말풍선: "꼭꼭 씹어 잘게 부숴요. 쪼개는 일의 첫 문."</li></ul></div><div class="fg-u"><p class="emph"><strong>② 위 — 녹이고 떼어 내기</strong></p><ul class="lst"><li>그림: 주머니 모양 위, 안에 작은 산 방울.</li><li>말풍선: "센 위산이 음식을 녹이고, 고기 속 비타민B12를 떼어 내요. 비타민B12가 나중에 들어갈 때 필요한 짝 단백질도 여기서 만들어요."</li></ul></div><div class="fg-u"><p class="emph"><strong>③ 작은창자 첫머리(샘창자) — 쓸개즙과 만나는 곳</strong></p><ul class="lst"><li>그림: 쓸개(작은 세제 병, 2-3 그림)와 췌장에서 관이 들어오는 모습.</li><li>말풍선: "쓸개즙이 기름을 잘게 풀어요. 기름과 쓸개즙이 함께 비타민을 싣는 작은 배를 만들어요. 철은 이 근처에서 많이 들어와요."</li><li>영양소 이름표: 철 · (배에 실리는) 비타민A·D·E · 베타카로틴</li></ul></div><div class="fg-u"><p class="emph"><strong>④ 작은창자 가운데 — 대부분이 들어오는 넓은 현관</strong></p><ul class="lst"><li>그림: 융모가 빽빽한 벽(2-4 그림을 작게).</li><li>말풍선: "포도당·아미노산·지방산, 대부분의 영양이 여기서 장벽을 넘어요. 엽산과 마그네슘도 이 길에서 들어와요. 칼슘은 작은창자 전체에서 조금씩 들어와요."</li><li>영양소 이름표: 탄수화물(포도당) · 단백질(아미노산) · 기름(지방산) · 엽산 · 마그네슘 · 칼슘(작은창자 전체)</li></ul></div><div class="fg-u"><p class="emph"><strong>⑤ 작은창자 끝(돌창자) — 마지막 문</strong></p><ul class="lst"><li>그림: 관이 좁아지며 큰창자로 꺾이는 곳.</li><li>말풍선: "위에서 짝을 만난 비타민B12가 여기서 들어와요. 비타민K도 기름 길로 이 끝에서 들어와요."</li><li>영양소 이름표: 비타민B12 · 비타민K · 마그네슘</li></ul></div><div class="fg-u"><p class="emph"><strong>⑥ 큰창자 — 식구들의 부엌</strong></p><ul class="lst"><li>그림: 굵은 관 속 작은 균 식구들(2-6 모양)이 식이섬유 실타래를 먹는 모습, 벽 쪽으로 물방울 화살표.</li><li>말풍선: "남은 물과 소금기를 거둬들여요. 우리가 못 쪼갠 식이섬유를 장 속 식구들이 발효해 짧은사슬지방산을 만들고, 장 세포가 그것을 에너지로 써요. 식구들은 비타민K 같은 물질도 만들어요."</li><li>영양소 이름표: 물 · 식이섬유 → 짧은사슬지방산 · 프로바이오틱스·프락토올리고당은 이곳 식구들과 이어짐</li></ul></div><div class="fg-u"><p class="emph"><strong>두 갈래 길 (관 옆)</strong></p><ul class="lst"><li>진초록 <strong>피 길</strong>: ③~⑤에서 "포도당·아미노산·물에 녹는 비타민·미네랄" 화살표 → 간문맥 → <strong>간</strong>(5장 그림과 같은 간). 작은 글씨 "핏줄로 들어온 것은 간부터 들러요."</li><li>레몬 노랑 <strong>림프 길</strong>: ③~⑤에서 "기름 알갱이 + 비타민A·D·E·K·베타카로틴" 화살표 → 가슴의 굵은 림프관 → 빗장뼈 아래 정맥에서 피와 만남. 작은 글씨 "기름 길은 림프를 돌아 피로 들어가요."</li><li>두 길이 만난 뒤 → <strong>세포</strong>(동그라미 집 모양): "쓰이는 문. 여기까지 와야 내 몸이 돼요."</li></ul></div><div class="fg-u"><p class="emph"><strong>관을 감싸는 띠 네 개 (관 바깥 테두리, 아주 작게)</strong></p><ul class="lst"><li>장벽: "세포 한 겹 + 이음매 + 점액 — 들일 것을 고르는 문"</li><li>면역 교실: "싸우지 않을 것을 배우는 곳"</li><li>장 속 식구: "밥상 따라 기우는 식구"</li><li>마음 길: 머리와 배를 잇는 가는 선 "긴장하면 소화가 뒤로 밀려요"</li></ul></div><div class="fg-u"><p class="emph"><strong>오른쪽 쪽 아래 — 이 지도 읽는 법 (작은 상자 3줄)</strong></p><ol class="lst"><li>정거장 번호는 먹은 것이 지나가는 순서예요.</li><li>이름표의 영양소는 "주로 그 자리에서 들어온다"는 뜻이에요. 다른 자리에서도 조금씩 들어올 수 있어요.</li><li>이 지도는 길을 보여 줄 뿐, 내 몸이 얼마나 흡수하는지 알려 주지는 않아요. 걱정되면 검사는 병원에서.</li></ol></div></div></div><p class="see"><b>함께 읽으면 좋은 꼭지</b> 2-1, 2-2, 2-3, 2-4, 2-5, 2-6, 4-1, 5-1, 11-2(비타민A·베타카로틴), 11-3(비타민B12·엽산), 11-5(비타민D), 11-6(비타민E·K), 11-7(칼슘·마그네슘), 11-8(철), 11-9(오메가3), 11-10(단백질), 11-11(프로바이오틱스), 11-12(식이섬유·프락토올리고당)</p></article>
</template>
<script>
(function(){
  "use strict";
  var KEY = "healthbook-ch2-page";
  var START_FOLIO = 27;
  var PW = 380, PH = 562;
  var src = document.getElementById("src");
  var book = document.getElementById("book");
  var bookbox = document.getElementById("bookbox");
  var stage = document.getElementById("stage");
  var countEl = document.getElementById("count");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var measure = document.getElementById("measure");
  var pages = [];      // {el, kind, folio, art}
  var artStart = {};   // 꼭지 id -> 쪽 순번
  var cur = 0;         // 지금 보이는 첫 쪽 순번
  var anchor = 0;      // 읽던 쪽 (펼친 두 쪽에서 맞춰 당기기 전)
  var spread = false;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function mkPage(kind){
    var p = document.createElement("div");
    p.className = "page " + kind;
    return p;
  }
  function fits(body){ return body.scrollHeight <= body.clientHeight + 0.5; }

  function newBodyPage(art){
    var p = mkPage("text");
    var run = document.createElement("div");
    run.className = "run";
    run.innerHTML = "<span><b>2장</b>" + escapeHtml(" \uc7a5") + "</span><span>" + escapeHtml(art.getAttribute("data-short")) + "</span>";
    var body = document.createElement("div");
    body.className = "pbody";
    var fol = document.createElement("div");
    fol.className = "folio";
    p.appendChild(run); p.appendChild(body); p.appendChild(fol);
    measure.appendChild(p);
    return {el:p, body:body, folioEl:fol};
  }
  function escapeHtml(s){ return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function unitBox(el){ return el.hasAttribute("data-units") ? el : el.querySelector("[data-units]"); }

  // 블록 하나를 page에 흘려 넣는다. 다 못 넣으면 남은 조각(복제본)을 돌려준다.
  function place(block, pg){
    pg.body.appendChild(block);
    if (fits(pg.body)) return null;
    var mode = block.getAttribute("data-split");
    var empty = pg.body.children.length === 1;
    if (!mode || (mode === "hard" && !empty)) {
      pg.body.removeChild(block);
      return empty ? "TOO_BIG" : block;
    }
    var box = unitBox(block);
    if (!box || box.children.length < 2) {
      pg.body.removeChild(block);
      return empty ? "TOO_BIG" : block;
    }
    // 조각 단위로 나누기
    var units = Array.prototype.slice.call(box.children);
    var rest = block.cloneNode(true);
    var restBox = unitBox(rest);
    while (box.firstChild) box.removeChild(box.firstChild);
    var placed = 0;
    for (var i = 0; i < units.length; i++) {
      box.appendChild(units[i]);
      if (!fits(pg.body)) { box.removeChild(units[i]); break; }
      placed++;
    }
    if (placed === 0) {
      pg.body.removeChild(block);
      return empty ? "TOO_BIG" : rest;
    }
    // 남은 조각
    var restUnits = Array.prototype.slice.call(restBox.children);
    for (var j = 0; j < placed; j++) restBox.removeChild(restUnits[j]);
    rest.classList.add("cont");
    if (restBox.tagName === "OL") {
      var st = parseInt(restBox.getAttribute("start") || "1", 10);
      restBox.setAttribute("start", st + placed);
    }
    return rest;
  }

  function paginate(){
    var keepArt = pages[anchor] && pages[anchor].art, keepOff = 0;
    if (keepArt) { keepOff = anchor - artStart[keepArt]; }
    pages = []; artStart = {};
    measure.innerHTML = "";
    // 표지·차례
    var cov = mkPage("kcover"); cov.innerHTML = src.content.querySelector("#cover-src").innerHTML;
    pages.push({el:cov, kind:"cover", folio:null, art:null});
    var toc = mkPage("tocp"); toc.innerHTML = src.content.querySelector("#toc-src").innerHTML;
    pages.push({el:toc, kind:"toc", folio:null, art:null});
    var folio = START_FOLIO;
    var arts = src.content.querySelectorAll("article");
    for (var a = 0; a < arts.length; a++) {
      var art = arts[a], id = art.getAttribute("data-id");
      var blocks = Array.prototype.slice.call(art.children).map(function(b){ return b.cloneNode(true); });
      var pg = newBodyPage(art);
      var artPages = [pg];
      artStart[id] = pages.length;
      var queue = blocks.slice();
      var guard = 0;
      while (queue.length && guard++ < 5000) {
        var b = queue.shift();
        if (b.classList.contains("brk")) {
          if (pg.body.children.length) { pg = newBodyPage(art); artPages.push(pg); }
          var sm = document.createElement("div"); sm.className = "side-mark"; sm.textContent = "· " + b.getAttribute("data-side") + " ·";
          pg.body.appendChild(sm);
          continue;
        }
        var r = place(b, pg);
        if (r === null) continue;
        if (r === "TOO_BIG") { // 빈 쪽에도 안 들어가는 블록: 그대로 두고 넘침 검사에서 드러나게
          pg.body.appendChild(b); pg = newBodyPage(art); artPages.push(pg); continue;
        }
        // 쪽 끝에 제목만 남지 않게 (뒤 글과 함께 다음 쪽으로)
        var carry = [];
        while (pg.body.lastElementChild && (pg.body.lastElementChild.hasAttribute("data-keep") || pg.body.lastElementChild.className === "side-mark") && pg.body.children.length > 1) {
          carry.unshift(pg.body.removeChild(pg.body.lastElementChild));
        }
        pg = newBodyPage(art); artPages.push(pg);
        queue = carry.concat([r], queue);
      }
      artPages.forEach(function(p){
        if (!p.body.children.length) return;
        p.folioEl.textContent = folio;
        pages.push({el:p.el, kind:"text", folio:folio, art:id});
        folio++;
      });
    }
    // 차례에 실제 쪽 번호
    pages.forEach(function(p){
      p.el.querySelectorAll && p.el.querySelectorAll("[data-pg]").forEach(function(s){
        var i = artStart[s.getAttribute("data-pg")];
        if (i != null) s.textContent = pages[i].folio;
      });
    });
    measure.innerHTML = "";
    if (keepArt && artStart[keepArt] != null) anchor = Math.min(artStart[keepArt] + keepOff, pages.length - 1);
    anchor = Math.min(anchor, pages.length - 1); cur = anchor;
  }

  function layout(){
    var w = stage.clientWidth, h = stage.clientHeight;
    var sTwo = Math.min(w / (PW * 2), h / PH);
    spread = sTwo >= 0.9 && w >= 700;
    var vw = spread ? PW * 2 : PW;
    var s = spread ? sTwo : Math.min(w / PW, h / PH);
    s = Math.max(0.3, Math.min(s, 1.8));
    book.style.transform = "scale(" + s + ")";
    book.style.width = vw + "px"; book.style.height = PH + "px";
    bookbox.style.width = Math.floor(vw * s) + "px";
    bookbox.style.height = Math.floor(PH * s) + "px";
    book.classList.toggle("spread", spread);
    cur = spread ? viewStart(anchor) : anchor;
    render();
  }
  // 펼친 두 쪽: [표지] 혼자, 그다음 (1,2) (3,4) ...
  function viewStart(i){ if (!spread || i === 0) return i; return i % 2 === 1 ? i : i - 1; }
  function viewPages(i){
    if (!spread) return [i];
    if (i === 0) return [0];
    return i + 1 < pages.length ? [i, i + 1] : [i];
  }
  function render(){
    book.innerHTML = "";
    var v = viewPages(cur);
    v.forEach(function(i, k){
      var el = pages[i].el;
      el.classList.remove("l", "r");
      if (spread && v.length === 2) el.classList.add(k === 0 ? "l" : "r");
      else if (spread) el.classList.add(i === 0 ? "r" : "l");
      book.appendChild(el);
    });
    if (spread && v.length === 1) { // 혼자 있는 쪽은 가운데
      book.style.justifyContent = "center";
    } else book.style.justifyContent = "flex-start";
    var first = pages[v[0]], last = pages[v[v.length - 1]];
    var label;
    if (first.kind === "cover") label = "표지";
    else if (first.kind === "toc") label = last.folio == null ? "차례" : "차례 · " + last.folio + "쪽";
    else label = (first.folio === last.folio ? first.folio : first.folio + "–" + last.folio) + "쪽";
    var n = v.map(function(i){return i + 1;});
    countEl.innerHTML = "<b>" + label + "</b> · " + (n.length > 1 ? n[0] + "–" + n[1] : n[0]) + " / " + pages.length;
    prevBtn.disabled = cur <= 0;
    nextBtn.disabled = v[v.length - 1] >= pages.length - 1;
    try {
      var pc = pages[anchor];
      localStorage.setItem(KEY, JSON.stringify({i:anchor, a:pc.art, o:pc.art ? anchor - artStart[pc.art] : 0}));
    } catch (e) {}
  }
  function go(target, dir){
    target = Math.max(0, Math.min(pages.length - 1, target));
    var shown = spread ? viewStart(target) : target;
    anchor = target;
    if (shown === cur) { render(); return; }
    if (!reduce) flipOut(dir || (shown > cur ? 1 : -1));
    cur = shown;
    render();
  }
  function step(dir){
    var v = viewPages(cur);
    if (dir > 0) go(v[v.length - 1] + 1, 1);
    else go(spread ? (cur <= 1 ? 0 : cur - 2) : cur - 1, -1);
  }
  function flipOut(dir){
    var kids = Array.prototype.slice.call(book.children);
    if (!kids.length) return;
    var src = dir > 0 ? kids[kids.length - 1] : kids[0];
    var c = src.cloneNode(true);
    c.classList.add("flip", dir > 0 ? "fwd" : "back");
    c.style.left = src.offsetLeft + "px";
    book.__flip && book.__flip.remove();
    book.__flip = c;
    setTimeout(function(){ book.appendChild(c); }, 0);
    var kill = function(){ c.remove(); };
    c.addEventListener("animationend", kill);
    setTimeout(kill, 600);
  }

  // 조작
  prevBtn.addEventListener("click", function(e){ e.stopPropagation(); step(-1); });
  nextBtn.addEventListener("click", function(e){ e.stopPropagation(); step(1); });
  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight" || e.key === "PageDown") { step(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { step(-1); e.preventDefault(); }
  });
  var tx = null, ty = 0, swipedAt = 0;
  stage.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) { tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:true});
  stage.addEventListener("touchend", function(e){
    if (tx == null) return;
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    tx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) { swipedAt = Date.now(); step(dx < 0 ? 1 : -1); }
  }, {passive:true});
  stage.addEventListener("click", function(e){
    if (Date.now() - swipedAt < 450) return; // 밀기 뒤 따라오는 눌림은 무시
    var g = e.target.closest && e.target.closest("[data-goto]");
    if (g) { var i = artStart[g.getAttribute("data-goto")]; if (i != null) go(i, 1); return; }
    var r = stage.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
    if (x < 0.4) step(-1); else if (x > 0.6) step(1);
  });
  window.addEventListener("resize", layout);

  // 검사용 (Playwright)
  window.__book = {
    count: function(){ return pages.length; },
    cur: function(){ return cur; },
    spread: function(){ return spread; },
    overflow: function(){ // 쪽마다 넘친 px (0이면 잘린 글 없음)
      var res = [];
      measure.innerHTML = "";
      pages.forEach(function(p, i){
        var el = p.el.cloneNode(true); measure.appendChild(el);
        var worst = 0;
        el.querySelectorAll(".pbody,.cover,.toc").forEach(function(b){
          worst = Math.max(worst, b.scrollHeight - b.clientHeight, b.scrollWidth - b.clientWidth);
        });
        res.push(worst);
        measure.removeChild(el);
      });
      return res;
    },
    folios: function(){ return pages.map(function(p){ return p.folio; }); },
    starts: function(){ return artStart; }
  };

  function start(){
    paginate();
    var saved = 0;
    try {
      var sv = JSON.parse(localStorage.getItem(KEY) || "null");
      if (sv && sv.a && artStart[sv.a] != null) {
        var nxt = null;
        for (var k in artStart) if (artStart[k] > artStart[sv.a] && (nxt == null || artStart[k] < nxt)) nxt = artStart[k];
        saved = Math.min(artStart[sv.a] + (sv.o || 0), (nxt == null ? pages.length : nxt) - 1);
      } else if (sv && typeof sv.i === "number") saved = sv.i;
    } catch (e) {}
    anchor = cur = Math.max(0, Math.min(saved, pages.length - 1));
    layout();
  }
  start();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function(){ paginate(); layout(); });
  }
})();
</script>
