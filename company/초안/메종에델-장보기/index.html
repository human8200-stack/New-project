<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EFE8DC">
<title>Maison Edel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* 메종에델 확정 색 + 부드러운 바탕 두 단계 */
  :root {
    --ivory: #F8F6F2;
    --beige: #E8DDCF;
    --taupe: #A89A8A;
    --olive: #6B7258;
    --charcoal: #3E3E3E;
    --white: #FFFFFF;
    --band: #EFE8DC;      /* 맨 위 띠: 베이지를 아이보리 쪽으로 */
    --page: #F3EFE8;      /* 페이지 바탕: 아이보리와 베이지 사이 */
    --olive-soft: #E6E8DF; /* 올리브를 아주 엷게 (D-day 꼬리표) */
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--charcoal); background: var(--page);
    font-family: "Gowun Batang", "Apple SD Gothic Neo", "Malgun Gothic", serif;
    font-size: 18px; line-height: 1.6; word-break: keep-all;
  }
  a { color: inherit; }
  .en { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; }

  /* 1. 맨 위 대가 표시 띠: 흘러가지 않고 한 번에 다 읽히게 (줄바꿈) */
  .band {
    position: sticky; top: 0; z-index: 5;
    background: var(--ivory); color: var(--olive);
    border-bottom: 1px solid var(--beige);
    padding: 7px 16px; text-align: center;
    font-size: 13.5px; font-weight: 700; line-height: 1.45;
  }

  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px 36px; }

  /* 이름 줄 */
  .head { display: flex; align-items: center; gap: 12px; padding: 18px 2px 14px; border-bottom: 1px solid var(--beige); }
  .mark { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--white);
          font-family: "Cormorant Garamond", Georgia, serif; font-style: normal; font-weight: 500; line-height: 1; letter-spacing: .02em; text-indent: .02em;
          border: 1.5px solid var(--olive); display: flex; align-items: center; justify-content: center;
          color: var(--olive); font-size: 22px; }
  .head .name { flex: 1; }
  .head .name b { display: block; font-size: 21px; line-height: 1.25; }
  .head .name span { font-size: 14px; color: var(--taupe); }

  .intro { text-align: center; padding: 18px 0 6px; }
  .intro p { margin: 0; }
  .intro .slogan { font-size: 18px; }
  .intro .ai { display: inline-block; margin-top: 10px; font-size: 14px; white-space: nowrap; color: var(--olive);
               background: var(--white); border: 1px solid var(--beige); border-radius: 999px; padding: 4px 14px; }

  /* 카드 공통: 흰 카드, 크게 둥근 모서리, 엷은 그림자 */
  .card { background: var(--white); border-radius: 28px; box-shadow: 0 6px 18px rgba(62,62,62,.07); }
  .stack { display: grid; gap: 14px; margin-top: 16px; }

  /* 요리별 장보기 */
  .shop-head { text-align: center; margin-top: 14px; }
  .shop-head h2 { font-size: 24px; margin: 0; }
  .shop-head .en { color: var(--taupe); font-size: 18px; margin: 0; }

  /* 요리 블록: 알약 모양 (왼쪽 동그란 작은 사진 + 가운데 요리 이름 + 오른쪽 ⌄), 누르면 아래로 재료 버튼이 펼쳐짐 */
  .dish { overflow: hidden; border-radius: 38px; }
  .dish[open] { border-radius: 28px; }
  .dish summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
                  min-height: 76px; padding: 8px 10px 8px 8px; -webkit-tap-highlight-color: transparent; }
  .dish summary::-webkit-details-marker { display: none; }
  .dish .thumb { flex: none; width: 60px; height: 60px; border-radius: 50%; overflow: hidden; background: var(--ivory); }
  .dish .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dish .tt { flex: 1; text-align: center; line-height: 1.3; }
  .dish .tt b { display: block; font-size: 18px; }
  .dish .sub { display: block; font-size: 14px; color: var(--taupe); }
  .dish .sub .ep { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; color: var(--olive); }
  .dish .sub .en { font-size: 15px; }
  .dish .chev { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--ivory); border: 1px solid var(--beige);
                display: flex; align-items: center; justify-content: center; color: var(--olive); transition: transform .25s ease; }
  .dish .chev svg { width: 22px; height: 22px; }
  .dish[open] .chev { transform: rotate(180deg); background: var(--olive); border-color: var(--olive); color: var(--white); }
  .dish .body { padding: 0 16px 18px; border-top: 1px solid var(--beige); }
  .dish .fee { margin: 12px 0 0; font-size: 14px; font-weight: 700; color: var(--olive); text-align: center;
               background: var(--olive-soft); border-radius: 999px; padding: 4px 12px; }
  .dish .say { margin: 10px 0 12px; font-size: 16px; text-align: center; }
  .items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .item { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
          min-height: 52px; padding: 6px 10px; border-radius: 999px;
          background: var(--ivory); border: 1px solid var(--beige);
          text-decoration: none; font-size: 17px; font-weight: 700; line-height: 1.25; }
  .items-empty { margin: 0; text-align: center; font-size: 15px; color: var(--taupe); }

  .dish .tt b .no { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; color: var(--olive);
                    background: var(--olive-soft); border-radius: 999px; padding: 1px 8px; margin-right: 6px; vertical-align: 2px; }
  .dish { scroll-margin-top: 80px; }
  .dish.flash { animation: flash 1.8s ease-out 1; }
  @keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px var(--olive), 0 6px 18px rgba(62,62,62,.07); } 100% { box-shadow: 0 6px 18px rgba(62,62,62,.07); } }
  .search { margin-top: 14px; }
  .search input { width: 100%; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--beige);
                  background: var(--white); color: var(--charcoal); font: inherit; font-size: 16px; outline: none; }
  .search input:focus { border-color: var(--olive); }
  .more { display: block; margin: 14px auto 0; min-height: 48px; padding: 0 26px; border-radius: 999px;
          border: 1px solid var(--olive); background: transparent; color: var(--olive); font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .none { text-align: center; color: var(--taupe); font-size: 15px; margin: 16px 0 0; }
  [hidden] { display: none !important; }
  @media (max-width: 340px) { .items { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- 1. 대가 표시 (쿠팡 파트너스 문장 원문 그대로, 맨 위에 늘 보이게) -->
<div class="band" role="note">[광고] 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>

<main class="wrap">

  <!-- 이름 줄 -->
  <header class="head">
    <div class="mark" aria-hidden="true">ME</div>
    <div class="name"><b>Maison Edel</b><span>메종 에델 · 에델의 식탁</span></div>
  </header>

  <div class="intro">
    <p class="slogan">햇살이 스며드는 주방, 계절을 요리하는 시간.</p>
    <p class="ai">영상은 AI, 레시피는 진짜</p>
  </div>

  <!-- 요리별 장보기 (페이지의 중심, 쿠팡 파트너스 링크가 있는 칸)
       요리 블록은 장보기-재료.js 의 요리 목록에서 저절로 만들어진다 (최신 요리가 맨 위) -->
  <section aria-labelledby="shop-title">
    <div class="shop-head">
      <h2 id="shop-title">🌿 요리별 장보기</h2>
      <p class="en">From my kitchen to your table</p>
    </div>
    <div class="search" id="search" hidden>
      <input type="search" id="q" placeholder="요리 이름이나 재료로 찾기" aria-label="요리 이름이나 재료로 찾기" autocomplete="off">
    </div>
    <div class="stack" id="dishes"></div>
    <p class="none" id="none" hidden>찾는 요리가 없어요.</p>
    <button type="button" class="more" id="more" hidden>더 보기</button>
  </section>


</main>
<script src="장보기-재료.js"></script>
<script>
  // 요리 블록과 재료 버튼은 장보기-재료.js 한 곳에서 읽어 만든다.
  // 쿠팡 링크가 비었거나 보이기가 꺼진 재료는 보이지 않는다.
  (function () {
    var FIRST = 8; // 처음에 보이는 요리 수, 이보다 많으면 검색 칸과 "더 보기"
    var dishes = (window.MAISON_EDEL_DISHES || []).slice().sort(function (x, y) { return (y.순서 || 0) - (x.순서 || 0); });
    var items = window.MAISON_EDEL_SHOP || [];
    var isLink = function (u) { return /^https:\/\//.test(u || ''); };
    var box = document.getElementById('dishes'), more = document.getElementById('more');
    var search = document.getElementById('search'), q = document.getElementById('q'), none = document.getElementById('none');
    var showAll = false, cards = [];
    var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    var chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

    dishes.forEach(function (d) {
      var mine = items.filter(function (i) { return i.요리 === d.요리 && i.보이기 !== false; })
                      .sort(function (x, y) { return (x.순서 || 0) - (y.순서 || 0); });
      var shown = mine.filter(function (i) { return isLink(i.링크); });
      var det = el('details', 'card dish'), sum = el('summary');
      var th = el('span', 'thumb');
      if (d.사진) { var img = el('img'); img.src = d.사진; img.alt = d.요리; img.loading = 'lazy'; th.appendChild(img); }
      var tt = el('span', 'tt'), tb = el('b');
      if (d.번호) tb.appendChild(el('span', 'no', 'No.' + d.번호));
      tb.appendChild(document.createTextNode(d.요리 + ' 장보기')); tt.appendChild(tb);
      if (d.번호) det.id = 'no-' + d.번호;
      var sub = el('span', 'sub'); if (d.EP) sub.appendChild(el('span', 'ep', d.EP)); if (d.영어) { sub.appendChild(document.createTextNode(' ')); sub.appendChild(el('span', 'en', d.영어)); }
      tt.appendChild(sub);
      var cv = el('span', 'chev'); cv.setAttribute('aria-hidden', 'true'); cv.innerHTML = chev;
      sum.appendChild(th); sum.appendChild(tt); sum.appendChild(cv); det.appendChild(sum);
      var body = el('div', 'body');
      body.appendChild(el('p', 'fee', '쿠팡 파트너스 링크 · 수수료를 받아요'));
      if (d.소개) body.appendChild(el('p', 'say', d.소개));
      if (!shown.length) { body.appendChild(el('p', 'items-empty', '재료 링크를 준비하고 있어요.')); }
      else {
        var ul = el('ul', 'items');
        shown.forEach(function (i) {
          var li = el('li'), a = el('a', 'item', i.이름);
          a.href = i.링크; a.target = '_blank'; a.rel = 'sponsored noopener';
          li.appendChild(a); ul.appendChild(li);
        });
        body.appendChild(ul);
      }
      det.appendChild(body);
      // 하나를 펼치면 다른 것은 접힌다
      det.addEventListener('toggle', function () { if (det.open) cards.forEach(function (c) { if (c.el !== det) c.el.open = false; }); });
      box.appendChild(det);
      cards.push({ el: det, no: String(d.번호 || ''), text: (d.요리 + ' ' + (d.영어 || '') + ' ' + mine.map(function (i) { return i.이름; }).join(' ')).toLowerCase() });
    });

    function draw() {
      var word = (q.value || '').trim().toLowerCase(), n = 0, hits = 0;
      var num = (word.match(/^(?:no\.?\s*|#)?(\d+)(?:번)?$/) || [])[1]; // "2", "No.2", "#2", "2번" → 번호로 찾기
      cards.forEach(function (c) {
        var hit = !word || (num ? c.no === num : c.text.indexOf(word) !== -1);
        if (hit) hits++;
        var show = hit && (word || showAll || n < FIRST);
        if (hit && !word) n++;
        c.el.hidden = !show;
        if (!show) c.el.open = false;
      });
      none.hidden = !(word && hits === 0);
      more.hidden = !!word || showAll || cards.length <= FIRST;
      if (!more.hidden) more.textContent = '더 보기 (' + (cards.length - FIRST) + '개)';
    }
    search.hidden = cards.length <= FIRST;
    q.addEventListener('input', draw);
    more.addEventListener('click', function () { showAll = true; draw(); });
    draw();

    // 주소 끝 #번호 (예: …/#2) → 그 요리를 펼치고 그 자리로 내려가 잠깐 올리브색 테두리로 반짝임. 없는 번호면 첫 화면 그대로
    function openFromHash() {
      var m = (location.hash || '').match(/^#(?:no-?)?(\d+)$/i); if (!m) return;
      var c = cards.filter(function (x) { return x.no === m[1]; })[0]; if (!c) return;
      if (c.el.hidden) { q.value = ''; showAll = true; draw(); }
      c.el.open = true;
      setTimeout(function () {
        c.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        c.el.classList.remove('flash'); void c.el.offsetWidth; c.el.classList.add('flash');
      }, 60);
    }
    window.addEventListener('hashchange', openFromHash);
    openFromHash();
  })();
</script>
</body>
</html>
