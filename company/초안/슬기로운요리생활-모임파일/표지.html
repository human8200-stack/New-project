<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슬기로운 요리생활 · 레시피 파일 표지</title>
<link rel="stylesheet" href="style.css">
<script>
  /* 휴대폰 미리보기에서 A4가 화면 폭에 맞게 보이도록 (인쇄 크기는 그대로) */
  (function () {
    function fit() {
      var a4 = 210 * 96 / 25.4;
      var z = Math.min(1, (document.documentElement.clientWidth - 12) / a4);
      document.documentElement.style.setProperty('--fit', z);
    }
    fit();
    window.addEventListener('resize', fit);
  })();
</script>
</head>
<body>
<main class="sheet cover">
  <div class="frame" aria-hidden="true"></div>

  <!-- 손그림풍 선 그림: 당근 · 냄비 · 허브 잎 -->
  <div class="art" aria-hidden="true">
    <svg class="carrot line-icon" viewBox="0 0 60 120">
      <path class="fill-soft" d="M18 42 Q30 34 42 42 Q38 78 31 111 Q29 113 28 110 Q22 78 18 42 Z"/>
      <path d="M22 58 h6 M32 70 h6 M25 84 h5 M31 96 h4"/>
      <path class="leaf" d="M30 38 Q22 22 13 14 M30 38 Q30 20 31 6 M30 38 Q38 22 47 15"/>
    </svg>

    <svg class="pot line-icon" viewBox="0 0 200 160">
      <path class="leaf" d="M78 44 q-7 -8 0 -16 q7 -8 0 -16 M100 40 q-7 -8 0 -16 q7 -8 0 -16 M122 44 q-7 -8 0 -16 q7 -8 0 -16"/>
      <circle cx="100" cy="60" r="6"/>
      <path d="M50 80 Q100 50 150 80"/>
      <path d="M42 80 H158"/>
      <path class="fill-soft" d="M46 84 H154 V124 Q154 145 133 145 H67 Q46 145 46 124 Z"/>
      <path d="M46 96 H31 Q24 96 24 102 Q24 108 31 108 H46 M154 96 H169 Q176 96 176 102 Q176 108 169 108 H154"/>
      <path class="accent" d="M64 106 H136" stroke-dasharray="1 7"/>
    </svg>

    <svg class="sprig line-icon" viewBox="0 0 60 120">
      <path class="leaf" d="M30 116 Q30 70 32 10"/>
      <path class="leaf" d="M31 90 Q14 84 10 66 Q26 68 31 86 M31 90 Q48 82 51 64 Q35 68 31 86"/>
      <path class="leaf" d="M31 60 Q16 54 14 38 Q28 41 31 56 M31 60 Q46 52 48 36 Q34 41 31 56"/>
      <path class="leaf" d="M32 30 Q22 24 22 12 Q31 16 32 27 M32 30 Q42 24 42 12 Q33 16 32 27"/>
    </svg>
  </div>

  <p class="en">Smart Cooking Life</p>
  <h1 class="title">슬기로운 <span class="accent">요리생활</span></h1>
  <p class="subtitle">레시피 파일</p>

  <svg class="divider line-icon" viewBox="0 0 240 16" aria-hidden="true" preserveAspectRatio="none">
    <path d="M4 8 Q34 2 64 8 T124 8 T184 8 T236 8" class="leaf"/>
  </svg>

  <p class="tagline">한 장씩 모으는, 우리 집 요리 이야기</p>

  <p class="owner">이 파일의 주인 <span class="blank"></span></p>

  <p class="foot">당근 모임 「슬기로운 요리생활」</p>
</main>
</body>
</html>
