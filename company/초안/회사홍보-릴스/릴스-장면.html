<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회사 소개 릴스 — 장면 (코드 영상, 11판, 38.8초)</title>
<!--
  회사 소개 릴스 11판 (2026-11-02) — 10판에서 조직도 고객지원본부에 "암웨이팀" 상자 하나만 더함 (회장님 지시). 나머지는 10판과 같음.
  회사 소개 릴스 10판 (2026-11-02) — 설계: 콘티-10판.md 3장 (디자인팀)
  - 10판: 장면마다 시계가 따로 있음 (script 아래쪽 CLOCK). 아래 CSS·CAPTIONS·data-s/e 숫자는 "코드 시각"이고,
    영상 시각으로 바꾸는 법과 장면이 보이는 영상 구간은 CLOCK·SHOW 에 있습니다. 조직도는 첫 화면 바로 뒤(영상 3.3~7.7초).
  - 자막 문구는 아래 <script> 맨 위 CAPTIONS 한곳에만 있습니다. 바꾸면 node 녹화.js 로 다시 뽑습니다.
    (긴 줄은 화면 폭에 맞게 글씨가 저절로 줄어듭니다. 한 화면 2줄까지)
  - 흐름: 첫 화면 → 조직도 → 할 일 쌓임 → 정신없음 → 진짜 이유 → 레시피·알림 → 하는 일 9장 → 핵심 문장 → 끝 장면(그 사람이 창가에서 차 한 모금)
  - 장면 1~5는 한 책상(#sPile) 안에서 이어짐. 물건이 사라지지 않고 계속 쌓이다가 5번에서 흐려짐. 조직도 동안 책상 시간은 멈춤.
  - 조직도: 나 → 사장(AI)(옆에 사장실·기획팀) → 본부 4개 → 본부별 팀 이름. 11판부터 고객지원본부에 "암웨이팀"(화면에 "사업"이라는 말은 넣지 않음). 객원멤버는 넣지 않음. 숫자·회사 이름 없음.
  - 사람은 뒷모습과 손만. 얼굴 없음. 사람 이름·날짜·제품 이름·로고 없음 (달력은 칸만, 숫자 없음).
  - 장면 바꿈 길이: script 의 SHOW (들어올 때·나갈 때 초). 대부분 0.4, 핵심 문장 → 끝 장면은 0.8 (천천히 겹쳐 바뀜).
  - 화면이 멈추지 않게: 모든 장면이 천천히 다가가고(조금씩 커짐), 장면마다 계속 움직이는 것(깜빡임·하트·김·햇살)이 있음.
  - 글꼴: Pretendard (SIL Open Font License 1.1, 상업용 무료) — fonts/ 폴더
  - 1080×1920, 38.8초. 브라우저에서 열면 그대로 재생됨. 녹화는 녹화.js 가 seek(ms)로 한 장씩 찍음.
  - 10판: 릴스-장면-10판.html / 릴스-미리보기-10판.mp4 / 릴스-게시용-10판.mp4 (38.8초, 고객지원본부에 DM·댓글팀만 있음)
  - 이전 판: 릴스-장면-9판.html / 릴스-미리보기-9판.mp4 / 릴스-게시용-9판.mp4 (37.6초, 조직도가 진짜 이유 뒤, 하는 일 그림 6장)
           릴스-장면-8판.html / 릴스-미리보기-8판.mp4 / 릴스-게시용-8판.mp4 (37.4초, 7·8번 따로, 끝에 "보여 드릴게요")
           릴스-장면-7판.html / 릴스-미리보기-7판.mp4 / 릴스-게시용-7판.mp4 (37.4초, 설거지 있음)
           릴스-장면-6판.html / 릴스-미리보기-6판.mp4 / 릴스-게시용-6판.mp4 (35.7초)
-->
<style>
@font-face { font-family: "Pretendard"; font-weight: 500; src: url("fonts/Pretendard-Medium.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 700; src: url("fonts/Pretendard-Bold.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 800; src: url("fonts/Pretendard-ExtraBold.woff2") format("woff2"); }

:root{
  --cream:#F7EFE3; --cream2:#FBF6EE; --brown:#4A3428; --brown2:#7A5440;
  --terra:#C9785A; --sage:#8FA58A; --mustard:#D9A64E; --wood:#B98B66; --sky:#7FA7BC;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#222;}
body{font-family:"Pretendard",sans-serif;color:var(--brown);overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--cream);transform-origin:0 0}
.scene{position:absolute;inset:0;opacity:0;transform-origin:50% 55%}
.abs{position:absolute}
#stage *{animation-play-state:paused !important}

/* 자막 (내용은 script 의 CAPTIONS) */
.cap{position:absolute;left:0;right:0;top:250px;text-align:center;font-weight:800;font-size:86px;
  line-height:1.3;letter-spacing:-0.02em;color:var(--brown);z-index:20}
.cap span{display:inline-block;white-space:nowrap}
@keyframes capIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes capOut{from{opacity:1}to{opacity:0;transform:translateY(-20px)}}

/* 공통 움직임 */
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes tap{0%{opacity:0;transform:scale(1.6)}30%{opacity:.85;transform:scale(1)}60%{opacity:.85;transform:scale(.85)}100%{opacity:0;transform:scale(1.3)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes cupIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0)}20%{opacity:.6}100%{opacity:0;transform:translateY(-420px)}}

/* 휴대폰 */
.phone{position:absolute;width:300px;height:620px;border-radius:46px;background:#2E2622;padding:12px;
  box-shadow:0 30px 60px rgba(74,52,40,.25)}
.phone .screen{position:relative;width:100%;height:100%;border-radius:36px;background:var(--cream2);overflow:hidden}
.phone .screen > *:not(.notch){filter:blur(1.6px)}
.phone .screen > .sbar{filter:none}
.phone .notch{position:absolute;top:22px;left:50%;width:84px;height:22px;margin-left:-42px;border-radius:12px;background:#2E2622;z-index:5}
.dot{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.55);
  border:6px solid rgba(255,255,255,.9);box-shadow:0 0 0 4px rgba(74,52,40,.25);z-index:12}
.spark{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;background:var(--terra);
  animation:sparkGo .45s ease-in-out var(--d) both}
@keyframes sparkGo{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.menuRow{position:absolute;left:18px;right:18px;height:96px;border-radius:20px;background:#fff;box-shadow:0 4px 10px rgba(74,52,40,.08)}
.menuRow b{position:absolute;left:14px;top:14px;width:68px;height:68px;border-radius:50%;background:var(--c)}
.menuRow i{position:absolute;left:98px;top:28px;height:16px;border-radius:8px;background:#D9C6B1}
.menuRow u{position:absolute;left:98px;top:56px;width:70px;height:12px;border-radius:6px;background:#EADCCB}

/* 손글씨 잉크 (pathLength 900 이면 펜과 같은 빠르기로 그려짐) */
.ink{fill:none;stroke:#7A5440;stroke-width:9;stroke-linecap:round;stroke-dasharray:900;animation:ink var(--t) linear var(--d) both}
@keyframes ink{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}

/* ---------- 장면 1~5: 한 책상 (#sPile) ---------- */
#sPile, #pileAll{background:linear-gradient(#EFE2D0 0,#EADBC6 1150px,var(--wood) 1150px,#A97C59 1920px)}
#pileAll{position:absolute;inset:0;animation:jitter .18s linear 10.0s 6, pileBlur .8s ease-in-out 12.6s both}
@keyframes jitter{0%,100%{transform:none}25%{transform:translate(3px,-2px)}75%{transform:translate(-3px,2px)}}
@keyframes pileBlur{from{filter:blur(0)}to{filter:blur(14px)}}
#pileAll .deskEdge{position:absolute;left:0;right:0;top:1150px;height:18px;background:#C89D78}
.note{position:absolute;width:210px;height:150px;border-radius:10px;padding:22px 18px;font-weight:700;font-size:32px;white-space:nowrap;
  color:#5A4033;box-shadow:0 8px 16px rgba(60,40,25,.22);transform:rotate(var(--r));
  animation:noteDrop .5s cubic-bezier(.2,.8,.3,1.1) var(--d1) both}
.note i{display:block;height:8px;border-radius:4px;background:rgba(90,64,51,.18);margin-top:14px;width:80%}
.note i+i{width:55%}
@keyframes noteDrop{from{opacity:0;transform:translate(0,-900px) rotate(calc(var(--r) + 40deg))}to{opacity:1;transform:rotate(var(--r))}}
/* 2번: 검색창 */
.sbar{position:absolute;left:16px;right:16px;top:62px;height:80px;border-radius:40px;background:#fff;z-index:4;
  box-shadow:0 4px 10px rgba(74,52,40,.10)}
.sbar .sd{position:absolute;top:33px;width:14px;height:14px;border-radius:50%;background:var(--brown2);animation:blink .6s ease-in-out var(--d) infinite both}
#results{position:absolute;left:0;right:0;top:160px;bottom:0;overflow:hidden}
#resultsIn{position:absolute;left:0;right:0;top:0;height:880px;animation:scrollUp 2.6s linear 2.9s both}
@keyframes scrollUp{from{transform:none}to{transform:translateY(-430px)}}
/* 2번: A4 종이 3장 */
.a4w{position:absolute;width:300px;height:424px;transform:rotate(var(--r))}
.a4{position:absolute;inset:0;background:#fff;border-radius:6px;box-shadow:0 10px 24px rgba(74,52,40,.18)}
.a4 .tl{position:absolute;left:34px;height:12px;border-radius:6px;background:#E3D6C6}
@keyframes paperDrop{from{opacity:0;transform:translateY(-90px) scale(1.05)}to{opacity:1;transform:none}}
#a4Away{transform-box:view-box;animation:handAway .4s ease-in 5.0s both}
@keyframes handAway{from{transform:none;opacity:1}to{transform:translate(900px,700px);opacity:0}}
#a4Pen{transform-box:view-box;animation:writeA4 1.1s linear 3.9s both}
@keyframes writeA4{0%{transform:translate(60px,200px)}45%{transform:translate(470px,200px)}55%{transform:translate(60px,290px)}100%{transform:translate(400px,290px)}}
/* 3번: 선반 + 달력 */
.ticket{position:absolute;width:80px;height:50px;background:#FFF1BF;border-radius:6px;box-shadow:0 4px 8px rgba(60,40,25,.18);
  transform:rotate(var(--r));animation:fadeIn .3s ease-out var(--d) both}
/* 4번: 뒷모습 사람 */
#figure{position:absolute;left:240px;top:1180px;width:600px;height:760px;animation:riseUp .6s cubic-bezier(.2,.8,.3,1) 9.6s both}
@keyframes riseUp{from{transform:translateY(760px)}to{transform:none}}
#arm{transform-box:view-box;transform-origin:470px 520px;animation:armUp .6s ease-out 10.3s both}
@keyframes armUp{from{transform:rotate(55deg);opacity:0}to{transform:none;opacity:1}}
#head{transform-box:view-box;transform-origin:300px 420px;animation:sigh 1.2s ease-in-out 10.8s both}
@keyframes sigh{0%{transform:none}50%{transform:rotate(-7deg) translateY(10px)}100%{transform:rotate(-5deg) translateY(8px)}}
/* 5번: 흐려지고 크림색 막 + 빛 + 하트 */
#veil{position:absolute;inset:0;background:var(--cream);animation:veilOn .8s ease-in-out 12.6s both}
@keyframes veilOn{from{opacity:0}to{opacity:.72}}
#whyGlow{position:absolute;left:190px;top:800px;width:700px;height:700px;border-radius:50%;
  background:radial-gradient(#FFF8EC 0,rgba(255,248,236,0) 70%);animation:glowIn 1s ease-out 12.9s both}
@keyframes glowIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#whyHeart{position:absolute;left:490px;top:1100px;width:100px;height:100px;animation:pop .6s ease-out 13.4s both}
#whyHeart path{transform-box:fill-box;transform-origin:50% 50%;animation:beat 1.2s ease-in-out 14.0s infinite both}

/* ---------- 장면 6: 조직도 ---------- */
#sOrg{background:var(--cream)}
.orgc{position:absolute;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 24px rgba(74,52,40,.2)}
.ln{position:absolute;background:#CDB8A2;border-radius:4px}
.ln.v{width:8px;transform-origin:50% 0;animation:growY .3s ease-out var(--d) both}
.ln.h{height:8px;transform-origin:50% 50%;animation:growX .4s ease-out var(--d) both}
@keyframes growY{from{transform:scaleY(0)}to{transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:none}}
.hq{position:absolute;width:248px;height:96px;border-radius:24px;font-weight:800;font-size:36px;color:#fff;
  display:flex;align-items:center;justify-content:center;letter-spacing:-0.02em;
  animation:fadeIn .25s ease var(--d0) both, lightUp .35s ease-out var(--d) both}
@keyframes lightUp{from{background:#EADFD1;color:#BCAB9B;transform:scale(1)}60%{transform:scale(1.07)}to{background:var(--c);color:#fff;transform:scale(1);box-shadow:0 8px 16px rgba(74,52,40,.18)}}
.tm{position:absolute;width:248px;height:78px;border-radius:18px;background:#fff;border:4px solid var(--c);
  font-weight:800;font-size:31px;letter-spacing:-0.03em;color:var(--brown);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 12px rgba(74,52,40,.10);animation:slideDown .4s cubic-bezier(.2,.8,.3,1.1) var(--d) both}
@keyframes slideDown{from{opacity:0;transform:translateY(-60px)}to{opacity:1;transform:none}}

/* ---------- 장면 7: 레시피 → A4 한 장 ---------- */
#s2{background:var(--cream)}
.pick{position:absolute;left:14px;right:14px;height:104px;border-radius:24px;border:6px solid var(--terra);opacity:0;animation:pickOn .4s ease-out var(--d) both}
@keyframes pickOn{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
#printer{position:absolute;left:460px;top:1020px;width:560px;height:240px}
#pled{animation:blink 1s ease-in-out 20.8s infinite both}
#paperBox{position:absolute;left:520px;top:1200px;width:440px;height:620px;overflow:hidden}
#paper{position:absolute;left:20px;top:0;width:400px;height:566px;background:#fff;border-radius:6px;
  box-shadow:0 10px 24px rgba(74,52,40,.18);animation:printOut 1.2s cubic-bezier(.3,.1,.3,1) 21.0s both}
@keyframes printOut{from{transform:translateY(-575px)}to{transform:none}}
#paper .ttl{position:absolute;left:0;right:0;top:34px;text-align:center;font-weight:800;font-size:38px;color:var(--brown)}
#paper .blurz{position:absolute;inset:100px 30px 30px;filter:blur(2.4px)}
#paper .fd{position:absolute;left:110px;top:6px;width:120px;height:120px;border-radius:50%;background:#F1D9B5}
#paper .fd::before{content:"";position:absolute;inset:14px;border-radius:50%;background:#C98B52}
#paper .tl{position:absolute;left:0;height:14px;border-radius:7px;background:#D9C6B1}
.shine{position:absolute;width:60px;height:60px;background:#EBC57A;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  animation:twinkle 1.4s ease-in-out var(--d) infinite both}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}

/* ---------- 장면 7 위쪽: 알림 팝업 3개 (글자 없이 아이콘 + 흐린 줄 + 체크) ---------- */
.popc{position:absolute;left:150px;width:660px;height:132px;border-radius:32px;background:#fff;z-index:10;
  box-shadow:0 18px 36px rgba(74,52,40,.22);display:flex;align-items:center;gap:22px;padding:0 100px 0 26px;
  font-weight:800;font-size:38px;letter-spacing:-0.02em;color:var(--brown);white-space:nowrap;
  transform-origin:20% 50%;animation:popUp .5s cubic-bezier(.2,.9,.3,1.3) var(--d) both}
@keyframes popUp{from{opacity:0;transform:translateY(40px) scale(.7)}to{opacity:1;transform:none}}
.popc .ic{flex:none;width:84px;height:84px;border-radius:22px;background:#F4ECE1;display:flex;align-items:center;justify-content:center}
.chk{position:absolute;right:26px;top:38px;width:56px;height:56px;border-radius:50%;background:var(--sage);
  display:flex;align-items:center;justify-content:center;animation:pop .4s ease-out var(--d) both}
.popc .bl{display:flex;flex-direction:column;gap:16px}
.popc .bl i{display:block;width:280px;height:18px;border-radius:9px;background:#D9C6B1}
.popc .bl u{display:block;width:180px;height:14px;border-radius:7px;background:#EADCCB}

/* ---------- 장면 8: 스쳐 가는 일들 (그림 9장이 0.4~0.5초마다 옆으로 휙) ---------- */
#sMix{background:var(--cream)}
#mixGlow{position:absolute;left:160px;top:770px;width:760px;height:760px;border-radius:50%;
  background:radial-gradient(#FBF6EE 0,#FBF6EE 55%,rgba(251,246,238,0) 70%)}
#mixStrip{position:absolute;left:0;top:0;width:9720px;height:1920px;animation:mixSwipe 3.25s 24.85s both}
@keyframes mixSwipe{
  0%{transform:none;animation-timing-function:ease-out}
  4.615%,13.846%{transform:translateX(-1080px);animation-timing-function:ease-out}
  18.462%,29.231%{transform:translateX(-2160px);animation-timing-function:ease-out}
  33.846%,43.077%{transform:translateX(-3240px);animation-timing-function:ease-out}
  47.692%,55.385%{transform:translateX(-4320px);animation-timing-function:ease-out}
  60%,67.692%{transform:translateX(-5400px);animation-timing-function:ease-out}
  72.308%,80%{transform:translateX(-6480px);animation-timing-function:ease-out}
  84.615%,95.385%{transform:translateX(-7560px);animation-timing-function:ease-out}
  100%{transform:translateX(-8640px)}}
.mp{position:absolute;top:0;width:1080px;height:1920px}
.msh{box-shadow:0 10px 24px rgba(74,52,40,.18)}

/* ---------- 장면 9: 손글씨 카드 + 핵심 문장 ---------- */
#sCore{background:radial-gradient(800px 800px at 540px 960px,#FFF8EC 0,var(--cream) 70%)}
#cardWrap{position:absolute;left:200px;top:1020px;width:680px;height:420px;transform-origin:0 0;z-index:9;
  animation:cardIn .6s cubic-bezier(.2,.8,.3,1) 27.5s both}
@keyframes cardIn{from{opacity:0;transform:translateY(80px) rotate(-2deg)}to{opacity:1;transform:rotate(-2deg)}}
#penHand{transform-box:view-box;animation:write 1.8s linear 27.9s both}
@keyframes write{0%{transform:translate(60px,120px)}35%{transform:translate(540px,120px)}40%{transform:translate(60px,205px)}
  75%{transform:translate(420px,205px)}80%{transform:translate(500px,300px)}100%{transform:translate(560px,300px)}}
.fh{position:absolute;width:44px;height:44px;opacity:0;animation:floatUp 3.2s ease-in-out var(--d) infinite both}

/* ---------- 장면 10: 끝 식탁 ---------- */
#s5{background:radial-gradient(900px 700px at 180px 380px,#FFF6E6 0,rgba(255,246,230,0) 70%),linear-gradient(#F3E6D4 0,#EEDDC7 1120px,#C69A72 1120px,#B3845E 1920px)}
#s5 .runner{position:absolute;left:150px;right:150px;top:1120px;bottom:0;background:#F6EEE2;box-shadow:inset 0 0 0 10px rgba(201,120,90,.15)}
#s5 .edge{position:absolute;left:0;right:0;top:1120px;height:16px;background:#D3AA84}
#table{position:absolute;inset:0}
.cup{position:absolute;animation:cupIn .6s cubic-bezier(.2,.8,.3,1) var(--d) both}
.steam{animation:steam 2.4s ease-in-out var(--d) infinite both}
@keyframes steam{0%{opacity:0;transform:translateY(20px)}35%{opacity:.75}100%{opacity:0;transform:translateY(-90px)}}
/* 창문 (벽 왼쪽 아래, 빛이 들어오는 곳) */
#win{position:absolute;left:60px;top:870px;width:320px;height:250px;border-radius:12px;background:#FFF6E6;border:14px solid var(--cream2);
  box-shadow:0 0 0 3px #E2D2BC,inset 0 0 0 3px #E2D2BC,0 6px 14px rgba(74,52,40,.10)}
#win::before{content:"";position:absolute;left:0;right:0;top:50%;height:12px;margin-top:-6px;background:var(--cream2);box-shadow:0 0 0 2px #E2D2BC}
#win::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:12px;margin-left:-6px;background:var(--cream2);box-shadow:0 0 0 2px #E2D2BC}
/* 햇살 2줄 (창문에서 사람 쪽으로 비스듬히) */
.sun{position:absolute;inset:0;background:rgba(255,246,230,.45);mix-blend-mode:screen;
  animation:fadeIn 1.2s ease-in-out 31.6s both, sunBreath 4s ease-in-out 32.8s infinite}
@keyframes sunBreath{0%,100%{opacity:1}50%{opacity:.7}}
#saucer{position:absolute;left:565px;top:1690px;width:170px;height:44px}
/* 차 마시는 사람 (뒷모습, 얼굴 없음). svg 좌표 기준 */
#sipper{position:absolute;left:120px;top:1232px;width:608px;height:688px;overflow:visible}
#sipBody{transform-box:view-box;transform-origin:300px 860px;animation:exhale 1s ease-out 31.8s both}
@keyframes exhale{from{transform:translateY(-16px) scaleY(1.03)}to{transform:none}}
#sipHead{transform-box:view-box;transform-origin:300px 420px;animation:headSip 1.3s ease-in-out 34.3s both}
@keyframes headSip{0%{transform:none}53.85%{transform:rotate(4deg)}100%{transform:none}}
/* 팔: 위팔(어깨 435,540 기준) → 아래팔(팔꿈치 468.8,686.1 기준) → 손·찻잔(손 625,578 기준, 찻잔은 늘 바로 서게)
   33.4 들어 올림(0.9) → 34.3 한 모금(0.7, 찻잔 -12°) → 35.0 내려놓기(0.8) → 35.8 받침에 톡 */
#armUp{transform-box:view-box;transform-origin:435px 540px;animation:armLift 2.4s 33.4s both}
@keyframes armLift{0%{transform:none;animation-timing-function:ease-in-out}37.5%,66.667%{transform:rotate(-103.5deg);animation-timing-function:ease-in-out}100%{transform:none}}
#armFore{transform-box:view-box;transform-origin:468.8px 686.1px;animation:foreLift 2.4s 33.4s both}
@keyframes foreLift{0%{transform:none;animation-timing-function:ease-in-out}37.5%,66.667%{transform:rotate(-6deg);animation-timing-function:ease-in-out}100%{transform:none}}
#cupKeep{transform-box:view-box;transform-origin:625px 578px;animation:cupKeep 2.4s 33.4s both}
@keyframes cupKeep{0%{transform:none;animation-timing-function:ease-in-out}37.5%{transform:rotate(109.6deg);animation-timing-function:ease-in-out}
  66.667%{transform:rotate(97.6deg);animation-timing-function:ease-in-out}100%{transform:none}}
#cupSettle{transform-box:view-box;animation:settle .25s ease-out 35.8s both}
@keyframes settle{0%{transform:translateY(-6px)}60%{transform:translateY(2px)}100%{transform:none}}
#handleRow{position:absolute;left:0;right:0;top:560px;text-align:center;z-index:20}
#handle{display:inline-block;height:96px;line-height:88px;padding:0 44px;border-radius:48px;background:#FFFBF4;border:4px solid var(--terra);
  font-weight:800;font-size:56px;letter-spacing:-0.01em;color:var(--brown);animation:handleIn .5s ease-out 33.3s both}
@keyframes handleIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="stage">

  <!-- 장면 1·3~6 (코드 0~15.6초 / 영상 0~3.3, 7.7~20.6초. 조직도 동안 코드 2.7초에서 멈춤): 한 책상 — 쪽지 → 검색·옮겨 적기 → 선반·달력 → 정신없음 → 흐려지고 진짜 이유 -->
  <section class="scene" id="sPile" data-s="0" data-e="15.6">

      <div class="a4w" style="left:660px;top:1300px;--r:-4deg">

          <svg class="abs" style="left:0;top:0;overflow:visible" width="300" height="424" viewBox="0 0 545 770">
            <path class="ink" pathLength="900" style="--d:3.9s;--t:.5s" d="M60 200 c35 -30 70 30 105 0 s70 -30 105 0 s70 30 105 0 s70 -30 100 0"/>

        <div class="abs" style="inset:0;animation:cupIn .5s cubic-bezier(.2,.8,.3,1) 3.6s both">

            <g id="a4Away"><g id="a4Pen">
              <g transform="rotate(35)"><rect x="-7" y="-170" width="14" height="154" rx="6" fill="#7A5440"/><path d="M-7 -16 L7 -16 L0 0 Z" fill="#4A3428"/></g>
              <ellipse cx="62" cy="-78" rx="58" ry="46" fill="#E5C09D"/>

  </section>

  <!-- 장면 2 (코드 15.6~20초 / 영상 3.3~7.7초): 조직도 — 나 → 사장(AI) → 본부 4개 → 팀 이름이 쭉 내려옴 -->
  <section class="scene" id="sOrg" data-s="15.6" data-e="20.0">

    <div class="ln v" style="left:536px;top:640px;height:40px;--d:15.9s"></div>

  <!-- 장면 7 (코드 20~24.4초 / 영상 20.6~25.0초): 아래 — 메뉴를 누르면 프린터에서 A4 한 장. 위 — 알림 3개가 가지런히 뜨고 체크 -->
  <section class="scene" id="s2" data-s="20.0" data-e="24.4">

    <div class="phone" style="left:60px;top:1080px;animation:pop .45s ease-out 20.05s both">
      <div class="screen" id="menuScreen"><div class="notch"></div>

    <div class="shine" style="left:930px;top:1420px;--d:22.2s"></div>
    <div class="shine" style="left:500px;top:1640px;width:44px;height:44px;--d:22.5s"></div>
  </section>

  <!-- 장면 8 (코드 24.4~28.6초 / 영상 25.0~29.2초): 스쳐 가는 일들 — 레시피 A4 → 안부 달력 → 공부 계획표 → 강의 노트 → 상담 노트 → 한 해 계획표 → 선 그래프 → 요리 영상 → 책. 그래프 위 작은 제목 말고는 글자·이름·로고·숫자 없음 -->

  <!-- 장면 9 (코드 27.4~31.6초 / 영상 29.2~33.4초): 손글씨 카드 + 핵심 문장. 다음 장면으로 0.8초 천천히 겹쳐 바뀜 -->
  <section class="scene" id="sCore" data-s="27.4" data-e="31.6">
    <div id="floaters"></div>
    <div id="cardWrap">
      <svg width="680" height="420" viewBox="0 0 680 420" style="overflow:visible">
        <rect x="10" y="40" width="660" height="370" rx="18" fill="#E9D9C3"/>
        <rect x="0" y="20" width="660" height="370" rx="18" fill="#FFFCF5" stroke="#E2D2BC" stroke-width="4"/>
        <path class="ink" style="--d:27.9s;--t:.63s" d="M60 120 c40 -34 80 34 120 0 s80 -34 120 0 s80 34 120 0 s80 -34 120 0"/>

        <path class="ink" style="--d:29.34s;--t:.36s;stroke:#C9785A" d="M530 330 c-30 -30 -10 -60 20 -40 c30 -20 50 10 20 40 l-20 20 z"/>
        <g id="penHand">
          <g transform="rotate(35)"><rect x="-7" y="-170" width="14" height="154" rx="6" fill="#7A5440"/><path d="M-7 -16 L7 -16 L0 0 Z" fill="#4A3428"/></g>
          <ellipse cx="62" cy="-78" rx="58" ry="46" fill="#E5C09D"/>
          <rect x="90" y="-150" width="1800" height="110" rx="34" fill="#8FA58A" transform="rotate(22 90 -95)"/><!-- 소매는 화면 밖까지 -->
        </g>
      </svg>
    </div>
  </section>

  <!-- 장면 10 (코드 31.6~37.0초 / 영상 33.4~38.8초): 끝 장면 — 장면 4의 그 사람(뒷모습)이 창가 빛 아래 차 한 모금. 회장님 두 줄 → 본계정 이름 -->
  <section class="scene" id="s5" data-s="31.6" data-e="37.0">
    <div id="table">
      <div class="edge"></div>
      <div class="runner"></div>
      <div id="win"></div>
      <svg class="abs" style="left:840px;top:900px" width="160" height="260" viewBox="0 0 160 260">
        <path d="M80 150 C70 100 60 70 40 40" stroke="#7E9A78" stroke-width="7" fill="none"/>
        <path d="M80 150 C85 95 100 60 120 30" stroke="#7E9A78" stroke-width="7" fill="none"/>
        <circle cx="40" cy="38" r="22" fill="#F2C7A5"/><circle cx="120" cy="28" r="20" fill="#F7DDB0"/>
        <ellipse cx="62" cy="96" rx="16" ry="8" fill="#8FA58A" transform="rotate(-30 62 96)"/>
        <path d="M50 150 h60 l-8 100 h-44 z" fill="#E3EBDD" stroke="#B7C7B0" stroke-width="4"/>
      </svg>
      <svg class="cup" style="--d:31.8s;left:760px;top:1400px" width="280" height="120" viewBox="0 0 280 120">
        <ellipse cx="140" cy="70" rx="130" ry="40" fill="#FFFFFF" stroke="#E2D4C2" stroke-width="5"/>
        <ellipse cx="110" cy="60" rx="42" ry="20" fill="#D9A15F"/><ellipse cx="170" cy="70" rx="42" ry="20" fill="#C98B4E"/>
        <circle cx="100" cy="56" r="4" fill="#7A5440"/><circle cx="122" cy="62" r="4" fill="#7A5440"/><circle cx="178" cy="66" r="4" fill="#7A5440"/>
      </svg>
      <div class="sun" style="clip-path:polygon(80px 1110px,400px 1110px,760px 1920px,300px 1920px)"></div>
      <div class="sun" style="clip-path:polygon(430px 1110px,590px 1110px,1000px 1920px,790px 1920px)"></div>
      <svg id="saucer" viewBox="0 0 170 44"><ellipse cx="85" cy="22" rx="80" ry="19" fill="#EDE3D6" stroke="#D5C4B0" stroke-width="4"/></svg>
      <!-- 사람: 층 순서 (아래→위) 팔·찻잔 → 몸 → 머리. 찻잔이 입에 오면 머리 오른쪽에 반쯤 가려짐 -->
      <svg id="sipper" viewBox="0 0 760 860">
        <defs>
          <!-- 창가 빛 테두리: 모양에서 오른쪽 아래로 민 같은 모양을 빼서, 왼쪽 위만 얇게 남김 (끝이 가늘어짐) -->
          <mask id="headRim" maskUnits="userSpaceOnUse" x="0" y="0" width="760" height="860"><circle cx="300" cy="290" r="125" fill="#fff"/><circle cx="310" cy="300" r="125" fill="#000"/></mask>

            <path d="M40 860 L40 700 C40 530 150 450 300 450 C450 450 560 530 560 700 L560 860 Z" fill="#fff"/>
            <path d="M40 860 L40 700 C40 530 150 450 300 450 C450 450 560 530 560 700 L560 860 Z" fill="#000" transform="translate(11 9)"/>
            <rect x="290" y="0" width="470" height="860" fill="#000"/></mask>
        </defs>
        <g id="armUp">
          <path d="M435 540 L468.8 686.1" stroke="#8C6B57" stroke-width="64" stroke-linecap="round"/>
          <g id="armFore">
            <path d="M468.8 686.1 L625 578" stroke="#8C6B57" stroke-width="58" stroke-linecap="round"/>
            <g id="cupKeep"><g id="cupSettle">
              <g transform="translate(592.6 485.9) scale(.42)">
                <path class="steam" style="--d:32.0s" d="M140 120 c-24 -30 24 -50 0 -80" stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" opacity=".7"/>
                <path class="steam" style="--d:32.6s" d="M190 120 c-24 -30 24 -50 0 -80" stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" opacity=".7"/>
                <path d="M270 175 c55 0 55 70 0 70" stroke="#FBF7F1" stroke-width="20" fill="none"/>

          <g id="sipHead">
            <rect x="262" y="370" width="76" height="100" rx="20" fill="#7B5D4B"/>
            <circle cx="300" cy="290" r="125" fill="#5E4537"/>
            <rect x="170" y="160" width="260" height="260" fill="#F2C7A5" fill-opacity=".55" mask="url(#headRim)"/>
          </g>
        </g>
      </svg>
    </div>
    <div id="handleRow"><span id="handle">@ssoll0820</span></div>
  </section>

</div>
<script>
/* ================================================================
   자막 — 문구는 여기 한곳에만 있습니다 (10판, 숫자는 코드 시각)
   lines: 한 화면 2줄까지 / in·out: 나타나는·사라지는 초 / stagger: 줄마다 늦게 나오기(초)
   top: 자막 높이(px) / size: 글씨 크기 고정(px) / color: 묶음 전체 글자 색 / color2: 둘째 줄 색
   ================================================================ */
const CAPTIONS = [
  { scene: "sPile", lines: ["AI로 작은 회사를 꾸렸어요", "할 일이 너무 많아서요"],              in: 0.2,  stagger: 0.6, out: 2.4, size: 96 },
  { scene: "sPile", lines: ["오늘은 무슨 요리를 할지 찾고", "레시피는 A4에 옮겨 적고, 뽑고"],      in: 2.8,  stagger: 1.2, out: 5.7 },
  { scene: "sPile", lines: ["필터·생활용품 관리해 드릴 때", "특별한 날은 미리 안부 전하고"],       in: 6.2,  stagger: 1.2, out: 9.1 },
  { scene: "sPile", lines: ["오래 해 온 저도 늘 정신없어요", "처음이면 얼마나 막막할까"],          in: 9.6,  stagger: 1.0, out: 12.3 },
  { scene: "sPile", lines: ["조금 더 쉬웠으면 하는 마음", "그게 회사를 꾸린 진짜 이유"],          in: 12.8, stagger: 0.9, out: 15.3, top: 760 },

CAPTIONS.forEach(c => {
  const el = document.createElement("div");
  el.className = "cap";
  if (c.top) el.style.top = c.top + "px";
  if (c.size) el.dataset.size = c.size;
  if (c.color) el.style.color = c.color;
  const st = c.stagger || 0, dur = st ? 0.7 : 0.5;
  el.innerHTML = c.lines.map((l,i)=>{
    const col = (i===1 && c.color2) ? `color:${c.color2};` : "";
    return `<span style="${col}animation:capIn ${dur}s ease-out ${(c.in+i*st).toFixed(2)}s both">${l}</span>`;
  }).join("<br>");
  if (c.out) el.style.animation = `capOut .3s ease-in ${c.out}s forwards`;
  $(c.scene).appendChild(el);
});
function fitCaps(){
  document.querySelectorAll(".cap").forEach(el=>{
    let fs = +(el.dataset.size || 86); el.style.fontSize = fs + "px";
    const widest = () => Math.max(...[...el.querySelectorAll("span")].map(s=>s.offsetWidth));
    while (widest() > MAX_W && fs > 40) { fs -= 2; el.style.fontSize = fs + "px"; }
  });
}

  P.push(`<div class="abs msh" style="left:220px;top:950px;width:640px;height:400px;background:#2E2622;border-radius:36px;padding:22px">
      <div class="abs" style="inset:22px;border-radius:18px;background:#F1D9B5;overflow:hidden">
        <div class="abs" style="left:168px;top:48px;width:260px;height:260px;border-radius:50%;background:#C98B52;filter:blur(3px)"><div class="abs" style="inset:40px;border-radius:50%;background:#E9C27E"></div></div>
        <div class="abs" style="left:223px;top:103px;width:150px;height:150px;border-radius:50%;background:#fff;opacity:.92"></div>
        <svg class="abs" style="left:223px;top:103px" width="150" height="150" viewBox="0 0 150 150"><path d="M60 45 L108 75 L60 105 Z" fill="#C9785A" stroke="#C9785A" stroke-width="8" stroke-linejoin="round"/></svg>
        <div class="abs" style="left:30px;right:30px;bottom:22px;height:10px;border-radius:5px;background:rgba(255,255,255,.5)"><div class="abs" style="left:0;top:0;bottom:0;width:35%;border-radius:5px;background:var(--terra)"></div></div>
      </div></div>`);
  // ⑨ 책: 세워 둔 책 (표지 terra, 책등, 종이 결, 빈 띠, 바닥 그림자)
  P.push(`<div class="abs" style="left:360px;top:1385px;width:360px;height:44px;border-radius:50%;background:rgba(74,52,40,.16);filter:blur(4px)"></div>
    <div class="abs msh" style="left:350px;top:890px;width:380px;height:520px;background:var(--terra);border-radius:8px;overflow:hidden">
      <div class="abs" style="left:0;top:0;bottom:0;width:30px;background:#B5654A"></div>
      <div class="abs" style="right:0;top:6px;bottom:6px;width:14px;background:var(--cream2)"></div>
      <div class="abs" style="left:${30+(336-200)/2}px;top:225px;width:200px;height:70px;border-radius:10px;background:var(--cream2)"></div></div>`);
  $("mixStrip").innerHTML = P.map((h,i)=>`<div class="mp" style="left:${i*1080}px">${h}</div>`).join("");
})();

/* 장면 9: 천천히 떠오르는 작은 하트 (카드 뒤로 지나감) */
(function(){
  const xs = [[150,1500,22.0],[880,1550,22.6],[300,1650,23.3],[760,1720,23.9],[520,1700,24.5],[200,1750,25.1],[900,1600,25.7]];
  $("floaters").innerHTML = xs.map(([x,y,d])=>`<svg class="fh" style="left:${x}px;top:${y}px;--d:${(d+5.8).toFixed(1)}s" viewBox="0 0 120 120">${ICON.heart("#E3A58A")}</svg>`).join("");
})();

/* 시간 맞추기: 장면마다 천천히 다가가서(커짐) 멈춘 화면이 없게 */
const scenes = [...document.querySelectorAll(".scene")];
const clamp = (v) => Math.max(0, Math.min(1, v));
// 10판: 장면마다 시계가 따로 있음. v = 영상 초 → 그 장면의 코드 초
const CLOCK = {
  sPile: v => v < 2.0 ? v : v < 2.6 ? 2.0 : v < 3.3 ? v - 0.6 : v < 7.7 ? 2.7 : v - 5.0, // 2.0에서 0.6초, 2.7에서 4.4초(조직도) 멈춤
  sOrg:  v => v + 12.3,   // 코드 15.6 = 영상 3.3
  s2:    v => v - 0.6,    // 9판과 같음
  sMix:  v => v - 0.6,    // 9판과 같음
  sCore: v => v - 1.8,    // 8번이 1.2초 늘어서 0.6 + 1.2
  s5:    v => v - 1.8,
};
// 보이는 영상 구간 [시작, 끝, 들어올 때 바꿈, 나갈 때 바꿈]. 0 = 바로 (처음·끝)
const SHOW = {
  sPile: [[0, 3.3, 0, 0.4], [7.7, 20.6, 0.4, 0.4]],
  sOrg:  [[3.3, 7.7, 0.4, 0.4]],
  s2:    [[20.6, 25.0, 0.4, 0.4]],
  sMix:  [[25.0, 29.2, 0.4, 0.4]],
  sCore: [[29.2, 33.4, 0.4, 0.8]],
  s5:    [[33.4, 38.8, 0.8, 0]],
};
const secOf = new WeakMap();
window.seek = function(ms){
  const v = ms/1000;
  for (const a of document.getAnimations()) {
    let id = secOf.get(a);
    if (!id) { id = a.effect.target.closest(".scene").id; secOf.set(a, id); }
    a.pause(); a.currentTime = Math.max(0, CLOCK[id](v)) * 1000;
  }
  scenes.forEach(sc=>{
    const op = Math.max(...SHOW[sc.id].map(([a,b,fi,fo])=>{
      const fin  = fi===0 ? 1 : clamp((v-(a-fi/2))/fi);
      const fout = fo===0 ? 1 : clamp(((b+fo/2)-v)/fo);
      return Math.min(fin, fout);
    }));
    sc.style.opacity = op;
    // 천천히 다가가기: 9판처럼 data-s/e(코드 시각)로 계산, t 대신 그 장면 시계를 씀
    const t = CLOCK[sc.id](v), s = +sc.dataset.s, e = +sc.dataset.e;
    const p = clamp((t-(s-0.2))/((e+0.2)-(s-0.2)));
    sc.style.transform = `scale(${(1 + 0.04*p).toFixed(4)})`;
  });
};
window.__ready = document.fonts.ready.then(()=>{ fitCaps(); return true; });

if (!location.search.includes("record")) {
  const st = $("stage");
  const fit = () => { const k = Math.min(innerWidth/1080, innerHeight/1920); st.style.transform = `scale(${k})`; };
  addEventListener("resize", fit); fit();
  const t0 = performance.now();
  const loop = () => { seek((performance.now()-t0) % TOTAL); requestAnimationFrame(loop); };
  window.__ready.then(()=>requestAnimationFrame(loop));
} else {
  seek(0);
}
</script>
