<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회사 소개 릴스 — 장면 (코드 영상, 7판, 37.4초)</title>
<!--
  회사 소개 릴스 7판 (2026-11-02) — 설계: 콘티-7판.md (디자인팀)
  - 자막 문구는 아래 <script> 맨 위 CAPTIONS 한곳에만 있습니다. 바꾸면 node 녹화.js 로 다시 뽑습니다.
    (긴 줄은 화면 폭에 맞게 글씨가 저절로 줄어듭니다. 한 화면 2줄까지)
  - 흐름 (캡션 문단 순서와 같음): 할 일 쌓임(1~4) → 마음(5) → AI 팀이 정리(6~8) → 핵심 문장(9) → 설거지(10) → 끝 식탁(11)
  - 장면 1~5는 한 책상(#sPile) 안에서 이어짐. 물건이 사라지지 않고 계속 쌓이다가 5번에서 흐려짐.
  - 조직도: 나 → 사장(AI)(옆에 사장실·기획팀) → 본부 4개 → 본부별 팀 이름. 암웨이사업팀·객원멤버는 넣지 않음. 숫자·회사 이름 없음.
  - 사람은 뒷모습과 손만. 얼굴 없음. 사람 이름·날짜·제품 이름·로고 없음 (달력은 칸만, 숫자 없음).
  - 장면 바꿈 길이: section 의 data-f(초, 다음 장면으로 넘어갈 때). 없으면 0.4. 9→10 바로 컷(0), 10→11 은 0.6.
  - 화면이 멈추지 않게: 모든 장면이 천천히 다가가고(조금씩 커짐), 장면마다 계속 움직이는 것(깜빡임·거품·김)이 있음.
  - 글꼴: Pretendard (SIL Open Font License 1.1, 상업용 무료) — fonts/ 폴더
  - 1080×1920, 37.4초. 브라우저에서 열면 그대로 재생됨. 녹화는 녹화.js 가 seek(ms)로 한 장씩 찍음.
  - 이전 판: 릴스-장면-6판.html / 릴스-미리보기-6판.mp4 / 릴스-게시용-6판.mp4 (35.7초)
-->
<style>
@font-face { font-family: "Pretendard"; font-weight: 500; src: url("fonts/Pretendard-Medium.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 700; src: url("fonts/Pretendard-Bold.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 800; src: url("fonts/Pretendard-ExtraBold.woff2") format("woff2"); }

:root{
  --cream:#F7EFE3; --cream2:#FBF6EE; --brown:#4A3428; --brown2:#7A5440;
  --terra:#C9785A; --sage:#8FA58A; --mustard:#D9A64E; --wood:#B98B66; --sky:#7FA7BC;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#222;}
body{font-family:"Pretendard",sans-serif;color:var(--brown);overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--cream);transform-origin:0 0}
.scene{position:absolute;inset:0;opacity:0;transform-origin:50% 55%}
.abs{position:absolute}
#stage *{animation-play-state:paused !important}

/* 자막 (내용은 script 의 CAPTIONS) */
.cap{position:absolute;left:0;right:0;top:250px;text-align:center;font-weight:800;font-size:86px;
  line-height:1.3;letter-spacing:-0.02em;color:var(--brown);z-index:20}
.cap span{display:inline-block;white-space:nowrap}
@keyframes capIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes capOut{from{opacity:1}to{opacity:0;transform:translateY(-20px)}}

/* 공통 움직임 */
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes tap{0%{opacity:0;transform:scale(1.6)}30%{opacity:.85;transform:scale(1)}60%{opacity:.85;transform:scale(.85)}100%{opacity:0;transform:scale(1.3)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes cupIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0)}20%{opacity:.6}100%{opacity:0;transform:translateY(-420px)}}

/* 휴대폰 */
.phone{position:absolute;width:300px;height:620px;border-radius:46px;background:#2E2622;padding:12px;
  box-shadow:0 30px 60px rgba(74,52,40,.25)}
.phone .screen{position:relative;width:100%;height:100%;border-radius:36px;background:var(--cream2);overflow:hidden}
.phone .screen > *:not(.notch){filter:blur(1.6px)}
.phone .screen > .sbar{filter:none}
.phone .notch{position:absolute;top:22px;left:50%;width:84px;height:22px;margin-left:-42px;border-radius:12px;background:#2E2622;z-index:5}
.dot{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.55);
  border:6px solid rgba(255,255,255,.9);box-shadow:0 0 0 4px rgba(74,52,40,.25);z-index:12}
.spark{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;background:var(--terra);
  animation:sparkGo .45s ease-in-out var(--d) both}
@keyframes sparkGo{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.menuRow{position:absolute;left:18px;right:18px;height:96px;border-radius:20px;background:#fff;box-shadow:0 4px 10px rgba(74,52,40,.08)}
.menuRow b{position:absolute;left:14px;top:14px;width:68px;height:68px;border-radius:50%;background:var(--c)}
.menuRow i{position:absolute;left:98px;top:28px;height:16px;border-radius:8px;background:#D9C6B1}
.menuRow u{position:absolute;left:98px;top:56px;width:70px;height:12px;border-radius:6px;background:#EADCCB}

/* 손글씨 잉크 (pathLength 900 이면 펜과 같은 빠르기로 그려짐) */
.ink{fill:none;stroke:#7A5440;stroke-width:9;stroke-linecap:round;stroke-dasharray:900;animation:ink var(--t) linear var(--d) both}
@keyframes ink{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}

/* ---------- 장면 1~5: 한 책상 (#sPile) ---------- */
#sPile, #pileAll{background:linear-gradient(#EFE2D0 0,#EADBC6 1150px,var(--wood) 1150px,#A97C59 1920px)}
#pileAll{position:absolute;inset:0;animation:jitter .18s linear 10.0s 6, pileBlur .8s ease-in-out 12.6s both}
@keyframes jitter{0%,100%{transform:none}25%{transform:translate(3px,-2px)}75%{transform:translate(-3px,2px)}}
@keyframes pileBlur{from{filter:blur(0)}to{filter:blur(14px)}}
#pileAll .deskEdge{position:absolute;left:0;right:0;top:1150px;height:18px;background:#C89D78}
.note{position:absolute;width:210px;height:150px;border-radius:10px;padding:22px 18px;font-weight:700;font-size:32px;white-space:nowrap;
  color:#5A4033;box-shadow:0 8px 16px rgba(60,40,25,.22);transform:rotate(var(--r));
  animation:noteDrop .5s cubic-bezier(.2,.8,.3,1.1) var(--d1) both}
.note i{display:block;height:8px;border-radius:4px;background:rgba(90,64,51,.18);margin-top:14px;width:80%}
.note i+i{width:55%}
@keyframes noteDrop{from{opacity:0;transform:translate(0,-900px) rotate(calc(var(--r) + 40deg))}to{opacity:1;transform:rotate(var(--r))}}
/* 2번: 검색창 */
.sbar{position:absolute;left:16px;right:16px;top:62px;height:80px;border-radius:40px;background:#fff;z-index:4;
  box-shadow:0 4px 10px rgba(74,52,40,.10)}
.sbar .sd{position:absolute;top:33px;width:14px;height:14px;border-radius:50%;background:var(--brown2);animation:blink .6s ease-in-out var(--d) infinite both}
#results{position:absolute;left:0;right:0;top:160px;bottom:0;overflow:hidden}
#resultsIn{position:absolute;left:0;right:0;top:0;height:880px;animation:scrollUp 2.6s linear 2.9s both}
@keyframes scrollUp{from{transform:none}to{transform:translateY(-430px)}}
/* 2번: A4 종이 3장 */
.a4w{position:absolute;width:300px;height:424px;transform:rotate(var(--r))}
.a4{position:absolute;inset:0;background:#fff;border-radius:6px;box-shadow:0 10px 24px rgba(74,52,40,.18)}
.a4 .tl{position:absolute;left:34px;height:12px;border-radius:6px;background:#E3D6C6}
@keyframes paperDrop{from{opacity:0;transform:translateY(-90px) scale(1.05)}to{opacity:1;transform:none}}
#a4Away{transform-box:view-box;animation:handAway .4s ease-in 5.0s both}
@keyframes handAway{from{transform:none;opacity:1}to{transform:translate(900px,700px);opacity:0}}
#a4Pen{transform-box:view-box;animation:writeA4 1.1s linear 3.9s both}
@keyframes writeA4{0%{transform:translate(60px,200px)}45%{transform:translate(470px,200px)}55%{transform:translate(60px,290px)}100%{transform:translate(400px,290px)}}
/* 3번: 선반 + 달력 */
.ticket{position:absolute;width:80px;height:50px;background:#FFF1BF;border-radius:6px;box-shadow:0 4px 8px rgba(60,40,25,.18);
  transform:rotate(var(--r));animation:fadeIn .3s ease-out var(--d) both}
/* 4번: 뒷모습 사람 */
#figure{position:absolute;left:240px;top:1180px;width:600px;height:760px;animation:riseUp .6s cubic-bezier(.2,.8,.3,1) 9.6s both}
@keyframes riseUp{from{transform:translateY(760px)}to{transform:none}}
#arm{transform-box:view-box;transform-origin:470px 520px;animation:armUp .6s ease-out 10.3s both}
@keyframes armUp{from{transform:rotate(55deg);opacity:0}to{transform:none;opacity:1}}
#head{transform-box:view-box;transform-origin:300px 420px;animation:sigh 1.2s ease-in-out 10.8s both}
@keyframes sigh{0%{transform:none}50%{transform:rotate(-7deg) translateY(10px)}100%{transform:rotate(-5deg) translateY(8px)}}
/* 5번: 흐려지고 크림색 막 + 빛 + 하트 */
#veil{position:absolute;inset:0;background:var(--cream);animation:veilOn .8s ease-in-out 12.6s both}
@keyframes veilOn{from{opacity:0}to{opacity:.72}}
#whyGlow{position:absolute;left:190px;top:800px;width:700px;height:700px;border-radius:50%;
  background:radial-gradient(#FFF8EC 0,rgba(255,248,236,0) 70%);animation:glowIn 1s ease-out 12.9s both}
@keyframes glowIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#whyHeart{position:absolute;left:490px;top:1100px;width:100px;height:100px;animation:pop .6s ease-out 13.4s both}
#whyHeart path{transform-box:fill-box;transform-origin:50% 50%;animation:beat 1.2s ease-in-out 14.0s infinite both}

/* ---------- 장면 6: 조직도 ---------- */
#sOrg{background:var(--cream)}
.orgc{position:absolute;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 24px rgba(74,52,40,.2)}
.ln{position:absolute;background:#CDB8A2;border-radius:4px}
.ln.v{width:8px;transform-origin:50% 0;animation:growY .3s ease-out var(--d) both}
.ln.h{height:8px;transform-origin:50% 50%;animation:growX .4s ease-out var(--d) both}
@keyframes growY{from{transform:scaleY(0)}to{transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:none}}
.hq{position:absolute;width:248px;height:96px;border-radius:24px;font-weight:800;font-size:36px;color:#fff;
  display:flex;align-items:center;justify-content:center;letter-spacing:-0.02em;
  animation:fadeIn .25s ease var(--d0) both, lightUp .35s ease-out var(--d) both}
@keyframes lightUp{from{background:#EADFD1;color:#BCAB9B;transform:scale(1)}60%{transform:scale(1.07)}to{background:var(--c);color:#fff;transform:scale(1);box-shadow:0 8px 16px rgba(74,52,40,.18)}}
.tm{position:absolute;width:248px;height:78px;border-radius:18px;background:#fff;border:4px solid var(--c);
  font-weight:800;font-size:31px;letter-spacing:-0.03em;color:var(--brown);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 12px rgba(74,52,40,.10);animation:slideDown .4s cubic-bezier(.2,.8,.3,1.1) var(--d) both}
@keyframes slideDown{from{opacity:0;transform:translateY(-60px)}to{opacity:1;transform:none}}

/* ---------- 장면 7: 레시피 → A4 한 장 ---------- */
#s2{background:var(--cream)}
.pick{position:absolute;left:14px;right:14px;height:104px;border-radius:24px;border:6px solid var(--terra);opacity:0;animation:pickOn .4s ease-out var(--d) both}
@keyframes pickOn{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
#printer{position:absolute;left:460px;top:780px;width:560px;height:240px}
#pled{animation:blink 1s ease-in-out 21.0s infinite both}
#paperBox{position:absolute;left:520px;top:960px;width:440px;height:620px;overflow:hidden}
#paper{position:absolute;left:20px;top:0;width:400px;height:566px;background:#fff;border-radius:6px;
  box-shadow:0 10px 24px rgba(74,52,40,.18);animation:printOut 1.4s cubic-bezier(.3,.1,.3,1) 21.3s both}
@keyframes printOut{from{transform:translateY(-575px)}to{transform:none}}
#paper .ttl{position:absolute;left:0;right:0;top:34px;text-align:center;font-weight:800;font-size:38px;color:var(--brown)}
#paper .blurz{position:absolute;inset:100px 30px 30px;filter:blur(2.4px)}
#paper .fd{position:absolute;left:110px;top:6px;width:120px;height:120px;border-radius:50%;background:#F1D9B5}
#paper .fd::before{content:"";position:absolute;inset:14px;border-radius:50%;background:#C98B52}
#paper .tl{position:absolute;left:0;height:14px;border-radius:7px;background:#D9C6B1}
.shine{position:absolute;width:60px;height:60px;background:#EBC57A;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  animation:twinkle 1.4s ease-in-out var(--d) infinite both}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}

/* ---------- 장면 8: 알림 팝업 3개 ---------- */
#s3{background:#F3EBDF}
.listRow{position:absolute;left:18px;right:18px;height:92px;border-radius:20px;background:#fff;box-shadow:0 4px 10px rgba(74,52,40,.08)}
.listRow b{position:absolute;left:16px;top:20px;width:52px;height:52px;border-radius:50%;background:#E2D3C1}
.listRow i{position:absolute;left:84px;top:36px;width:130px;height:16px;border-radius:8px;background:#E2D3C1}
.popc{position:absolute;left:150px;width:660px;height:132px;border-radius:32px;background:#fff;z-index:10;
  box-shadow:0 18px 36px rgba(74,52,40,.22);display:flex;align-items:center;gap:22px;padding:0 100px 0 26px;
  font-weight:800;font-size:38px;letter-spacing:-0.02em;color:var(--brown);white-space:nowrap;
  transform-origin:20% 50%;animation:popUp .5s cubic-bezier(.2,.9,.3,1.3) var(--d) both}
@keyframes popUp{from{opacity:0;transform:translateY(40px) scale(.7)}to{opacity:1;transform:none}}
.popc .ic{flex:none;width:84px;height:84px;border-radius:22px;background:#F4ECE1;display:flex;align-items:center;justify-content:center}
.chk{position:absolute;right:26px;top:38px;width:56px;height:56px;border-radius:50%;background:var(--sage);
  display:flex;align-items:center;justify-content:center;animation:pop .4s ease-out var(--d) both}

/* ---------- 장면 9: 손글씨 카드 + 핵심 문장 ---------- */
#sCore{background:radial-gradient(800px 800px at 540px 960px,#FFF8EC 0,var(--cream) 70%)}
#cardWrap{position:absolute;left:200px;top:1020px;width:680px;height:420px;transform-origin:0 0;z-index:9;
  animation:cardIn .6s cubic-bezier(.2,.8,.3,1) 27.5s both}
@keyframes cardIn{from{opacity:0;transform:translateY(80px) rotate(-2deg)}to{opacity:1;transform:rotate(-2deg)}}
#penHand{transform-box:view-box;animation:write 1.8s linear 27.9s both}
@keyframes write{0%{transform:translate(60px,120px)}35%{transform:translate(540px,120px)}40%{transform:translate(60px,205px)}
  75%{transform:translate(420px,205px)}80%{transform:translate(500px,300px)}100%{transform:translate(560px,300px)}}
.fh{position:absolute;width:44px;height:44px;opacity:0;animation:floatUp 3.2s ease-in-out var(--d) infinite both}

/* ---------- 장면 10: 설거지 ---------- */
#sDish{background:linear-gradient(#F3EBDF 0,#F3EBDF 1200px,var(--wood) 1200px,#A97C59 1920px)}
#sDish .edge{position:absolute;left:0;right:0;top:1200px;height:16px;background:#D3AA84}
#sink{position:absolute;left:190px;top:1150px;width:700px;height:330px;border-radius:40px;background:#DCD3C8;border:14px solid #EDE4D8;
  box-shadow:inset 0 18px 30px rgba(74,52,40,.12)}
#dishIn{transform-box:view-box;animation:dishIn .4s cubic-bezier(.2,.8,.3,1) 31.8s both}
@keyframes dishIn{from{opacity:0;transform:translateX(700px)}to{opacity:1;transform:none}}
#scrubG{transform-box:view-box;animation:scrub .45s ease-in-out 32.2s infinite both}
@keyframes scrub{0%,100%{transform:translateX(0)}50%{transform:translateX(-50px)}}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.95);border:4px solid #D3E2EA;opacity:0;
  animation:bubUp 2s ease-out var(--d) infinite both}
@keyframes bubUp{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:.95;transform:translateY(-40px) scale(1)}100%{opacity:0;transform:translateY(-320px) scale(1.1)}}

/* ---------- 장면 11: 끝 식탁 ---------- */
#s5{background:radial-gradient(900px 700px at 180px 380px,#FFF6E6 0,rgba(255,246,230,0) 70%),linear-gradient(#F3E6D4 0,#EEDDC7 1120px,#C69A72 1120px,#B3845E 1920px)}
#s5 .runner{position:absolute;left:150px;right:150px;top:1120px;bottom:0;background:#F6EEE2;box-shadow:inset 0 0 0 10px rgba(201,120,90,.15)}
#s5 .edge{position:absolute;left:0;right:0;top:1120px;height:16px;background:#D3AA84}
#table{position:absolute;inset:0}
.cup{position:absolute;animation:cupIn .6s cubic-bezier(.2,.8,.3,1) var(--d) both}
.steam{animation:steam 2.4s ease-in-out var(--d) infinite both}
@keyframes steam{0%{opacity:0;transform:translateY(20px)}35%{opacity:.75}100%{opacity:0;transform:translateY(-90px)}}
#handleRow{position:absolute;left:0;right:0;top:690px;text-align:center;z-index:20}
#handle{display:inline-block;height:96px;line-height:88px;padding:0 44px;border-radius:48px;background:#FFFBF4;border:4px solid var(--terra);
  font-weight:800;font-size:56px;letter-spacing:-0.01em;color:var(--brown);animation:handleIn .5s ease-out 35.8s both}
@keyframes handleIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="stage">

  <!-- 장면 1~5 (0~15.6초): 한 책상 — 쪽지 → 검색·옮겨 적기 → 선반·달력 → 정신없음 → 흐려지고 진짜 이유 -->
  <section class="scene" id="sPile" data-s="0" data-e="15.6">
    <div id="pileAll">
      <div class="deskEdge"></div>
      <div id="shelf"></div>
      <div id="calWall"></div>
      <div id="notes1"></div>
      <!-- 2번: 휴대폰 검색 (크기 0.8) -->
      <div class="abs" style="left:40px;top:1210px;width:300px;height:620px;transform:scale(.8);transform-origin:0 0">
        <div class="phone" style="left:0;top:0;animation:pop .45s ease-out 2.7s both">
          <div class="screen" id="searchScreen"><div class="notch"></div>
            <div class="sbar">
              <svg class="abs" style="left:22px;top:18px" width="44" height="44" viewBox="0 0 44 44">
                <circle cx="18" cy="18" r="12" fill="none" stroke="#7A5440" stroke-width="6"/>
                <path d="M27 27 L38 38" stroke="#7A5440" stroke-width="7" stroke-linecap="round"/></svg>
              <span class="sd" style="left:84px;--d:2.9s"></span><span class="sd" style="left:108px;--d:3.05s"></span><span class="sd" style="left:132px;--d:3.2s"></span>
            </div>
            <div id="results"><div id="resultsIn"></div></div>
          </div>
        </div>
      </div>
      <!-- 2번: A4 3장 (1장째에 손으로 옮겨 적고, 2·3장째가 툭툭 얹힘) -->
      <div class="a4w" style="left:660px;top:1300px;--r:-4deg">

/* 시간 맞추기: 장면마다 천천히 다가가서(커짐) 멈춘 화면이 없게. 바꿈 길이는 data-f (없으면 0.4) */
const scenes = [...document.querySelectorAll(".scene")];
const clamp = (v) => Math.max(0, Math.min(1, v));
const fOf = (sc) => (sc && sc.dataset.f != null) ? +sc.dataset.f : 0.4;
window.seek = function(ms){
  const t = ms/1000;
  for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; }
  scenes.forEach((sc,i)=>{
    const s = +sc.dataset.s, e = +sc.dataset.e;
    const Fi = i===0 ? 0.4 : fOf(scenes[i-1]);   // 들어올 때 = 앞 장면의 바꿈 길이
    const Fo = fOf(sc);                           // 나갈 때 = 이 장면의 바꿈 길이
    const fin = i===0 ? 1 : (Fi===0 ? (t>=s?1:0) : clamp((t-(s-Fi/2))/Fi));
    const fout = i===scenes.length-1 ? 1 : (Fo===0 ? (t<e?1:0) : clamp(((e+Fo/2)-t)/Fo));
    sc.style.opacity = Math.min(fin, fout);
    const p = clamp((t-(s-Fi/2))/((e+Fo/2)-(s-Fi/2)));
    sc.style.transform = `scale(${(1 + 0.04*p).toFixed(4)})`;
  });
};
window.__ready = document.fonts.ready.then(()=>{ fitCaps(); return true; });

if (!location.search.includes("record")) {
  const st = $("stage");
  const fit = () => { const k = Math.min(innerWidth/1080, innerHeight/1920); st.style.transform = `scale(${k})`; };
  addEventListener("resize", fit); fit();
  const t0 = performance.now();
  const loop = () => { seek((performance.now()-t0) % TOTAL); requestAnimationFrame(loop); };
  window.__ready.then(()=>requestAnimationFrame(loop));
} else {
  seek(0);
}
