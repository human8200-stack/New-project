<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>공부 루틴</title>
  <meta name="description" content="과목별 상태와 실제 공부 속도로 오늘 할 공부를 정하고 자동으로 다시 계획하는 학습 관리">
  <meta name="theme-color" content="#2f5d50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="공부 루틴">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <h1>공부 루틴</h1>
      <div class="top-badges">
        <span id="sync" class="sync" hidden></span>
        <div id="dday" class="dday" hidden></div>
        <button id="settings-btn" class="settings-btn" data-action="go-tab" data-id="settings" aria-label="설정">설정</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button data-tab="today" class="active">오늘</button>
      <button data-tab="plan">계획표</button>
      <button data-tab="review">오답·복습</button>
      <button data-tab="projects">수행평가</button>
      <button data-tab="analysis">기록</button>
    </nav>
  </header>

  <main id="view"></main>
    <div id="popup"></div>

  <script src="planner.js"></script>
  <script src="seed.js"></script>
  <script src="app.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>
