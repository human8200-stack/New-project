name = "study-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# 앱 주소만 허용 (GitHub Pages)
ALLOWED_ORIGIN = "https://human8200-stack.github.io"

# 기기 동기화 저장소. id는 GitHub Actions(deploy-ai.yml)가 만들어서 채운다
[[kv_namespaces]]
binding = "SYNC"
id = "SYNC_NAMESPACE_ID"
